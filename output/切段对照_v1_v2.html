<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --sunk:#EDF0F5; --ink:#18202E; --muted:#5A6477; --faint:#8A93A4; --rule:#DCE1E9;
  --accent:#2F4B8F;
  --same:#1F7A55; --same-bg:#E4F3EC;
  --near:#9A6A0B; --near-bg:#FBF1DC;
  --over:#5B45A8; --over-bg:#ECE8F8;
  --under:#B4441A; --under-bg:#FBE9E1;
  --mixed:#B42335; --mixed-bg:#FBE4E7;
  --gold:#2F4B8F; --pred:#0F7C84;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141B; --surface:#171C25; --sunk:#1E2430; --ink:#E6EAF1; --muted:#A3ACBC; --faint:#737D8F; --rule:#2B3342;
    --accent:#9DB2EC;
    --same:#5CC99A; --same-bg:#16302A; --near:#E3B55A; --near-bg:#33291A; --over:#B5A4F0; --over-bg:#272240;
    --under:#F0936B; --under-bg:#3A2219; --mixed:#F2808F; --mixed-bg:#3A1C22; --gold:#9DB2EC; --pred:#5FC6CD;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141B; --surface:#171C25; --sunk:#1E2430; --ink:#E6EAF1; --muted:#A3ACBC; --faint:#737D8F; --rule:#2B3342;
  --accent:#9DB2EC;
  --same:#5CC99A; --same-bg:#16302A; --near:#E3B55A; --near-bg:#33291A; --over:#B5A4F0; --over-bg:#272240;
  --under:#F0936B; --under-bg:#3A2219; --mixed:#F2808F; --mixed-bg:#3A1C22; --gold:#9DB2EC; --pred:#5FC6CD;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:26px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:70ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px;margin-top:10px}
.meta b{color:var(--ink);font-weight:500}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:22px 0 8px}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.stat .v{font-size:20px;font-weight:600}
.stat .s{font-size:12px;color:var(--faint)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0;max-width:90ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px;border-bottom:1px solid var(--rule);margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.45}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{color:var(--muted);font-size:11.5px}
select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
button:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chapter{margin-top:30px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.chead h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:18px;margin:0;text-wrap:balance}
.chead .r{color:var(--muted);font-size:12.5px}
.strip{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px 4px;margin-bottom:10px;overflow-x:auto}
.strip svg{display:block;width:100%;min-width:520px;height:54px}
.strip .lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);padding:2px 2px 4px}
.cols{display:grid;grid-template-columns:118px 1fr 1fr;gap:0 14px;font-size:12px;color:var(--muted);padding:0 12px 4px;letter-spacing:.03em}
.group{display:grid;grid-template-columns:118px 1fr 1fr;gap:0 14px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.gl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.badge{font-size:12px;font-weight:500;color:var(--c);background:var(--cb);border-radius:4px;padding:1px 7px}
.grange{font-size:12px;color:var(--muted)}
.toggle{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side .lbl{display:none;font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.para{border-left:2px solid var(--rule);padding-left:9px}
.gold .para{border-color:var(--gold)}
.pred .para{border-color:var(--pred)}
.ph{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:12px;color:var(--muted)}
.ph .rg{font-weight:600;color:var(--ink);font-size:12.5px}
.ph .d{font-weight:600}
.ph .d.pos{color:var(--near)} .ph .d.neg{color:var(--near)} .ph .d.ok{color:var(--same)} .ph .d.miss{color:var(--mixed)}
.pt{margin:2px 0 0}
.pe{margin:3px 0 0;font-size:12px;color:var(--faint)}
.pe b{font-weight:500;color:var(--muted)}
.pu{margin:3px 0 0;font-size:12px;color:var(--near)}
.src{grid-column:1/-1;margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px;overflow-x:auto}
.src table{border-collapse:collapse;width:100%;font-size:13px}
.src td{padding:2px 6px;vertical-align:top}
.src td.n{width:44px;text-align:right;color:var(--faint);font-size:12px}
.src td.m{width:26px;font-size:11px;font-weight:600;text-align:center;white-space:nowrap}
.src tr.cut td{border-top:1px solid var(--rule)}
.src .mg{color:var(--gold)} .src .mp{color:var(--pred)}
.empty{color:var(--muted);padding:20px 0}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--ink);padding:4px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.chk{font-size:12.5px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.runinfo{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.runinfo b{color:var(--ink);font-weight:500}
.cmp{font-size:11.5px;margin-left:6px}
.cmp.up{color:var(--same)} .cmp.down{color:var(--mixed)} .cmp.flat{color:var(--faint)}
mark{background:none;color:inherit;padding:0 1px;border-radius:2px}
mark.ban{background:var(--mixed-bg);color:var(--mixed);font-weight:600}
mark.per{background:var(--over-bg);color:var(--over);font-weight:600}
mark.dem{border-bottom:1.5px dotted var(--near)}
.fl{display:inline-flex;gap:4px;flex-wrap:wrap}
.ft{font-size:11px;border-radius:3px;padding:0 5px;font-weight:500}
.ft.ban{background:var(--mixed-bg);color:var(--mixed)} .ft.per{background:var(--over-bg);color:var(--over)} .ft.dem{background:var(--near-bg);color:var(--near)}
.other{margin:6px 0 0;padding:6px 8px;background:var(--sunk);border-radius:5px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.other .ol{font-size:11.5px;font-weight:600;color:var(--ink)}
.other .same{color:var(--same);font-weight:600}
@media (max-width:760px){
  .cols{display:none}
  .group{grid-template-columns:1fr;gap:10px}
  .gl{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .side .lbl{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap">
  <header>
    <h1>约伯记1章1–8节讲道稿 · 切段结果与 gold 对照</h1>
    <p class="lede">左栏是 gold 的段，右栏是所选版本的切段结果。gold 和模型在同一行切开的位置作为分组点：一组里左右各一段、起止行完全相同，就是“一致”，否则按差异类型标出。模型标题下方附上另一版在同一位置的标题。</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="bar" role="toolbar" aria-label="版本与筛选">
    <div class="seg" id="runsel" role="group" aria-label="选择版本"></div>
    <div class="chips" id="chips"></div>
    <label class="mono" style="font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center" for="chsel">章
      <select id="chsel"><option value="all">全部</option></select>
    </label>
    <label class="chk" for="onlyflag"><input type="checkbox" id="onlyflag">只看标题有问题的组</label>
    <label class="chk" for="showother"><input type="checkbox" id="showother" checked>显示另一版标题</label>
  </div>
  <section class="summary" id="summary"></section>
  <p class="runinfo" id="runinfo"></p>
  <p class="note">边界 = 每段的起始行（不含第 1 行）。“±3 行”指模型边界与 gold 相差 3 行以内也算命中。标题检查：<mark class="ban">红底</mark> 是禁用的说话人词（讲者、讲员、作者、这段……），<mark class="per">紫底</mark> 是第一、二人称（「」里的直接引语不算），<mark class="dem">虚线</mark> 是指示词（是否悬空要人看）。模型的节来自 c2low4 切节，与 gold 的节号可能不同，这里只比段。</p>
  <main id="main"></main>

<script id="data" type="application/json">{"gold_name": "gold_v3.md", "gold_n": 113, "gold": [{"i": 0, "s": 1, "e": 3, "t": "开场问候，并说明讲道的定位是把神的话用今天的语言讲给会众，使神的话建立会众", "sec": "1.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 1, "s": 4, "e": 8, "t": "宣告诵读本周正道经文约伯记1章1至8节，并说明会对难解的部分尽可能给出解释", "sec": "2.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 2, "s": 9, "e": 13, "t": "约伯记1章1至3节：乌斯地的约伯完全正直敬畏神，七子三女，家产丰厚，在东方为至大", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 3, "s": 14, "e": 18, "t": "约伯记1章4至5节：儿子按日设摆筵席，约伯清早按人数献燔祭，恐怕儿子犯罪心中弃掉神", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 4, "s": 19, "e": 25, "t": "约伯记1章6至8节：神的众子侍立，撒但来在其中，耶和华向撒但称许约伯完全正直", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 5, "s": 26, "e": 29, "t": "祷告求神在众圣徒中得当得的荣耀，临格会众中间，开通弟兄姊妹的耳朵使他们能听", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 6, "s": 30, "e": 33, "t": "祷告求神赐下众先知使徒记在圣经上的福音与古旧信仰，使会众认识神并多结果子", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 7, "s": 34, "e": 36, "t": "宣告今天的讲道分两个部分，以两个眼光来看刚才诵读的约伯记1章经文", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 8, "s": 37, "e": 41, "t": "第一部分为约伯记1章1至5节，呈现约伯的现实背景：儿子众多、牛驴仆婢丰厚的东方富户", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 9, "s": 42, "e": 48, "t": "第二部分为约伯记1章6至8节，呈现约伯的属灵背景：被撒但控告却被耶和华认可敬畏神远离恶事", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 10, "s": 49, "e": 54, "t": "自我介绍为陈社炳，服侍任务是抛开传统传讲圣经福音使之成为敬拜根基，并以约伯记开始", "sec": "4.2", "f": {"ban": [], "per": ["我"], "dem": []}}, {"i": 11, "s": 55, "e": 58, "t": "今天教会对福音的信仰多关注个人今生的祸福而非国度，因此需要先从个人的事谈起", "sec": "4.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 12, "s": 59, "e": 63, "t": "约伯记可以消除以往顽固的观念，为领受真道预备智慧，其冲击也小于福音本身对人的挑战", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 13, "s": 64, "e": 67, "t": "约伯记被编排为智慧书第一卷，大主题是认识耶和华的智慧，而非人们通常联想的苦难", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 14, "s": 68, "e": 73, "t": "第一个问题对应约伯记1章1至5节：世界上存不存在绝对的平安，平安常是信主者的第一诉求", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 15, "s": 74, "e": 76, "t": "第二个问题对应约伯记1章6至8节：信仰被上帝认可是否意味着这人就会远离灾祸", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 16, "s": 77, "e": 79, "t": "约伯记的开篇可以调整人对信仰祸福的不恰当归类，以及对神赐福前因后果的不正确认识", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 17, "s": 80, "e": 87, "t": "转入约伯记1章1至5节，说明约伯记成书可能早于创世记，约伯的年代或早于亚伯拉罕", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 18, "s": 88, "e": 95, "t": "约伯记1章1节记约伯是乌斯地人并非以色列人，可能是比亚伯拉罕更早认识独一真神的古代圣徒", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 19, "s": 96, "e": 106, "t": "麦基洗德作为至高神祭司收亚伯拉罕十分之一，以东术士巴兰也知道耶和华的名，可见耶和华是全地的主", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 20, "s": 107, "e": 114, "t": "独一神信仰并非始于摩西或亚伯拉罕，连该隐都认识耶和华，纯正信仰只是在一族之内被保全", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 21, "s": 115, "e": 121, "t": "圣经没有一段细节是白费的，约伯记1章1至5节记录约伯的大致情况是要读者先明白一件事", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 22, "s": 122, "e": 128, "t": "提出问题：任何时代的人都认为钱多、人多、资源多的家庭绝不会出意外，遇事也更能平事", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 23, "s": 129, "e": 136, "t": "约伯记1章1至5节突出约伯及其家庭的稳，按各时代的眼光看都是不会出现任何灾祸的人", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 24, "s": 137, "e": 144, "t": "约伯后来家破人亡、浑身疾病躺在炉灰中，与1至5节的绝对稳妥形成极大落差", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 25, "s": 145, "e": 154, "t": "读约伯记1章1至5节时应先搁置后文，因上帝视角会破坏对开篇本应有的判断", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 26, "s": 155, "e": 169, "t": "人生风险因素的列举：赚钱、锻炼身体、购买保险都为增加家庭抗风险能力，抗风险最强者被视为最平安", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 27, "s": 170, "e": 174, "t": "人们通常认为家庭易出灾祸有两个原因：抗风险能力低，或是恶人常在恶事里被反噬", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 28, "s": 175, "e": 183, "t": "约伯记1章1节称约伯完全正直远离恶事，道德与违法犯罪带来的风险在他身上可彻底排除", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 29, "s": 184, "e": 192, "t": "对照作奸犯科、开赌场贩毒的家庭因不正直与恶事招祸，约伯则完全正直且敬畏神远离恶事", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 30, "s": 193, "e": 205, "t": "约伯敬畏神连耶和华都承认，排除了遭天谴的因素；相对的是拜偶像、养小鬼等污秽信仰所带来的灾祸", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 31, "s": 206, "e": 214, "t": "约伯从道德伦理、司法到信仰虔诚度的一切风险因素都不存在，且他的敬畏被上帝认可", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 32, "s": 215, "e": 222, "t": "硬实力不足是另一风险因素；古代与农村社会中人丁兴旺意味着家族势力大、顶梁柱多", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"i": 33, "s": 223, "e": 228, "t": "约伯记1章2节记约伯生了七个儿子三个女儿，人丁兴旺构成这个家庭抗风险的第二把锁", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"i": 34, "s": 229, "e": 237, "t": "约伯记1章3节列出约伯的家产与地位：七千羊、三千骆驼、五百对牛、五百母驴与许多仆婢", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 35, "s": 238, "e": 247, "t": "七千只羊意味着庞大牧场，羊毛与羊奶在古代御寒需求之下是极为丰厚的利润来源", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 36, "s": 248, "e": 260, "t": "三千骆驼在古代用于运货物流，相当于三千辆大货车，说明约伯的物流商贸规模极大", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 37, "s": 261, "e": 267, "t": "牛与驴用于耕地、仆婢众多，说明约伯的田产农业同样庞大，硬实力丰厚到难以想象", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 38, "s": 268, "e": 274, "t": "约伯记1章3节末句称约伯在东方为至大而非在乌斯地为至大，意指整个东方最顶配的人物", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 39, "s": 275, "e": 284, "t": "瘦死的骆驼未必比马大：只要上帝允许撒但插手，富可敌国、具国际地位的约伯也会满身烂疮坐在炉灰中", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 40, "s": 285, "e": 293, "t": "这类随时能平事的人被认为不会有任何不平安，只读1至5节会判断约伯的家庭一生不会出事", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 41, "s": 294, "e": 303, "t": "约伯不会出意外的三个理由：道德上远离恶事、信仰上敬畏神、硬实力达到国际大佬的级别", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 42, "s": 304, "e": 312, "t": "回应豪门家庭因兄弟姐妹争夺家产而痛苦的说法，指出约伯家里并不存在这种争端", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"i": 43, "s": 313, "e": 323, "t": "约伯记1章4节记儿子按日设摆筵席并请三个姐妹同吃喝，显示兄弟姐妹感情和睦、家庭其乐融融", "sec": "5.8", "f": {"ban": [], "per": [], "dem": []}}, {"i": 44, "s": 324, "e": 338, "t": "约伯记1章5节记筵席过后约伯叫儿女自洁、清早按数目献燔祭，因恐怕儿子犯罪心中弃掉神", "sec": "5.9", "f": {"ban": [], "per": [], "dem": []}}, {"i": 45, "s": 339, "e": 354, "t": "约伯的五层保障齐备：硬实力、正直、家庭和睦、经济与对儿女信仰的顶级看守，全家都在圣约的看守之中", "sec": "5.9", "f": {"ban": [], "per": [], "dem": []}}, {"i": 46, "s": 355, "e": 364, "t": "如此敬虔又强大的家族后来家破人亡、满身烂疮躺在炉灰中，而允许撒但施行此事的正是耶和华", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"i": 47, "s": 365, "e": 379, "t": "约伯记被列为智慧书第一卷；客观读约伯记会倒掉基督教鸡汤，因约伯全家敬虔、常常献祭仍遭巨变", "sec": "5.10", "f": {"ban": [], "per": [], "dem": []}}, {"i": 48, "s": 380, "e": 390, "t": "圣经所说的智慧不是中国人理解的厚黑圆滑，而是倒掉虚假的平安；钱多势力大加上虔诚仍非无懈可击", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"i": 49, "s": 391, "e": 399, "t": "约伯记1章5节称约伯常常这样行；生活经验会判断这种人不会出意外，如同不会认为马斯克交不起房租", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"i": 50, "s": 400, "e": 410, "t": "读完约伯记会发现支撑人生稳健度的资源可能瞬间倒塌，最终护住人的是耶和华所安扎的看不见的篱笆", "sec": "5.12", "f": {"ban": [], "per": [], "dem": []}}, {"i": 51, "s": 411, "e": 420, "t": "身外之物与身内之物的区分：约伯连皮与骨都被撒但击打，仍说他杀我我仍要在炉灰中等他", "sec": "5.12", "f": {"ban": [], "per": ["我"], "dem": []}}, {"i": 52, "s": 421, "e": 427, "t": "真正看守人的是耶和华所圈的四维篱笆，最终存留的是敬畏耶和华的真知识与真智慧所结的果子", "sec": "5.12", "f": {"ban": [], "per": [], "dem": []}}, {"i": 53, "s": 428, "e": 437, "t": "读约伯记须先预备好接受苦难可能突然发生；错误的期待带来错误的信心，只余去掉或更改福音两条危险的路", "sec": "5.13", "f": {"ban": [], "per": [], "dem": []}}, {"i": 54, "s": 438, "e": 444, "t": "约伯记2章称约伯持守纯正，即在炉灰中仍按原来所信的等候，不更改也不以口犯罪", "sec": "5.13", "f": {"ban": [], "per": [], "dem": []}}, {"i": 55, "s": 445, "e": 452, "t": "以约伯记2章回应信耶稣就保平安的说法；约伯的妻子在第一轮家财散尽、儿女尽亡时并未说什么", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}, {"i": 56, "s": 453, "e": 466, "t": "约伯的妻子在第二轮身体溃烂后才说弃掉神死了吧，约伯回答我们从神手里得福不也受祸吗", "sec": "5.14", "f": {"ban": [], "per": ["我们"], "dem": []}}, {"i": 57, "s": 467, "e": 478, "t": "面对信耶稣绝对平安顺遂的说法，以得福也受祸为信仰告白；并进入第一部分结尾的解释", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"i": 58, "s": 479, "e": 487, "t": "借保罗在罗马书所说万事互相效力使人在救恩上得益处，说明祸与福都通向确定的益处", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"i": 59, "s": 488, "e": 492, "t": "破产、生病对今生无益却对永生有益；人需重新认识得福受祸与永生益处之间的关系", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"i": 60, "s": 493, "e": 497, "t": "跟随耶稣确实不是专为今生保平安，最终寻求的是永恒的福乐，在那里神会擦去一切眼泪", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}, {"i": 61, "s": 498, "e": 503, "t": "今生几十年所遇的苦难都会过去，但永恒的福乐与永恒的咒诅都永久不会过去", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}, {"i": 62, "s": 504, "e": 511, "t": "人处在暂存的几十年中，福与祸会随之清空，惟永恒的定局不会废去，为此可接受今生的祸与福", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"i": 63, "s": 512, "e": 518, "t": "两套福音的区分：一套相信上帝只给福不给祸，另一套相信得福与得祸都为儿女的救恩效力", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"i": 64, "s": 519, "e": 532, "t": "约伯的三个朋友认为上帝只赐福义人，因而推论约伯受祸必因犯罪，三轮辩论都源于这套福音", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"i": 65, "s": 533, "e": 540, "t": "相信从神手里得福也受祸不等于上帝咒诅人，因他有永久的祝福，即让万事为救恩互相效力", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"i": 66, "s": 541, "e": 546, "t": "选择哪一套信仰决定信心的方向、道路与果子；后一套并不残酷，因永久之福远重于几十年的祸福", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"i": 67, "s": 547, "e": 551, "t": "总结约伯记1章1至5节所呈现的绝对稳固，以及约伯仍然出意外这一事实带来的基本认识", "sec": "5.18", "f": {"ban": [], "per": [], "dem": []}}, {"i": 68, "s": 552, "e": 556, "t": "人生一切抗风险的支架都会顷刻失去，最终看守人的是耶和华所安扎的篱笆与敬畏所积累的智慧", "sec": "5.18", "f": {"ban": [], "per": [], "dem": []}}, {"i": 69, "s": 557, "e": 566, "t": "进入第二部分约伯记1章6至8节，说明影响家庭乃至国家历史的往往是看不见的天上场景", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 70, "s": 567, "e": 572, "t": "约伯记1章6节记有一天神的众子来侍立在耶和华面前，约伯遭遇的转折点由此开始", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 71, "s": 573, "e": 581, "t": "神的众子即众天使，聚集在耶和华面前的场景如同皇帝早朝听政，众大臣站立其下", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 72, "s": 582, "e": 590, "t": "撒但原是堕落的天使，虽仍是受造的属灵活物，堕落之后已不在神的众子这个队伍之中", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"i": 73, "s": 591, "e": 604, "t": "也来在其中这一措辞暗示撒但不是集会的合法成员，如同外人出现在某教会聚集中显得不协调", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 74, "s": 605, "e": 613, "t": "约伯记1章7节耶和华主动询问撒但你从哪里来，这不是搭讪也不是找茬，而是一次讲话的授权", "sec": "6.3", "f": {"ban": [], "per": ["你"], "dem": []}}, {"i": 75, "s": 614, "e": 621, "t": "这段经文要表达的是撒但自始至终都在上帝权下，神不发问撒但便无法主动开口", "sec": "6.3", "f": {"ban": ["这段"], "per": [], "dem": []}}, {"i": 76, "s": 622, "e": 629, "t": "约伯记1章7节与2章2节问的是同样的问题，说明这不是全知者的困惑，而是命其回答的授权语式", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 77, "s": 630, "e": 640, "t": "以早朝有事启奏无事退朝、公司开会、课堂秩序为例，说明人在权柄底下不能主动发话", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 78, "s": 641, "e": 646, "t": "撒但不能冲进集会主动向上帝提起约伯，耶和华主动发问才给了撒但说话的资格", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"i": 79, "s": 647, "e": 653, "t": "耶和华出于荣耀的目的给撒但一定活动权限，攻击约伯两次都被限制，这种限制贯彻整卷约伯记", "sec": "6.4", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"i": 80, "s": 654, "e": 660, "t": "确知撒但肆虐的当下仍被上帝良善的权柄限制，人的安稳感便不只建立在脱离困境之后，也在困境之中", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}, {"i": 81, "s": 661, "e": 667, "t": "约伯记1章8节耶和华主动称许约伯完全正直远离恶事，引发是否主动引魔鬼攻击义人的困惑", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"i": 82, "s": 668, "e": 678, "t": "提出两个可能：耶和华主动要撒但注意约伯，或撒但本就在关注约伯而耶和华借其邪恶成就美善计划", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"i": 83, "s": 679, "e": 687, "t": "魔鬼不是全知全能，全宇宙只有耶和华全知全能全在；撒但似乎不受时间限制却受空间限制", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 84, "s": 688, "e": 694, "t": "约伯记1章7节撒但自称从地上走来走去往返而来，正说明他受空间限制，不可能全在", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 85, "s": 695, "e": 704, "t": "以耶稣所说从天降下仍旧在天的人子为对照，惟有上帝在东也在西、充满全地，不需往返", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 86, "s": 705, "e": 720, "t": "撒但从地上往返而来说明他已不在天上且受空间限制，若了解约伯的状况就必曾走到约伯身边", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"i": 87, "s": 721, "e": 730, "t": "约伯记1章9节之后撒但说出约伯家里的情况与神所设的篱笆，说明撒但一直在约伯身边盯着他", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 88, "s": 731, "e": 740, "t": "撒但对约伯敬畏神的原因两次表达质疑，耶和华两次允许试验，而上帝对约伯的评价不会出错", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"i": 89, "s": 741, "e": 749, "t": "撒但先说夺去所有约伯必弃掉神，约伯却说赏赐收取都是耶和华；再说击打身体，约伯仍持守纯正", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"i": 90, "s": 750, "e": 757, "t": "撒但对人的观察需要知识积累，先推测约伯因钱财敬畏神，再推测因皮肉骨头，两次都判断错误", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"i": 91, "s": 758, "e": 765, "t": "撒但虽厉害却不能与上帝掰手腕，受造天使永远处在上帝权下，而耶和华在天上就了解约伯", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"i": 92, "s": 766, "e": 775, "t": "人在神面前赤露敞开，在撒但面前却需被观察；日久见人心是受造物的限制，耶和华从开始就知道约伯", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"i": 93, "s": 776, "e": 785, "t": "上帝完全认可约伯的敬畏却两次允许他受严重灾祸；人们普遍认为招灾的必是恶人、义人必得福", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"i": 94, "s": 786, "e": 793, "t": "约伯记讨论一人受苦二人亨通这一在智慧书、诗篇、先知书中反复出现的主题，具备此智慧便有健全信心", "sec": "6.9", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"i": 95, "s": 794, "e": 801, "t": "各宗庙都以灵验作招牌，教会的见证也清一色是信主后丰收，无人敢以敬畏神后家破人亡作见证", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}, {"i": 96, "s": 802, "e": 813, "t": "路加福音财主与拉撒路比喻中的乞丐至死未得双倍，不可因约伯记结尾的双倍祝福把盼望重新寄于今生", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}, {"i": 97, "s": 814, "e": 822, "t": "好人不长命王八活千年这句中国俗语，同样是通过观察懂得恶人可能家大业大的道理", "sec": "6.11", "f": {"ban": [], "per": [], "dem": []}}, {"i": 98, "s": 823, "e": 829, "t": "不能因灾难就怀疑自己或别人的信仰，因上帝可能正认可他；也不能因顺风顺水就认可某人的信仰", "sec": "6.11", "f": {"ban": [], "per": [], "dem": []}}, {"i": 99, "s": 830, "e": 840, "t": "有人用家里买了三套房这类人生顺遂回应信仰认知的问题，属于鸡同鸭讲，也使人公然拒绝反思信仰", "sec": "6.12", "f": {"ban": [], "per": [], "dem": []}}, {"i": 100, "s": 841, "e": 850, "t": "有人明明对了却因突然遭灾开始怀疑自己；熟知智慧书的基督徒不会用当下环境解释信仰的正与反", "sec": "6.12", "f": {"ban": [], "per": [], "dem": []}}, {"i": 101, "s": 851, "e": 877, "t": "举例说明同一件事会有两种相反解读：腿摔断既被说成上帝拦阻也被说成撒但拦阻，实情往往是各人按自己的意愿解读", "sec": "6.13", "f": {"ban": [], "per": [], "dem": []}}, {"i": 102, "s": 878, "e": 889, "t": "人不只随私意解读圣经也随私意解读环境；所发生的事可能与上帝旨意无关，环境不应成为第一参考标准", "sec": "6.13", "f": {"ban": [], "per": [], "dem": []}}, {"i": 103, "s": 890, "e": 899, "t": "不要做属灵懂王替人解读身上所发生之事的属灵事实，传道人同样没有这种能力", "sec": "6.14", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"i": 104, "s": 900, "e": 913, "t": "传道人能告诉人的只有上帝的话，家庭处境的缘由无从知晓；瞎猜神的意思并据此教导别人的人被圣经称为愚昧人", "sec": "6.14", "f": {"ban": [], "per": [], "dem": ["据此"]}}, {"i": 105, "s": 914, "e": 922, "t": "约伯的三个朋友言之凿凿地用处境解释上帝如何看待约伯，正是这种人的示范；具备智慧可得干净皮袋装载新酒", "sec": "6.14", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"i": 106, "s": 923, "e": 928, "t": "宣告今天讲道到此为止，并回应遗留问题：不可用做事顺与不顺判断是否出于上帝的意思", "sec": "7.1", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"i": 107, "s": 929, "e": 935, "t": "第一鉴别标准是圣经六十六卷所立的上帝圣言准则，违反即不是、遵从即是，与顺遂与否无关", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 108, "s": 936, "e": 942, "t": "最大的灾祸是心眼昏迷不能明白真道，最大的祝福是上帝带人进入真理并赐下永恒的福乐", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"i": 109, "s": 943, "e": 947, "t": "回应上帝所认可的人既非受刑罚也非受管教为何仍被允许受祸的疑问，并以一段经文作为结束", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 110, "s": 948, "e": 959, "t": "约翰福音9章1至3节记门徒问生来瞎眼的人是谁犯了罪，门徒的提问已把答案限定在罪的范围内", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 111, "s": 960, "e": 967, "t": "耶稣回答不是这人也不是他父母犯罪，而是要显出神的作为；人对祸福罪恶的想当然认知需要调整", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"i": 112, "s": 968, "e": 969, "t": "宣告一起祷告，祷告以遵照上帝的话开始查考约伯为开端，转写稿在此处中断", "sec": "8.1", "f": {"ban": [], "per": [], "dem": ["此"]}}], "lines": ["好，各位平安哦。", "平安。", "好，帮助不敢当，但是神的话确实能建立你们，我只是把神的话呃用我们今天的话那个讲给，尽可能的讲给大家听哈。", "那我们闲言少叙，我为大家来宣读这周正道的经文。", "是在约伯记一章1~8节。", "那我来为弟兄姊妹们来诵读这周正道的经文。", "我们坦然地看经文就好了，一些难解的部分我为大家尽可能来解释。", "啊。", "1~8节，乌斯地有一个人名叫约伯。", "那人完全正直，敬畏神，远离恶事。", "他生了七个儿子，三个女儿。", "他的家产有七千羊、三千骆驼、五百对牛、五百母驴，并有许多仆婢。", "这人在东方中为至大。", "他的儿子按着日子各在自己家中设摆筵席，就打发人去请了他们三个姐妹来，与她们一同吃喝。", "筵席的日子过了，约伯打发人去叫她们自洁。", "他清早起来，按着他们众人的数目，献燔祭。", "因为他说，恐怕我儿子犯了罪，心中弃掉神。", "约伯常常这样行。", "有一天，神的众子来侍立在耶和华面前。", "撒但也来到其中。", "耶和华问撒但说，你从哪里来？", "撒但回答说，我从地上走来走去，往返而来。", "耶和华问撒但说，你曾用心查看我的仆人约伯没有？", "地上再没有人像他完全正直，敬畏神，远离恶事。", "好，这周我们只分享到这个部分为止。", "那我们先一起来祷告。", "主们照着你的话能够继续在以你话语的根基上来崇拜你。", "但愿你 还是儿子的罪？", "他们限定了耶稣的回答，是不是？", "他们认为绝对是罪这个答案。", "耶稣怎么回答？", "耶稣说，也不是这人犯罪。", "也不是他父母犯罪，是要在他身上显出神的作为来，能明白吗？", "原来与罪无关，原来与神的作为有关。", "当你去思考的时候，有的时候你限定了上帝的回答。", "你问上帝问题，你只给了上帝一个选择题，A 与 B 你回答我，到底是父母的罪还是儿子的罪？", "后来你发现两个都不是，原来与神的作为有关，这件事从头到尾与罪无关。", "这就是圣经告诉我们的，祸福罪恶到底是不是我们以前这么想当然的认知的，我们需要做个调整，好吗？", "好，我们一起来祷告。", "所以我们遵照你的话，要开始看约伯的"], "chapters": [{"no": 1, "t": "开场问候与讲道定位：用今天的语言把神的话讲给会众，以神的话建立会众", "s": 1, "e": 3}, {"no": 2, "t": "诵读本周正道经文约伯记1章1至8节：约伯其人、家产、儿女筵席与天上的集会", "s": 4, "e": 25}, {"no": 3, "t": "开场祷告：求神临格会众中间、开通耳朵，赐下先知使徒所记的福音与真信心", "s": 26, "e": 33}, {"no": 4, "t": "讲道框架：约伯记1章1至5节看现实背景、6至8节看属灵背景，并提出两个待答问题", "s": 34, "e": 79}, {"no": 5, "t": "讲道第一部分：约伯记1章1至5节，约伯在道德、信仰、人丁、财富与家庭上的绝对稳固及其神学含义", "s": 80, "e": 556}, {"no": 6, "t": "讲道第二部分：约伯记1章6至8节，天上的集会、撒但在上帝权下的受限地位与不可凭环境判断信仰", "s": 557, "e": 922}, {"no": 7, "t": "收尾补充：鉴别上帝旨意的第一标准是圣经准则，并以约翰福音9章1至3节作结", "s": 923, "e": 967}, {"no": 8, "t": "结束祷告的开端：遵照上帝的话开始查考约伯的记载，转写稿在此处中断", "s": 968, "e": 969}], "runs": {"v1": {"stats": {"pred_n": 140, "gb": 112, "pb": 139, "exact": 77, "near": 31, "f0": [0.554, 0.688, 0.614], "f3": [0.777, 0.964, 0.861], "wd": 0.2446, "groups": {"same": 40, "over": 10, "near": 12, "under": 2, "mixed": 14}, "ban": 71, "per": 15, "dem": 52, "long": 8, "tok_in": 53923, "tok_out": 68308, "prompt": "切段_v1", "model": "deepseek-flash", "effort": "low"}, "groups": [{"s": 1, "e": 3, "st": "same", "g": [0], "p": [{"s": 1, "e": 3, "t": "讲者开场向会众问平安，面对「帮助」的称许表示不敢当，谦卑地说真正能建立人的是神的话，自己只是把神的话尽可能用今天的话讲给大家听", "en": "讲者表示帮助不敢当，只是把神的话尽可能用今天的话讲给会众听", "sec": "1.1", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 4, "e": 8, "st": "same", "g": [1], "p": [{"s": 4, "e": 8, "t": "宣布本周正道经文为约伯记一章1至8节，讲员先为大家宣读、再为弟兄姊妹诵读，并说明坦然看经文就好，一些难解的部分会尽可能解释", "en": "说明会坦然看经文，难解的部分尽可能为大家解释", "sec": "2.1", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 9, "e": 13, "st": "same", "g": [2], "p": [{"s": 9, "e": 13, "t": "约伯记1章开头介绍乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴并许多仆婢，在东方人中为至大", "en": "这人在东方中为至大", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 14, "e": 18, "st": "same", "g": [3], "p": [{"s": 14, "e": 18, "t": "约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹一同吃喝；筵席的日子过了，约伯打发人叫他们自洁，清早按众人的数目献燔祭，因为恐怕儿子犯了罪、心中弃掉神，约伯常常这样行", "en": "约伯常常这样行", "sec": "2.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 19, "e": 25, "st": "over", "g": [4], "p": [{"s": 19, "e": 22, "t": "约伯记1章6至7节，有一天神的众子来侍立在耶和华面前，撒但也来到其中；耶和华问撒但从哪里来，撒但回答说他在世上走来走去、往返而来", "en": "撒但回答说他从地上走来走去，往返而来", "sec": "2.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 23, "e": 25, "t": "约伯记1章8节，耶和华问撒但曾否用心查看他的仆人约伯，并说地上再没有人像约伯完全正直、敬畏神、远离恶事；这周的分享到此为止", "en": "地上再没有人像约伯完全正直、敬畏神、远离恶事，本周分享到此为止", "sec": "2.3", "f": {"ban": [], "per": [], "dem": ["此"]}}]}, {"s": 26, "e": 33, "st": "near", "g": [5, 6], "p": [{"s": 26, "e": 28, "t": "会前祷告开始，求神照着话语、以他的话语为根基继续受崇拜，并求神自己在众圣徒中得着他当得的荣耀", "en": "求神自己在众圣徒中得着他当得的荣耀", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 29, "e": 33, "t": "求神临格开通众弟兄姊妹的耳朵使他们听，赐下圣经所记的福音、古旧信仰与一切知识，使他们认识神、一次得救，并愿真信心在他们中间酝酿、多结果子，最后奉耶稣基督的圣名祈求", "en": "全篇以奉耶稣基督的圣名祈求作结", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 34, "e": 41, "st": "under", "g": [7, 8], "p": [{"s": 34, "e": 41, "t": "讲员把约伯记开篇分两个部分、两个眼光来看，其中1至5节是约伯的现实背景：他是个东方大富户，有众多儿子、牛驴仆婢，经文先向读者介绍约伯这个人", "en": "约伯的现实背景是东方大富户，先介绍约伯这个人", "sec": "4.1", "f": {"ban": ["讲员"], "per": [], "dem": ["这个"]}}]}, {"s": 42, "e": 48, "st": "same", "g": [9], "p": [{"s": 42, "e": 48, "t": "6至8节是约伯信仰的属灵背景：他敬畏神、远离恶事，因此他虽是被撒但控告的人，却也是在天上被耶和华非常认可的人；讲员就按大纲这两方面来讲解", "en": "就按大纲上的这两个方面来讲", "sec": "4.1", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 49, "e": 54, "st": "over", "g": [10], "p": [{"s": 49, "e": 51, "t": "讲员自我介绍姓陈名社炳，本人不必多介绍，并说明新的一年在本地服侍的任务很明确：把圣经里的福音、先知使徒的教导抛开传统，慢慢告诉会众，使这道成为这里敬拜的根基，不再另立根基", "en": "希望这道成为这里敬拜的根基，不再立别的根基", "sec": "4.2", "f": {"ban": ["讲员"], "per": ["我"], "dem": []}}, {"s": 52, "e": 54, "t": "讲员会在自认许可的范围内与自己教会同步信息，尽量同步他认为合适的内容；若觉得某周信息不合适，就改用最古老的约伯记来讲", "en": "就用最古老的一卷约伯记来慢慢开始", "sec": "4.2", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 55, "e": 58, "st": "same", "g": [11], "p": [{"s": 55, "e": 58, "t": "今天教会对福音的信仰通常关注的是个人而不是国度，比较关注今生这几十年个人的祸福，并不关注将来的国度，所以到各地讲道时不得不先从个人层面的事谈起", "en": "所以到各地不得不先从个人的事谈起", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 59, "e": 63, "st": "same", "g": [12], "p": [{"s": 59, "e": 63, "t": "约伯记不是传全备福音最好的书，却能帮助消除以前比较顽固的观念，为领受真道预备所需的智慧；若以后要冒犯会众，讲员希望先用约伯记来冒犯，因为福音本身对人的挑战更大", "en": "希望先用约伯记来冒犯你们，因为福音对人的挑战更大", "sec": "4.3", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 64, "e": 67, "st": "same", "g": [13], "p": [{"s": 64, "e": 67, "t": "针对「认识真道是否要先认识苦难」的疑问，讲员明确说不是，并提醒约伯记是智慧书的第一卷；人们提到约伯记通常联想到苦难，其实它的大主题是智慧，而且是认识耶和华的智慧", "en": "约伯记的大主题其实是智慧，是认识耶和华的智慧", "sec": "4.4", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 68, "e": 73, "st": "same", "g": [14], "p": [{"s": 68, "e": 73, "t": "讲员按讲章上的两个大纲先讨论两个问题，第一个问题是通过1至5节看世界上存不存在绝对的平安；许多在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求", "en": "一到五节先看平安这个课题", "sec": "4.5", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 74, "e": 76, "st": "same", "g": [15], "p": [{"s": 74, "e": 76, "t": "第二个问题在6至8节：被上帝认可的信仰，是否意味着这个人就会远离灾祸", "en": "是否意味着这个人就会远离灾祸", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 77, "e": 79, "st": "same", "g": [16], "p": [{"s": 77, "e": 79, "t": "如果对信仰的祸与福曾做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整这些看法", "en": "约伯记的开篇可以稍微调整一下", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 80, "e": 106, "st": "mixed", "g": [17, 18, 19], "p": [{"s": 80, "e": 83, "t": "讲者引出约伯记一章1至5节，请听众先看一看约伯这个近乎永久安稳的人生，并设问什么叫做永久安稳的人生", "en": "提出什么叫永久安稳的人生这一问题", "sec": "5.1", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}, {"s": 84, "e": 88, "t": "讲者稍作背景介绍，认为约伯记是最早写成的一卷书，成书比创世记更早，约伯是生活在很早年代、可能比亚伯拉罕更早的人；随后引出第一节乌斯地有一个人名叫约伯", "en": "引出第一节经文，乌斯地有一个人名叫约伯", "sec": "5.1", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 89, "e": 93, "t": "约伯是乌斯地的人，并不是以色列人；他可能生活在更早的族长时代，甚至可能比亚伯拉罕更早，是一位认识独一真神的古代圣徒", "en": "指出约伯是可能比亚伯拉罕更早、认识独一真神的古代圣徒", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 94, "e": 98, "t": "针对有人认为旧约只有以色列人信上帝的误会，讲者指出这是人会有的第一个误会，耶和华是全地的主，也是全人类的主", "en": "强调耶和华是全地的主、全人类的主", "sec": "5.2", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 99, "e": 106, "t": "讲者举例说明亚伯拉罕之前就有人敬拜耶和华，如撒冷王麦基洗德本是至高上帝的祭司并从亚伯拉罕手里收取十分之一，术士巴兰也知道耶和华的名字，可见族长时代之前耶和华是全地的信仰", "en": "得出结论：族长时代之前耶和华其实是全地的信仰", "sec": "5.2", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 107, "e": 114, "st": "same", "g": [20], "p": [{"s": 107, "e": 114, "t": "独一神信仰并非从摩西或亚伯拉罕才开始，连该隐都认识耶和华，万族本来都知道，只是在开枝散叶中纯正信仰被保全在一族之内；早在约伯的年代，乌斯地就有一个非常敬畏上帝的人", "en": "指出早在约伯年代，乌斯地已有一个非常敬畏上帝的人", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 115, "e": 121, "st": "same", "g": [21], "p": [{"s": 115, "e": 121, "t": "讲者提出为什么圣经要收录约伯的故事、开篇一章1至5节究竟要向读者交代什么，并强调圣经没有一段细节是枉费的，读者必须先明白一件事", "en": "追问读者在开篇1-5节要先明白和了解什么", "sec": "5.3", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 122, "e": 128, "st": "same", "g": [22], "p": [{"s": 122, "e": 128, "t": "讲者请听众先设想，今天在一般人眼中什么样的人和家庭绝对不会出意外，答案通常是钱多一点、人多一点、资源多一点，这类家庭遇到事情更有能力平事", "en": "指出人多、钱多、资源多的家庭更能平事", "sec": "5.3", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 129, "e": 144, "st": "mixed", "g": [23, 24], "p": [{"s": 129, "e": 133, "t": "从经文的描述看，作者突出约伯一个鲜明的观念，就是他的稳或他家庭的稳；按照各个时代的眼光，约伯都是一个绝对不会遭遇灾祸、有能力面对任何风险的人", "en": "说按各时代的眼光约伯是不会遭灾祸、能面对任何风险的人", "sec": "5.3", "f": {"ban": ["作者"], "per": [], "dem": []}}, {"s": 134, "e": 140, "t": "讲者解释为什么开篇1至5节要交代约伯的稳，因为约伯后来落入极大灾难，开篇绝对平安稳妥的大背景与后面完全不安稳的处境形成了一种非常大的落差", "en": "说1-5节的平安稳妥与后面的不安稳形成非常大的落差", "sec": "5.3", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 141, "e": 144, "t": "讲者建议用这个落差慢慢思考自己对耶和华信心的根基；即使以前没特别读懂的弟兄姐妹，也至少知道约伯后来遭殃，家破人亡、浑身疾病、躺在炉灰中非常痛苦", "en": "提到约伯后来家破人亡、浑身疾病、躺在炉灰中", "sec": "5.3", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}]}, {"s": 145, "e": 154, "st": "over", "g": [25], "p": [{"s": 145, "e": 150, "t": "讲者提醒读经先不要管后面的故事，最怕带着上帝视角；上帝视角就是已经知道后面的事，知道太多反而破坏了读开头时本应有的思维渠道", "en": "说知道太多反而破坏开头应有的思维渠道", "sec": "5.4", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 151, "e": 154, "t": "讲者请听众设想，若生活中遇到约伯这样的人，会不会认为他的家庭出现变故，并自答应该不会，进而追问这样的人可能遇到什么样的麻烦事", "en": "追问听众会认为约伯这种人可能遇到什么样的麻烦", "sec": "5.4", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}]}, {"s": 155, "e": 174, "st": "near", "g": [26, 27], "p": [{"s": 155, "e": 168, "t": "讲者请听众列举人生动荡困境的风险因素，指出努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力，抗风险能力最强的人常被认为最平安，可见人都有对生活不安稳的担忧和风险意识", "en": "说我们都有对生活不安稳的担忧和风险意识", "sec": "5.4", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 169, "e": 174, "t": "对于突然遭遇灾祸的人，通常的看法是恶有恶报，坏人最不稳；讲者追问家庭为何容易出灾祸，认为或因抗风险能力低，或因是常在恶事里、常被恶事反噬的恶人", "en": "说常做恶事的人会像常在河边走一样难免不湿鞋", "sec": "5.4", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 175, "e": 192, "st": "near", "g": [28, 29], "p": [{"s": 175, "e": 180, "t": "讲者引导听众看第一节，追问圣经怎样形容约伯，他是不是坏人、是不是常在河边走难免不湿鞋、容易遭到恶报的人，答案是都不是", "en": "断定约伯不是容易遭到恶报的人", "sec": "5.5", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 181, "e": 192, "t": "圣经首先介绍约伯第一个稳健的因素，就是他完全正直并远离恶事，由此任何道德和违法犯罪带来的风险都可彻底排除；讲者以开赌场贩毒的人迟早会因自己的不正直招来灾祸作对比，指出约伯没有这些风险", "en": "指出约伯完全正直，敬畏神，远离恶事", "sec": "5.5", "f": {"ban": ["讲者"], "per": [], "dem": ["这些"]}}]}, {"s": 193, "e": 205, "st": "same", "g": [30], "p": [{"s": 193, "e": 205, "t": "约伯还有敬畏神这一点，连耶和华都承认，因此连属灵的、遭天谴的因素也排开；讲者解释所谓天谴因素，就是不信上帝、拜偶像、乱搞迷信甚至养小鬼、亵渎上帝，可能因上帝的愤怒牵连家庭", "en": "说明约伯敬畏神，连遭天谴的因素也排开", "sec": "5.5", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 206, "e": 222, "st": "near", "g": [31, 32], "p": [{"s": 206, "e": 215, "t": "约伯从品质上完全正直、信仰上敬畏神、生活上没有违法乱纪并远离一切恶事，道德伦理、司法到信仰虔诚度的风险因素都不存在；讲者由此认同约伯是个好人，并追问这样的家庭若还会遇到波折，还有什么可能因素", "en": "追问这样子的家庭若还会遇到波折，还有什么可能因素", "sec": "5.5", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}, {"s": 216, "e": 222, "t": "讲者指出还有硬实力不够或太弱小的因素，在古代乃至今天的农村，人丁兴旺都意味着家族势力大；过去的人喜欢生儿子未必是重男轻女，而是人丁兴旺、顶梁柱多，家族就更稳健，讲者以爷爷那一辈农村的见闻为例", "en": "总结生儿子多、人丁兴旺的家族更稳健的观念", "sec": "5.6", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 223, "e": 228, "st": "same", "g": [33], "p": [{"s": 223, "e": 228, "t": "讲者转向约伯的硬实力，看第二节所记他的家庭成员，指出这是家庭抗风险的第二把锁，约伯生了七个儿子，还有三个女儿，人丁足够兴旺", "en": "指出约伯生七个儿子三个女儿，人丁兴旺", "sec": "5.6", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 229, "e": 237, "st": "same", "g": [34], "p": [{"s": 229, "e": 237, "t": "讲者承接努力赚钱、多积累人脉资源也是为了增加抗风险因素，转而看第三节约伯的财富和地位：他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，这人在东方为至大，经文交代了他的财富、权势和国际地位", "en": "说这一节交代了约伯的财富、权势和国际地位", "sec": "5.7", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 238, "e": 260, "st": "near", "g": [35, 36], "p": [{"s": 238, "e": 248, "t": "讲者换一种方式解释，七千只羊可见约伯有庞大的牧场，在古代羊毛和羊奶都是非常丰厚的利润；圣经其实一五一十清晰交代了约伯的收入来源，如同他的一份财务报表和清单", "en": "说这就是约伯的财务报表和清单", "sec": "5.7", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 249, "e": 260, "t": "讲者解释三千骆驼在古代不用来吃，而是运货的交通工具，相当于今天的大货车；他提到丝绸之路和佩特拉古城，说约伯就像拥有三千辆大货车，物流商贸做得非常非常大", "en": "说约伯的物流商贸做得非常非常大", "sec": "5.7", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 261, "e": 267, "st": "same", "g": [37], "p": [{"s": 261, "e": 267, "t": "古代耕地用牛和驴，可见约伯的田产也非常大，他家里还有许多仆婢；讲者总结约伯在牧场、物流和农业田产各方面都很丰厚，硬实力和产业丰厚到令人难以想象", "en": "说约伯的产业丰厚到难以想象", "sec": "5.7", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 268, "e": 284, "st": "mixed", "g": [38, 39], "p": [{"s": 268, "e": 272, "t": "经文最后给约伯的评价是「在东方为至大」，讲者特别强调这不是在乌斯地为至大；约伯不只在家乡最厉害，而是整个东方最顶配的人物", "en": "说约伯是整个东方最顶配的人物", "sec": "5.7", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 273, "e": 280, "t": "讲者点出那里落差感：约伯这种人后来竟坐在炉灰里；人说瘦死的骆驼比马大，约伯记却说未必，只要上帝愿意、撒旦插手，这样的人也会满身烂疮哀叫连连；约伯的强盛恐怕连城邦君王都很难做到", "en": "说约伯强盛到连城邦君王都很难做到", "sec": "5.8", "f": {"ban": ["讲者"], "per": [], "dem": ["这样", "这种"]}}, {"s": 281, "e": 284, "t": "讲者开始总结约伯在历史上真实的素描：他的经济富可敌国，不止乌斯地而是整个东方；他的地位东方为至大，是在东边具备国际影响力的人", "en": "说约伯是东方具备国际影响力的人", "sec": "5.8", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 285, "e": 303, "st": "near", "g": [40, 41], "p": [{"s": 285, "e": 290, "t": "讲者追问，如果今天在生活中认识约伯，会觉得他有什么风险吗，就算遇到事情处理起来是不是小问题；生病、儿子结婚买房对普通家庭是负担，对约伯却随时可以处理，能随时平事的人怎会不平安", "en": "追问随时能平事的人是否会有不平安", "sec": "5.8", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 291, "e": 303, "t": "讲者说如果只看1至5节，会认为约伯这个家庭这辈子不可能有任何意外；理由明确：道德上他远离恶事、不干坏事也不惹事，信仰上敬畏神而远离被击打，硬实力上更是国际大佬，这类手眼通天的人最爱喊人定胜天", "en": "说今天最常喊人定胜天口号的就是这种手眼通天的大佬", "sec": "5.8", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}]}, {"s": 304, "e": 323, "st": "near", "g": [42, 43], "p": [{"s": 304, "e": 311, "t": "有人不服气，提出豪门这个因素，说有钱人也有有钱人的苦，兄弟姐妹争夺家产时打得头破血流；讲者承认这种悲剧自古确实有，但指出约伯家里并不是这样", "en": "说豪门争夺家产的悲剧自古就有，但约伯家不是这样", "sec": "5.9", "f": {"ban": ["讲者"], "per": [], "dem": ["这个", "这样", "这种"]}}, {"s": 312, "e": 323, "t": "讲者引用第四节，约伯的儿子按着日子各在自己家里设摆筵席，并请三个姐妹一同吃喝，由此构建出兄弟姐妹感情非常好、常常聚餐、其乐融融的氛围，并没有豪门争夺家产的争端，家庭根本不存在任何变数", "en": "说约伯家根本不存在任何变数", "sec": "5.9", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 324, "e": 338, "st": "over", "g": [44], "p": [{"s": 324, "e": 329, "t": "讲者加上第五节的最后一层保障，指出约伯对儿女的信仰教育也是顶级的；有些人才稍有一点小钱就人定胜天，约伯到了这样的地位却仍活在一种警醒甚至震惊之中", "en": "说约伯活在一种警醒甚至震惊之中", "sec": "5.10", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}, {"s": 330, "e": 338, "t": "第五节记载筵席的日子一过，约伯就打发儿女去自洁，又清早起来按着众人的数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，而且约伯常常这样行", "en": "说约伯常常这样行为儿女献燔祭", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 339, "e": 379, "st": "mixed", "g": [45, 46, 47], "p": [{"s": 339, "e": 353, "t": "讲者加上最后一层锁，指出作者要表达这种人不可能出意外，从硬实力、正直、家庭和睦、经济到对家庭的信仰看守都是顶级；约伯生怕儿子们弃掉神，所以宴席一过他清早起来按数目献燔祭，连信仰教育都是顶配，全家从本人到子女都在圣约的看守之中", "en": "说约伯全家从本人到子女的信仰都在圣约的看守之中", "sec": "5.10", "f": {"ban": ["作者", "讲者"], "per": [], "dem": ["这种"]}}, {"s": 354, "e": 359, "t": "讲者描述脑海中浮现出一个敬虔又强大的家族，随即指出约伯记的冲击力正在这里：这么敬虔又强大的家族，到后面居然会家破人亡，人全部被杀光，唯一的活口还满身烂疮躺在炉灰里", "en": "说唯一剩下的活口满身烂疮躺在炉灰里", "sec": "5.11", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 360, "e": 363, "t": "讲者指出更难接受的一点：人以为攻击约伯的是撒旦，但允许这件事发生的，竟然是他们全家敬畏的那位耶和华，是耶和华允许撒旦去做的", "en": "说允许这件事的竟是他们全家敬畏的耶和华", "sec": "5.11", "f": {"ban": ["讲者"], "per": [], "dem": ["这件"]}}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷，讲者认为很合适；因为如果肯客观地读约伯记，人一定会倒掉之前喝下过的所有基督教的鸡汤，打掉任何幻想，不需要别人来劝", "en": "说读懂约伯记会打掉任何幻想、倒掉基督教的鸡汤", "sec": "5.11", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 371, "e": 379, "t": "读懂约伯记会看到，此人不仅硬实力强，更是全家敬虔，作父亲的在信仰上非常警醒，第五节说他常常这样行，连耶和华也认可他完全敬畏、远离恶事；但读第三章就看到约伯说自己在炉灰中巴不得快点死，极其痛苦", "en": "说约伯在第三章说自己躺在炉灰中巴不得快点死", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["此", "这样"]}}]}, {"s": 380, "e": 399, "st": "mixed", "g": [48, 49], "p": [{"s": 380, "e": 385, "t": "讲者设问读懂约伯记会获得怎样的智慧，指出中国人常把智慧理解成厚黑或圆滑，其实不是，而是让人倒掉曾喝下的一切基督教毒鸡汤和虚假的平安；没想清楚这个问题，人就没法健全地认识福音", "en": "说没想清楚这个问题就无法健全认识福音", "sec": "5.12", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}, {"s": 386, "e": 392, "t": "讲者指出每个人评估自己人生的顺遂和稳健都有具体标准，用约伯记1至5节可整理为：钱多、人多、势力大的人遇到难关都能轻易迈过，再加上做人好、虔诚、家庭团结、敬畏神，就内外无懈可击，而且约伯不是偶尔如此，第五节说他常常这样行", "en": "说约伯不是偶尔如此，第五节说他常常这样行", "sec": "5.12", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}, {"s": 393, "e": 399, "t": "讲者追问这样的人会不会出现意外，说生活中真遇到这种人，人肯定认为不会；就像自己可能交不起房租，却不可能认为马斯克交不起房租，因为从没想象过这种事，这种人与炉灰中的乞丐完全是两种人，无法想象会重叠在一个人身上", "en": "追问这两种形象怎么会重叠在一个人身上", "sec": "5.12", "f": {"ban": ["讲者"], "per": [], "dem": ["这样", "这种"]}}]}, {"s": 400, "e": 410, "st": "over", "g": [50], "p": [{"s": 400, "e": 404, "t": "讲者说答案要到后面读约伯记才见分晓：按人以往的人生经验，会觉得这么厉害又敬畏上帝的人不会出意外，但约伯记告诉你会，不止会，而且非常非常会", "en": "说约伯记告诉你会出意外，而且非常非常会", "sec": "5.12", "f": {"ban": ["讲者"], "per": ["你"], "dem": []}}, {"s": 405, "e": 410, "t": "作为安稳支柱的资源都有可能瞬间失去；读完约伯记会发现，支撑人生稳健的资源可能一个接一个甚至瞬间倒塌，最后护住人的反倒是耶和华看守的一个看不见的篱笆，连身外之物到身内之物都失去后，剩下的只有敬畏耶和华的智慧和知识", "en": "说最终留下的是敬畏耶和华的智慧和知识", "sec": "5.13", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 411, "e": 420, "st": "same", "g": [51], "p": [{"s": 411, "e": 420, "t": "讲者解释身外之物就是钱、房产，弟兄姐妹还能想通，连衣服也算身外之物，扔掉还有皮和肉；但约伯连身内之物都失去，皮与骨被撒旦击打，倒在炉灰中快扛不住，却仍说要继续等候神，只求神说清楚为何让他这样，这就是约伯的信仰", "en": "说约伯只求神说清楚为何让他这样，这就是他的信仰", "sec": "5.13", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}]}, {"s": 421, "e": 427, "st": "same", "g": [52], "p": [{"s": 421, "e": 427, "t": "最终能够看守人的，不是人以为的抗风险因素，也不是想象中的人生支架，因为这些说倒塌就倒塌；真正看守人的是耶和华为我们圈上的四围篱笆，最终剩下的不是身外之物甚至不是皮与骨，而是敬畏耶和华的真知识和真智慧，是发芽结果后丰收的果子，神要收割并存留", "en": "说神要从你身上收割并存留你", "sec": "5.13", "f": {"ban": [], "per": ["我们"], "dem": ["这些"]}}]}, {"s": 428, "e": 444, "st": "mixed", "g": [53, 54], "p": [{"s": 428, "e": 433, "t": "讲者说人需要在约伯记一开始就预备好接受这件事，随时清醒知道与神同行这些年许多事很可能突然发生；只有在正确的预设下，人才不会在苦难的年岁突然弃掉神，因为错误的期待往往带来错误的信心，而错误的信心无法正确回应自己的遭遇", "en": "说错误的信心无法正确回应自己的一切遭遇", "sec": "5.14", "f": {"ban": ["讲者"], "per": [], "dem": ["这些", "这件"]}}, {"s": 434, "e": 439, "t": "讲者说带着错误的期待又想回应当下的处境，只剩下两个最危险的做法：要么去掉福音，要么更改福音；就算宣称不去掉福音，若仍怀着错误的期待来信，也还是要更改福音，没办法接受纯正的东西", "en": "说怀着错误期待就只好更改福音，无法接受纯正的东西", "sec": "5.14", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 440, "e": 444, "t": "第二章上帝评价约伯持守纯正；讲者解释持守纯正，就是这个福音在约伯于乌斯地为至大时让他舒适，如今倒在炉灰中让他不舒适，但他仍按原来的继续等候，哪怕困惑也不更改，也不以口犯罪、不忘认上帝，这才是真实的智慧", "en": "说这才是真实的智慧", "sec": "5.14", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}]}, {"s": 445, "e": 466, "st": "mixed", "g": [55, 56], "p": [{"s": 445, "e": 448, "t": "讲者说这些年无论顺境逆境，都有人好意地对他说信耶稣就是保平安、上帝大大祝福；他往往喜欢用约伯记二章九节来回应，就是我们从神手里得福，也从神手里受祸，这话是约伯对他太太说的", "en": "说明这是约伯对他太太说的话", "sec": "5.15", "f": {"ban": ["讲者"], "per": ["我们"], "dem": ["这些"]}}, {"s": 449, "e": 458, "t": "讲者不认同很多人说约伯太太太坏：第一轮家财散尽、儿女全死光时，她没说什么，还跟在约伯身边；直到第二轮约伯身体烂掉、骨头被击打倒在炉灰中，她才受不了崩溃，所以说这个女人已经非常非常好了", "en": "说这个女人已经非常非常好了", "sec": "5.15", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}, {"s": 459, "e": 466, "t": "讲者分析约伯太太过不去的那关，就是觉得从神手里得福就算了，一个福也不给也行，但不能受祸；约伯却回答说，我们从神手里得福，不也受祸吗，并说她说话像个愚顽的妇人，这是他们夫妻之间的对话", "en": "说这是约伯和妻子之间的对话", "sec": "5.15", "f": {"ban": ["讲者"], "per": ["我们"], "dem": []}}]}, {"s": 467, "e": 492, "st": "mixed", "g": [57, 58, 59], "p": [{"s": 467, "e": 476, "t": "讲者回顾这些年无论顺境逆境，总有人说信耶稣绝对平安顺遂，他会请对方打住，因为他认定自己从神手里得福也从神手里受祸，甘心愿意如此，这位给福也给祸的上帝都是他的上帝；但很多人会疑惑，按传统宗教性来看，得祸你还信什么，没有人是为了承认得祸来信耶稣的", "en": "说没有人是为了承认得祸来信耶稣的", "sec": "5.15", "f": {"ban": ["讲者"], "per": ["你"], "dem": ["这些"]}}, {"s": 477, "e": 482, "t": "讲者在第一层的结尾解释为什么按这个眼光看约伯记；他借助使徒保罗在罗马书中的话，即万事互相效力，为人的救恩得益处，并说明从神手里得福也从神手里受祸，指的是人的人生际遇", "en": "说从神手里得福受祸指的是人生际遇", "sec": "5.16", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}, {"s": 483, "e": 492, "t": "讲者说这不是说上帝坏心眼，因为万事包含祸与福，无论祸福都有一个确定的益处，就是救恩的益处；破产、生病对人生无益，对永生却有益；所以人从一开始就要明确，万事互相效力为的是永生的益处，因为只有到达终点，神才会擦去我们一切的眼泪", "en": "说只有到达终点神才会擦去我们一切的眼泪", "sec": "5.16", "f": {"ban": ["讲者"], "per": ["我们"], "dem": []}}]}, {"s": 493, "e": 497, "st": "same", "g": [60], "p": [{"s": 493, "e": 497, "t": "讲者说跟随耶稣确实不是专门为了今生保平安；他并不是说这辈子的事不重要，但人最终寻求的是什么必须一开始就认识清楚，因为那是永恒的福乐，信耶稣一定是为了追求这个而来", "en": "说信耶稣一定是为了追求永恒的福乐", "sec": "5.16", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}]}, {"s": 498, "e": 511, "st": "under", "g": [61, 62], "p": [{"s": 498, "e": 511, "t": "讲者用通俗的话说，自己相信这辈子的苦难都会过去，而永恒的福乐永久不会过去，但永恒的咒诅也同样永久不会过去；信耶稣与否会有永恒的结局，人如今处在暂存的状态里，九十年以后要进入永恒不废去的祸福；为了这个永恒定局，他愿意接受现在的福与祸，只要它为救恩效力", "en": "说为了永恒定局，愿意在今生承受祸与福", "sec": "5.16", "f": {"ban": ["讲者"], "per": [], "dem": ["这个"]}}]}, {"s": 512, "e": 518, "st": "same", "g": [63], "p": [{"s": 512, "e": 518, "t": "讲者说最终一定会发现两套截然不同的福音：一套相信上帝只给福、不给祸，另一套相信上帝让人得福、得祸都为儿女的救恩效力；这两套绝对不一样，而大部分人相信信耶稣绝对只给福，只有祝福没有灾祸", "en": "说大部分人相信信耶稣只有祝福没有灾祸", "sec": "5.17", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 519, "e": 532, "st": "same", "g": [64], "p": [{"s": 519, "e": 532, "t": "讲者说人后来经历人生动荡又无法解释，只能不断怀疑自己哪里做错了；约伯后面三个朋友集体怀疑他，认定上帝只给信他的人祝福，所以约伯受苦就一定干了坏事，三轮对话都在骂约伯，约伯则不断辩解自己一生没干任何对不起上帝的事", "en": "说约伯不断辩解自己没干任何对不起上帝的事", "sec": "5.17", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 533, "e": 540, "st": "same", "g": [65], "p": [{"s": 533, "e": 540, "t": "讲者总结第一套福音就是绝对平安、没有灾祸、只有祝福；而我们所信的是从神手里得福也从神手里受祸，但这并不代表上帝咒诅我们，因为他给的是永久的祝福，就是让万事为人的救恩互相效力，甚至可以为了永恒的定局在短暂期间暂时降祸，正如他对以色列整个部族所做的，短暂的咒诅促成永久的祝福", "en": "说短暂的咒诅促成永久的祝福", "sec": "5.17", "f": {"ban": ["讲者"], "per": ["我们"], "dem": []}}]}, {"s": 541, "e": 546, "st": "same", "g": [66], "p": [{"s": 541, "e": 546, "t": "讲者说最终会发现选择哪一套信仰、信心看向哪个方向，会让人走向不同的道路、结出不同的果子；他劝大家选后一套福音，且并不认为它残酷，因为略有一点得救智慧的人都知道怎么选，所以在今生只要能促成不可废去之福，就愿意接受上帝给的一切", "en": "说只要促成不可废去之福，愿意接受上帝给的一切", "sec": "5.17", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 547, "e": 556, "st": "near", "g": [67, 68], "p": [{"s": 547, "e": 550, "t": "讲者总结约伯记一章1至5节，指出这是为后面读约伯记作铺垫的绝对稳固：方方面面约伯都不可能出现任何意外，但他还是出了意外", "en": "说约伯方方面面都不可能出意外，但他还是出意外了", "sec": "5.18", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 551, "e": 556, "t": "讲者由此得出最基本的结论：人以前认为的一切抗风险稳固支架都不算数，原来都会顷刻失去，原来耶和华会允许这样的事发生，最终看守人的只是耶和华为我们安扎的篱笆；身内之物、身外之物全部失去后，剩下的只有敬畏耶和华的人生所积累的知识和智慧", "en": "说那积累下来的知识和智慧会开花结果", "sec": "5.18", "f": {"ban": ["讲者"], "per": ["我们"], "dem": ["这样"]}}]}, {"s": 557, "e": 566, "st": "same", "g": [69], "p": [{"s": 557, "e": 566, "t": "约伯记1至5节讲的是人能看见的约伯有多有钱、家庭有多和睦，但有些关乎家庭的事在人的家中看不见，真正影响家庭甚至国家历史的是天上的场景，圣经也多次呈现这所谓的灵界", "en": "真正影响家庭甚至国家历史的是天上的场景，圣经多次呈现所谓的灵界", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 567, "e": 581, "st": "near", "g": [70, 71], "p": [{"s": 567, "e": 575, "t": "视角转到天上，从约伯记1章6节看有一天神的众子在耶和华面前侍立，神的众子就是众天使的意思，大家一同聚集在耶和华面前", "en": "神的众子聚集在耶和华面前，他们称天使为神的众子", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 576, "e": 581, "t": "用康熙王朝、雍正王朝里皇帝坐在上面、众大臣站在下面集会的早朝场景，来比方神的众子聚集在耶和华面前的景象", "en": "这个场景就像君王听政的集会，被称为早朝", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 582, "e": 604, "st": "mixed", "g": [72, 73], "p": [{"s": 582, "e": 591, "t": "很多人不明白撒旦怎么也能到天上、混在神的众子中间，撒旦本是堕落的天使，背叛上帝以后已不在这队伍之中，因此经文用「也来在其中」的措辞值得留意", "en": "撒旦堕落以后不在这个队伍之中，但经上用「也来在其中」的措辞值得注意", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 592, "e": 601, "t": "「也来在其中」这一措辞暗示撒旦已不属神的众子，就如高湖教会集会时陈世美也来在其中，说明撒旦是这个队伍中不协调的成员", "en": "神的众子是一个队伍，撒旦是这个队伍中不协调的一个成员", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 602, "e": 604, "t": "撒旦已经不是神的众子，也不是天使，但他原本确实是受造的这种属灵气的活物，所以不在这个集会的合法成员之内", "en": "他不在这个集会的合法成员之内", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这个", "这种"]}}]}, {"s": 605, "e": 613, "st": "same", "g": [74], "p": [{"s": 605, "e": 613, "t": "许多人的困惑是：耶和华既然允许撒旦来，为何还在约伯记1章7节主动询问撒旦从哪里来，这不是一次搭讪，也不是一次找茬，而是一次讲话的授权", "en": "这不是一次搭讪，也不是一次找茬，它是一次讲话的授权", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 614, "e": 629, "st": "near", "g": [75, 76], "p": [{"s": 614, "e": 618, "t": "这里要表达的不是耶和华主动找魔鬼说话，而是撒旦自始至终都在上帝的权下，因为这是一次说话的授权，神不开口，撒旦就没有办法主动开口", "en": "神不跟他这样讲，撒旦是没有办法主动开口的", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 619, "e": 629, "t": "有人质疑耶和华全知为何还要问撒旦从哪里来，但约伯记1章7节和2章2节上帝问的是同样的问题，可见这不是上帝困惑，而是一句授权的语式，是叫撒旦回答自己从哪里来", "en": "上帝问的是同样的问题，这是一种说话的授权", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 630, "e": 640, "st": "same", "g": [77], "p": [{"s": 630, "e": 640, "t": "皇帝早朝时大臣太监会说「有事启奏，无事退朝」，公司跟领导开会、小孩上课乃至讲道时也都没人能主动站起来说话，可见在权柄之下人平时察觉不到权柄，要说话必须得到授权", "en": "你们在我的权柄底下，要说话得举手，我要授权你才能站起来讲话", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 641, "e": 646, "st": "same", "g": [78], "p": [{"s": 641, "e": 646, "t": "在耶和华的集会上，撒旦不可能冲进去主动跟上帝说话，是耶和华主动用同样的语式发问，给了撒旦一个发言的授权，撒旦才得到说话的权利，否则他在上帝面前连说话的资格都没有", "en": "撒旦才能够得到说话的权利，不然他在上帝面前连说话的资格都没有", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 647, "e": 653, "st": "same", "g": [79], "p": [{"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给了撒旦一定的活动权限，魔鬼完全在神的掌管之中，连攻击约伯时也必须被耶和华的权柄限制，这种对邪恶的限制会贯彻整卷约伯记", "en": "这种对邪恶的限制，也会贯彻整个约伯记", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 654, "e": 660, "st": "same", "g": [80], "p": [{"s": 654, "e": 660, "t": "神的儿女若确知撒旦肆虐的当下正被上帝良善的权柄限制，那么对上帝的期待和安稳感就不只建立在脱离困境之后，也建立在正处困境之中，因为相信当下仍被上帝掌控", "en": "你相信当下还在被上帝掌控着，你就不会有任何的不安稳感", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 661, "e": 667, "st": "same", "g": [81], "p": [{"s": 661, "e": 667, "t": "约伯记1章8节耶和华主动称赞约伯完全正直、远离恶事，很多人因此困惑：这不是主动引魔鬼攻击义人吗？撒旦本来就凶，上帝不去掩盖，反而提醒他去看约伯，岂不成了勾引他试探这义人", "en": "撒旦本来就是控告者，上帝还说他有多好，这个问题还要解决", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 668, "e": 694, "st": "near", "g": [82, 83, 84], "p": [{"s": 668, "e": 677, "t": "读圣经时因不了解原来的表达而感觉不痛快，于是提出两个选择题：究竟是耶和华主动要撒旦注意约伯，还是撒旦本来就在关注约伯，耶和华只是借着他的邪恶来授权他，并促成自己美善的计划", "en": "两个选择题：是耶和华主动要撒旦注意约伯，还是撒旦本来就在关注约伯", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 678, "e": 684, "t": "平常规矩是介绍上帝，今天要稍微介绍魔鬼：魔鬼不是全知全能，全宇宙中只有耶和华上帝一位是全知且全能且全在的", "en": "全宇宙中只有耶和华上帝一位是全知且全能且全在", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 685, "e": 694, "t": "魔鬼好像不受时间限制、不会老，但受空间限制，约伯记1章7节他自己说从地上走来走去、往返而来，说明他在东方就不在西方，不能认为魔鬼是全在的，全在的只有上帝", "en": "如果他在东方，他就一定不在西边，不能认为魔鬼是全在的", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 695, "e": 704, "st": "over", "g": [85], "p": [{"s": 695, "e": 700, "t": "耶稣所说从天降下却仍就在天的人子表明，宇宙中没有一个人能既在这里又在那里，受造物都受空间限制，要去那边只能从这里走过去", "en": "我们受空间限制，要去那边只能从这里走过去，往返而来", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 701, "e": 704, "t": "只有上帝能说自己在东也在西，超乎众人之上、贯乎众人之中、也住在众人之间，道成肉身仍在天，用全能的命令托住万有，他不需要往返，充满全地", "en": "他不需要往返，他充满全地，耶和华的荣耀", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 705, "e": 720, "st": "over", "g": [86], "p": [{"s": 705, "e": 711, "t": "耶和华问撒旦是从哪里来、是什么样的活物，撒旦非常诚实地回答自己从地上来，因为他已经不在天上，神的众子在天上，撒旦却从地上走来走去、往返而来", "en": "神的众子在天上，撒旦从地上来，走来走去往返而来", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 712, "e": 720, "t": "介绍撒旦受空间限制的用意在于：他在东方就不在西方，得走来走去，所以如果他了解约伯的信息，这些年他一定在约伯身边；若认为撒旦也是全在的就要受批评，他既然不全在也不全知，就得走到约伯身边", "en": "他既然不全在也不全知，他就要走到约伯身边", "sec": "6.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 721, "e": 730, "st": "same", "g": [87], "p": [{"s": 721, "e": 730, "t": "不要以为魔鬼全然厉害，撒旦对约伯了解不了解？他不是全知者，却因一直在约伯身边、一直盯着约伯，所以知道约伯家里的情况，他本身就想试探约伯", "en": "撒旦一直盯着这个人，因为他不是一个全知者", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 731, "e": 740, "st": "same", "g": [88], "p": [{"s": 731, "e": 740, "t": "撒旦对约伯敬畏神的原因两次提出质疑，耶和华两次都允许他去试验，但撒旦对约伯内心的评估出错了；上帝全知全能全在，对约伯的评价是敬畏我、远离恶事，不会错", "en": "上帝对约伯的评价是敬畏我、远离恶事，不会错", "sec": "6.6", "f": {"ban": [], "per": ["我"], "dem": []}}]}, {"s": 741, "e": 749, "st": "same", "g": [89], "p": [{"s": 741, "e": 749, "t": "撒旦第一次质疑岂是无故呢，声称夺去他所有约伯必当面弃掉神，结果没有发生，约伯说赏赐收取都在耶和华；第二次撒旦又以皮代骨，声称击打他身体他必弃掉神，结果又错了，约伯浑身烂疮之后依然持守纯正", "en": "第二次又错了，约伯浑身烂疮之后依然持守纯正", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 750, "e": 757, "st": "same", "g": [90], "p": [{"s": 750, "e": 757, "t": "撒旦两次出错，上帝不会出错，撒旦对人的观察需要一个知识的积累：第一次他以为约伯是因为钱财才敬畏神，钱财拿掉却发现约伯仍然敬畏，第二次又评估是皮肉，结果骨头又错了", "en": "第二次评估是皮肉，骨头又错了", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 758, "e": 765, "st": "same", "g": [91], "p": [{"s": 758, "e": 765, "t": "撒旦很厉害，人搞不过他，但千万不要把他想成能跟上帝掰腕子，网络中耶稣和撒旦掰手腕的图是没有可能的，撒旦永远在上帝面前是权下的姿态，耶和华对约伯的评价从头到尾没有任何差错", "en": "耶和华对约伯的评价从头到尾都没有出现任何差错", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 766, "e": 775, "st": "same", "g": [92], "p": [{"s": 766, "e": 775, "t": "人在神面前赤露敞开，在撒旦面前却不是，撒旦有智慧也需要观察人，他对约伯的评估两次出错；而日久见人心是人类这些有限受造物才需要的，耶和华从开始就知道约伯，撒旦却不全知也不全在，只是他在约伯旁边，想试探约伯", "en": "他对约伯也不全然了解，但他在约伯旁边，他本身就想试探约伯", "sec": "6.6", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 776, "e": 813, "st": "mixed", "g": [93, 94, 95, 96], "p": [{"s": 776, "e": 781, "t": "上帝完全认可约伯对他的敬畏，人会觉得神应该直接赶走撒旦、保护约伯，可上帝竟然两次都允许约伯受祸，而且灾祸非常严重，这是大部分人都想不明白的，因为人认为招灾的一定是恶人，义人一定要得福", "en": "招灾的一定是恶人，义人一定要得福才对", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 782, "e": 786, "t": "约伯的三个朋友后面也持同样的看法；这卷书讨论了一个非常需要讨论的主题，就是义人受苦、恶人亨通这个怪现象", "en": "这卷书讨论的主题：义人受苦、恶人亨通的怪现象", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 787, "e": 792, "t": "义人受苦、恶人亨通这一主题在智慧书、诗篇、先知书中反复出现，与人的想象相反，圣经非常诚实地告诉人真实处境；当然不是说义人必然受苦，而是义人有可能受苦，恶人却有可能亨通", "en": "义人有可能受苦，恶人却有可能亨通", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 793, "e": 800, "t": "具备这种智慧之后才能喝不下基督教的毒鸡汤，也有健全的信心；正常人选择任何宗教都以保佑顺遂和福泽为敬拜理由，庙宇都以灵验作招牌，就连教会听到的见证也几乎清一色是信耶稣以后丰收了什么，没有人敢拿敬畏神以后家破人亡来说事", "en": "没有人敢拿敬畏神以后家破人亡来说事，但上帝自己就记载了这个事", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 801, "e": 807, "t": "圣经中有一位与约伯类似的人物至死没有得回，就是路加福音财主和拉撒路比喻中的乞丐拉撒路，他长烂疮、狗舔他的疮，没有得到双倍，死后却在亚伯拉罕的怀里", "en": "拉撒路长烂疮，死后在亚伯拉罕的怀里", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 808, "e": 810, "t": "不要因为约伯记结尾说他双倍得回，就以为最终盼望的又变成祝福，那这篇道就白讲了；很多的时候，义人可能受苦、恶人可能亨通，是圣经告诉人在这个始祖堕落以后被败坏辖制的世界，人生可能就是这样", "en": "义人可能受苦，恶人可能亨通，是上帝告诉你在被败坏辖制的世界人生可能这样", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这个", "这样"]}}, {"s": 811, "e": 813, "t": "更重要的是要告诉大家，这几十年所给的是不可废去之福，福音就是这个，不是别的东西", "en": "我们的福音是这个，不是别的东西", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 814, "e": 829, "st": "near", "g": [97, 98], "p": [{"s": 814, "e": 821, "t": "不用约伯记来介绍，中国老祖宗有一句话好人不长命、王八活千年，王八指的就是坏人，坏人反而家大业大，老祖宗都通过观察懂得这个道理", "en": "坏人怎么家大业大呢，老祖宗都通过观察懂得这个道理", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 822, "e": 829, "t": "作为一个具体的基督徒，不能因为遭遇灾难就怀疑自己或别人的信仰，因为上帝可能认可他；同样也不能因为一个人顺风顺水就认可他的信仰，因为上帝可能不认可他，圣经中也有这样的例子", "en": "不能因顺遂就认可一个人的信仰，因为上帝可能不认可他", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 830, "e": 850, "st": "mixed", "g": [99, 100], "p": [{"s": 830, "e": 838, "t": "当指出某人信仰的方式需要调整时，有人竟拿自己家里买了三套房子来回应，这是鸡同鸭讲；不要把处境放在自己信仰的纯正度上，人对福音的误解会导致完全错信，有人会用多年家庭和睦或事业高升来公然拒绝反思自己的信仰", "en": "有人用家庭和睦或事业高升来拒绝反思自己的信仰，这是非常遗憾的", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 839, "e": 843, "t": "有的人自己错了，却因家庭或人生顺遂的处境拿来拒绝反思；有的人明明对了，却因突然遭灾又开始怀疑自己，这两种都不可取，要相信智慧书一定给人带来智慧", "en": "两个都不可取，你得信智慧书一定给你带来智慧", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 844, "e": 850, "t": "用环境来解释信仰的实质是一种误区，用当下的环境作为对信仰正与反的解释，绝不会从一个熟知智慧书的基督徒嘴里听见，因为顺遂与祸福跟上帝对一个人的认可与否是两码事", "en": "顺遂与祸福跟上帝对你的认可与否是两码事", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 851, "e": 877, "st": "over", "g": [101], "p": [{"s": 851, "e": 858, "t": "假设决定要来这间教会讲道，昨天却摔断了腿、早上又拉肚子，有人会说这是上帝在拦阻、不要去，另一拨人则说这是撒旦在拦阻、你要坚持去作成神的工，一件事却有两种解释", "en": "一件事，一个现实，你会两种解释", "sec": "6.9", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 859, "e": 870, "t": "这不是虚构，十多年来要做关乎上帝的工作时，事前常出现发烧、腿受伤、骑车摔了这类看得见的问题，结果同一件事分出两拨人给出两种解释：一拨说看来上帝拦阻不要去，另一拨说看来撒旦拦阻、上帝喜欢、你要去，让人不知该听谁的", "en": "同一件事分出两拨人给出两种解释，不知听谁的", "sec": "6.9", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 871, "e": 877, "t": "借着物质的事指着灵界来论就是愚昧，但很多人喜欢这样干；真相是：一般说上帝拦阻你的人，通常是自己不想我去；一般说撒旦拦阻的人，其实是他自己想去", "en": "说上帝拦阻的人通常自己不想我去，说撒旦拦阻的人其实自己想去", "sec": "6.9", "f": {"ban": [], "per": ["你", "我"], "dem": ["这样"]}}]}, {"s": 878, "e": 889, "st": "over", "g": [102], "p": [{"s": 878, "e": 884, "t": "人随私意解读，不只解读圣经，还会解读环境；他身上发生的事可能跟上帝的旨意没半点关系，不要硬扯在一起、一定要去对应；从约伯记会发现天上的场景和地下的场景完全没什么关系，都是上帝在这件事上的美意", "en": "天上的场景和地下的场景完全是没什么关系的", "sec": "6.9", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 885, "e": 889, "t": "无论走上正确还是错误的道路，环境都不要成为第一参考标准，因为有时眼前显明的东西并不表示背后属灵的实际，生病也不代表这个人就是坏，解读上帝的旨意不要这样", "en": "眼前显明的东西不表示背后属灵的实际", "sec": "6.9", "f": {"ban": [], "per": [], "dem": ["这个", "这样"]}}]}, {"s": 890, "e": 922, "st": "mixed", "g": [103, 104, 105], "p": [{"s": 890, "e": 893, "t": "约伯完全没有得罪神，他1至5节的稳却被6至8节认可他的上帝打破，所以今天当下要做一个最简单的调整：不要去做那种属灵的董王，好像可以为弟兄姊妹解读他身上发生的一切属灵事实，人何德何能", "en": "你何德何能，可以为弟兄姊妹解读他身上的属灵事实", "sec": "6.10", "f": {"ban": [], "per": [], "dem": ["那种"]}}, {"s": 894, "e": 898, "t": "所谓的传道人何德何能，家庭的处境和顺遂不要来问他，他不知道；天底下许多传道人都认为他们知道，但他认为他不知道，而且也不认为他们知道", "en": "天底下许多传道人都认为他们知道，我认为我不知道", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}, {"s": 899, "e": 910, "t": "能懂的只有上帝的话是怎么说，可以通过上帝的原则告诉大家，但天上那个场景是人的智慧所不可企及的，也不知道某人家里的处境为什么这样；希望弟兄姊妹安稳在这本书上，这不是直接的安稳，而是根基的稳固，风吹雨打也不动摇", "en": "希望弟兄姊妹安稳在其上，根基稳固，风吹雨打也不动摇", "sec": "6.10", "f": {"ban": [], "per": [], "dem": ["这样", "那个"]}}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天通过自己的瞎猜教别人怎么做事的这种人，或许被看作属灵人，圣经却称他们为愚昧人；约伯的三个朋友后面会具体示范什么叫这种人，他们言之凿凿、振振有词地跟约伯解释他的处境证明上帝怎么看待他，我们不要做这种人", "en": "三个朋友是属灵的懂王，我们不要做这种人", "sec": "6.10", "f": {"ban": [], "per": ["我们"], "dem": ["这种"]}}, {"s": 919, "e": 922, "t": "如果具备了智慧书的智慧，就可以得到一个干净的皮袋子，得到了干净的皮袋子，就能好好地装载新酒，不至于破裂掉，这就是约伯记全部的信息", "en": "得到干净的皮袋子，装载新酒不至于破裂，这是约伯记全部的信息", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 923, "e": 928, "st": "same", "g": [106], "p": [{"s": 923, "e": 928, "t": "讲者在结尾回应听众可能提出的疑问：既然不能靠环境来辨别神的旨意，那多年来靠环境判断、认为做事不顺就不是上帝意思的做法对不对；他提醒不要这样理解，并指出做事不顺就不是神的意思、越不顺越是神的意思，这两种极端都不可取", "en": "提醒不要把做事不顺当作神的意思，也不要把越不顺当作神的意思，两种极端都不可取", "sec": "7.1", "f": {"ban": ["讲者"], "per": [], "dem": ["这样"]}}]}, {"s": 929, "e": 942, "st": "mixed", "g": [107, 108], "p": [{"s": 929, "e": 936, "t": "讲者自问自答，指出第一鉴别标准是上帝圣言的准则，也就是这66卷书，无论环境顺遂与否，遵从就是、违反就不是；这是所谓的根基，上帝怎么说永远是行动的最高准则，而不是自己或家庭的遭遇", "en": "上帝怎么说永远是行动的最高准则，而不是自己或家庭的遭遇", "sec": "7.1", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 937, "e": 939, "t": "我们靠什么知道上帝对自己的真实想法，答案也是这卷书，也就是圣经，因此希望人的安全感能够建立在圣经之上", "en": "希望人的安全感建立在圣经这卷书之上", "sec": "7.2", "f": {"ban": [], "per": ["我们"], "dem": []}}, {"s": 940, "e": 942, "t": "人所能遭遇的最大灾祸是心眼昏迷、不能明白真道，所能遭遇的最大祝福则是上帝带领人进入真理，并且赐下永恒的福乐", "en": "最大祝福是上帝带领人进入真理并赐永恒的福乐", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 943, "e": 959, "st": "mixed", "g": [109, 110], "p": [{"s": 943, "e": 946, "t": "有人提出疑问：上帝所认可的人不出于刑罚，也不出于管教，那有什么理由让这个人受祸；既然不管教他、不试炼他、不行罚他，又不讨厌他，为什么还允许人受祸", "en": "既然不讨厌他，为什么还允许人受祸", "sec": "7.3", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 947, "e": 952, "t": "讲者用一段经文来结束，并念出约翰福音9章1到3节：耶稣过去看见一个生来瞎眼的人，门徒问他说，拉比，这人生来瞎眼是谁犯了罪，是这人呢，是他父母呢", "en": "门徒问这人生来瞎眼是谁犯了罪，是这人还是他父母", "sec": "7.3", "f": {"ban": ["讲者"], "per": [], "dem": []}}, {"s": 953, "e": 959, "t": "讲者解释门徒对天生瞎子的反应：他们认定一定与罪有关，只是争论是父母的罪还是本人的罪，等于限定了耶稣的回答，认为答案绝对是罪", "en": "门徒认定答案绝对是罪，限定了耶稣的回答", "sec": "7.3", "f": {"ban": ["讲者"], "per": [], "dem": []}}]}, {"s": 960, "e": 967, "st": "over", "g": [111], "p": [{"s": 960, "e": 962, "t": "耶稣回答门徒说，也不是这人犯罪，也不是他父母犯罪，是要在他身上显出神的作为来（约翰福音9章3节）", "en": "不是这人犯罪，也不是他父母犯罪，是要在他身上显出神的作为来", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 963, "e": 967, "t": "讲者总结说原来这件事与罪无关，而与神的作为有关；人向上帝提问时往往只给一个选择题，结果两个都不是，因此需要对祸福与罪恶想当然的认知作出调整", "en": "祸福罪恶并非从前想当然的认知，需要做调整", "sec": "7.3", "f": {"ban": ["讲者"], "per": [], "dem": ["这件"]}}]}, {"s": 968, "e": 969, "st": "same", "g": [112], "p": [{"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记", "en": "落在遵照神的话、要开始看约伯记这件事上", "sec": "8.1", "f": {"ban": [], "per": [], "dem": []}}]}], "near": {"29": 30, "89": 88, "94": 96, "134": 137, "169": 170, "181": 184, "216": 215, "249": 248, "273": 275, "291": 294, "312": 313, "354": 355, "364": 365, "393": 391, "440": 438, "477": 479, "551": 552, "576": 573, "592": 591, "619": 622, "678": 679, "685": 688, "787": 786, "793": 794, "801": 802, "822": 823, "839": 841, "899": 900, "911": 914, "937": 936, "947": 948}, "unc": {"6": "4至6行是重复的宣读与诵读宣告，同属一个动作，不再细分", "29": "开通耳朵既承接前面对神的崇拜，也引出后面赐下福音使其听信；单独成段不足三行，故与后面的祈求合并为一段", "34": "34-36为全节的总起，仅3行，按宁少勿多并入第一段", "52": "全节仅6行，49-51与52-54各3行，是否该并成一段可再斟酌", "77": "77-79为收束性的应用，仅3行，也可并入前一段", "155": "155-168共14行，155-158抛出风险因素的问题与159-168谈抗风险能力是否应再切一刀，倾向视为同一论证动作", "330": "「第五节怎么讲？」为下文开口，按过渡句规则归入引出的一段", "418": "418-420引约伯在炉灰中的回应，也可独立成段，但也像411-417失去身内之物的延续，暂并入前段", "592": "「也来在其中」的措辞分析是否应与582-591分开，也可看作同一个论证动作的深入", "630": "皇帝早朝的比方与后面公司、课堂的比方并列支撑同一个论点，也可合成一段", "801": "801是引子，802-807是拉撒路的反例，801也可看作前一段的延续", "894": "894的「包括我」是893的递进，也可与890-893合成一段", "929": "「那你说，那如果环境的顺遂，它不是指第一鉴别标准」既收束上文对环境的讨论，又引出下面对第一标准的自问自答，按过渡句规则归后", "947": "「我用最后一段经文作为结束，我给你们念一下就好」既是本段的收尾，又为下文念经文开口，按其引出的内容归后"}, "paras": [{"s": 1, "e": 3, "t": "讲者开场向会众问平安，面对「帮助」的称许表示不敢当，谦卑地说真正能建立人的是神的话，自己只是把神的话尽可能用今天的话讲给大家听"}, {"s": 4, "e": 8, "t": "宣布本周正道经文为约伯记一章1至8节，讲员先为大家宣读、再为弟兄姊妹诵读，并说明坦然看经文就好，一些难解的部分会尽可能解释"}, {"s": 9, "e": 13, "t": "约伯记1章开头介绍乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴并许多仆婢，在东方人中为至大"}, {"s": 14, "e": 18, "t": "约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹一同吃喝；筵席的日子过了，约伯打发人叫他们自洁，清早按众人的数目献燔祭，因为恐怕儿子犯了罪、心中弃掉神，约伯常常这样行"}, {"s": 19, "e": 22, "t": "约伯记1章6至7节，有一天神的众子来侍立在耶和华面前，撒但也来到其中；耶和华问撒但从哪里来，撒但回答说他在世上走来走去、往返而来"}, {"s": 23, "e": 25, "t": "约伯记1章8节，耶和华问撒但曾否用心查看他的仆人约伯，并说地上再没有人像约伯完全正直、敬畏神、远离恶事；这周的分享到此为止"}, {"s": 26, "e": 28, "t": "会前祷告开始，求神照着话语、以他的话语为根基继续受崇拜，并求神自己在众圣徒中得着他当得的荣耀"}, {"s": 29, "e": 33, "t": "求神临格开通众弟兄姊妹的耳朵使他们听，赐下圣经所记的福音、古旧信仰与一切知识，使他们认识神、一次得救，并愿真信心在他们中间酝酿、多结果子，最后奉耶稣基督的圣名祈求"}, {"s": 34, "e": 41, "t": "讲员把约伯记开篇分两个部分、两个眼光来看，其中1至5节是约伯的现实背景：他是个东方大富户，有众多儿子、牛驴仆婢，经文先向读者介绍约伯这个人"}, {"s": 42, "e": 48, "t": "6至8节是约伯信仰的属灵背景：他敬畏神、远离恶事，因此他虽是被撒但控告的人，却也是在天上被耶和华非常认可的人；讲员就按大纲这两方面来讲解"}, {"s": 49, "e": 51, "t": "讲员自我介绍姓陈名社炳，本人不必多介绍，并说明新的一年在本地服侍的任务很明确：把圣经里的福音、先知使徒的教导抛开传统，慢慢告诉会众，使这道成为这里敬拜的根基，不再另立根基"}, {"s": 52, "e": 54, "t": "讲员会在自认许可的范围内与自己教会同步信息，尽量同步他认为合适的内容；若觉得某周信息不合适，就改用最古老的约伯记来讲"}, {"s": 55, "e": 58, "t": "今天教会对福音的信仰通常关注的是个人而不是国度，比较关注今生这几十年个人的祸福，并不关注将来的国度，所以到各地讲道时不得不先从个人层面的事谈起"}, {"s": 59, "e": 63, "t": "约伯记不是传全备福音最好的书，却能帮助消除以前比较顽固的观念，为领受真道预备所需的智慧；若以后要冒犯会众，讲员希望先用约伯记来冒犯，因为福音本身对人的挑战更大"}, {"s": 64, "e": 67, "t": "针对「认识真道是否要先认识苦难」的疑问，讲员明确说不是，并提醒约伯记是智慧书的第一卷；人们提到约伯记通常联想到苦难，其实它的大主题是智慧，而且是认识耶和华的智慧"}, {"s": 68, "e": 73, "t": "讲员按讲章上的两个大纲先讨论两个问题，第一个问题是通过1至5节看世界上存不存在绝对的平安；许多在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求"}, {"s": 74, "e": 76, "t": "第二个问题在6至8节：被上帝认可的信仰，是否意味着这个人就会远离灾祸"}, {"s": 77, "e": 79, "t": "如果对信仰的祸与福曾做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整这些看法"}, {"s": 80, "e": 83, "t": "讲者引出约伯记一章1至5节，请听众先看一看约伯这个近乎永久安稳的人生，并设问什么叫做永久安稳的人生"}, {"s": 84, "e": 88, "t": "讲者稍作背景介绍，认为约伯记是最早写成的一卷书，成书比创世记更早，约伯是生活在很早年代、可能比亚伯拉罕更早的人；随后引出第一节乌斯地有一个人名叫约伯"}, {"s": 89, "e": 93, "t": "约伯是乌斯地的人，并不是以色列人；他可能生活在更早的族长时代，甚至可能比亚伯拉罕更早，是一位认识独一真神的古代圣徒"}, {"s": 94, "e": 98, "t": "针对有人认为旧约只有以色列人信上帝的误会，讲者指出这是人会有的第一个误会，耶和华是全地的主，也是全人类的主"}, {"s": 99, "e": 106, "t": "讲者举例说明亚伯拉罕之前就有人敬拜耶和华，如撒冷王麦基洗德本是至高上帝的祭司并从亚伯拉罕手里收取十分之一，术士巴兰也知道耶和华的名字，可见族长时代之前耶和华是全地的信仰"}, {"s": 107, "e": 114, "t": "独一神信仰并非从摩西或亚伯拉罕才开始，连该隐都认识耶和华，万族本来都知道，只是在开枝散叶中纯正信仰被保全在一族之内；早在约伯的年代，乌斯地就有一个非常敬畏上帝的人"}, {"s": 115, "e": 121, "t": "讲者提出为什么圣经要收录约伯的故事、开篇一章1至5节究竟要向读者交代什么，并强调圣经没有一段细节是枉费的，读者必须先明白一件事"}, {"s": 122, "e": 128, "t": "讲者请听众先设想，今天在一般人眼中什么样的人和家庭绝对不会出意外，答案通常是钱多一点、人多一点、资源多一点，这类家庭遇到事情更有能力平事"}, {"s": 129, "e": 133, "t": "从经文的描述看，作者突出约伯一个鲜明的观念，就是他的稳或他家庭的稳；按照各个时代的眼光，约伯都是一个绝对不会遭遇灾祸、有能力面对任何风险的人"}, {"s": 134, "e": 140, "t": "讲者解释为什么开篇1至5节要交代约伯的稳，因为约伯后来落入极大灾难，开篇绝对平安稳妥的大背景与后面完全不安稳的处境形成了一种非常大的落差"}, {"s": 141, "e": 144, "t": "讲者建议用这个落差慢慢思考自己对耶和华信心的根基；即使以前没特别读懂的弟兄姐妹，也至少知道约伯后来遭殃，家破人亡、浑身疾病、躺在炉灰中非常痛苦"}, {"s": 145, "e": 150, "t": "讲者提醒读经先不要管后面的故事，最怕带着上帝视角；上帝视角就是已经知道后面的事，知道太多反而破坏了读开头时本应有的思维渠道"}, {"s": 151, "e": 154, "t": "讲者请听众设想，若生活中遇到约伯这样的人，会不会认为他的家庭出现变故，并自答应该不会，进而追问这样的人可能遇到什么样的麻烦事"}, {"s": 155, "e": 168, "t": "讲者请听众列举人生动荡困境的风险因素，指出努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力，抗风险能力最强的人常被认为最平安，可见人都有对生活不安稳的担忧和风险意识"}, {"s": 169, "e": 174, "t": "对于突然遭遇灾祸的人，通常的看法是恶有恶报，坏人最不稳；讲者追问家庭为何容易出灾祸，认为或因抗风险能力低，或因是常在恶事里、常被恶事反噬的恶人"}, {"s": 175, "e": 180, "t": "讲者引导听众看第一节，追问圣经怎样形容约伯，他是不是坏人、是不是常在河边走难免不湿鞋、容易遭到恶报的人，答案是都不是"}, {"s": 181, "e": 192, "t": "圣经首先介绍约伯第一个稳健的因素，就是他完全正直并远离恶事，由此任何道德和违法犯罪带来的风险都可彻底排除；讲者以开赌场贩毒的人迟早会因自己的不正直招来灾祸作对比，指出约伯没有这些风险"}, {"s": 193, "e": 205, "t": "约伯还有敬畏神这一点，连耶和华都承认，因此连属灵的、遭天谴的因素也排开；讲者解释所谓天谴因素，就是不信上帝、拜偶像、乱搞迷信甚至养小鬼、亵渎上帝，可能因上帝的愤怒牵连家庭"}, {"s": 206, "e": 215, "t": "约伯从品质上完全正直、信仰上敬畏神、生活上没有违法乱纪并远离一切恶事，道德伦理、司法到信仰虔诚度的风险因素都不存在；讲者由此认同约伯是个好人，并追问这样的家庭若还会遇到波折，还有什么可能因素"}, {"s": 216, "e": 222, "t": "讲者指出还有硬实力不够或太弱小的因素，在古代乃至今天的农村，人丁兴旺都意味着家族势力大；过去的人喜欢生儿子未必是重男轻女，而是人丁兴旺、顶梁柱多，家族就更稳健，讲者以爷爷那一辈农村的见闻为例"}, {"s": 223, "e": 228, "t": "讲者转向约伯的硬实力，看第二节所记他的家庭成员，指出这是家庭抗风险的第二把锁，约伯生了七个儿子，还有三个女儿，人丁足够兴旺"}, {"s": 229, "e": 237, "t": "讲者承接努力赚钱、多积累人脉资源也是为了增加抗风险因素，转而看第三节约伯的财富和地位：他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，这人在东方为至大，经文交代了他的财富、权势和国际地位"}, {"s": 238, "e": 248, "t": "讲者换一种方式解释，七千只羊可见约伯有庞大的牧场，在古代羊毛和羊奶都是非常丰厚的利润；圣经其实一五一十清晰交代了约伯的收入来源，如同他的一份财务报表和清单"}, {"s": 249, "e": 260, "t": "讲者解释三千骆驼在古代不用来吃，而是运货的交通工具，相当于今天的大货车；他提到丝绸之路和佩特拉古城，说约伯就像拥有三千辆大货车，物流商贸做得非常非常大"}, {"s": 261, "e": 267, "t": "古代耕地用牛和驴，可见约伯的田产也非常大，他家里还有许多仆婢；讲者总结约伯在牧场、物流和农业田产各方面都很丰厚，硬实力和产业丰厚到令人难以想象"}, {"s": 268, "e": 272, "t": "经文最后给约伯的评价是「在东方为至大」，讲者特别强调这不是在乌斯地为至大；约伯不只在家乡最厉害，而是整个东方最顶配的人物"}, {"s": 273, "e": 280, "t": "讲者点出那里落差感：约伯这种人后来竟坐在炉灰里；人说瘦死的骆驼比马大，约伯记却说未必，只要上帝愿意、撒旦插手，这样的人也会满身烂疮哀叫连连；约伯的强盛恐怕连城邦君王都很难做到"}, {"s": 281, "e": 284, "t": "讲者开始总结约伯在历史上真实的素描：他的经济富可敌国，不止乌斯地而是整个东方；他的地位东方为至大，是在东边具备国际影响力的人"}, {"s": 285, "e": 290, "t": "讲者追问，如果今天在生活中认识约伯，会觉得他有什么风险吗，就算遇到事情处理起来是不是小问题；生病、儿子结婚买房对普通家庭是负担，对约伯却随时可以处理，能随时平事的人怎会不平安"}, {"s": 291, "e": 303, "t": "讲者说如果只看1至5节，会认为约伯这个家庭这辈子不可能有任何意外；理由明确：道德上他远离恶事、不干坏事也不惹事，信仰上敬畏神而远离被击打，硬实力上更是国际大佬，这类手眼通天的人最爱喊人定胜天"}, {"s": 304, "e": 311, "t": "有人不服气，提出豪门这个因素，说有钱人也有有钱人的苦，兄弟姐妹争夺家产时打得头破血流；讲者承认这种悲剧自古确实有，但指出约伯家里并不是这样"}, {"s": 312, "e": 323, "t": "讲者引用第四节，约伯的儿子按着日子各在自己家里设摆筵席，并请三个姐妹一同吃喝，由此构建出兄弟姐妹感情非常好、常常聚餐、其乐融融的氛围，并没有豪门争夺家产的争端，家庭根本不存在任何变数"}, {"s": 324, "e": 329, "t": "讲者加上第五节的最后一层保障，指出约伯对儿女的信仰教育也是顶级的；有些人才稍有一点小钱就人定胜天，约伯到了这样的地位却仍活在一种警醒甚至震惊之中"}, {"s": 330, "e": 338, "t": "第五节记载筵席的日子一过，约伯就打发儿女去自洁，又清早起来按着众人的数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，而且约伯常常这样行"}, {"s": 339, "e": 353, "t": "讲者加上最后一层锁，指出作者要表达这种人不可能出意外，从硬实力、正直、家庭和睦、经济到对家庭的信仰看守都是顶级；约伯生怕儿子们弃掉神，所以宴席一过他清早起来按数目献燔祭，连信仰教育都是顶配，全家从本人到子女都在圣约的看守之中"}, {"s": 354, "e": 359, "t": "讲者描述脑海中浮现出一个敬虔又强大的家族，随即指出约伯记的冲击力正在这里：这么敬虔又强大的家族，到后面居然会家破人亡，人全部被杀光，唯一的活口还满身烂疮躺在炉灰里"}, {"s": 360, "e": 363, "t": "讲者指出更难接受的一点：人以为攻击约伯的是撒旦，但允许这件事发生的，竟然是他们全家敬畏的那位耶和华，是耶和华允许撒旦去做的"}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷，讲者认为很合适；因为如果肯客观地读约伯记，人一定会倒掉之前喝下过的所有基督教的鸡汤，打掉任何幻想，不需要别人来劝"}, {"s": 371, "e": 379, "t": "读懂约伯记会看到，此人不仅硬实力强，更是全家敬虔，作父亲的在信仰上非常警醒，第五节说他常常这样行，连耶和华也认可他完全敬畏、远离恶事；但读第三章就看到约伯说自己在炉灰中巴不得快点死，极其痛苦"}, {"s": 380, "e": 385, "t": "讲者设问读懂约伯记会获得怎样的智慧，指出中国人常把智慧理解成厚黑或圆滑，其实不是，而是让人倒掉曾喝下的一切基督教毒鸡汤和虚假的平安；没想清楚这个问题，人就没法健全地认识福音"}, {"s": 386, "e": 392, "t": "讲者指出每个人评估自己人生的顺遂和稳健都有具体标准，用约伯记1至5节可整理为：钱多、人多、势力大的人遇到难关都能轻易迈过，再加上做人好、虔诚、家庭团结、敬畏神，就内外无懈可击，而且约伯不是偶尔如此，第五节说他常常这样行"}, {"s": 393, "e": 399, "t": "讲者追问这样的人会不会出现意外，说生活中真遇到这种人，人肯定认为不会；就像自己可能交不起房租，却不可能认为马斯克交不起房租，因为从没想象过这种事，这种人与炉灰中的乞丐完全是两种人，无法想象会重叠在一个人身上"}, {"s": 400, "e": 404, "t": "讲者说答案要到后面读约伯记才见分晓：按人以往的人生经验，会觉得这么厉害又敬畏上帝的人不会出意外，但约伯记告诉你会，不止会，而且非常非常会"}, {"s": 405, "e": 410, "t": "作为安稳支柱的资源都有可能瞬间失去；读完约伯记会发现，支撑人生稳健的资源可能一个接一个甚至瞬间倒塌，最后护住人的反倒是耶和华看守的一个看不见的篱笆，连身外之物到身内之物都失去后，剩下的只有敬畏耶和华的智慧和知识"}, {"s": 411, "e": 420, "t": "讲者解释身外之物就是钱、房产，弟兄姐妹还能想通，连衣服也算身外之物，扔掉还有皮和肉；但约伯连身内之物都失去，皮与骨被撒旦击打，倒在炉灰中快扛不住，却仍说要继续等候神，只求神说清楚为何让他这样，这就是约伯的信仰"}, {"s": 421, "e": 427, "t": "最终能够看守人的，不是人以为的抗风险因素，也不是想象中的人生支架，因为这些说倒塌就倒塌；真正看守人的是耶和华为我们圈上的四围篱笆，最终剩下的不是身外之物甚至不是皮与骨，而是敬畏耶和华的真知识和真智慧，是发芽结果后丰收的果子，神要收割并存留"}, {"s": 428, "e": 433, "t": "讲者说人需要在约伯记一开始就预备好接受这件事，随时清醒知道与神同行这些年许多事很可能突然发生；只有在正确的预设下，人才不会在苦难的年岁突然弃掉神，因为错误的期待往往带来错误的信心，而错误的信心无法正确回应自己的遭遇"}, {"s": 434, "e": 439, "t": "讲者说带着错误的期待又想回应当下的处境，只剩下两个最危险的做法：要么去掉福音，要么更改福音；就算宣称不去掉福音，若仍怀着错误的期待来信，也还是要更改福音，没办法接受纯正的东西"}, {"s": 440, "e": 444, "t": "第二章上帝评价约伯持守纯正；讲者解释持守纯正，就是这个福音在约伯于乌斯地为至大时让他舒适，如今倒在炉灰中让他不舒适，但他仍按原来的继续等候，哪怕困惑也不更改，也不以口犯罪、不忘认上帝，这才是真实的智慧"}, {"s": 445, "e": 448, "t": "讲者说这些年无论顺境逆境，都有人好意地对他说信耶稣就是保平安、上帝大大祝福；他往往喜欢用约伯记二章九节来回应，就是我们从神手里得福，也从神手里受祸，这话是约伯对他太太说的"}, {"s": 449, "e": 458, "t": "讲者不认同很多人说约伯太太太坏：第一轮家财散尽、儿女全死光时，她没说什么，还跟在约伯身边；直到第二轮约伯身体烂掉、骨头被击打倒在炉灰中，她才受不了崩溃，所以说这个女人已经非常非常好了"}, {"s": 459, "e": 466, "t": "讲者分析约伯太太过不去的那关，就是觉得从神手里得福就算了，一个福也不给也行，但不能受祸；约伯却回答说，我们从神手里得福，不也受祸吗，并说她说话像个愚顽的妇人，这是他们夫妻之间的对话"}, {"s": 467, "e": 476, "t": "讲者回顾这些年无论顺境逆境，总有人说信耶稣绝对平安顺遂，他会请对方打住，因为他认定自己从神手里得福也从神手里受祸，甘心愿意如此，这位给福也给祸的上帝都是他的上帝；但很多人会疑惑，按传统宗教性来看，得祸你还信什么，没有人是为了承认得祸来信耶稣的"}, {"s": 477, "e": 482, "t": "讲者在第一层的结尾解释为什么按这个眼光看约伯记；他借助使徒保罗在罗马书中的话，即万事互相效力，为人的救恩得益处，并说明从神手里得福也从神手里受祸，指的是人的人生际遇"}, {"s": 483, "e": 492, "t": "讲者说这不是说上帝坏心眼，因为万事包含祸与福，无论祸福都有一个确定的益处，就是救恩的益处；破产、生病对人生无益，对永生却有益；所以人从一开始就要明确，万事互相效力为的是永生的益处，因为只有到达终点，神才会擦去我们一切的眼泪"}, {"s": 493, "e": 497, "t": "讲者说跟随耶稣确实不是专门为了今生保平安；他并不是说这辈子的事不重要，但人最终寻求的是什么必须一开始就认识清楚，因为那是永恒的福乐，信耶稣一定是为了追求这个而来"}, {"s": 498, "e": 511, "t": "讲者用通俗的话说，自己相信这辈子的苦难都会过去，而永恒的福乐永久不会过去，但永恒的咒诅也同样永久不会过去；信耶稣与否会有永恒的结局，人如今处在暂存的状态里，九十年以后要进入永恒不废去的祸福；为了这个永恒定局，他愿意接受现在的福与祸，只要它为救恩效力"}, {"s": 512, "e": 518, "t": "讲者说最终一定会发现两套截然不同的福音：一套相信上帝只给福、不给祸，另一套相信上帝让人得福、得祸都为儿女的救恩效力；这两套绝对不一样，而大部分人相信信耶稣绝对只给福，只有祝福没有灾祸"}, {"s": 519, "e": 532, "t": "讲者说人后来经历人生动荡又无法解释，只能不断怀疑自己哪里做错了；约伯后面三个朋友集体怀疑他，认定上帝只给信他的人祝福，所以约伯受苦就一定干了坏事，三轮对话都在骂约伯，约伯则不断辩解自己一生没干任何对不起上帝的事"}, {"s": 533, "e": 540, "t": "讲者总结第一套福音就是绝对平安、没有灾祸、只有祝福；而我们所信的是从神手里得福也从神手里受祸，但这并不代表上帝咒诅我们，因为他给的是永久的祝福，就是让万事为人的救恩互相效力，甚至可以为了永恒的定局在短暂期间暂时降祸，正如他对以色列整个部族所做的，短暂的咒诅促成永久的祝福"}, {"s": 541, "e": 546, "t": "讲者说最终会发现选择哪一套信仰、信心看向哪个方向，会让人走向不同的道路、结出不同的果子；他劝大家选后一套福音，且并不认为它残酷，因为略有一点得救智慧的人都知道怎么选，所以在今生只要能促成不可废去之福，就愿意接受上帝给的一切"}, {"s": 547, "e": 550, "t": "讲者总结约伯记一章1至5节，指出这是为后面读约伯记作铺垫的绝对稳固：方方面面约伯都不可能出现任何意外，但他还是出了意外"}, {"s": 551, "e": 556, "t": "讲者由此得出最基本的结论：人以前认为的一切抗风险稳固支架都不算数，原来都会顷刻失去，原来耶和华会允许这样的事发生，最终看守人的只是耶和华为我们安扎的篱笆；身内之物、身外之物全部失去后，剩下的只有敬畏耶和华的人生所积累的知识和智慧"}, {"s": 557, "e": 566, "t": "约伯记1至5节讲的是人能看见的约伯有多有钱、家庭有多和睦，但有些关乎家庭的事在人的家中看不见，真正影响家庭甚至国家历史的是天上的场景，圣经也多次呈现这所谓的灵界"}, {"s": 567, "e": 575, "t": "视角转到天上，从约伯记1章6节看有一天神的众子在耶和华面前侍立，神的众子就是众天使的意思，大家一同聚集在耶和华面前"}, {"s": 576, "e": 581, "t": "用康熙王朝、雍正王朝里皇帝坐在上面、众大臣站在下面集会的早朝场景，来比方神的众子聚集在耶和华面前的景象"}, {"s": 582, "e": 591, "t": "很多人不明白撒旦怎么也能到天上、混在神的众子中间，撒旦本是堕落的天使，背叛上帝以后已不在这队伍之中，因此经文用「也来在其中」的措辞值得留意"}, {"s": 592, "e": 601, "t": "「也来在其中」这一措辞暗示撒旦已不属神的众子，就如高湖教会集会时陈世美也来在其中，说明撒旦是这个队伍中不协调的成员"}, {"s": 602, "e": 604, "t": "撒旦已经不是神的众子，也不是天使，但他原本确实是受造的这种属灵气的活物，所以不在这个集会的合法成员之内"}, {"s": 605, "e": 613, "t": "许多人的困惑是：耶和华既然允许撒旦来，为何还在约伯记1章7节主动询问撒旦从哪里来，这不是一次搭讪，也不是一次找茬，而是一次讲话的授权"}, {"s": 614, "e": 618, "t": "这里要表达的不是耶和华主动找魔鬼说话，而是撒旦自始至终都在上帝的权下，因为这是一次说话的授权，神不开口，撒旦就没有办法主动开口"}, {"s": 619, "e": 629, "t": "有人质疑耶和华全知为何还要问撒旦从哪里来，但约伯记1章7节和2章2节上帝问的是同样的问题，可见这不是上帝困惑，而是一句授权的语式，是叫撒旦回答自己从哪里来"}, {"s": 630, "e": 640, "t": "皇帝早朝时大臣太监会说「有事启奏，无事退朝」，公司跟领导开会、小孩上课乃至讲道时也都没人能主动站起来说话，可见在权柄之下人平时察觉不到权柄，要说话必须得到授权"}, {"s": 641, "e": 646, "t": "在耶和华的集会上，撒旦不可能冲进去主动跟上帝说话，是耶和华主动用同样的语式发问，给了撒旦一个发言的授权，撒旦才得到说话的权利，否则他在上帝面前连说话的资格都没有"}, {"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给了撒旦一定的活动权限，魔鬼完全在神的掌管之中，连攻击约伯时也必须被耶和华的权柄限制，这种对邪恶的限制会贯彻整卷约伯记"}, {"s": 654, "e": 660, "t": "神的儿女若确知撒旦肆虐的当下正被上帝良善的权柄限制，那么对上帝的期待和安稳感就不只建立在脱离困境之后，也建立在正处困境之中，因为相信当下仍被上帝掌控"}, {"s": 661, "e": 667, "t": "约伯记1章8节耶和华主动称赞约伯完全正直、远离恶事，很多人因此困惑：这不是主动引魔鬼攻击义人吗？撒旦本来就凶，上帝不去掩盖，反而提醒他去看约伯，岂不成了勾引他试探这义人"}, {"s": 668, "e": 677, "t": "读圣经时因不了解原来的表达而感觉不痛快，于是提出两个选择题：究竟是耶和华主动要撒旦注意约伯，还是撒旦本来就在关注约伯，耶和华只是借着他的邪恶来授权他，并促成自己美善的计划"}, {"s": 678, "e": 684, "t": "平常规矩是介绍上帝，今天要稍微介绍魔鬼：魔鬼不是全知全能，全宇宙中只有耶和华上帝一位是全知且全能且全在的"}, {"s": 685, "e": 694, "t": "魔鬼好像不受时间限制、不会老，但受空间限制，约伯记1章7节他自己说从地上走来走去、往返而来，说明他在东方就不在西方，不能认为魔鬼是全在的，全在的只有上帝"}, {"s": 695, "e": 700, "t": "耶稣所说从天降下却仍就在天的人子表明，宇宙中没有一个人能既在这里又在那里，受造物都受空间限制，要去那边只能从这里走过去"}, {"s": 701, "e": 704, "t": "只有上帝能说自己在东也在西，超乎众人之上、贯乎众人之中、也住在众人之间，道成肉身仍在天，用全能的命令托住万有，他不需要往返，充满全地"}, {"s": 705, "e": 711, "t": "耶和华问撒旦是从哪里来、是什么样的活物，撒旦非常诚实地回答自己从地上来，因为他已经不在天上，神的众子在天上，撒旦却从地上走来走去、往返而来"}, {"s": 712, "e": 720, "t": "介绍撒旦受空间限制的用意在于：他在东方就不在西方，得走来走去，所以如果他了解约伯的信息，这些年他一定在约伯身边；若认为撒旦也是全在的就要受批评，他既然不全在也不全知，就得走到约伯身边"}, {"s": 721, "e": 730, "t": "不要以为魔鬼全然厉害，撒旦对约伯了解不了解？他不是全知者，却因一直在约伯身边、一直盯着约伯，所以知道约伯家里的情况，他本身就想试探约伯"}, {"s": 731, "e": 740, "t": "撒旦对约伯敬畏神的原因两次提出质疑，耶和华两次都允许他去试验，但撒旦对约伯内心的评估出错了；上帝全知全能全在，对约伯的评价是敬畏我、远离恶事，不会错"}, {"s": 741, "e": 749, "t": "撒旦第一次质疑岂是无故呢，声称夺去他所有约伯必当面弃掉神，结果没有发生，约伯说赏赐收取都在耶和华；第二次撒旦又以皮代骨，声称击打他身体他必弃掉神，结果又错了，约伯浑身烂疮之后依然持守纯正"}, {"s": 750, "e": 757, "t": "撒旦两次出错，上帝不会出错，撒旦对人的观察需要一个知识的积累：第一次他以为约伯是因为钱财才敬畏神，钱财拿掉却发现约伯仍然敬畏，第二次又评估是皮肉，结果骨头又错了"}, {"s": 758, "e": 765, "t": "撒旦很厉害，人搞不过他，但千万不要把他想成能跟上帝掰腕子，网络中耶稣和撒旦掰手腕的图是没有可能的，撒旦永远在上帝面前是权下的姿态，耶和华对约伯的评价从头到尾没有任何差错"}, {"s": 766, "e": 775, "t": "人在神面前赤露敞开，在撒旦面前却不是，撒旦有智慧也需要观察人，他对约伯的评估两次出错；而日久见人心是人类这些有限受造物才需要的，耶和华从开始就知道约伯，撒旦却不全知也不全在，只是他在约伯旁边，想试探约伯"}, {"s": 776, "e": 781, "t": "上帝完全认可约伯对他的敬畏，人会觉得神应该直接赶走撒旦、保护约伯，可上帝竟然两次都允许约伯受祸，而且灾祸非常严重，这是大部分人都想不明白的，因为人认为招灾的一定是恶人，义人一定要得福"}, {"s": 782, "e": 786, "t": "约伯的三个朋友后面也持同样的看法；这卷书讨论了一个非常需要讨论的主题，就是义人受苦、恶人亨通这个怪现象"}, {"s": 787, "e": 792, "t": "义人受苦、恶人亨通这一主题在智慧书、诗篇、先知书中反复出现，与人的想象相反，圣经非常诚实地告诉人真实处境；当然不是说义人必然受苦，而是义人有可能受苦，恶人却有可能亨通"}, {"s": 793, "e": 800, "t": "具备这种智慧之后才能喝不下基督教的毒鸡汤，也有健全的信心；正常人选择任何宗教都以保佑顺遂和福泽为敬拜理由，庙宇都以灵验作招牌，就连教会听到的见证也几乎清一色是信耶稣以后丰收了什么，没有人敢拿敬畏神以后家破人亡来说事"}, {"s": 801, "e": 807, "t": "圣经中有一位与约伯类似的人物至死没有得回，就是路加福音财主和拉撒路比喻中的乞丐拉撒路，他长烂疮、狗舔他的疮，没有得到双倍，死后却在亚伯拉罕的怀里"}, {"s": 808, "e": 810, "t": "不要因为约伯记结尾说他双倍得回，就以为最终盼望的又变成祝福，那这篇道就白讲了；很多的时候，义人可能受苦、恶人可能亨通，是圣经告诉人在这个始祖堕落以后被败坏辖制的世界，人生可能就是这样"}, {"s": 811, "e": 813, "t": "更重要的是要告诉大家，这几十年所给的是不可废去之福，福音就是这个，不是别的东西"}, {"s": 814, "e": 821, "t": "不用约伯记来介绍，中国老祖宗有一句话好人不长命、王八活千年，王八指的就是坏人，坏人反而家大业大，老祖宗都通过观察懂得这个道理"}, {"s": 822, "e": 829, "t": "作为一个具体的基督徒，不能因为遭遇灾难就怀疑自己或别人的信仰，因为上帝可能认可他；同样也不能因为一个人顺风顺水就认可他的信仰，因为上帝可能不认可他，圣经中也有这样的例子"}, {"s": 830, "e": 838, "t": "当指出某人信仰的方式需要调整时，有人竟拿自己家里买了三套房子来回应，这是鸡同鸭讲；不要把处境放在自己信仰的纯正度上，人对福音的误解会导致完全错信，有人会用多年家庭和睦或事业高升来公然拒绝反思自己的信仰"}, {"s": 839, "e": 843, "t": "有的人自己错了，却因家庭或人生顺遂的处境拿来拒绝反思；有的人明明对了，却因突然遭灾又开始怀疑自己，这两种都不可取，要相信智慧书一定给人带来智慧"}, {"s": 844, "e": 850, "t": "用环境来解释信仰的实质是一种误区，用当下的环境作为对信仰正与反的解释，绝不会从一个熟知智慧书的基督徒嘴里听见，因为顺遂与祸福跟上帝对一个人的认可与否是两码事"}, {"s": 851, "e": 858, "t": "假设决定要来这间教会讲道，昨天却摔断了腿、早上又拉肚子，有人会说这是上帝在拦阻、不要去，另一拨人则说这是撒旦在拦阻、你要坚持去作成神的工，一件事却有两种解释"}, {"s": 859, "e": 870, "t": "这不是虚构，十多年来要做关乎上帝的工作时，事前常出现发烧、腿受伤、骑车摔了这类看得见的问题，结果同一件事分出两拨人给出两种解释：一拨说看来上帝拦阻不要去，另一拨说看来撒旦拦阻、上帝喜欢、你要去，让人不知该听谁的"}, {"s": 871, "e": 877, "t": "借着物质的事指着灵界来论就是愚昧，但很多人喜欢这样干；真相是：一般说上帝拦阻你的人，通常是自己不想我去；一般说撒旦拦阻的人，其实是他自己想去"}, {"s": 878, "e": 884, "t": "人随私意解读，不只解读圣经，还会解读环境；他身上发生的事可能跟上帝的旨意没半点关系，不要硬扯在一起、一定要去对应；从约伯记会发现天上的场景和地下的场景完全没什么关系，都是上帝在这件事上的美意"}, {"s": 885, "e": 889, "t": "无论走上正确还是错误的道路，环境都不要成为第一参考标准，因为有时眼前显明的东西并不表示背后属灵的实际，生病也不代表这个人就是坏，解读上帝的旨意不要这样"}, {"s": 890, "e": 893, "t": "约伯完全没有得罪神，他1至5节的稳却被6至8节认可他的上帝打破，所以今天当下要做一个最简单的调整：不要去做那种属灵的董王，好像可以为弟兄姊妹解读他身上发生的一切属灵事实，人何德何能"}, {"s": 894, "e": 898, "t": "所谓的传道人何德何能，家庭的处境和顺遂不要来问他，他不知道；天底下许多传道人都认为他们知道，但他认为他不知道，而且也不认为他们知道"}, {"s": 899, "e": 910, "t": "能懂的只有上帝的话是怎么说，可以通过上帝的原则告诉大家，但天上那个场景是人的智慧所不可企及的，也不知道某人家里的处境为什么这样；希望弟兄姊妹安稳在这本书上，这不是直接的安稳，而是根基的稳固，风吹雨打也不动摇"}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天通过自己的瞎猜教别人怎么做事的这种人，或许被看作属灵人，圣经却称他们为愚昧人；约伯的三个朋友后面会具体示范什么叫这种人，他们言之凿凿、振振有词地跟约伯解释他的处境证明上帝怎么看待他，我们不要做这种人"}, {"s": 919, "e": 922, "t": "如果具备了智慧书的智慧，就可以得到一个干净的皮袋子，得到了干净的皮袋子，就能好好地装载新酒，不至于破裂掉，这就是约伯记全部的信息"}, {"s": 923, "e": 928, "t": "讲者在结尾回应听众可能提出的疑问：既然不能靠环境来辨别神的旨意，那多年来靠环境判断、认为做事不顺就不是上帝意思的做法对不对；他提醒不要这样理解，并指出做事不顺就不是神的意思、越不顺越是神的意思，这两种极端都不可取"}, {"s": 929, "e": 936, "t": "讲者自问自答，指出第一鉴别标准是上帝圣言的准则，也就是这66卷书，无论环境顺遂与否，遵从就是、违反就不是；这是所谓的根基，上帝怎么说永远是行动的最高准则，而不是自己或家庭的遭遇"}, {"s": 937, "e": 939, "t": "我们靠什么知道上帝对自己的真实想法，答案也是这卷书，也就是圣经，因此希望人的安全感能够建立在圣经之上"}, {"s": 940, "e": 942, "t": "人所能遭遇的最大灾祸是心眼昏迷、不能明白真道，所能遭遇的最大祝福则是上帝带领人进入真理，并且赐下永恒的福乐"}, {"s": 943, "e": 946, "t": "有人提出疑问：上帝所认可的人不出于刑罚，也不出于管教，那有什么理由让这个人受祸；既然不管教他、不试炼他、不行罚他，又不讨厌他，为什么还允许人受祸"}, {"s": 947, "e": 952, "t": "讲者用一段经文来结束，并念出约翰福音9章1到3节：耶稣过去看见一个生来瞎眼的人，门徒问他说，拉比，这人生来瞎眼是谁犯了罪，是这人呢，是他父母呢"}, {"s": 953, "e": 959, "t": "讲者解释门徒对天生瞎子的反应：他们认定一定与罪有关，只是争论是父母的罪还是本人的罪，等于限定了耶稣的回答，认为答案绝对是罪"}, {"s": 960, "e": 962, "t": "耶稣回答门徒说，也不是这人犯罪，也不是他父母犯罪，是要在他身上显出神的作为来（约翰福音9章3节）"}, {"s": 963, "e": 967, "t": "讲者总结说原来这件事与罪无关，而与神的作为有关；人向上帝提问时往往只给一个选择题，结果两个都不是，因此需要对祸福与罪恶想当然的认知作出调整"}, {"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记"}]}, "v2": {"stats": {"pred_n": 146, "gb": 112, "pb": 145, "exact": 74, "near": 34, "f0": [0.51, 0.661, 0.576], "f3": [0.745, 0.964, 0.84], "wd": 0.2642, "groups": {"same": 39, "over": 9, "near": 6, "under": 2, "mixed": 19}, "ban": 7, "per": 33, "dem": 56, "long": 6, "tok_in": 58051, "tok_out": 64246, "prompt": "切段_v2", "model": "deepseek-flash", "effort": "low"}, "groups": [{"s": 1, "e": 3, "st": "same", "g": [0], "p": [{"s": 1, "e": 3, "t": "开场互相问候平安，谦卑表示「帮助不敢当」，并说明自己只是把神的话用今天的话尽可能讲给大家听，因为能建立人的是神的话本身", "en": "最后落在谦卑承认「帮助不敢当」，自己只是把神的话用今天的话尽可能讲给大家听", "sec": "1.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 4, "e": 8, "st": "same", "g": [1], "p": [{"s": 4, "e": 8, "t": "宣布本周正道要宣读的经文是约伯记一章1至8节，并说明诵读时坦然看经文就好，其中难解的部分会尽可能替大家解释", "en": "说明会坦然诵读经文，难解的部分尽可能为大家解释", "sec": "2.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 9, "e": 13, "st": "same", "g": [2], "p": [{"s": 9, "e": 13, "t": "约伯记一章1至3节记载，乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴并许多仆婢，在东方人中为至大", "en": "说明这人在东方人中为至大", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 14, "e": 18, "st": "same", "g": [3], "p": [{"s": 14, "e": 18, "t": "约伯记一章4至5节记载，约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹一同吃喝；筵席的日子过了，约伯打发人去叫他们自洁，清早按众人的数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，约伯常常这样行", "en": "因为恐怕儿子犯了罪、心中弃掉神，约伯常常这样行", "sec": "2.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 19, "e": 25, "st": "over", "g": [4], "p": [{"s": 19, "e": 22, "t": "约伯记一章6至7节记载，有一天神的众子来侍立在耶和华面前，撒但也来到其中，耶和华问撒但从哪里来，撒但回答说自己从地上走来走去、往返而来", "en": "撒但回答说自己从地上走来走去、往返而来", "sec": "2.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 23, "e": 25, "t": "约伯记一章8节记载，耶和华问撒但是否用心查看过他的仆人约伯，并说地上再没有人像约伯那样完全正直、敬畏神、远离恶事；本周的分享就到这里", "en": "本周的分享只到这个部分为止", "sec": "2.3", "f": {"ban": [], "per": [], "dem": ["那样"]}}]}, {"s": 26, "e": 33, "st": "near", "g": [5, 6], "p": [{"s": 26, "e": 28, "t": "会前祷告开始，祈求神使众人照着他的话、以他话语的根基继续敬拜他，并求神自己在众圣徒中得着当得的荣耀。", "en": "祈求神使众人以他的话语为根基来敬拜他，并在众圣徒中得着当得的荣耀。", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 29, "e": 33, "t": "祈求神临格开通众弟兄姊妹的耳朵，使他们凡有耳的都应当听；求神将众先知使徒记在圣经上的福音、古旧信仰和所需的一切知识赐给他们，使他们通达灵敏认识神、一次得救；又求神让真信心在他们里面酝酿，并使他们中间多结果子，最后奉耶稣基督的圣名祈求。", "en": "最后以奉耶稣基督的圣名祈求结束整段祷告。", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 34, "e": 41, "st": "under", "g": [7, 8], "p": [{"s": 34, "e": 41, "t": "约伯记开篇分两个部分、两种眼光来看：1-5节先介绍约伯的现实背景，用通俗的话说就是他很有钱，生了多少儿子，牛驴仆婢众多，是一个东方的大富户", "en": "1~5节看到的现实背景是东方的大富户，先介绍约伯这个人", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 42, "e": 48, "st": "same", "g": [9], "p": [{"s": 42, "e": 48, "t": "6-8节是约伯的属灵背景：他敬畏神、远离恶事，因此在天上人看不见的地方，耶和华如此评价他——他虽是被撒但控告的人，却也是被耶和华非常认可的人", "en": "在人看不见的天上，耶和华是这样评价约伯的", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 49, "e": 54, "st": "same", "g": [10], "p": [{"s": 49, "e": 54, "t": "讲员自我介绍姓陈、人称陈社炳，本人的事不必过多介绍；他新年在此服侍的任务很明确，就是把圣经里先知使徒的福音抛开传统告诉会众，使这道成为这里敬拜的根基、不再立别的根基，并适当地与自己教会同步信息，若认为不合适就用最古老的约伯记开始", "en": "如果认为这周的信息不合适，就用最古老的约伯记来慢慢开始", "sec": "4.2", "f": {"ban": ["讲员"], "per": ["我"], "dem": ["此"]}}]}, {"s": 55, "e": 58, "st": "same", "g": [11], "p": [{"s": 55, "e": 58, "t": "今天教会对福音的信仰通常比较关注个人，而不关注国度，也就是只关注今生这几十年个人的祸福，并不关注将来那个所谓的国度；因此讲员到很多地方，也不得不先从个人的事谈起", "en": "因为这种局面，讲员到很多地方也不得不先从个人的事谈起", "sec": "4.3", "f": {"ban": ["讲员"], "per": [], "dem": ["那个"]}}]}, {"s": 59, "e": 63, "st": "same", "g": [12], "p": [{"s": 59, "e": 63, "t": "约伯记不是传讲全备福音最好的一卷书，但它能帮助人消除以前比较顽固的观念，为领受真道预备所需的智慧；讲员也希望以后若冒犯听众，就先用约伯记来冒犯，因为福音本身对人的挑战会更大", "en": "希望先用约伯记来冒犯听众，因为福音本身对人的挑战会更大", "sec": "4.3", "f": {"ban": ["讲员"], "per": [], "dem": []}}]}, {"s": 64, "e": 67, "st": "same", "g": [13], "p": [{"s": 64, "e": 67, "t": "认识福音要先读约伯记，并不意味着认识真道要先与认识苦难有关；约伯记的排版不可忽略，它是智慧书的第一卷，一般人提到它常联想到苦难，其实它的大主题是智慧，也就是认识耶和华的智慧", "en": "一般人提到约伯记会联想到苦难，其实它的大主题是智慧，是认识耶和华的智慧", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 68, "e": 73, "st": "same", "g": [14], "p": [{"s": 68, "e": 73, "t": "先讨论两个问题，第一个是1-5节的：世界上存不存在绝对的平安；因为许多在平安夜信耶稣的弟兄姊妹，平安正是他们信基督教的第一诉求，所以先从平安这个话题看起", "en": "许多人，特别是在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 74, "e": 76, "st": "same", "g": [15], "p": [{"s": 74, "e": 76, "t": "第二个问题在6-8节：上帝所认可的信仰，是否意味着这个人就会远离灾祸", "en": "如果你的信仰被上帝认可，是否意味着你这个人就会远离灾祸", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 77, "e": 79, "st": "same", "g": [16], "p": [{"s": 77, "e": 79, "t": "如果人曾经对信仰的祸与福做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整一下这些观念", "en": "对
