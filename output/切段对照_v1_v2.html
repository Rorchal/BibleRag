 88, "t": "先交代约伯记的成书背景，认为它比创世记更早写成，约伯是生活得极早、可能比亚伯拉罕还早的人；随后回到第一节，指出乌斯地有一个人名叫约伯"}, {"s": 89, "e": 98, "t": "约伯是乌斯地人而非以色列人，可能生活在比亚伯拉罕更早的年代；由此回应「旧约只有以色列人信上帝」的误会，说明耶和华是全地的主、全人类的主"}, {"s": 99, "e": 106, "t": "以麦基洗德和巴兰为例，说明亚伯拉罕之前就有人认识并敬拜耶和华：麦基洗德是至高上帝的祭司，连术士巴兰也知道耶和华的名字，可见族长时代之前耶和华是全地的信仰"}, {"s": 107, "e": 114, "t": "独一神信仰并非从摩西才开始，连该隐都知道耶和华，万族本来都知道，只是纯正信仰后来在一族之内被保全；早在约伯的年代，乌斯地已有一个非常敬畏上帝的人"}, {"s": 115, "e": 121, "t": "追问圣经为何收录约伯的故事，开篇1至5节记录约伯的大致情况并非枉费，而是要让读者在读后面内容之前先明白一件事"}, {"s": 122, "e": 128, "t": "让听众先不看圣经来想：什么样的人、什么样的家庭绝对不会出意外；一般会认为是钱多、人多、资源多，因为这样的家庭遇事更有能力平息"}, {"s": 129, "e": 132, "t": "从经文的描述看，作者突出约伯及其家庭的稳固，按各个时代的眼光衡量，这样的人绝不会遭遇灾祸，也有能力面对任何风险"}, {"s": 133, "e": 144, "t": "说明1至5节要先交代约伯的稳，是因为他后面落到极大灾难中，这种绝对平安稳妥与后来的完全不安稳形成很大落差，借此让人思考自己对耶和华信心的根基；约伯后来家破人亡、浑身疾病、躺在炉灰中"}, {"s": 145, "e": 149, "t": "读约伯记开头要先放下后面的故事，避免带着「上帝视角」，即预先知道后面的事；知道太多反而会破坏读开头时本该有的思路"}, {"s": 150, "e": 154, "t": "让听众先看1至5节来想：如果生活中遇到约伯这样的人，会不会认为他的家庭会出现变故，答案应该是不会；并进一步追问约伯这种人可能遇到什么麻烦事"}, {"s": 155, "e": 168, "t": "追问人生动荡困境的风险因素有哪些，指出努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力；抗风险能力最强的人通常被认为最平安，人对自己生活的不安稳都有担忧和风险意识"}, {"s": 169, "e": 174, "t": "人们对突然遭灾的人通常持恶有恶报的看法，认为坏人最不稳；追问一个家庭为何容易出灾祸，答案可能是抗风险能力低，也可能因为常做恶事而被恶事反噬，即常在河边走难免不湿鞋"}, {"s": 175, "e": 183, "t": "看第一节圣经如何形容约伯，他不是坏人、不是常在河边走的人，也不会遭恶报；圣经首先给出他第一个稳健因素，即完全正直、远离恶事，因此道德和违法犯罪带来的风险在他身上可以彻底排除"}, {"s": 184, "e": 190, "t": "以假设自己家庭作奸犯科、开赌场贩毒为例，说明身处恶势力、不正直又不远离恶事的人迟早会招来灾祸；约伯却不是这样，他完全正直，且敬畏神、远离恶事"}, {"s": 191, "e": 195, "t": "约伯敬畏神说明道德和违法犯罪的因素都已被排除，而且他的敬畏连耶和华都承认，因此连属灵层面遭天谴的因素也一并排开了"}, {"s": 196, "e": 205, "t": "假设一个人基本没干违法犯罪的事，却不信上帝、拜偶像、乱搞迷信，甚至养小鬼，就可能因上帝的愤怒使家庭受牵连；这是基于错误信仰所造成的第二个不稳健因素"}, {"s": 206, "e": 211, "t": "约伯敬畏神、远离恶事，品质完全正直，信仰上敬畏神，生活上没有违法乱纪，因此从道德伦理、司法到信仰虔诚度的一切风险因素都不存在，而且他的敬畏是被上帝认可的"}, {"s": 212, "e": 215, "t": "由第一节可认同约伯是好人、好弟兄、好虔诚的人；这样好的一个人似乎不会有任何问题，但若连这样的家庭都还会遇到波折，那就还有别的因素"}, {"s": 216, "e": 222, "t": "指出第二个稳健因素是硬实力，太弱小则不稳；无论古今，人丁兴旺都意味着家族势力大，以前人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里更稳"}, {"s": 223, "e": 228, "t": "转向约伯的硬实力，看第二节记载的家庭成员：人丁兴旺，他生了七个儿子和三个女儿，这是这个家庭抗风险的第二把锁"}, {"s": 229, "e": 237, "t": "今天努力赚钱、积累人脉也是为了增加抗风险因素；第三节记载约伯的财富与地位，他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方为至大，这一节交代了他的财富、权势和国际地位"}, {"s": 238, "e": 248, "t": "转换视角解释七千羊意味着庞大的牧场，古代羊毛和羊奶利润丰厚，圣经清楚交代约伯的收入来源，如同他的财务报表和清单，接下来还有三千骆驼"}, {"s": 249, "e": 260, "t": "解释骆驼在古代不用来吃，而是运货和物流的工具，丝绸之路和佩特拉古城的交通都靠骆驼；约伯的三千骆驼可看作三千辆大货车，说明他的物流商贸做得非常大"}, {"s": 261, "e": 265, "t": "古代耕地用牛和驴，由此可以看出约伯的田产也非常大，他家里还有许多仆婢"}, {"s": 266, "e": 272, "t": "总结约伯在牧场、羊毛羊奶、三千骆驼的物流以及牛驴仆婢的农业田产上都极其丰厚，硬实力和产业大到难以想象；经文评价他在东方为至大，不是仅限乌斯地，而是整个东方最顶配的人物"}, {"s": 273, "e": 280, "t": "约伯这种后来坐在炉灰里的人，说明「瘦死的骆驼比马大」未必成立；只要上帝愿意、撒旦插手，这样的人也会满身烂疮、哀叫连连，这是约伯用自己人生留下的残酷真相；他在古代东方的强盛，恐怕连城邦君王都难以做到"}, {"s": 281, "e": 290, "t": "为约伯画一幅素描：经济富可敌国，地位在整个东方为至大、具备国际影响力；今天若认识这样的人，会觉得他有什么风险吗，生病、买房这类负担对他随时都能处理，这样随时能平事的人还会有不平安吗"}, {"s": 291, "e": 303, "t": "若只看1至5节，会觉得约伯家一辈子不会出任何事：道德上他远离恶事，信仰上他敬畏神而远离被上帝击打，硬实力上则是国际大佬；今天最爱喊人定胜天的正是这种手眼通天的大佬，约伯更是如此"}, {"s": 304, "e": 311, "t": "有人对约伯的稳固仍不服气，提出豪门家庭这个因素，认为有钱人也有有钱人的苦，豪门内部无情，兄弟姐妹会为争夺家产打得头破血流"}, {"s": 312, "e": 323, "t": "承认豪门争产的悲剧自古就有，但约伯家不是这样；第四节记载他的儿子按着日子各自设摆筵席，请三个姐妹一同吃喝，可见约伯家兄弟姐妹感情非常好、常常聚餐、其乐融融，不存在豪门争端带来的变数"}, {"s": 324, "e": 330, "t": "第五节提供最后一层保障，即约伯对儿女的信仰教育也是顶级的；与那些稍有积蓄就自认人定胜天的人相比，约伯做到这样的地位，却仍活在警醒甚至震惊之中"}, {"s": 331, "e": 338, "t": "第五节记载，筵席的日子一过，约伯就打发儿女自洁，又清早起来按众人的数目献燔祭，因为他恐怕儿子们犯罪、心中弃掉神，而且约伯常常这样行"}, {"s": 339, "e": 353, "t": "这是最后一层锁，说明约伯从硬实力、正直、家庭和睦、经济到对家庭的信仰看守都是顶级，作者借此表明这种人不可能出意外；他担心被称为富二代的儿子们弃掉神，每次聚餐后都献燔祭、叫他们自洁，整个家庭从本人到子女的信仰都在圣约和上帝的看守之中"}, {"s": 354, "e": 359, "t": "约伯记的冲击力在于，一个既敬虔又强大的家族后来竟然家破人亡，人几乎被杀光，唯一剩下的活口也满身烂疮，躺在炉灰里"}, {"s": 360, "e": 367, "t": "更让人难以接受的是，允许撒但攻击约伯的，竟是他全家所敬畏的耶和华；因此约伯记被放在智慧书的第一卷，智慧书包括约伯记、箴言、诗篇、传道书和雅歌"}, {"s": 368, "e": 379, "t": "若肯客观读约伯记，就会倒掉曾喝下的所有基督教鸡汤，打掉一切幻想；约伯不只是硬实力强，更是全家敬虔、父亲时刻警醒，连耶和华也承认他完全敬畏神、远离恶事；但到第三章，约伯却躺在炉灰中巴不得快死，极其痛苦，这就是他的变化"}, {"s": 380, "e": 385, "t": "追问读懂约伯记能获得怎样的智慧，指出它不是中国人通常理解的厚黑或圆滑，而是让人倒掉曾喝下的一切基督教毒鸡汤和虚假平安；没想清楚这个问题，就无法健全地认识福音"}, {"s": 386, "e": 390, "t": "人对人生顺遂和稳健程度的评估都有具体标准，用1至5节可整理为：钱多、人多、势力大的人遇到难关都能轻易迈过；若再加上做人好、虔诚、家庭团结、敬畏神，就更是内外无懈可击"}, {"s": 391, "e": 398, "t": "约伯不是偶尔如此，第五节说他常常这样行；这样内外无懈可击的人会出现意外吗，生活中若真遇到这种人，肯定认为不会，正如同为房租发愁的人不会认为马斯克交不起房租；这种人与在炉灰中的乞丐仿佛两个物种，很难想象两种形象会重叠在一个人身上"}, {"s": 399, "e": 404, "t": "约伯记给出的答案要到后面才真正显明；按以前的人生经验，人会认为这样厉害又敬畏上帝的人不会出意外，但约伯记告诉你会，不仅会，而且非常会"}, {"s": 405, "e": 410, "t": "作为安稳支柱的那些资源都可能瞬间失去，一个个搭建起来的人生稳健度支架会瞬间倒塌；最后能护住人的反而是耶和华看守的一道看不见的篱笆，当身外之物和身内之物都失去，留下的只有曾经敬畏耶和华的智慧和知识"}, {"s": 411, "e": 420, "t": "解释身外之物指钱和房产，人尚能想通；但约伯连身内之物都失去了，皮与骨被撒旦击打，快扛不住时仍说杀我也要在炉灰中继续等神，只求神说明为何让他这样，这就是约伯的整个信仰"}, {"s": 421, "e": 427, "t": "最终看守人的不是人以为的抗风险因素或人生支架，这些说倒塌就倒塌；真正看守人的是耶和华为我们圈上的四面篱笆，以及最终留下的、曾经敬畏耶和华的真知识和真智慧，也就是发芽结果后丰收的果子，神要从中收割"}, {"s": 428, "e": 433, "t": "需要在约伯记开头就预备好接受这件事，清醒知道与神同行的岁月里许多事很可能突然发生；只有在正确的预设下，人才不会在苦难的年岁突然弃掉神，因为错误的期待会带来错误的信心，无法正确回应自己的遭遇"}, {"s": 434, "e": 439, "t": "若带着错误的期待又想回应自己的遭遇，只剩两个危险的做法：要么去掉福音，要么更改福音；即使不去掉福音，怀着错误的期待来信，也会更改福音，无法接受纯正的东西"}, {"s": 440, "e": 444, "t": "第二章上帝评价约伯持守纯正，所谓持守纯正，就是这个福音在他为至大时让他舒适，如今他在炉灰中不舒适，他仍按原来的继续等候，哪怕困惑也不更改、不以口犯罪、不妄认上帝，这才是真实的智慧"}, {"s": 445, "e": 448, "t": "这些年常有人出于好意说信耶稣就是保平安、上帝大大祝福，而回应这类话常用约伯记2章9节约伯对妻子所说的话：我们从神手里得福，也从神手里受祸"}, {"s": 449, "e": 458, "t": "约伯第一轮家财散尽、儿女死光时，他妻子并没有说什么，仍跟在身边；直到第二轮约伯身体烂掉、倒在炉灰中还祷告时，她才受不了，质问他还持守纯正吗、干脆弃掉神死掉，可见她是第二轮才崩溃，已属难得"}, {"s": 459, "e": 466, "t": "约伯妻子过不去的那一关是：从神手里得福尚可，但一个福都不给、还要受祸就无法接受；约伯却回答，我们从神手里得福，不也受祸吗，并说她说话像愚顽的妇人，这是夫妻之间的对话"}, {"s": 467, "e": 476, "t": "许多人在顺境逆境中都劝人信耶稣就绝对平安顺遂，而「从神手里得福，也从神手里受祸」被当作信仰告白，认为这位上帝给福给祸都是自己的上帝；但很多人按传统宗教性会疑惑：得祸还信什么呢"}, {"s": 477, "e": 482, "t": "第一层结尾解释为何要按这个眼光读约伯记，借助使徒保罗在罗马书中的话「万事互相效力，为人的救恩得益处」，说明从神手里得福、也从神手里受祸指的是人的人生际遇"}, {"s": 483, "e": 492, "t": "上帝并非坏心眼，万事包含祸与福，祸福之中都有确定的益处，有时益处正是从祸里来，即救恩的益处；破产生病对今生无益却对永生有益，因此要重新认识从神手里得福、也从神手里受祸，万事互相效力是为永生这确定的益处，到终点神才擦去一切眼泪"}, {"s": 493, "e": 497, "t": "跟随耶稣确实不是专门为今生保平安，并非说今生的事不重要，而是必须一开始就清楚最终寻求的是永恒的福乐；信耶稣正是为追求这个而来，在那里不会有悲哀，神会擦去一切的眼泪"}, {"s": 498, "e": 511, "t": "用通俗的话说，今生的苦难都会过去，而永恒的福乐不会过去，永恒的咒诅也不会过去；信耶稣与否有永恒的结局，人处在暂存的状态中，九十年后今生的福祸清空，却进入永不废去的永恒福祸；为这永恒的定局，人愿意接受今生任何福祸，只要它为救恩效力"}, {"s": 512, "e": 518, "t": "世上存在两套截然不同的福音：一套相信上帝只赐福、不降祸，另一套相信上帝让人得福也得祸，都为儿女的救恩效力；两者绝不一样，而大部分人相信的是信耶稣只有祝福没有灾祸的那一套"}, {"s": 519, "e": 532, "t": "接受人生动荡又无法解释的人只能不断怀疑自己做错了；约伯的三个朋友正是如此，他们认定上帝只给信他的人祝福，因此约伯受祸必然是干了坏事，后面的三轮辩论都源于这套在上古乌斯地就已存在的福音，约伯则不断辩解自己没做过对不起上帝的事"}, {"s": 533, "e": 540, "t": "第一套福音是绝对平安、只有祝福没有灾祸；我们所信的则是从神手里得福也从神手里受祸，但这不代表上帝咒诅人，因为他有永久的祝福，就是让万事为人的救恩互相效力；为了永恒的定局，上帝可在短暂期间暂时降祸，短暂咒诅促成永久的祝福"}, {"s": 541, "e": 546, "t": "最终人要选择哪一套信仰，信心看向不同的方向，就会走向不同的道路、结出不同的果子；后一套福音并不残酷，因为稍有得救智慧的人都知道怎么选，今生只要能促成不可废去之福，就愿意接受上帝所给的一切"}, {"s": 547, "e": 550, "t": "总结1至5节：约伯绝对的稳固是为后面读约伯记作铺垫，方方面面都显示他不可能出现任何意外，但他还是出意外了"}, {"s": 551, "e": 556, "t": "由此得到最基本的一点：人以前认为的一切抗风险稳固支架都不算数，都会顷刻失去，耶和华允许了这件事发生；最终能看守人的只是耶和华安扎的篱笆，当身内之物和身外之物都失去，剩下的是通过敬畏耶和华所积累、会开花结果的知识和智慧"}, {"s": 557, "e": 566, "t": "从第1至5节人能看见的约伯的家产与家庭和睦，转到第6至8节看不见的灵界；影响家庭乃至整个国家历史的，未必是银行里那些自认为的保障，而往往是天上的场景，圣经不止一次呈现过所谓灵界的事。"}, {"s": 567, "e": 572, "t": "把镜头切到天上，约伯记1章6节有一天神的众子在耶和华面前侍立；人类的物质支持与情感维系都非常脆弱，所争取的资源对自己的影响力其实没那么大，真正影响历史中人的是天上属灵的领域，而这一切的转折点始于神的众子聚集的那一天。"}, {"s": 573, "e": 581, "t": "解释神的众子就是众天使，他们聚集在耶和华面前；这个场景如同君王听政的集会，好比康熙王朝、雍正王朝里皇帝坐在上面、众大臣站在下面的早朝。"}, {"s": 582, "e": 596, "t": "很多人不明白撒旦怎么也在神的众子聚会中；撒旦原是堕落的天使，背叛上帝之后确实已不在这个队伍里，但经文却说他「也来在其中」，因此要留意作者措辞的用意。"}, {"s": 597, "e": 601, "t": "以今天高湖教会集会时「陈世美也来在其中」为例，说明他本不属于这个群体却来了；同理，神的众子是一个队伍，撒旦是队伍中一个不协调的成员。"}, {"s": 602, "e": 604, "t": "结论是撒旦已经不是神的众子、不再是天使，但他原本确实是受造的属灵活物，因此他不在这个集会的合法成员之内。"}, {"s": 605, "e": 612, "t": "提出许多人的困惑：约伯记1章7节耶和华不但允许撒旦来到集会，还主动询问他「你从哪里来」，与他搭话而不把他赶走，正因这次搭话才有了约伯后来的惨况，上帝这一做法令人难以理解。"}, {"s": 613, "e": 618, "t": "直接给出结论：耶和华询问撒旦不是搭讪也不是找茬，而是一次说话的授权，要表达的是撒旦自始至终都在上帝的权柄之下；神若不这样发问，撒旦就没有办法主动在集会中开口说话。"}, {"s": 619, "e": 629, "t": "回应「耶和华全知为何还要问」的质疑：约伯记1章7节与2章2节两次集会，上帝问的都是同样的问题，说明他不是因困惑才询问，而是以「你回答我，你从哪里来」的命令式发问，给撒旦说话的授权。"}, {"s": 630, "e": 640, "t": "以皇帝早朝时「有事启奏，无事退朝」为例，说明得到许可才能说话；又举公司开会、小孩上课乃至讲道现场为例，指出人处在一个人的权柄底下往往不自觉，因为权柄是无形的，要说话得先举手、经授权。"}, {"s": 641, "e": 646, "t": "把权柄的道理用在撒旦身上：他不可能冲进集会主动对上帝说话，是耶和华两次主动以同样语式发问，给他发言的授权，他才有说话的权利，否则他在上帝面前连说话的资格都没有。"}, {"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给了撒旦一定的活动权限；但魔鬼完全在神的掌管之中，攻击约伯时都被耶和华的权柄限制，第一次不能伤他身体，第二次能伤身体却不能夺他性命，这种对邪恶的限制贯穿整卷约伯记。"}, {"s": 654, "e": 660, "t": "若确知撒旦肆虐的当下正被上帝良善的权柄限制，神儿女对上帝的期待、信心和安稳感就不只建立于脱离困境之后，更建立在身处困境的当下，因为相信此刻仍在上帝掌管之中，就不会有任何不安稳。"}, {"s": 661, "e": 666, "t": "提出约伯记1章8节带来的困惑：上帝主动称赞约伯完全正直、远离恶事，本可把约伯掩盖过去，却像在提醒撒旦去看他，而撒旦本是控告者，这不等于主动引魔鬼攻击义人吗。"}, {"s": 667, "e": 677, "t": "提出解决这一困惑的两个选择题：究竟认为耶和华主动要撒旦注意约伯、让他去试探，还是认为撒旦本来就在关注约伯，耶和华不过是借他的邪恶授权他，并借此促成自己美善的计划。"}, {"s": 678, "e": 686, "t": "指出全宇宙中只有耶和华一位是全知、全能、全在的，魔鬼并不是；从创世以前直到如今魔鬼一直存在，似乎不受时间限制、不会老，这段经文正有证据说明这一点。"}, {"s": 687, "e": 694, "t": "魔鬼虽然不受时间限制，却受空间限制；约伯记1章7节他自称「从地上走来走去，往返而来」正说明这一点，他在东方就不在西边，不能认为魔鬼是全在的，全在的只有上帝。"}, {"s": 695, "e": 700, "t": "以耶稣所说「从天降下却仍就在天的人子」为例，说明宇宙中除上帝以外没有谁能同时在此又在彼；受造之物只要在这里就不在那边，要去那边只能走过去、往返而来，这就是受空间限制。"}, {"s": 701, "e": 704, "t": "与受造之物相对，上帝可以说「我在东也在西」，超乎众人之上、贯乎众人之内、也住在众人之间；他道成肉身降世却仍在天，用全能命令托住万有，不需要往返，因他充满全地，耶和华的荣耀遍满。"}, {"s": 705, "e": 714, "t": "上帝问撒旦从什么空间来、是什么样的活物，撒旦诚实回答「我从地上来」，因为堕落之后他已不在天上；神的众子在天上，他却从地上走来走去、往返而来，正因受空间限制，他在东方就不在西方。"}, {"s": 715, "e": 720, "t": "撒旦既非全在也非全知，他要了解约伯的信息，就得走到约伯身边；由他后来能把约伯的状况说得那么清楚，可以合理推断这些年他就在约伯身边。"}, {"s": 721, "e": 730, "t": "撒旦对约伯是了解的：他不是全知者，却因长期在约伯身边盯着他，能说出约伯家里受神篱笆保护的情况，也就是约伯记1章9节「他敬畏你岂是无故呢」那番话；可见他要走来走去、靠观察了解约伯。"}, {"s": 731, "e": 740, "t": "撒旦两次质疑约伯敬畏神的原因，耶和华两次都允许他试验；但两次质疑传出同一个信息，就是撒旦对约伯内心的评估出错了，而全知全能全在的上帝对约伯「敬畏我、远离恶事」的评价全然无误。"}, {"s": 741, "e": 749, "t": "撒旦第一次质疑「夺去他所有，他必当面弃掉你」，结果约伯说「赏赐的是耶和华，收取的也是耶和华」，出乎他意料；第二次质疑「击打他身体，他必当面弃掉你」，约伯浑身烂疮后依然持守纯正，又错了。"}, {"s": 750, "e": 757, "t": "撒旦两次出错，上帝却绝不会出错；撒旦对人的观察需要知识的积累，他先以为约伯是因钱财才敬畏神，钱财被夺走后发现并非如此，又改猜是皮肉，结果仍然错了。"}, {"s": 758, "e": 764, "t": "撒旦固然厉害，人搞不过他，但绝不能把他看作能与上帝掰手腕的对手；他不像网上那幅耶稣与撒旦同桌掰手腕的图，他永远在上帝面前处于权下的姿态，作为受造的天使，再高级也不可能像耶和华那样。"}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾毫无差错；人面对上帝是赤露敞开的，面对撒旦却不是，撒旦虽很有智慧仍需观察、评估仍会出错，只有有限的受造之物才需要日久见人心，而撒旦不全知也不全在，对约伯并不全然了解，却在约伯旁边想试探他。"}, {"s": 776, "e": 783, "t": "上帝完全认可约伯的敬畏，按人的想法就该把撒旦赶走、保护约伯，可上帝竟两次允许他受非常严重的灾祸；这是大部分人想不明白的，因为人总认为招灾的一定是恶人、义人一定得福，约伯的三个朋友后来也都是这样认为。"}, {"s": 784, "e": 792, "t": "约伯记讨论的是一个非常需要讨论的主题：义人受苦、恶人亨通，这怪象在智慧书、诗篇、先知书中反复出现；人想象的是义人得福、恶人受苦，圣经却诚实指出义人受苦、恶人亨通，但这不是必然，而是义人有可能受苦、恶人有可能亨通。"}, {"s": 793, "e": 800, "t": "具备这种智慧就能有健全的信心，不喝基督教的毒鸡汤；正常人选择任何宗教都以保佑顺遂、福泽作为敬拜理由，宗庙庙宇以灵验作招牌，教会见证也多是信耶稣后丰收，没人敢拿敬畏神后家破人亡说事，可上帝自己恰恰记载了这样的事。"}, {"s": 801, "e": 810, "t": "有人以约伯后来双倍得回祝福为据，但路加福音里财主与拉撒路比喻中的乞丐拉撒路至死没有得回，死后才在亚伯拉罕怀里；不能因约伯记结尾的双倍就说最终盼望都变成祝福，义人可能受苦、恶人可能亨通，正是上帝在这被败坏辖制的世界里告诉人的。"}, {"s": 811, "e": 814, "t": "更重要的信息是：这几十年所传的不可废去之福，福音正是这个，而不是别的东西。"}, {"s": 815, "e": 821, "t": "以中国人的老话「好人不长命，王八活千年」为例，其中的王八指的是坏人，说明老祖宗凭观察也懂得坏人反而家大业大这个道理。"}, {"s": 822, "e": 829, "t": "由此得出重要原则：不能因灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，正如约伯；同样也不能因某人顺风顺水就认可他的信仰，因为上帝可能并不认可他，圣经中也有这样的例子。"}, {"s": 830, "e": 838, "t": "当提醒一个人信仰的方式需要调整，指的是知识与认知，他却拿自己人生的顺遂、家里买了三套房子来回应，这如同鸡同鸭讲；不要把处境当作自己信仰纯正度的凭据，对福音的误解会让人用多年来的家庭和睦或事业高升公然拒绝反思自己的信仰。"}, {"s": 839, "e": 850, "t": "两种情形都不可取：有人自己错了，却因家庭或人生顺遂拒绝反思；有人明明对了，却因遭灾开始怀疑自己。智慧书带来的智慧，是在环境中认识上帝；用当下的环境来解释信仰的实质，是绝不应当从熟知智慧书的基督徒口中听见的误区，因为顺遂与祸福跟上帝是否认可你是两码事，光这一点，这种愚昧很多人都有。"}, {"s": 851, "e": 858, "t": "以讲道前腿摔断、接连拉肚子为例：有人说这是上帝在拦阻、不要去，另一拨人却说这是撒旦在拦阻、可见要去做成神的工；同一个现实竟得出两种相反的解释。"}, {"s": 859, "e": 868, "t": "这不是虚构，而是亲身经历：每次要做关乎上帝的工作前身体出事，人们就分成两拨——一拨说生病说明上帝拦阻、不要去，另一拨说生病是撒旦拦阻，说明上帝喜欢、你该去。"}, {"s": 869, "e": 878, "t": "到底该听谁的？借物质之事指向灵界来论断，就是愚昧；说上帝拦阻的人通常是自己不想去，说撒旦拦阻的人其实自己想去。人不仅随私意解读圣经，也随私意解读环境。"}, {"s": 879, "e": 884, "t": "我身上发生的事可能跟上帝的旨意毫无关系，不要硬把当下的事与旨意对应起来；从约伯记可以看出，天上的场景与地下的场景完全没有关系，背后有的是上帝自己在这件事上的美意与圣言。"}, {"s": 885, "e": 889, "t": "走上正确或错误的道路时，环境都不应成为第一参考标准；有些时候在你眼前显明的东西并不代表背后的属灵实际，你的生病也不表示这个人就是坏的。"}, {"s": 890, "e": 893, "t": "日后会看到约伯完全没有得罪神，第1至5节的安稳却被第6至8节那位认可他的上帝打破；至少今天先做一个最简单的调整，就是不要做属灵的董王，仿佛能为弟兄姊妹解读他身上一切遭遇背后的属灵事实。"}, {"s": 894, "e": 899, "t": "追问「你何德何能」：连传道人也不例外；日后相识，家庭的处境与顺遂不要来问，因为不知道。天底下许多传道人都以为自己知道，而我认为自己不知道，也不认为他们知道。"}, {"s": 900, "e": 910, "t": "能懂的只有上帝的话怎么说；至于某人家里为什么这样，是无从知道的，天上的场景是人的智慧不可企及、无法触及的，我们又不是先知。因此只能按上帝的原则告诉大家，并希望大家安稳其上，在这卷书上得着救恩根基的稳固，风吹雨打也不动摇。"}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天靠自己的猜测教别人做事的这种人，或许被看作属灵人，圣经却称他们为愚昧人；约伯的三个朋友正是示范——他们言之凿凿地替约伯解释处境，好像以利法、比勒达、琐法都知道，只有约伯不知道，所以不要做这样的属灵懂王。"}, {"s": 919, "e": 922, "t": "若具备智慧书的智慧，就像得到一个干净的皮袋，可以好好装载新酒而不至于破裂，这就是约伯记全部的信息。"}, {"s": 923, "e": 928, "t": "针对不靠环境辨别的疑问，纠正多年来靠环境判断的习惯：一件事做得很不顺，不等于不是上帝的旨意，而认为越不顺越是上帝旨意的另一种极端同样不可取"}, {"s": 929, "e": 936, "t": "自问既然环境的顺遂不是第一鉴别标准，那第一标准究竟是什么，答案是上帝圣言的66卷准则：违背就不是、遵从就是，与顺遂与否无关；这是根基，上帝的话才是行动的最高准则，而非人的遭遇"}, {"s": 937, "e": 939, "t": "人靠圣经这卷书知道上帝对人的真实想法，并希望安全感建立在这卷书之上"}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道，最大的祝福则是上帝带领人进入真理，并赐下永恒的福乐"}, {"s": 943, "e": 946, "t": "有人提出疑问：上帝所认可的人不出于刑罚、也不出于管教，那上帝既不讨厌他，为什么还允许这个人遭受祸患"}, {"s": 947, "e": 952, "t": "以约翰福音9章1到3节作结并念出经文：耶稣过去看见一个生来瞎眼的人，门徒问他这人生来瞎眼是谁犯了罪，是这人还是他父母"}, {"s": 953, "e": 959, "t": "分析门徒的反应：他们认为天生瞎眼必定与罪有关，只在父母犯罪还是本人犯罪之间二选一，等于限定了耶稣的回答，认定了答案必然是罪"}, {"s": 960, "e": 962, "t": "耶稣的回答否定了这两种猜测：不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来"}, {"s": 963, "e": 967, "t": "由此得出这人的瞎眼与罪无关、与神的作为有关；人向上帝提问时常只给出一道A与B的选择题，结果发现两个都不是，因此对祸福与罪恶的认知需要作出调整"}, {"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记"}]}, "v4": {"stats": {"pred_n": 139, "gb": 112, "pb": 138, "exact": 68, "near": 38, "f0": [0.493, 0.607, 0.544], "f3": [0.768, 0.946, 0.848], "wd": 0.2674, "groups": {"same": 33, "over": 7, "mixed": 18, "near": 10, "under": 1}, "ban": 3, "per": 2, "dem": 45, "long": 1, "tok_in": 84679, "tok_out": 56370, "prompt": "切段_v4", "model": "deepseek-flash", "effort": "low"}, "groups": [{"s": 1, "e": 3, "st": "same", "g": [0], "p": [{"s": 1, "e": 3, "t": "开场互道平安，谦卑地表示「帮助」不敢当，真正能建立人的是神的话，自己只是把神的话用今天的话尽可能讲给听众听", "en": "谦卑地表示自己担当不起「帮助」二字，只是把神的话用今天的话尽可能讲给听众听", "sec": "1.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 4, "e": 8, "st": "same", "g": [1], "p": [{"s": 4, "e": 8, "t": "宣布本周要诵读的正道经文是约伯记一章1至8节，并说明会坦然地看经文，遇到难解的部分尽可能加以解释", "en": "会坦然看经文，难解的部分尽可能解释，末行是语气词", "sec": "2.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 9, "e": 13, "st": "same", "g": [2], "p": [{"s": 9, "e": 13, "t": "约伯记一章记载，乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方人中为至大", "en": "这人在东方人中为至大", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 14, "e": 18, "st": "same", "g": [3], "p": [{"s": 14, "e": 18, "t": "约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹来一同吃喝；筵席的日子过了，约伯打发人去叫他们自洁，清早起来按众人的数目献燔祭，因为恐怕儿子犯了罪、心中弃掉神，约伯常常这样行", "en": "约伯常常这样行", "sec": "2.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 19, "e": 25, "st": "over", "g": [4], "p": [{"s": 19, "e": 22, "t": "约伯记一章记载，有一天神的众子来侍立在耶和华面前，撒但也来到其中；耶和华问撒但从哪里来，撒但回答说自己从地上走来走去，往返而来", "en": "撒但答自己从地上走来走去，往返而来", "sec": "2.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 23, "e": 25, "t": "耶和华问撒但有没有用心查看他的仆人约伯，说地上再没有人像约伯完全正直、敬畏神、远离恶事；随后说明本周只分享到这里", "en": "耶和华向撒但夸约伯，随后说明本节分享到此为止", "sec": "2.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 26, "e": 29, "st": "same", "g": [5], "p": [{"s": 26, "e": 29, "t": "会前祷告开头，求神使众人继续以他的话语为根基来崇拜他，在众圣徒中得着他当得的荣耀，并临格在他们中间，开通众弟兄姊妹的耳朵，使他们凡有耳的都能听", "en": "求神临格开通众弟兄姊妹的耳朵，使他们凡有耳的都能听", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 30, "e": 33, "st": "same", "g": [6], "p": [{"s": 30, "e": 33, "t": "求神把众先知使徒记在圣经上的福音、古旧的信仰以及他们所需用的一切知识一同赐给他们，使他们通达灵敏、得以认识神、一次得救，并使真信心在他们中间自己酝酿，使他们中间多结果子", "en": "求神使真信心在其中酝酿并使他们多结果子，最后奉耶稣基督的圣名祈求", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 34, "e": 36, "st": "same", "g": [7], "p": [{"s": 34, "e": 36, "t": "约伯记开篇的讲解分两个部分进行，用两个眼光来看这段经文，稍后还会把经文再打给会众。", "en": "说明分两个部分、两个眼光来讲，稍后会再打给会众看这段经文", "sec": "4.1", "f": {"ban": ["这段"], "per": [], "dem": []}}]}, {"s": 37, "e": 41, "st": "same", "g": [8], "p": [{"s": 37, "e": 41, "t": "1至5节讲约伯的现实背景：先介绍约伯这个人，说他极为富有，有众多儿女、牛驴仆婢，是东方的大富户。", "en": "先介绍约伯这个人，他的现实背景就是东方的大富户", "sec": "4.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 42, "e": 48, "st": "same", "g": [9], "p": [{"s": 42, "e": 48, "t": "6至8节讲约伯的属灵背景：他敬畏神、远离恶事，在天上得耶和华的认可，虽是被撒但控告的人，却是神非常认可的人。", "en": "在人看不见的天上，耶和华如此评价约伯；这一讲就分这两个方面", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 49, "e": 54, "st": "over", "g": [10], "p": [{"s": 49, "e": 51, "t": "陈社炳自我介绍姓氏与称呼，并说明新的一年在此服侍的任务明确：抛开传统，把圣经里先知使徒的福音教导慢慢告诉会众，使这道成为敬拜的根基，不再另立别的根基。", "en": "希望这道成为这里敬拜的根基，不要再立别的根基", "sec": "4.2", "f": {"ban": [], "per": ["我"], "dem": ["此"]}}, {"s": 52, "e": 54, "t": "在自认为许可的范围内，与自己的教会同步信息，尽量保持同步；若认为某一周的信息不合适，就用最古老的一卷约伯记来跟大家慢慢开始。", "en": "若认为不合适，就用最古老的约伯记慢慢开始", "sec": "4.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 55, "e": 58, "st": "same", "g": [11], "p": [{"s": 55, "e": 58, "t": "今天教会对福音的信仰通常更关注个人而不是国度，比较关注今生这几十年个人的祸福，却不关注将来的国度；因此到许多地方，也不得不先从个人层面的事谈起。", "en": "所以到许多地方，也不得不先从个人层面的事谈起", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 59, "e": 63, "st": "same", "g": [12], "p": [{"s": 59, "e": 63, "t": "约伯记不是传全备福音最好的一卷书，却能帮助消除从前比较顽固的观念，为领受真道预备所需的智慧；日后若有冒犯，也宁愿先用约伯记冒犯，因为福音本身对人的挑战更大。", "en": "若以后冒犯会众，也希望先用约伯记来冒犯，因为福音本身对人的挑战更大", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 64, "e": 67, "st": "same", "g": [13], "p": [{"s": 64, "e": 67, "t": "认识真道并不等于先跟认识苦难有关；约伯记是智慧书的第一卷，这一点不可忽略，人们提到约伯记常联想到苦难，但它的大主题其实是智慧，即认识耶和华的智慧。", "en": "约伯记的大主题其实是智慧，而且是认识耶和华的智慧", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 68, "e": 73, "st": "same", "g": [14], "p": [{"s": 68, "e": 73, "t": "从1至5节提出第一个问题：世界上存不存在绝对的平安；许多在平安夜信耶稣的弟兄姊妹，把平安当作信基督教的第一诉求，所以先来谈平安这个话题。", "en": "1至5节先来看平安这个话题", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 74, "e": 76, "st": "same", "g": [15], "p": [{"s": 74, "e": 76, "t": "从6至8节提出第二个问题：如果一个人的信仰被上帝认可，是否意味着他这个人就会远离灾祸。", "en": "信仰若被上帝认可，是否就意味着这个人会远离灾祸", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 77, "e": 79, "st": "same", "g": [16], "p": [{"s": 77, "e": 79, "t": "如果曾对信仰中的祸与福作过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以对此稍作调整。", "en": "约伯记的开篇可以稍微调整一下", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["此"]}}]}, {"s": 80, "e": 114, "st": "mixed", "g": [17, 18, 19, 20], "p": [{"s": 80, "e": 83, "t": "引出约伯记1章1至5节，邀请读者看约伯近乎永久安稳的人生，并追问什么叫永久安稳的人生", "en": "引出看约伯的永久安稳人生，并追问什么叫永久安稳的人生", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 84, "e": 88, "t": "介绍背景：约伯记被认为是最早写成的一卷书，比创世记还早，约伯生活在很早的年代，可能比亚伯拉罕更早；随后进入经文，乌斯地有一个人名叫约伯", "en": "进入经文，乌斯地有一个人名叫约伯", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 89, "e": 93, "t": "约伯是乌斯地人，并非以色列人；他可能生活在族长时代之前、比亚伯拉罕更早，是认识独一真神的古代圣徒", "en": "约伯可能比亚伯拉罕更早，是认识独一真神的古代圣徒", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 94, "e": 98, "t": "针对「旧约只有以色列人信上帝」的误会，指出并非如此，耶和华是全地的主、全人类的主，不是以色列人发明了耶和华", "en": "耶和华是全地的主，全人类的主", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 99, "e": 105, "t": "举例说明亚伯拉罕之前已有人信耶和华：亚伯拉罕认识至高祭司、撒冷王麦基洗德，并向他纳十分之一；以东行邪术的巴兰也知道耶和华的名字", "en": "巴兰虽是行邪术的，也知道耶和华的名字", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 106, "e": 114, "t": "独一神信仰不是从摩西才开始，该隐也认识耶和华；万族都知道耶和华，只是纯正信仰后来在一族人中被保全；早在约伯的年代，乌斯地已有一个非常敬畏上帝的人", "en": "早在约伯年代，至少乌斯地有一个非常敬畏上帝的人，就是约伯", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 115, "e": 128, "st": "near", "g": [21, 22], "p": [{"s": 115, "e": 120, "t": "追问圣经为何收录约伯的故事、约伯记1章开篇为何要写1至5节，强调圣经没有一段细节是枉费白费的", "en": "追问为什么约伯记开篇要写1到5节，强调圣经没有一段细节是枉费的", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 121, "e": 128, "t": "提问约伯记开篇要读者先明白什么，并以一般人的眼光设想：什么样的人、什么样的家庭绝不会出意外，通常认为是钱多、人多、资源多，遇事更能平事", "en": "通常认为钱多、人多、资源多的人家，遇事更能平事", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 129, "e": 144, "st": "mixed", "g": [23, 24], "p": [{"s": 129, "e": 132, "t": "从描述看，作者突出约伯身上一个鲜明的特点，就是他和家庭的稳，按各个时代的眼光，他都是不会遭遇灾祸、能面对任何风险的人", "en": "按各时代眼光，约伯是不会遭灾祸、能面对任何风险的", "sec": "5.3", "f": {"ban": ["作者"], "per": [], "dem": []}}, {"s": 133, "e": 140, "t": "解释约伯记1章1至5节先交代约伯的稳，是因为他后面落到极大的灾难中，前面的绝对平安稳妥与后面的完全不安稳形成极大的落差", "en": "1至5节的平安稳妥与大灾难中的不安稳形成极大落差", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 141, "e": 144, "t": "指出读者可以用这个落差慢慢思考自己对耶和华信心的根基；许多老弟兄老姐妹即使没特别读懂约伯记，也知道约伯后来家破人亡、浑身疾病、躺在炉灰中", "en": "许多老弟兄老姐妹也知道约伯后来家破人亡、浑身疾病、躺在炉灰中", "sec": "5.3", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 145, "e": 174, "st": "mixed", "g": [25, 26, 27], "p": [{"s": 145, "e": 149, "t": "提醒读约伯记1章1至5节时先不管后面的故事，不要带着「上帝视角」，因为知道太多反而会破坏读开头时应有的思路", "en": "知道太多反而破坏开头应有的思路", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 150, "e": 153, "t": "设想只看约伯记1章1至5节，如果在生活中遇到约伯这样的人，会不会认为他的家庭会出现变故，答案应该是不会", "en": "会认为约伯这样的家庭应该不会出现变故", "sec": "5.4", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 154, "e": 168, "t": "列举人生动荡的风险因素：努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力；抗风险能力最强的人通常被认为最平安，人都有对生活不安稳的担忧和风险意识", "en": "抗风险能力最强的人通常被认为最平安，人都有对生活不安稳的担忧", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 169, "e": 174, "t": "讲一般人对突然遭灾者的看法，即恶有恶报：一个家庭容易遭灾，可能因为抗风险能力低，也可能因为他是恶人、常在恶事里被反噬，所谓常在河边走难免不湿鞋", "en": "家庭易遭灾或因抗风险低，或为恶人常在恶事里被反噬", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 175, "e": 205, "st": "mixed", "g": [28, 29, 30], "p": [{"s": 175, "e": 184, "t": "约伯不是坏人；圣经首先给出他第一个稳健因素，即完全正直、远离恶事，也就是把他身上任何道德和违法犯罪所带来的风险彻底排除", "en": "约伯完全正直、远离恶事，排除道德和违法犯罪的风险", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 185, "e": 189, "t": "假设一个家庭作奸犯科、开赌场贩毒，人们会认为它迟早遭殃，因为身处恶势力、没有远离恶事又不正直，会招来灾祸；而约伯不是这样", "en": "作奸犯科的家庭会招灾，但约伯没有这些", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 190, "e": 195, "t": "约伯完全正直、敬畏神、远离恶事；敬畏神这一点连耶和华都承认，说明他连属灵的、遭天谴的因素也排除了", "en": "约伯敬畏神，连属灵遭天谴的因素也排开，且被耶和华承认", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 196, "e": 205, "t": "设想一个没干违法犯罪之事的好人，还可能因不信上帝、拜偶像、乱搞迷信、信仰上污秽而遭上帝愤怒的牵连，这是基于错误信仰的第二个不稳健因素", "en": "基于错误信仰，可能因上帝愤怒遭家庭牵连，这是第二个不稳健因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 206, "e": 222, "st": "mixed", "g": [31, 32], "p": [{"s": 206, "e": 211, "t": "约伯敬畏神、远离恶事、完全正直、生活上没有违法乱纪，因此从道德伦理、司法到信仰虔诚度的一切风险因素在他身上都不存在，他的敬畏且被上帝认可", "en": "约伯各方面风险因素都不存在，敬畏且被上帝认可", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 212, "e": 215, "t": "由约伯记1章1节可以认同约伯是好人、好弟兄、好虔诚人；但这样的家庭若还会遇到波折，那还有什么可能性的因素", "en": "这样的家庭若还遇波折，还有什么可能因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 216, "e": 222, "t": "谈硬实力：人丁兴旺在古代社会乃至今天的农村都意味着家族势力比较大；以前的人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里比较稳健", "en": "儿子多、顶梁柱多，家族就比较稳健", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 223, "e": 228, "st": "same", "g": [33], "p": [{"s": 223, "e": 228, "t": "看约伯除虔诚之外的硬实力：约伯记1章2节记载他的家庭成员，他生了七个儿子、三个女儿，人丁相当兴旺，这成为家庭抗风险的第二把锁", "en": "约伯生了七个儿子、三个女儿，人丁兴旺", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 229, "e": 237, "st": "same", "g": [34], "p": [{"s": 229, "e": 237, "t": "承接努力赚钱、积累人脉是为增加抗风险因素，看约伯记1章3节约伯的财富和地位：他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方为至大", "en": "约伯的财富权势和地位在东方为至大", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 238, "e": 247, "st": "same", "g": [35], "p": [{"s": 238, "e": 247, "t": "解释七千只羊意味着庞大的牧场，羊毛和羊奶在古代是丰厚的利润；圣经清晰交代约伯的收入来源，如同他的财务报表", "en": "圣经清晰交代约伯的收入来源，如同财务报表", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 248, "e": 260, "st": "same", "g": [36], "p": [{"s": 248, "e": 260, "t": "解释三千骆驼的用途：骆驼一般不吃，而是用来运货、走沙漠和丝绸之路，相当于今天的大货车，可见约伯的物流商贸做得非常大", "en": "三千骆驼相当于三千辆大货车，约伯的物流商贸非常庞大", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 261, "e": 284, "st": "mixed", "g": [37, 38, 39], "p": [{"s": 261, "e": 266, "t": "解释牛和驴用于耕地，可见约伯的田产也很大；再加上许多仆婢，他的牧场、物流和农业田产都非常大", "en": "约伯的牧场、物流、农业田产都非常大", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 267, "e": 272, "t": "约伯的硬实力和产业丰厚到难以想象；圣经评价他「在东方为至大」，不是仅在乌斯地为至大，而是整个东方最顶配的人物", "en": "圣经评价约伯在整个东方为至大，而非仅乌斯地", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 273, "e": 278, "t": "讲约伯人生的落差：以「瘦死的骆驼比马大」反衬，只要上帝愿意、撒但插手，这样的人也会在炉灰里满身烂疮、哀叫连连，这是约伯记留下的残酷人生真相", "en": "约伯后来满身烂疮坐在炉灰里，是残酷的人生真相", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 279, "e": 284, "t": "总结约伯在历史上的素描：他强盛到连一个城邦的君王都难做到，经济富可敌国、地位在东方为至大，是在东边具备国际影响力的人", "en": "约伯经济富可敌国、地位东方为至大，具国际影响力", "sec": "5.8", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 285, "e": 303, "st": "mixed", "g": [40, 41], "p": [{"s": 285, "e": 290, "t": "设想如果今天生活中认识约伯，人们不会觉得他有什么风险，遇到生病、买房这类事对他都是小问题，他是随时能够平事的人", "en": "约伯随时能处理任何问题，人们不觉得他有风险", "sec": "5.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 291, "e": 299, "t": "如果不看后面的内容，第一感觉会是约伯这个家庭这辈子不会出任何意外；理由明确：道德上他远离恶事、不惹事，信仰上他敬畏神、远离被上帝击打，硬实力上他像国际大佬，有事都办得到", "en": "理由是他道德远离恶事、信仰敬畏神、硬实力极强", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 300, "e": 303, "t": "说今天最常喊人定胜天口号的就是这种已经手眼通天、站在至大地位的大佬，而许多人只有一点点钱就觉得自己可以上天", "en": "这种大佬已手眼通天，许多人有点钱就自以为了不起", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 304, "e": 312, "st": "same", "g": [42], "p": [{"s": 304, "e": 312, "t": "有人不服气，提出豪门家庭的因素，说有钱人有有钱人的苦，豪门兄弟姐妹争夺家产、打得头破血流；这悲剧自古就有，但约伯家里并不是这样", "en": "豪门争家产的悲剧自古有，但约伯家不是这样", "sec": "5.9", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 313, "e": 323, "st": "same", "g": [43], "p": [{"s": 313, "e": 323, "t": "约伯记1章4节记载约伯的儿子按着日子各在自己家里设摆筵席，并请三个姐妹一同吃喝；说明约伯不但实力强、敬畏神，家里兄弟姐妹也感情极好、常常聚餐、其乐融融，不存在豪门争端", "en": "约伯家兄弟姐妹常常聚餐、其乐融融，不存在任何变数", "sec": "5.9", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 324, "e": 338, "st": "over", "g": [44], "p": [{"s": 324, "e": 328, "t": "加上最后一层保障：约伯对儿女的信仰教育也是顶级的；有人稍有点小钱就人定胜天，约伯做到那样的地位却活得警醒，甚至活在震惊之中", "en": "约伯对儿女的信仰教育是顶级的", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["那样"]}}, {"s": 329, "e": 338, "t": "解释约伯记1章5节：筵席的日子一过，约伯就打发儿女去自洁，并清早起来按众人的数目献燔祭，因为他恐怕儿女犯了罪、心中弃掉神；约伯常常这样行", "en": "约伯怕儿女犯罪弃掉神，常常这样献燔祭、叫他们自洁", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 339, "e": 379, "st": "mixed", "g": [45, 46, 47], "p": [{"s": 339, "e": 341, "t": "加上最后一层锁，归纳说这种人不可能出意外：从硬实力、自己的正直、家庭的和睦、经济，到对家庭的信仰看守，都是顶级中的顶级", "en": "从各方面到信仰看守，约伯都是顶级", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 342, "e": 350, "t": "约伯不把儿女的聚餐当作只是吃一顿饭，他深深恐惧这些「富二代」儿子会不会弃掉神，所以一早起来按数目一一献燔祭、叫他们自洁，希望儿女像他一样敬畏神、远离恶事；连信仰教育都是顶配", "en": "约伯希望儿女像他一样敬畏神、远离恶事，信仰教育是顶配", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这些"]}}, {"s": 351, "e": 353, "t": "总结说约伯这个家庭从本人的信仰到子女的信仰，全部都在圣约的看守、上帝的看守之中", "en": "约伯全家从本人到子女的信仰都在上帝的看守之中", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 354, "e": 359, "t": "讲约伯记的冲击力：一个这么敬虔又这么强大的家族，后来竟然家破人亡，人全部被杀光，唯一剩下的活口还满身烂疮、躺在炉灰里", "en": "这个敬虔又强大的家族后来家破人亡，只剩满身烂疮的活口", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"s": 360, "e": 363, "t": "指出更难接受的一点：允许这件事发生的，竟不是撒但单方面，而是他们全家敬畏的那位耶和华允许撒但去做的", "en": "允许这件事的是他们全家敬畏的耶和华，允许撒但去做", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷（约伯记、箴言、诗篇、传道书、雅歌）很合适，因为若肯客观读约伯记，一定会倒掉之前喝下过的所有基督教鸡汤，打掉任何幻想", "en": "客观读约伯记会倒掉所有基督教鸡汤，打掉幻想", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"s": 371, "e": 379, "t": "若读懂约伯记，会看到约伯不只是硬实力强，更是全家敬虔、父亲在信仰上极其警醒，1章5节说他「常常这样行」；耶和华也认可他，但读第三章时，约伯却躺在炉灰中巴不得快死，极其痛苦", "en": "但到第三章，约伯躺在炉灰中极其痛苦，巴不得死掉", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 380, "e": 390, "st": "over", "g": [48], "p": [{"s": 380, "e": 385, "t": "说明读懂约伯记会获得的智慧，不是中国人所理解的厚黑、圆滑，而是让人倒掉一切曾喝下的基督教毒鸡汤和虚假的平安；没想清楚这个问题，就无法健全地认识福音", "en": "没想清楚这问题之前无法健全认识福音", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 386, "e": 390, "t": "说每个人对自己人生顺遂和稳健程度的评估都有具体标准；用约伯记1至5节整理：钱多、人多、势力大，再加上做人好、虔诚、家庭团结、敬畏神，似乎就内外无懈可击", "en": "加上做人好、虔诚、家庭团结、敬畏神，似乎内外无懈可击", "sec": "5.12", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 391, "e": 410, "st": "mixed", "g": [49, 50], "p": [{"s": 391, "e": 394, "t": "指出约伯不是偶尔这样，1章5节说他「常常这样行」；这样的人会出现意外吗？人们肯定认为不会", "en": "这样的人会不会出意外，人们肯定认为不会", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 395, "e": 398, "t": "以人们不会认为马斯克交不起房租作比，说约伯这种人与炉灰中的乞丐像两个物种、两种人，难以想象这两个形象最终重叠在一个人身上", "en": "这种人和炉灰中的乞丐是两个物种，难以想象重叠在一人身上", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 399, "e": 404, "t": "说这就是约伯记要告诉人的，到后面读约伯记就有真实答案；用以前的人生经验会回答这样的人不会出意外，但约伯记告诉人会，而且还非常非常会", "en": "约伯记告诉人会出意外，而且非常非常会", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 405, "e": 410, "t": "说作为人生安稳支柱的那些资源都可能瞬间失去；读完约伯记会发现，真正护住人的是一条看不见的篱笆，即耶和华看守的；身内身外之物全失去后，剩下的只有曾经敬畏耶和华的智慧和知识", "en": "剩下的只有曾经敬畏耶和华的智慧和知识", "sec": "5.13", "f": {"ban": [], "per": [], "dem": ["那些"]}}]}, {"s": 411, "e": 420, "st": "over", "g": [51], "p": [{"s": 411, "e": 417, "t": "解释身外之物指钱、房产，生不带来死不带去，连衣服也算身外之物；但约伯连身内之物都没了，皮与骨都被撒但击打，皮囊已在炉灰中，快扛不住了", "en": "约伯连皮与骨都被撒但击打，在炉灰中快扛不住", "sec": "5.13", "f": {"ban": [], "per": [], "dem": []}}, {"s": 418, "e": 420, "t": "说约伯即使如此仍表示，就算神杀他，他也要在炉灰中继续等候，只求神跟他说清楚为什么让他遭遇这些", "en": "约伯仍要在炉灰中继续等候，只求神说清楚缘由", "sec": "5.13", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 421, "e": 427, "st": "same", "g": [52], "p": [{"s": 421, "e": 427, "t": "总结说，最终能够看守人的不是人自以为的抗风险因素和人生支架，因为它们说倒塌就倒塌；真正看守人的是耶和华圈上的四围篱笆，以及敬畏耶和华所积累的真知识和真智慧，那是发芽结果后丰收的果子", "en": "剩下的是敬畏耶和华的真知识真智慧，是丰收的果子", "sec": "5.13", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 428, "e": 444, "st": "mixed", "g": [53, 54], "p": [{"s": 428, "e": 431, "t": "说需要在约伯记一开始就预备好、接受这件事，清醒知道与神同行的几十年里许多事很可能会突然发生；只有在正确的预设之下，人才不会在苦难的年岁突然弃掉神", "en": "正确的预设下人才不会在苦难中突然弃掉神", "sec": "5.14", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 432, "e": 439, "t": "说错误的期待会带来错误的信心，无法正确回应遭遇；若带着错误期待又想回应当下处境，只有两个危险做法：去掉福音或更改福音；就算不去掉福音，只要仍怀着错误期待来信，最终也要更改福音，接受不了纯正的东西", "en": "带着错误期待，要么去掉福音，要么更改福音", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}, {"s": 440, "e": 444, "t": "讲约伯记第二章上帝对约伯的评价是「持守纯正」，即福音在乌斯地为至大时让他舒适，倒在炉灰中让他不舒适，他仍按原来的继续等候思想，哪怕困惑也不更改、不以口犯罪、不妄认上帝", "en": "持守纯正就是哪怕困惑也不更改、不以口犯罪、不妄认上帝", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 445, "e": 466, "st": "mixed", "g": [55, 56], "p": [{"s": 445, "e": 448, "t": "讲这些年在人生顺境逆境中总有人好意地劝信耶稣就是保平安、上帝大大祝福；面对这类话，以约伯记2章9节约伯对太太的话作为回应：从神手里得福，也从神手里受祸", "en": "用约伯记2章9节回应：从神手里得福，也从神手里受祸", "sec": "5.15", "f": {"ban": [], "per": [], "dem": ["这些"]}}, {"s": 449, "e": 458, "t": "为约伯的妻子说话，认为她并非太坏：第一轮散尽家财、儿女死光时她没说啥，仍跟在约伯身边；直到第二轮约伯身体烂掉、骨头被击打、倒在炉灰中还祷告时，她才崩溃说「你仍然持守纯正吗？你弃掉神死了吧」", "en": "约伯妻子直到第二轮才崩溃，她被看作已非常好", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"s": 459, "e": 466, "t": "说约伯妻子过不去的那关是「从神手里得福，就不能受祸吗」；约伯回应说「我们从神手里得福，不也受祸吗」，并说她说话像愚顽的妇人一样", "en": "约伯回应「从神手里得福，不也受祸吗」，说她像愚顽的妇人", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 467, "e": 487, "st": "near", "g": [57, 58], "p": [{"s": 467, "e": 476, "t": "讲这些年无论顺境逆境，许多人都会说信耶稣绝对平安顺遂；回应是约伯的信仰告白，认从神手里得福也从神手里受祸，甘心愿意，这位上帝给福给祸都是他的上帝；但很多人按传统的宗教性会疑惑，得祸还信什么，没有人是为承认得祸来信耶稣的", "en": "很多人疑惑得祸还信什么，没人是为承认得祸来信耶稣", "sec": "5.15", "f": {"ban": [], "per": [], "dem": ["这些"]}}, {"s": 477, "e": 487, "t": "在第一层的结尾，借使徒保罗在罗马书的解释说明：万事互相效力，为人的救恩得益处；从神手里得福、受祸指的是人生际遇，万事包含祸与福，总有确定的益处，有时益处从祸里来，就是救恩的益处", "en": "万事互相效力，让人在救恩上得益处", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 488, "e": 492, "st": "same", "g": [59], "p": [{"s": 488, "e": 492, "t": "说破产、生病等事对今生无益，对永生却有益；要重新知道什么叫从神手里得福也受祸、万事互相效力为一个确定的益处，就是永生的益处，只有到达终点神才会擦去一切眼泪", "en": "万事互相效力为永生的益处，到终点神才擦去一切眼泪", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 493, "e": 497, "st": "same", "g": [60], "p": [{"s": 493, "e": 497, "t": "说跟随耶稣确实不是专门为今生保平安；不是说这辈子的事不重要，而是最终寻求的必须一开始就认识清楚，那是永恒的福乐，信耶稣一定是为追求这个而来的", "en": "信耶稣一定是为追求永恒的福乐而来", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 498, "e": 511, "st": "under", "g": [61, 62], "p": [{"s": 498, "e": 511, "t": "通俗地讲，信这辈子的苦难都会过去，而永恒的福乐永不会过去，永恒的咒诅也永不会过去；信耶稣与否会有永恒的结局，信徒处在暂存的九十年里，为了那不会废去的永恒，愿意接受现在的福与祸，只要它为救恩效力", "en": "为了永恒的定局，愿意接受今生的一切福祸，只要为救恩效力", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 512, "e": 532, "st": "mixed", "g": [63, 64], "p": [{"s": 512, "e": 516, "t": "说最终一定会发现两套截然不同的福音：一套相信上帝只给福、不给祸；另一套相信上帝让人得福也让人得祸，都为儿女的救恩效力，两者绝对不一样", "en": "两套福音绝对不一样：只给福，或福祸都为救恩效力", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"s": 517, "e": 526, "t": "说大部分人相信信耶稣就只给福、只有祝福没有灾祸；约伯的三个朋友正是按这套逻辑集体怀疑他，认为上帝只给信他的人祝福，所以约伯受祸必是干了坏事，后面的辩论都源于这套福音", "en": "三个朋友按这套福音怀疑约伯，认定他干了坏事", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}, {"s": 527, "e": 532, "t": "说这种观念上古在乌斯地就已存在，即上帝只给义人祝福，一旦受苦就不是义人、就是犯罪的人；所以三轮对话都在骂约伯，约伯则不断辩白自己整个人生没做任何对上帝不起的事", "en": "三轮对话骂约伯，约伯不断辩白自己没做对上帝不起的事", "sec": "5.17", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 533, "e": 540, "st": "same", "g": [65], "p": [{"s": 533, "e": 540, "t": "总结第一套福音是绝对平安、没有灾祸、只有祝福；而所信的是从神手里得福也从神手里受祸，但这不代表上帝咒诅人，他给人永久的祝福，让万事为救恩互相效力；为了永恒的定局，上帝甚至可在短暂期间降祸，短暂的咒诅促成永久的祝福，对他的选民以色列也是如此", "en": "短暂的咒诅可以促成永久的祝福", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 541, "e": 546, "st": "same", "g": [66], "p": [{"s": 541, "e": 546, "t": "说选择哪一套信仰、信心看向哪个方向，最终会走向不同的道路、结出不同的果子；劝人选择后一套，它并不残酷，因为与永恒不能废去的福祸相比，有得救智慧的人都知道怎么选；今生只要能促成那不可废去之福，就愿意接受上帝给的一切", "en": "今生只要能促成不可废去之福，愿接受上帝给的一切", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 547, "e": 556, "st": "near", "g": [67, 68], "p": [{"s": 547, "e": 550, "t": "总结约伯记1章1至5节：约伯各方面都绝对稳固，不可能出现任何意外，这是为后面读约伯记作铺垫，但他最终还是出了意外", "en": "约伯各方面都不可能出现意外，但他还是出意外了", "sec": "5.18", "f": {"ban": [], "per": [], "dem": []}}, {"s": 551, "e": 556, "t": "由此得到最基本的认识：人生以前认为的一切抗风险稳固支架都不算数、会顷刻失去；最终看守人的只是耶和华为我们安扎的篱笆，身内身外之物全部失去后，剩下的只有通过敬畏耶和华的人生所积累的知识和智慧，那东西会开花结果", "en": "剩下的是敬畏耶和华积累的知识和智慧，它会开花结果", "sec": "5.18", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 557, "e": 581, "st": "mixed", "g": [69, 70, 71], "p": [{"s": 557, "e": 571, "t": "从1-5节看得见的约伯家产与和睦，转向6-8节看不见的灵界；影响家庭乃至国家历史的是天上的场景，人所争取的物质资源其实很脆弱、影响有限，天上属灵领域的影响反而更大，转折始于第6节。", "en": "天上属灵领域影响历史中的人，转折点始于第6节", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 572, "e": 581, "t": "解释「神的众子」即众天使聚集在耶和华面前，这场景如同君王听政的集会，并以康熙王朝、雍正王朝中皇帝上朝、众大臣侍立听政的早朝作比方。", "en": "神的众子就是众天使，聚集在耶和华面前如同早朝", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 582, "e": 590, "st": "same", "g": [72], "p": [{"s": 582, "e": 590, "t": "提出很多人不明白的困惑——撒但怎么也能到天上；解释撒但原本是堕落的天使，背叛了上帝，堕落后确实已不在神众子的队伍之中。", "en": "撒但原是天使，堕落后已不在神众子的队伍中", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 591, "e": 604, "st": "over", "g": [73], "p": [{"s": 591, "e": 597, "t": "提醒注意约伯记作者的措辞「神的众子在耶和华面前，撒但也来在其中」，指出作者在暗示撒但已经不是神的众子之一，所以才会用「也来」这样的说法。", "en": "作者用「也来在其中」暗示撒但已不是神的众子之一", "sec": "6.1", "f": {"ban": ["作者"], "per": [], "dem": ["这样"]}}, {"s": 598, "e": 601, "t": "以高湖教会集会时「陈社炳也来在其中」为例，说明这话暗示来者本不属于该群体；神的众子是一个队伍，撒但是队伍中不协调的成员。", "en": "神的众子是一个队伍，撒但是其中不协调的成员", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 602, "e": 604, "t": "结论是撒但已不是神的众子、不再是天使，也不在这次天上集会的合法成员之内，但他原本确实是受造的一种属灵气的活物。", "en": "撒但已不在集会的合法成员之内，却是受造的属灵活物", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 605, "e": 629, "st": "near", "g": [74, 75, 76], "p": [{"s": 605, "e": 612, "t": "许多人更不理解的是，耶和华为何允许撒但来，还主动询问他「你从哪里来」、不把他赶走；因为这次搭话，约伯变得很惨，上帝的有些做法令人难以理解。", "en": "很多人困惑耶和华为何找撒但搭话，搞得约伯这么惨", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 613, "e": 618, "t": "给出结论：耶和华与撒但的对话不是搭讪也不是找茬，而是一次说话的授权，要表达的是撒但自始至终都在上帝的权下；神若不这样开口，撒但无法主动说话。", "en": "这是说话的授权，表明撒但自始至终在上帝权下", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 619, "e": 629, "t": "针对「耶和华不是全知吗、为何还要问撒但从哪里来」的质疑，指出约伯记1章7节和2章2节上帝问的是同样的问题，说明这不是上帝困惑，而是在授权撒但回答。", "en": "7节与2章2节上帝问同样的问题，说明这是发言授权", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 630, "e": 653, "st": "mixed", "g": [77, 78, 79], "p": [{"s": 630, "e": 645, "t": "以皇帝上早朝时「有事启奏，无事退朝」为例，并类比公司开会、课堂、讲道现场，说明在别人的权柄之下不能主动发言、需要被授权；耶和华两次用同样句式发问，正是给撒但发言的授权。", "en": "撒但要在耶和华授权下才能说话，否则连资格都没有", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 646, "e": 653, "t": "耶和华出于日后才揭晓的荣耀目的，给撒但一定的活动权限，但魔鬼完全在神的掌管之中；他两次攻击约伯都受耶和华权柄限制，不能伤身体、能伤身体却不能夺命，这种对邪恶的限制贯穿整卷约伯记。", "en": "魔鬼完全在神掌管中，攻击约伯都受权柄限制，贯穿全卷", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 654, "e": 660, "st": "same", "g": [80], "p": [{"s": 654, "e": 660, "t": "若确信撒但肆虐之时仍在上帝良善权柄的限制之下，神的儿女对上帝的期待、信心和安稳感就不只建立在脱离困境之后，也会建立在仍处困境之时，相信当下仍在上帝掌控中。", "en": "确信这真理的人，安稳不只在困境解脱之后，也在困境之中", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 661, "e": 667, "st": "same", "g": [81], "p": [{"s": 661, "e": 667, "t": "约伯记1章8节耶和华主动称赞约伯完全正直、远离恶事，引发困惑：这岂不是主动引魔鬼攻击义人？撒但本就凶恶，若没注意约伯就该遮掩过去，为何还提醒他去看约伯、试探这位义人。", "en": "很多人困惑上帝主动称赞约伯岂非引魔鬼攻击义人", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 668, "e": 694, "st": "near", "g": [82, 83, 84], "p": [{"s": 668, "e": 677, "t": "读经感觉不痛快是因为不了解原来的表达，借此提出两个选择题：是耶和华主动要撒但注意约伯，还是撒但本来就在关注约伯，耶和华不过借他的邪恶授权并促成自己美善的计划。", "en": "提出两个可能性，由听众判断哪一种", "sec": "6.3", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"s": 678, "e": 686, "t": "说明魔鬼不是全知全能的，全宇宙中只有耶和华上帝一位是全知、全能、全在；魔鬼似乎不受时间限制，从创世以前、始祖时就在，到如今还在，也不会老。", "en": "魔鬼不是全知全能，只有耶和华是全知全能全在", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 687, "e": 694, "t": "魔鬼受空间限制，因第7节他自称「我从地上走来走去，往返而来」，说明他不能同时在两地，在东就不在西，不能认为魔鬼是全在的，全在的只有上帝。", "en": "魔鬼受空间限制，在东就不在西，全在的只有上帝", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 695, "e": 704, "st": "same", "g": [85], "p": [{"s": 695, "e": 704, "t": "以耶稣「从天降下却仍在天的人子」为例，说明受空间限制的受造物只要在一处就不在另一处；唯有上帝在东也在西、贯乎众人之中，道成肉身仍在天，用全能命令托住万有，充满全地。", "en": "上帝不需要往返，他充满全地", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 705, "e": 730, "st": "mixed", "g": [86, 87], "p": [{"s": 705, "e": 714, "t": "耶和华问撒但从哪里来，撒但诚实地答「我从地上走来走去，往返而来」，表明他已不在天上，与在天上的神众子不同；他受空间限制，在东方就不在西方，必须走来走去。", "en": "撒但从地上来回走，受空间限制，在东就不在西", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 715, "e": 730, "t": "撒但既非全在也非全知，就得走到约伯身边；他后面能把约伯家的情况说得清楚，说明这些年他一直在约伯身边观察、盯着约伯，所以才会了解，这也印证他不是全知的活物。", "en": "撒但一直盯着约伯、在他身边，才了解他，因其非全知", "sec": "6.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 731, "e": 740, "st": "same", "g": [88], "p": [{"s": 731, "e": 740, "t": "撒但两次质疑约伯敬畏神的缘由，耶和华两次允许试验；这两次质疑表明撒但对约伯内心的评估出了错，而上帝全知全能全在，对约伯「敬畏我、远离恶事」的评价不会错。", "en": "撒但对约伯的评估出错，上帝的评价全然无误", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 741, "e": 757, "st": "near", "g": [89, 90], "p": [{"s": 741, "e": 747, "t": "撒但第一次质疑「岂是无故呢」，断言夺去约伯所有他必当面弃掉神；结果一切被夺去后，约伯却说赏赐和收取都在于耶和华、耶和华的名应当称颂，出乎撒但的意料。", "en": "约伯却称颂耶和华，出乎撒但意料", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"s": 748, "e": 757, "t": "撒但第二次改口说「人以皮代骨」，击打约伯的身体他必弃掉神，结果约伯浑身烂疮仍持守纯正，撒但又错了；可见撒但对人的观察需要知识的积累，第一次以为是钱财，第二次以为是皮肉。", "en": "撒但第二次评估又错了，他需要知识积累", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 758, "e": 775, "st": "near", "g": [91, 92], "p": [{"s": 758, "e": 764, "t": "撒但虽然厉害，信徒斗不过他，但绝不能把他放到与上帝掰手腕的位置；网络流传的耶稣与撒但掰手腕的图画是不可能的，撒但永远是受造的天使，在上帝面前处于权下姿态。", "en": "撒但永远在上帝面前处于权下姿态，不能与上帝同桌", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾毫无差错；而撒但需要在观察中评估人，评估可能出错，如圣经记载两次出错。日久见人心是有限受造物才需要的，耶和华从起初就知道约伯，撒但不全知也不全在。", "en": "耶和华从起初就知道约伯，撒但不全知不全在", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 776, "e": 829, "st": "near", "g": [93, 94, 95, 96, 97, 98], "p": [{"s": 776, "e": 782, "t": "既然上帝完全认可约伯的敬畏，按理应把撒但赶走、保护约伯，可上帝竟两次允许约伯受祸，而且灾祸非常严重；大部分人想不明白，因为人总认为招灾的是恶人、义人必得福，约伯的三个朋友后面也持同样看法。", "en": "大部分人想不明白，三个朋友后面也这样认为", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 783, "e": 792, "t": "约伯记讨论的主题是义人受苦、恶人亨通，这一主题在智慧书、诗篇、先知书中反复出现；人想象中的是义人得福、恶人受苦，圣经却诚实地指出义人可能受苦、恶人可能亨通，具备这种智慧才能有健全的信心。", "en": "义人可能受苦，恶人可能亨通", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 793, "e": 800, "t": "人选择任何宗教，都以保佑顺遂和福泽作为敬拜的理由，庙宇以灵验作招牌；甚至教会里听到的见证也几乎都是信耶稣后丰收了某些东西，没有人敢拿敬畏神后家破人亡来说事，觉得那是给上帝抹黑，但上帝自己就记载了这事。", "en": "没人敢拿敬畏神后家破人亡说事，上帝却自己记载了", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 801, "e": 810, "t": "有人以约伯记结尾约伯双倍得回祝福来反驳，但路加福音财主和拉撒路比喻中的乞丐拉撒路至死没得回、长满烂疮，死后才在亚伯拉罕怀里；不能因约伯双倍得回就把最终盼望又变成祝福，义人可能受苦、恶人可能亨通才是上帝告诉人的实况。", "en": "义人可能受苦、恶人可能亨通，是上帝告诉人的实况", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 811, "e": 821, "t": "更重要的东西是：福音是不可废去之福，不是别的东西；中国老祖宗早有「好人不长命，王八活千年」的说法，坏人反倒家大业大，说明人通过观察也能懂得这个道理。", "en": "中国老祖宗通过观察也懂得坏人反倒家大业大", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 822, "e": 829, "t": "对具体基督徒而言，不能因遭遇灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，如约伯；同样也不能因人顺风顺水就认可他的信仰，因为上帝可能并不认可他，圣经中也有这样的例子。", "en": "不能因灾难怀疑信仰，也不能因顺遂认可信仰", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 830, "e": 850, "st": "near", "g": [99, 100], "p": [{"s": 830, "e": 838, "t": "指出信仰方式需要调整，指的其实是知识和认知；很多人却用人生顺遂来回应，如「家里买了三套房子」，这属于鸡同鸭讲，不要把处境当作信仰纯正度的证明；人用多年家庭和睦或事业高升公然拒绝反思信仰，是非常不好也遗憾的事。", "en": "人用家庭和睦、事业高升公然拒绝反思信仰，非常遗憾", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 839, "e": 850, "t": "有的人明明找到真理，却因人生顺遂拒绝反思；有的人明明对了，却因突然遭灾开始怀疑自己，两个都不可取；用当下的环境来解释信仰的实质是一种误区，熟悉智慧书的基督徒都知道顺遂与祸福跟上帝是否认可一个人是两码事。", "en": "顺遂与祸福跟上帝是否认可一个人是两码事", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 851, "e": 889, "st": "mixed", "g": [101, 102], "p": [{"s": 851, "e": 858, "t": "举例说明：假设讲道前一天腿摔断、当天还拉肚子，有人说这是上帝在拦阻、不要去，另一拨人却说这是撒但拦阻、可见要去做神的工；同一件事、同一个现实，竟有两种解释。", "en": "一件事、一个现实，竟会有两种解释", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 859, "e": 870, "t": "亲身经历印证：多年做关乎上帝的工作之前，身体常出问题，如发烧、骑车摔伤、磕到头；同一件事分出两拨人——一拨说生病是上帝拦阻、不要去，另一拨说生病是撒但拦阻、正是要去的证明，令人不知该听谁的。", "en": "一件事分出两拨人给出相反解释，令人不知听谁的", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 871, "e": 878, "t": "借物质的事指着灵界来论断就是愚昧；通常说上帝拦阻的人，是自己不想对方去，说撒但拦阻的人，是自己想去；可见人随私意解读，不只随私意解读圣经，也随私意解读环境。", "en": "人随私意解读圣经，也随私意解读环境", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 879, "e": 889, "t": "身上发生的事可能跟上帝的旨意没有关系，不要硬扯在一起；从约伯记可见天上的场景与地下的场景没有关系，所以环境不要成为信仰的第一参考标准，眼前显明的东西不代表背后属灵的实际，生病也不代表那人就是坏。", "en": "环境不要成为信仰的第一参考标准", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 890, "e": 922, "st": "mixed", "g": [103, 104, 105], "p": [{"s": 890, "e": 898, "t": "今后要做一个最简单的调整，就是不要做属灵的「董王」，为弟兄姊妹解读他身上遭遇的属灵事实；这连传道人也不能，家庭处境和顺遂的问题不要来问，许多传道人自以为知道，其实不知道。", "en": "连传道人都不能解读别人遭遇，家庭顺遂不要来问", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}, {"s": 899, "e": 910, "t": "能懂的只有上帝的话怎么说，而别人家里为什么这样无从得知；天上的场景是人的智慧不可企及、至高不能及的，人又不是先知，只能通过上帝的原则来告诉大家，使人在这本书上得着根基的稳固。", "en": "只能通过上帝的原则告诉大家，使人根基稳固", "sec": "6.10", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 911, "e": 918, "t": "天天借瞎猜神的意思教别人做事的，人或许以为是属灵人，圣经却称这种人为愚昧人；约伯的三个朋友后面会具体示范这种人——以利法、比勒达、琐法都言之凿凿地解释约伯的处境证明了上帝怎样看他，仿佛只有约伯不知道。", "en": "三个朋友会示范什么叫这种人，都自称知道", "sec": "6.10", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 919, "e": 922, "t": "若具备了智慧书的智慧，就能得到干净的皮袋子，用这皮袋好好装载新酒，不至于破裂；这是约伯记全部的信息。", "en": "干净的皮袋能好好装载新酒，不至于破裂", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 923, "e": 928, "st": "same", "g": [106], "p": [{"s": 923, "e": 928, "t": "结尾回应一个疑问：既然不靠环境辨别，可多年来人都习惯以环境判断，事情做得不顺就认为不是上帝的旨意；这种看法不对，也不能走另一极端，认为越不顺越才是上帝的旨意，两者都不可取", "en": "另一种极端认为越不顺越是上帝的意思，两种都不可取", "sec": "7.1", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 929, "e": 942, "st": "mixed", "g": [107, 108], "p": [{"s": 929, "e": 936, "t": "既然环境顺遂不是第一鉴别标准，那么第一鉴别标准就是上帝圣言的准则，即圣经66卷：遵行就是，违反就不是，无论环境顺遂与否。这才是根基所在，上帝怎么说永远是行动的最高准则，而不是个人或家庭的遭遇", "en": "上帝怎么说永远是行动的最高准则，而不是自己或家庭的遭遇", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 937, "e": 939, "t": "靠什么知道上帝对人真实的心意？答案还是这卷书，即圣经；也希望人的安全感能够建立在这上面", "en": "希望人的安全感建立在这卷书之上", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道；所能遭遇的最大祝福，则是上帝带领他进入真理，并赐给他永恒的福乐", "en": "最大的祝福是上帝带入真理并赐永恒福乐", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 943, "e": 959, "st": "near", "g": [109, 110], "p": [{"s": 943, "e": 948, "t": "有人提出疑问：上帝所认可的人既然不出于刑罚，也不出于管教，上帝既不试炼、不行罚，又不讨厌他，为什么还允许这个人受祸？为此要用最后一段经文来作结", "en": "提出用最后一段经文作结，引出约翰福音九章1至3节", "sec": "7.3", "f": {"ban": [], "per": [], "dem": ["此", "这个"]}}, {"s": 949, "e": 959, "t": "约翰福音9章1至3节记载耶稣看见一个生来瞎眼的人，门徒问是谁犯了罪，是这人还是他父母；门徒一口认定天生瞎眼一定与罪有关，只是分不清是父母的罪还是儿子的罪，等于限定了耶稣的回答", "en": "门徒认定天生瞎眼绝对是罪，只是分不清是父母的罪还是儿子的罪", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 960, "e": 967, "st": "over", "g": [111], "p": [{"s": 960, "e": 963, "t": "耶稣的回答出人意料：也不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来；可见这件事与罪无关，只与神的作为有关", "en": "原来与罪无关，原来与神的作为有关", "sec": "7.3", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 964, "e": 967, "t": "人向上帝提问时，常常只给上帝一道选择题，限定了他可能的回答；等到发现两个选项都不是，才明白与神的作为有关。圣经由此要求人对祸福、罪恶之间的关系，作出认知上的调整", "en": "圣经要人调整对祸福罪恶想当然的认知", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 968, "e": 969, "st": "same", "g": [112], "p": [{"s": 968, "e": 969, "t": "以祷告开始，求神带领，遵照神的话开始查考约伯记", "en": "末行落在遵照神的话、要开始看约伯记", "sec": "8.1", "f": {"ban": [], "per": [], "dem": []}}]}], "near": {"89": 88, "94": 96, "106": 107, "121": 122, "154": 155, "169": 170, "185": 184, "190": 193, "212": 215, "267": 268, "273": 275, "291": 294, "354": 355, "364": 365, "399": 400, "440": 438, "477": 479, "517": 519, "551": 552, "572": 573, "613": 614, "619": 622, "646": 647, "678": 679, "687": 688, "748": 750, "765": 766, "783": 786, "793": 794, "801": 802, "811": 814, "822": 823, "839": 841, "879": 878, "899": 900, "911": 914, "937": 936, "949": 948}, "unc": {"8": "「啊」是语气词，无内容，并入本段", "14": "9-10 只有两行，述约伯的为人，按不足三行并入相邻段，与家产一并成段；14 起转述儿女设宴与约伯献祭，另作一段", "25": "25 是收束的一句交代，只有一行，并入前一段；23-24 耶和华向撒但夸约伯与前段同属一场对话，也可不切", "30": "祷告按祈求事项分段，26 单独一行属呼召祷告，与前三项祈求合并；29 求开通耳朵与 30 起求赐福音知识是两项不同的祈求，故在 30 处切开", "31": "「使他们于于的，什么通达灵敏」识别不清，按上下文理解为求神使他们通达灵敏、认识神", "40": "「东方为自大的富户」疑为「东方为大（最大）的富户」的识别错误，标题按「东方的大富户」处理", "52": "49-50 仅两行自我介绍，不足三行，按规则并入相邻段，与任务说明合为一段", "58": "58 是 55-57 观察的推论，同时引出下文谈约伯记，按归入它所引出的一段处理在 59 处切", "78": "「门神赐福」疑为「神赐福」的识别错误，标题按「神赐福」处理", "121": "121 是提出问题、为下文 122 的设问开口，按过渡句归属规则归后", "248": "248 起单讲三千骆驼的用途，也可看作 238-247 解释财富的延续，按新的一步（物流商贸）单独成段", "582": "582-590 与 591-597 同为解释撒但为何在其中，切点是否必要不确定", "687": "687「但他受不受空间限制啊」为下文开口，按过渡句规则归后", "783": "783「这卷书我们才刚开始」属过渡插话，与主题说明同段", "923": "923 是「今天到这里」的收尾语，但下文继续展开，故并入第一段", "948": "「在约翰福音九章1至3节，有这么一句话」是为下文读经开口，也可移入下一段开头；此处按经文引用归属处理", "969": "转写在此处被截断，「约伯的」应为「约伯记」，按上下文补全"}, "paras": [{"s": 1, "e": 3, "t": "开场互道平安，谦卑地表示「帮助」不敢当，真正能建立人的是神的话，自己只是把神的话用今天的话尽可能讲给听众听"}, {"s": 4, "e": 8, "t": "宣布本周要诵读的正道经文是约伯记一章1至8节，并说明会坦然地看经文，遇到难解的部分尽可能加以解释"}, {"s": 9, "e": 13, "t": "约伯记一章记载，乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方人中为至大"}, {"s": 14, "e": 18, "t": "约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹来一同吃喝；筵席的日子过了，约伯打发人去叫他们自洁，清早起来按众人的数目献燔祭，因为恐怕儿子犯了罪、心中弃掉神，约伯常常这样行"}, {"s": 19, "e": 22, "t": "约伯记一章记载，有一天神的众子来侍立在耶和华面前，撒但也来到其中；耶和华问撒但从哪里来，撒但回答说自己从地上走来走去，往返而来"}, {"s": 23, "e": 25, "t": "耶和华问撒但有没有用心查看他的仆人约伯，说地上再没有人像约伯完全正直、敬畏神、远离恶事；随后说明本周只分享到这里"}, {"s": 26, "e": 29, "t": "会前祷告开头，求神使众人继续以他的话语为根基来崇拜他，在众圣徒中得着他当得的荣耀，并临格在他们中间，开通众弟兄姊妹的耳朵，使他们凡有耳的都能听"}, {"s": 30, "e": 33, "t": "求神把众先知使徒记在圣经上的福音、古旧的信仰以及他们所需用的一切知识一同赐给他们，使他们通达灵敏、得以认识神、一次得救，并使真信心在他们中间自己酝酿，使他们中间多结果子"}, {"s": 34, "e": 36, "t": "约伯记开篇的讲解分两个部分进行，用两个眼光来看这段经文，稍后还会把经文再打给会众。"}, {"s": 37, "e": 41, "t": "1至5节讲约伯的现实背景：先介绍约伯这个人，说他极为富有，有众多儿女、牛驴仆婢，是东方的大富户。"}, {"s": 42, "e": 48, "t": "6至8节讲约伯的属灵背景：他敬畏神、远离恶事，在天上得耶和华的认可，虽是被撒但控告的人，却是神非常认可的人。"}, {"s": 49, "e": 51, "t": "陈社炳自我介绍姓氏与称呼，并说明新的一年在此服侍的任务明确：抛开传统，把圣经里先知使徒的福音教导慢慢告诉会众，使这道成为敬拜的根基，不再另立别的根基。"}, {"s": 52, "e": 54, "t": "在自认为许可的范围内，与自己的教会同步信息，尽量保持同步；若认为某一周的信息不合适，就用最古老的一卷约伯记来跟大家慢慢开始。"}, {"s": 55, "e": 58, "t": "今天教会对福音的信仰通常更关注个人而不是国度，比较关注今生这几十年个人的祸福，却不关注将来的国度；因此到许多地方，也不得不先从个人层面的事谈起。"}, {"s": 59, "e": 63, "t": "约伯记不是传全备福音最好的一卷书，却能帮助消除从前比较顽固的观念，为领受真道预备所需的智慧；日后若有冒犯，也宁愿先用约伯记冒犯，因为福音本身对人的挑战更大。"}, {"s": 64, "e": 67, "t": "认识真道并不等于先跟认识苦难有关；约伯记是智慧书的第一卷，这一点不可忽略，人们提到约伯记常联想到苦难，但它的大主题其实是智慧，即认识耶和华的智慧。"}, {"s": 68, "e": 73, "t": "从1至5节提出第一个问题：世界上存不存在绝对的平安；许多在平安夜信耶稣的弟兄姊妹，把平安当作信基督教的第一诉求，所以先来谈平安这个话题。"}, {"s": 74, "e": 76, "t": "从6至8节提出第二个问题：如果一个人的信仰被上帝认可，是否意味着他这个人就会远离灾祸。"}, {"s": 77, "e": 79, "t": "如果曾对信仰中的祸与福作过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以对此稍作调整。"}, {"s": 80, "e": 83, "t": "引出约伯记1章1至5节，邀请读者看约伯近乎永久安稳的人生，并追问什么叫永久安稳的人生"}, {"s": 84, "e": 88, "t": "介绍背景：约伯记被认为是最早写成的一卷书，比创世记还早，约伯生活在很早的年代，可能比亚伯拉罕更早；随后进入经文，乌斯地有一个人名叫约伯"}, {"s": 89, "e": 93, "t": "约伯是乌斯地人，并非以色列人；他可能生活在族长时代之前、比亚伯拉罕更早，是认识独一真神的古代圣徒"}, {"s": 94, "e": 98, "t": "针对「旧约只有以色列人信上帝」的误会，指出并非如此，耶和华是全地的主、全人类的主，不是以色列人发明了耶和华"}, {"s": 99, "e": 105, "t": "举例说明亚伯拉罕之前已有人信耶和华：亚伯拉罕认识至高祭司、撒冷王麦基洗德，并向他纳十分之一；以东行邪术的巴兰也知道耶和华的名字"}, {"s": 106, "e": 114, "t": "独一神信仰不是从摩西才开始，该隐也认识耶和华；万族都知道耶和华，只是纯正信仰后来在一族人中被保全；早在约伯的年代，乌斯地已有一个非常敬畏上帝的人"}, {"s": 115, "e": 120, "t": "追问圣经为何收录约伯的故事、约伯记1章开篇为何要写1至5节，强调圣经没有一段细节是枉费白费的"}, {"s": 121, "e": 128, "t": "提问约伯记开篇要读者先明白什么，并以一般人的眼光设想：什么样的人、什么样的家庭绝不会出意外，通常认为是钱多、人多、资源多，遇事更能平事"}, {"s": 129, "e": 132, "t": "从描述看，作者突出约伯身上一个鲜明的特点，就是他和家庭的稳，按各个时代的眼光，他都是不会遭遇灾祸、能面对任何风险的人"}, {"s": 133, "e": 140, "t": "解释约伯记1章1至5节先交代约伯的稳，是因为他后面落到极大的灾难中，前面的绝对平安稳妥与后面的完全不安稳形成极大的落差"}, {"s": 141, "e": 144, "t": "指出读者可以用这个落差慢慢思考自己对耶和华信心的根基；许多老弟兄老姐妹即使没特别读懂约伯记，也知道约伯后来家破人亡、浑身疾病、躺在炉灰中"}, {"s": 145, "e": 149, "t": "提醒读约伯记1章1至5节时先不管后面的故事，不要带着「上帝视角」，因为知道太多反而会破坏读开头时应有的思路"}, {"s": 150, "e": 153, "t": "设想只看约伯记1章1至5节，如果在生活中遇到约伯这样的人，会不会认为他的家庭会出现变故，答案应该是不会"}, {"s": 154, "e": 168, "t": "列举人生动荡的风险因素：努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力；抗风险能力最强的人通常被认为最平安，人都有对生活不安稳的担忧和风险意识"}, {"s": 169, "e": 174, "t": "讲一般人对突然遭灾者的看法，即恶有恶报：一个家庭容易遭灾，可能因为抗风险能力低，也可能因为他是恶人、常在恶事里被反噬，所谓常在河边走难免不湿鞋"}, {"s": 175, "e": 184, "t": "约伯不是坏人；圣经首先给出他第一个稳健因素，即完全正直、远离恶事，也就是把他身上任何道德和违法犯罪所带来的风险彻底排除"}, {"s": 185, "e": 189, "t": "假设一个家庭作奸犯科、开赌场贩毒，人们会认为它迟早遭殃，因为身处恶势力、没有远离恶事又不正直，会招来灾祸；而约伯不是这样"}, {"s": 190, "e": 195, "t": "约伯完全正直、敬畏神、远离恶事；敬畏神这一点连耶和华都承认，说明他连属灵的、遭天谴的因素也排除了"}, {"s": 196, "e": 205, "t": "设想一个没干违法犯罪之事的好人，还可能因不信上帝、拜偶像、乱搞迷信、信仰上污秽而遭上帝愤怒的牵连，这是基于错误信仰的第二个不稳健因素"}, {"s": 206, "e": 211, "t": "约伯敬畏神、远离恶事、完全正直、生活上没有违法乱纪，因此从道德伦理、司法到信仰虔诚度的一切风险因素在他身上都不存在，他的敬畏且被上帝认可"}, {"s": 212, "e": 215, "t": "由约伯记1章1节可以认同约伯是好人、好弟兄、好虔诚人；但这样的家庭若还会遇到波折，那还有什么可能性的因素"}, {"s": 216, "e": 222, "t": "谈硬实力：人丁兴旺在古代社会乃至今天的农村都意味着家族势力比较大；以前的人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里比较稳健"}, {"s": 223, "e": 228, "t": "看约伯除虔诚之外的硬实力：约伯记1章2节记载他的家庭成员，他生了七个儿子、三个女儿，人丁相当兴旺，这成为家庭抗风险的第二把锁"}, {"s": 229, "e": 237, "t": "承接努力赚钱、积累人脉是为增加抗风险因素，看约伯记1章3节约伯的财富和地位：他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方为至大"}, {"s": 238, "e": 247, "t": "解释七千只羊意味着庞大的牧场，羊毛和羊奶在古代是丰厚的利润；圣经清晰交代约伯的收入来源，如同他的财务报表"}, {"s": 248, "e": 260, "t": "解释三千骆驼的用途：骆驼一般不吃，而是用来运货、走沙漠和丝绸之路，相当于今天的大货车，可见约伯的物流商贸做得非常大"}, {"s": 261, "e": 266, "t": "解释牛和驴用于耕地，可见约伯的田产也很大；再加上许多仆婢，他的牧场、物流和农业田产都非常大"}, {"s": 267, "e": 272, "t": "约伯的硬实力和产业丰厚到难以想象；圣经评价他「在东方为至大」，不是仅在乌斯地为至大，而是整个东方最顶配的人物"}, {"s": 273, "e": 278, "t": "讲约伯人生的落差：以「瘦死的骆驼比马大」反衬，只要上帝愿意、撒但插手，这样的人也会在炉灰里满身烂疮、哀叫连连，这是约伯记留下的残酷人生真相"}, {"s": 279, "e": 284, "t": "总结约伯在历史上的素描：他强盛到连一个城邦的君王都难做到，经济富可敌国、地位在东方为至大，是在东边具备国际影响力的人"}, {"s": 285, "e": 290, "t": "设想如果今天生活中认识约伯，人们不会觉得他有什么风险，遇到生病、买房这类事对他都是小问题，他是随时能够平事的人"}, {"s": 291, "e": 299, "t": "如果不看后面的内容，第一感觉会是约伯这个家庭这辈子不会出任何意外；理由明确：道德上他远离恶事、不惹事，信仰上他敬畏神、远离被上帝击打，硬实力上他像国际大佬，有事都办得到"}, {"s": 300, "e": 303, "t": "说今天最常喊人定胜天口号的就是这种已经手眼通天、站在至大地位的大佬，而许多人只有一点点钱就觉得自己可以上天"}, {"s": 304, "e": 312, "t": "有人不服气，提出豪门家庭的因素，说有钱人有有钱人的苦，豪门兄弟姐妹争夺家产、打得头破血流；这悲剧自古就有，但约伯家里并不是这样"}, {"s": 313, "e": 323, "t": "约伯记1章4节记载约伯的儿子按着日子各在自己家里设摆筵席，并请三个姐妹一同吃喝；说明约伯不但实力强、敬畏神，家里兄弟姐妹也感情极好、常常聚餐、其乐融融，不存在豪门争端"}, {"s": 324, "e": 328, "t": "加上最后一层保障：约伯对儿女的信仰教育也是顶级的；有人稍有点小钱就人定胜天，约伯做到那样的地位却活得警醒，甚至活在震惊之中"}, {"s": 329, "e": 338, "t": "解释约伯记1章5节：筵席的日子一过，约伯就打发儿女去自洁，并清早起来按众人的数目献燔祭，因为他恐怕儿女犯了罪、心中弃掉神；约伯常常这样行"}, {"s": 339, "e": 341, "t": "加上最后一层锁，归纳说这种人不可能出意外：从硬实力、自己的正直、家庭的和睦、经济，到对家庭的信仰看守，都是顶级中的顶级"}, {"s": 342, "e": 350, "t": "约伯不把儿女的聚餐当作只是吃一顿饭，他深深恐惧这些「富二代」儿子会不会弃掉神，所以一早起来按数目一一献燔祭、叫他们自洁，希望儿女像他一样敬畏神、远离恶事；连信仰教育都是顶配"}, {"s": 351, "e": 353, "t": "总结说约伯这个家庭从本人的信仰到子女的信仰，全部都在圣约的看守、上帝的看守之中"}, {"s": 354, "e": 359, "t": "讲约伯记的冲击力：一个这么敬虔又这么强大的家族，后来竟然家破人亡，人全部被杀光，唯一剩下的活口还满身烂疮、躺在炉灰里"}, {"s": 360, "e": 363, "t": "指出更难接受的一点：允许这件事发生的，竟不是撒但单方面，而是他们全家敬畏的那位耶和华允许撒但去做的"}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷（约伯记、箴言、诗篇、传道书、雅歌）很合适，因为若肯客观读约伯记，一定会倒掉之前喝下过的所有基督教鸡汤，打掉任何幻想"}, {"s": 371, "e": 379, "t": "若读懂约伯记，会看到约伯不只是硬实力强，更是全家敬虔、父亲在信仰上极其警醒，1章5节说他「常常这样行」；耶和华也认可他，但读第三章时，约伯却躺在炉灰中巴不得快死，极其痛苦"}, {"s": 380, "e": 385, "t": "说明读懂约伯记会获得的智慧，不是中国人所理解的厚黑、圆滑，而是让人倒掉一切曾喝下的基督教毒鸡汤和虚假的平安；没想清楚这个问题，就无法健全地认识福音"}, {"s": 386, "e": 390, "t": "说每个人对自己人生顺遂和稳健程度的评估都有具体标准；用约伯记1至5节整理：钱多、人多、势力大，再加上做人好、虔诚、家庭团结、敬畏神，似乎就内外无懈可击"}, {"s": 391, "e": 394, "t": "指出约伯不是偶尔这样，1章5节说他「常常这样行」；这样的人会出现意外吗？人们肯定认为不会"}, {"s": 395, "e": 398, "t": "以人们不会认为马斯克交不起房租作比，说约伯这种人与炉灰中的乞丐像两个物种、两种人，难以想象这两个形象最终重叠在一个人身上"}, {"s": 399, "e": 404, "t": "说这就是约伯记要告诉人的，到后面读约伯记就有真实答案；用以前的人生经验会回答这样的人不会出意外，但约伯记告诉人会，而且还非常非常会"}, {"s": 405, "e": 410, "t": "说作为人生安稳支柱的那些资源都可能瞬间失去；读完约伯记会发现，真正护住人的是一条看不见的篱笆，即耶和华看守的；身内身外之物全失去后，剩下的只有曾经敬畏耶和华的智慧和知识"}, {"s": 411, "e": 417, "t": "解释身外之物指钱、房产，生不带来死不带去，连衣服也算身外之物；但约伯连身内之物都没了，皮与骨都被撒但击打，皮囊已在炉灰中，快扛不住了"}, {"s": 418, "e": 420, "t": "说约伯即使如此仍表示，就算神杀他，他也要在炉灰中继续等候，只求神跟他说清楚为什么让他遭遇这些"}, {"s": 421, "e": 427, "t": "总结说，最终能够看守人的不是人自以为的抗风险因素和人生支架，因为它们说倒塌就倒塌；真正看守人的是耶和华圈上的四围篱笆，以及敬畏耶和华所积累的真知识和真智慧，那是发芽结果后丰收的果子"}, {"s": 428, "e": 431, "t": "说需要在约伯记一开始就预备好、接受这件事，清醒知道与神同行的几十年里许多事很可能会突然发生；只有在正确的预设之下，人才不会在苦难的年岁突然弃掉神"}, {"s": 432, "e": 439, "t": "说错误的期待会带来错误的信心，无法正确回应遭遇；若带着错误期待又想回应当下处境，只有两个危险做法：去掉福音或更改福音；就算不去掉福音，只要仍怀着错误期待来信，最终也要更改福音，接受不了纯正的东西"}, {"s": 440, "e": 444, "t": "讲约伯记第二章上帝对约伯的评价是「持守纯正」，即福音在乌斯地为至大时让他舒适，倒在炉灰中让他不舒适，他仍按原来的继续等候思想，哪怕困惑也不更改、不以口犯罪、不妄认上帝"}, {"s": 445, "e": 448, "t": "讲这些年在人生顺境逆境中总有人好意地劝信耶稣就是保平安、上帝大大祝福；面对这类话，以约伯记2章9节约伯对太太的话作为回应：从神手里得福，也从神手里受祸"}, {"s": 449, "e": 458, "t": "为约伯的妻子说话，认为她并非太坏：第一轮散尽家财、儿女死光时她没说啥，仍跟在约伯身边；直到第二轮约伯身体烂掉、骨头被击打、倒在炉灰中还祷告时，她才崩溃说「你仍然持守纯正吗？你弃掉神死了吧」"}, {"s": 459, "e": 466, "t": "说约伯妻子过不去的那关是「从神手里得福，就不能受祸吗」；约伯回应说「我们从神手里得福，不也受祸吗」，并说她说话像愚顽的妇人一样"}, {"s": 467, "e": 476, "t": "讲这些年无论顺境逆境，许多人都会说信耶稣绝对平安顺遂；回应是约伯的信仰告白，认从神手里得福也从神手里受祸，甘心愿意，这位上帝给福给祸都是他的上帝；但很多人按传统的宗教性会疑惑，得祸还信什么，没有人是为承认得祸来信耶稣的"}, {"s": 477, "e": 487, "t": "在第一层的结尾，借使徒保罗在罗马书的解释说明：万事互相效力，为人的救恩得益处；从神手里得福、受祸指的是人生际遇，万事包含祸与福，总有确定的益处，有时益处从祸里来，就是救恩的益处"}, {"s": 488, "e": 492, "t": "说破产、生病等事对今生无益，对永生却有益；要重新知道什么叫从神手里得福也受祸、万事互相效力为一个确定的益处，就是永生的益处，只有到达终点神才会擦去一切眼泪"}, {"s": 493, "e": 497, "t": "说跟随耶稣确实不是专门为今生保平安；不是说这辈子的事不重要，而是最终寻求的必须一开始就认识清楚，那是永恒的福乐，信耶稣一定是为追求这个而来的"}, {"s": 498, "e": 511, "t": "通俗地讲，信这辈子的苦难都会过去，而永恒的福乐永不会过去，永恒的咒诅也永不会过去；信耶稣与否会有永恒的结局，信徒处在暂存的九十年里，为了那不会废去的永恒，愿意接受现在的福与祸，只要它为救恩效力"}, {"s": 512, "e": 516, "t": "说最终一定会发现两套截然不同的福音：一套相信上帝只给福、不给祸；另一套相信上帝让人得福也让人得祸，都为儿女的救恩效力，两者绝对不一样"}, {"s": 517, "e": 526, "t": "说大部分人相信信耶稣就只给福、只有祝福没有灾祸；约伯的三个朋友正是按这套逻辑集体怀疑他，认为上帝只给信他的人祝福，所以约伯受祸必是干了坏事，后面的辩论都源于这套福音"}, {"s": 527, "e": 532, "t": "说这种观念上古在乌斯地就已存在，即上帝只给义人祝福，一旦受苦就不是义人、就是犯罪的人；所以三轮对话都在骂约伯，约伯则不断辩白自己整个人生没做任何对上帝不起的事"}, {"s": 533, "e": 540, "t": "总结第一套福音是绝对平安、没有灾祸、只有祝福；而所信的是从神手里得福也从神手里受祸，但这不代表上帝咒诅人，他给人永久的祝福，让万事为救恩互相效力；为了永恒的定局，上帝甚至可在短暂期间降祸，短暂的咒诅促成永久的祝福，对他的选民以色列也是如此"}, {"s": 541, "e": 546, "t": "说选择哪一套信仰、信心看向哪个方向，最终会走向不同的道路、结出不同的果子；劝人选择后一套，它并不残酷，因为与永恒不能废去的福祸相比，有得救智慧的人都知道怎么选；今生只要能促成那不可废去之福，就愿意接受上帝给的一切"}, {"s": 547, "e": 550, "t": "总结约伯记1章1至5节：约伯各方面都绝对稳固，不可能出现任何意外，这是为后面读约伯记作铺垫，但他最终还是出了意外"}, {"s": 551, "e": 556, "t": "由此得到最基本的认识：人生以前认为的一切抗风险稳固支架都不算数、会顷刻失去；最终看守人的只是耶和华为我们安扎的篱笆，身内身外之物全部失去后，剩下的只有通过敬畏耶和华的人生所积累的知识和智慧，那东西会开花结果"}, {"s": 557, "e": 571, "t": "从1-5节看得见的约伯家产与和睦，转向6-8节看不见的灵界；影响家庭乃至国家历史的是天上的场景，人所争取的物质资源其实很脆弱、影响有限，天上属灵领域的影响反而更大，转折始于第6节。"}, {"s": 572, "e": 581, "t": "解释「神的众子」即众天使聚集在耶和华面前，这场景如同君王听政的集会，并以康熙王朝、雍正王朝中皇帝上朝、众大臣侍立听政的早朝作比方。"}, {"s": 582, "e": 590, "t": "提出很多人不明白的困惑——撒但怎么也能到天上；解释撒但原本是堕落的天使，背叛了上帝，堕落后确实已不在神众子的队伍之中。"}, {"s": 591, "e": 597, "t": "提醒注意约伯记作者的措辞「神的众子在耶和华面前，撒但也来在其中」，指出作者在暗示撒但已经不是神的众子之一，所以才会用「也来」这样的说法。"}, {"s": 598, "e": 601, "t": "以高湖教会集会时「陈社炳也来在其中」为例，说明这话暗示来者本不属于该群体；神的众子是一个队伍，撒但是队伍中不协调的成员。"}, {"s": 602, "e": 604, "t": "结论是撒但已不是神的众子、不再是天使，也不在这次天上集会的合法成员之内，但他原本确实是受造的一种属灵气的活物。"}, {"s": 605, "e": 612, "t": "许多人更不理解的是，耶和华为何允许撒但来，还主动询问他「你从哪里来」、不把他赶走；因为这次搭话，约伯变得很惨，上帝的有些做法令人难以理解。"}, {"s": 613, "e": 618, "t": "给出结论：耶和华与撒但的对话不是搭讪也不是找茬，而是一次说话的授权，要表达的是撒但自始至终都在上帝的权下；神若不这样开口，撒但无法主动说话。"}, {"s": 619, "e": 629, "t": "针对「耶和华不是全知吗、为何还要问撒但从哪里来」的质疑，指出约伯记1章7节和2章2节上帝问的是同样的问题，说明这不是上帝困惑，而是在授权撒但回答。"}, {"s": 630, "e": 645, "t": "以皇帝上早朝时「有事启奏，无事退朝」为例，并类比公司开会、课堂、讲道现场，说明在别人的权柄之下不能主动发言、需要被授权；耶和华两次用同样句式发问，正是给撒但发言的授权。"}, {"s": 646, "e": 653, "t": "耶和华出于日后才揭晓的荣耀目的，给撒但一定的活动权限，但魔鬼完全在神的掌管之中；他两次攻击约伯都受耶和华权柄限制，不能伤身体、能伤身体却不能夺命，这种对邪恶的限制贯穿整卷约伯记。"}, {"s": 654, "e": 660, "t": "若确信撒但肆虐之时仍在上帝良善权柄的限制之下，神的儿女对上帝的期待、信心和安稳感就不只建立在脱离困境之后，也会建立在仍处困境之时，相信当下仍在上帝掌控中。"}, {"s": 661, "e": 667, "t": "约伯记1章8节耶和华主动称赞约伯完全正直、远离恶事，引发困惑：这岂不是主动引魔鬼攻击义人？撒但本就凶恶，若没注意约伯就该遮掩过去，为何还提醒他去看约伯、试探这位义人。"}, {"s": 668, "e": 677, "t": "读经感觉不痛快是因为不了解原来的表达，借此提出两个选择题：是耶和华主动要撒但注意约伯，还是撒但本来就在关注约伯，耶和华不过借他的邪恶授权并促成自己美善的计划。"}, {"s": 678, "e": 686, "t": "说明魔鬼不是全知全能的，全宇宙中只有耶和华上帝一位是全知、全能、全在；魔鬼似乎不受时间限制，从创世以前、始祖时就在，到如今还在，也不会老。"}, {"s": 687, "e": 694, "t": "魔鬼受空间限制，因第7节他自称「我从地上走来走去，往返而来」，说明他不能同时在两地，在东就不在西，不能认为魔鬼是全在的，全在的只有上帝。"}, {"s": 695, "e": 704, "t": "以耶稣「从天降下却仍在天的人子」为例，说明受空间限制的受造物只要在一处就不在另一处；唯有上帝在东也在西、贯乎众人之中，道成肉身仍在天，用全能命令托住万有，充满全地。"}, {"s": 705, "e": 714, "t": "耶和华问撒但从哪里来，撒但诚实地答「我从地上走来走去，往返而来」，表明他已不在天上，与在天上的神众子不同；他受空间限制，在东方就不在西方，必须走来走去。"}, {"s": 715, "e": 730, "t": "撒但既非全在也非全知，就得走到约伯身边；他后面能把约伯家的情况说得清楚，说明这些年他一直在约伯身边观察、盯着约伯，所以才会了解，这也印证他不是全知的活物。"}, {"s": 731, "e": 740, "t": "撒但两次质疑约伯敬畏神的缘由，耶和华两次允许试验；这两次质疑表明撒但对约伯内心的评估出了错，而上帝全知全能全在，对约伯「敬畏我、远离恶事」的评价不会错。"}, {"s": 741, "e": 747, "t": "撒但第一次质疑「岂是无故呢」，断言夺去约伯所有他必当面弃掉神；结果一切被夺去后，约伯却说赏赐和收取都在于耶和华、耶和华的名应当称颂，出乎撒但的意料。"}, {"s": 748, "e": 757, "t": "撒但第二次改口说「人以皮代骨」，击打约伯的身体他必弃掉神，结果约伯浑身烂疮仍持守纯正，撒但又错了；可见撒但对人的观察需要知识的积累，第一次以为是钱财，第二次以为是皮肉。"}, {"s": 758, "e": 764, "t": "撒但虽然厉害，信徒斗不过他，但绝不能把他放到与上帝掰手腕的位置；网络流传的耶稣与撒但掰手腕的图画是不可能的，撒但永远是受造的天使，在上帝面前处于权下姿态。"}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾毫无差错；而撒但需要在观察中评估人，评估可能出错，如圣经记载两次出错。日久见人心是有限受造物才需要的，耶和华从起初就知道约伯，撒但不全知也不全在。"}, {"s": 776, "e": 782, "t": "既然上帝完全认可约伯的敬畏，按理应把撒但赶走、保护约伯，可上帝竟两次允许约伯受祸，而且灾祸非常严重；大部分人想不明白，因为人总认为招灾的是恶人、义人必得福，约伯的三个朋友后面也持同样看法。"}, {"s": 783, "e": 792, "t": "约伯记讨论的主题是义人受苦、恶人亨通，这一主题在智慧书、诗篇、先知书中反复出现；人想象中的是义人得福、恶人受苦，圣经却诚实地指出义人可能受苦、恶人可能亨通，具备这种智慧才能有健全的信心。"}, {"s": 793, "e": 800, "t": "人选择任何宗教，都以保佑顺遂和福泽作为敬拜的理由，庙宇以灵验作招牌；甚至教会里听到的见证也几乎都是信耶稣后丰收了某些东西，没有人敢拿敬畏神后家破人亡来说事，觉得那是给上帝抹黑，但上帝自己就记载了这事。"}, {"s": 801, "e": 810, "t": "有人以约伯记结尾约伯双倍得回祝福来反驳，但路加福音财主和拉撒路比喻中的乞丐拉撒路至死没得回、长满烂疮，死后才在亚伯拉罕怀里；不能因约伯双倍得回就把最终盼望又变成祝福，义人可能受苦、恶人可能亨通才是上帝告诉人的实况。"}, {"s": 811, "e": 821, "t": "更重要的东西是：福音是不可废去之福，不是别的东西；中国老祖宗早有「好人不长命，王八活千年」的说法，坏人反倒家大业大，说明人通过观察也能懂得这个道理。"}, {"s": 822, "e": 829, "t": "对具体基督徒而言，不能因遭遇灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，如约伯；同样也不能因人顺风顺水就认可他的信仰，因为上帝可能并不认可他，圣经中也有这样的例子。"}, {"s": 830, "e": 838, "t": "指出信仰方式需要调整，指的其实是知识和认知；很多人却用人生顺遂来回应，如「家里买了三套房子」，这属于鸡同鸭讲，不要把处境当作信仰纯正度的证明；人用多年家庭和睦或事业高升公然拒绝反思信仰，是非常不好也遗憾的事。"}, {"s": 839, "e": 850, "t": "有的人明明找到真理，却因人生顺遂拒绝反思；有的人明明对了，却因突然遭灾开始怀疑自己，两个都不可取；用当下的环境来解释信仰的实质是一种误区，熟悉智慧书的基督徒都知道顺遂与祸福跟上帝是否认可一个人是两码事。"}, {"s": 851, "e": 858, "t": "举例说明：假设讲道前一天腿摔断、当天还拉肚子，有人说这是上帝在拦阻、不要去，另一拨人却说这是撒但拦阻、可见要去做神的工；同一件事、同一个现实，竟有两种解释。"}, {"s": 859, "e": 870, "t": "亲身经历印证：多年做关乎上帝的工作之前，身体常出问题，如发烧、骑车摔伤、磕到头；同一件事分出两拨人——一拨说生病是上帝拦阻、不要去，另一拨说生病是撒但拦阻、正是要去的证明，令人不知该听谁的。"}, {"s": 871, "e": 878, "t": "借物质的事指着灵界来论断就是愚昧；通常说上帝拦阻的人，是自己不想对方去，说撒但拦阻的人，是自己想去；可见人随私意解读，不只随私意解读圣经，也随私意解读环境。"}, {"s": 879, "e": 889, "t": "身上发生的事可能跟上帝的旨意没有关系，不要硬扯在一起；从约伯记可见天上的场景与地下的场景没有关系，所以环境不要成为信仰的第一参考标准，眼前显明的东西不代表背后属灵的实际，生病也不代表那人就是坏。"}, {"s": 890, "e": 898, "t": "今后要做一个最简单的调整，就是不要做属灵的「董王」，为弟兄姊妹解读他身上遭遇的属灵事实；这连传道人也不能，家庭处境和顺遂的问题不要来问，许多传道人自以为知道，其实不知道。"}, {"s": 899, "e": 910, "t": "能懂的只有上帝的话怎么说，而别人家里为什么这样无从得知；天上的场景是人的智慧不可企及、至高不能及的，人又不是先知，只能通过上帝的原则来告诉大家，使人在这本书上得着根基的稳固。"}, {"s": 911, "e": 918, "t": "天天借瞎猜神的意思教别人做事的，人或许以为是属灵人，圣经却称这种人为愚昧人；约伯的三个朋友后面会具体示范这种人——以利法、比勒达、琐法都言之凿凿地解释约伯的处境证明了上帝怎样看他，仿佛只有约伯不知道。"}, {"s": 919, "e": 922, "t": "若具备了智慧书的智慧，就能得到干净的皮袋子，用这皮袋好好装载新酒，不至于破裂；这是约伯记全部的信息。"}, {"s": 923, "e": 928, "t": "结尾回应一个疑问：既然不靠环境辨别，可多年来人都习惯以环境判断，事情做得不顺就认为不是上帝的旨意；这种看法不对，也不能走另一极端，认为越不顺越才是上帝的旨意，两者都不可取"}, {"s": 929, "e": 936, "t": "既然环境顺遂不是第一鉴别标准，那么第一鉴别标准就是上帝圣言的准则，即圣经66卷：遵行就是，违反就不是，无论环境顺遂与否。这才是根基所在，上帝怎么说永远是行动的最高准则，而不是个人或家庭的遭遇"}, {"s": 937, "e": 939, "t": "靠什么知道上帝对人真实的心意？答案还是这卷书，即圣经；也希望人的安全感能够建立在这上面"}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道；所能遭遇的最大祝福，则是上帝带领他进入真理，并赐给他永恒的福乐"}, {"s": 943, "e": 948, "t": "有人提出疑问：上帝所认可的人既然不出于刑罚，也不出于管教，上帝既不试炼、不行罚，又不讨厌他，为什么还允许这个人受祸？为此要用最后一段经文来作结"}, {"s": 949, "e": 959, "t": "约翰福音9章1至3节记载耶稣看见一个生来瞎眼的人，门徒问是谁犯了罪，是这人还是他父母；门徒一口认定天生瞎眼一定与罪有关，只是分不清是父母的罪还是儿子的罪，等于限定了耶稣的回答"}, {"s": 960, "e": 963, "t": "耶稣的回答出人意料：也不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来；可见这件事与罪无关，只与神的作为有关"}, {"s": 964, "e": 967, "t": "人向上帝提问时，常常只给上帝一道选择题，限定了他可能的回答；等到发现两个选项都不是，才明白与神的作为有关。圣经由此要求人对祸福、罪恶之间的关系，作出认知上的调整"}, {"s": 968, "e": 969, "t": "以祷告开始，求神带领，遵照神的话开始查考约伯记"}]}}, "order": ["v1", "v2", "v3", "v4"]}</script>

const state = {
  run: load('cmp-run', D.order[D.order.length - 1]),
  on: new Set(load('cmp-on', Object.keys(ST))),
  ch: load('cmp-ch', 'all'), onlyflag: load('cmp-onlyflag', false), showother: load('cmp-showother', true)
};
if (!D.runs[state.run]) state.run = D.order[D.order.length - 1];

document.getElementById('meta').innerHTML =
  `<span>源文件 <b>GH_伯1章1到8节（校对版）</b>，${D.lines.length} 行</span><span>gold <b>${esc(D.gold_name)}</b>，${D.gold_n} 段</span>` +
  D.order.map(k => { const s = D.runs[k].stats; return `<span>${esc(k)} <b>${esc(s.prompt)}</b> · ${esc(s.model)} · effort ${esc(s.effort)}</span>`; }).join('');

// ---- 版本切换
const runsel = document.getElementById('runsel');
runsel.innerHTML = D.order.map(k => `<button id="run-${k}" data-k="${k}">${esc(k)}</button>`).join('');
runsel.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.run = b.dataset.k; store('cmp-run', state.run); render(); });

// ---- 筛选
const chips = document.getElementById('chips');
chips.innerHTML = Object.entries(ST).map(([k,v]) =>
  `<button class="chip" id="chip-${k}" data-k="${k}" aria-pressed="true" title="${v.desc}"><span class="dot" style="background:var(${v.c})"></span>${v.name}<span class="n mono" id="n-${k}"></span></button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k; state.on.has(k) ? state.on.delete(k) : state.on.add(k); store('cmp-on', [...state.on]); render();
});
const sel = document.getElementById('chsel');
D.chapters.forEach(c => sel.insertAdjacentHTML('beforeend', `<option value="${c.no}">第${c.no}章（${c.s}–${c.e}）</option>`));
sel.value = state.ch;
sel.addEventListener('change', () => { state.ch = sel.value; store('cmp-ch', state.ch); render(); });
const onlyflag = document.getElementById('onlyflag'), showother = document.getElementById('showother');
onlyflag.checked = state.onlyflag; showother.checked = state.showother;
onlyflag.addEventListener('change', () => { state.onlyflag = onlyflag.checked; store('cmp-onlyflag', state.onlyflag); render(); });
showother.addEventListener('change', () => { state.showother = showother.checked; store('cmp-showother', state.showother); render(); });

// ---- 标题高亮
function marked(t, f) {
  const cls = [];
  f.ban.forEach(w => cls.push([w, 'ban']));
  f.per.forEach(w => cls.push([w, 'per']));
  f.dem.forEach(w => cls.push([w, 'dem']));
  if (!cls.length) return esc(t);
  cls.sort((a, b) => b[0].length - a[0].length);
  // 「」内直接引语不标人称
  const parts = t.split(/(「[^」]*」)/);
  return parts.map(seg => {
    const quoted = seg.startsWith('「');
    const list = cls.filter(([, c]) => !(quoted && c === 'per'));
    if (!list.length) return esc(seg);
    const re = new RegExp(list.map(([w]) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    let out = '', last = 0, m;
    while ((m = re.exec(seg))) {
      out += esc(seg.slice(last, m.index));
      const c = list.find(([w]) => w === m[0])[1];
      out += `<mark class="${c}">${esc(m[0])}</mark>`;
      last = m.index + m[0].length;
    }
    return out + esc(seg.slice(last));
  }).join('');
}
const hasFlag = f => f.ban.length || f.per.length;
function ftags(f) {
  const t = [];
  if (f.ban.length) t.push(`<span class="ft ban">禁用词 ${esc(f.ban.join('/'))}</span>`);
  if (f.per.length) t.push(`<span class="ft per">人称 ${esc(f.per.join('/'))}</span>`);
  if (f.dem.length) t.push(`<span class="ft dem">指示词 ${esc(f.dem.join('/'))}</span>`);
  return t.length ? `<span class="fl">${t.join('')}</span>` : '';
}

// ---- 渲染
const main = document.getElementById('main');
const open = new Set();
function render() {
  const R = D.runs[state.run], s = R.stats;
  const others = D.order.filter(k => k !== state.run);
  const near = R.near, nearRev = {};
  for (const k in near) nearRev[near[k]] = +k;
  const gStarts = new Set(D.gold.map(p => p.s)), pStarts = new Set();
  R.groups.forEach(g => g.p.forEach(p => pStarts.add(p.s)));

  D.order.forEach(k => document.getElementById('run-' + k).setAttribute('aria-pressed', k === state.run));
  Object.keys(ST).forEach(k => {
    document.getElementById('chip-' + k).setAttribute('aria-pressed', state.on.has(k));
    document.getElementById('n-' + k).textContent = s.groups[k] || 0;
  });

  // 摘要，附与另一版的差
  const ref = others.length ? D.runs[others[others.length - 1]].stats : null;
  const delta = (v, r, better) => {
    if (r === null || r === undefined) return '';
    const d = +(v - r).toFixed(3);
    if (!d) return `<span class="cmp flat">与 ${esc(others[others.length-1])} 持平</span>`;
    const good = better === 'up' ? d > 0 : d < 0;
    return `<span class="cmp ${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d} vs ${esc(others[others.length-1])}</span>`;
  };
  const same = s.groups.same || 0;
  document.getElementById('summary').innerHTML = [
    ['段数', `${D.gold_n} → ${s.pred_n}`, `gold → ${esc(state.run)}` + delta(s.pred_n, ref && ref.pred_n, 'down')],
    ['起止行完全一致的段', `${same}`, `占 gold 的 ${(same / D.gold_n * 100).toFixed(1)}%` + delta(same, ref && (ref.groups.same || 0), 'up')],
    ['边界完全命中 F1', `${s.f0[2]}`, `P ${s.f0[0]} · R ${s.f0[1]}` + delta(s.f0[2], ref && ref.f0[2], 'up')],
    ['边界 ±3 行 F1', `${s.f3[2]}`, `P ${s.f3[0]} · R ${s.f3[1]}` + delta(s.f3[2], ref && ref.f3[2], 'up')],
    ['标题含禁用词', `${s.ban}`, '讲者、讲员、作者、这段…' + delta(s.ban, ref && ref.ban, 'down')],
    ['标题含第一二人称', `${s.per}`, '我、我们、你、你们、咱' + delta(s.per, ref && ref.per, 'down')],
  ].map(([k,v,sub]) => `<div class="stat"><span class="k">${k}</span><span class="v mono">${v}</span><span class="s">${sub}</span></div>`).join('');
  document.getElementById('runinfo').innerHTML =
    `当前版本 <b>${esc(state.run)}</b>：${esc(s.prompt)} · ${esc(s.model)} · effort ${esc(s.effort)} · 输入 ${s.tok_in} tok / 输出 ${s.tok_out} tok · 含指示词的标题 ${s.dem} 段 · 超过 110 字 ${s.long} 段`;

  const tagGold = p => {
    if (p.s === 1) return '';
    if (pStarts.has(p.s)) return `<span class="d ok">起始行一致</span>`;
    if (p.s in nearRev) { const d = nearRev[p.s] - p.s; return `<span class="d pos">模型起于 ${nearRev[p.s]}（${d>0?'+':''}${d}）</span>`; }
    return `<span class="d miss">模型没在这里切</span>`;
  };
  const tagPred = p => {
    if (p.s === 1) return '';
    if (gStarts.has(p.s)) return `<span class="d ok">起始行一致</span>`;
    if (p.s in near) { const d = p.s - near[p.s]; return `<span class="d pos">gold 起于 ${near[p.s]}（${d>0?'+':''}${d}）</span>`; }
    return `<span class="d miss">gold 没在这里切</span>`;
  };
  const otherBlock = p => {
    if (!state.showother || !others.length) return '';
    return others.map(k => {
      const ov = D.runs[k].paras.filter(q => q.s <= p.e && q.e >= p.s);
      if (!ov.length) return '';
      const exact = ov.length === 1 && ov[0].s === p.s && ov[0].e === p.e;
      const rows = ov.map(q => `<div><span class="mono">${exact ? '<span class="same">同段</span>' : `行 ${q.s}–${q.e}`}</span>　${esc(q.t)}</div>`).join('');
      return `<div class="other"><span class="ol">${esc(k)} ${exact ? '' : '在这里的切法不同'}</span>${rows}</div>`;
    }).join('');
  };
  const paraG = p => `<div class="para"><div class="ph mono"><span class="rg">行 ${p.s}–${p.e}</span><span>${p.e-p.s+1} 行</span><span>节 ${esc(p.sec)}</span>${tagGold(p)}</div>
    <p class="pt">${esc(p.t)}</p><p class="pe">标题 ${[...p.t].length} 字</p></div>`;
  const paraP = p => `<div class="para"><div class="ph mono"><span class="rg">行 ${p.s}–${p.e}</span><span>${p.e-p.s+1} 行</span><span>节 ${esc(p.sec)}</span>${tagPred(p)}</div>
    <p class="pt">${marked(p.t, p.f)}</p>
    <p class="pe"><b>ending</b> ${esc(p.en)}　· 标题 ${[...p.t].length} 字 ${ftags(p.f)}</p>
    ${R.unc[p.s] ? `<p class="pu">模型拿不准此切点：${esc(R.unc[p.s])}</p>` : ''}${otherBlock(p)}</div>`;
  const source = g => {
    let rows = '';
    for (let i = g.s; i <= g.e; i++) {
      const mg = gStarts.has(i), mp = pStarts.has(i);
      rows += `<tr class="${(mg||mp) && i !== g.s ? 'cut' : ''}"><td class="n mono">${i}</td>
        <td class="m mono">${mg ? '<span class="mg">G</span>' : ''}${mp ? '<span class="mp">P</span>' : ''}</td><td>${esc(D.lines[i-1])}</td></tr>`;
    }
    return `<div class="src"><table>${rows}</table></div>`;
  };
  const strip = c => {
    const W = 1000, lo = c.s, hi = c.e + 1, x = n => 6 + (n - lo) / (hi - lo) * (W - 12);
    let out = `<line x1="6" x2="${W-6}" y1="27" y2="27" stroke="var(--rule)" stroke-width="1"/>`;
    [...gStarts].filter(b => b > lo && b <= c.e).forEach(b => {
      const col = pStarts.has(b) ? '--same' : (b in nearRev ? '--near' : '--mixed');
      out += `<line x1="${x(b)}" x2="${x(b)}" y1="6" y2="24" stroke="var(${col})" stroke-width="2"><title>gold 边界 ${b}</title></line>`;
    });
    [...pStarts].filter(b => b > lo && b <= c.e).forEach(b => {
      const col = gStarts.has(b) ? '--same' : (b in near ? '--near' : '--over');
      out += `<line x1="${x(b)}" x2="${x(b)}" y1="30" y2="48" stroke="var(${col})" stroke-width="2"><title>模型边界 ${b}</title></line>`;
      if (b in near) out += `<line x1="${x(near[b])}" x2="${x(b)}" y1="24" y2="30" stroke="var(--near)" stroke-width="1"/>`;
    });
    out += `<text x="6" y="60" font-size="10" fill="var(--faint)" font-family="JetBrains Mono,monospace">${lo}</text>`;
    out += `<text x="${W-6}" y="60" font-size="10" fill="var(--faint)" text-anchor="end" font-family="JetBrains Mono,monospace">${c.e}</text>`;
    return `<div class="strip"><div class="lg"><span>上排 gold 边界 · 下排 ${esc(state.run)} 边界</span>
      <span style="color:var(--same)">■ 同一行</span><span style="color:var(--near)">■ 差 1–3 行</span>
      <span style="color:var(--mixed)">■ gold 有、模型没切</span><span style="color:var(--over)">■ 模型多切</span></div>
      <svg viewBox="0 0 ${W} 64" preserveAspectRatio="none" role="img" aria-label="第${c.no}章边界对照">${out}</svg></div>`;
  };

  let html = '';
  for (const c of D.chapters) {
    if (state.ch !== 'all' && +state.ch !== c.no) continue;
    const gs = R.groups.filter(g => g.s >= c.s && g.s <= c.e);
    const shown = gs.filter(g => state.on.has(g.st) && (!state.onlyflag || g.p.some(p => hasFlag(p.f))));
    const tally = Object.keys(ST).map(k => [k, gs.filter(g => g.st === k).length]).filter(x => x[1]);
    html += `<section class="chapter" id="ch${c.no}"><div class="chead"><h2>第${c.no}章　${esc(c.t)}</h2>
      <span class="r mono">行 ${c.s}–${c.e} · gold ${gs.reduce((a,g)=>a+g.g.length,0)} 段 / ${esc(state.run)} ${gs.reduce((a,g)=>a+g.p.length,0)} 段 · ${tally.map(([k,n]) => ST[k].name + ' ' + n).join('，')}</span></div>`;
    html += strip(c);
    if (!shown.length) { html += `<p class="empty">这一章没有符合筛选条件的分组。</p></section>`; continue; }
    html += `<div class="cols"><span>分组</span><span style="color:var(--gold)">gold</span><span style="color:var(--pred)">${esc(state.run)}</span></div>`;
    for (const g of shown) {
      const t = ST[g.st], key = g.s;
      html += `<article class="group" style="--c:var(${t.c});--cb:var(${t.cb})">
        <div class="gl"><span class="badge">${t.name}</span><span class="grange mono">行 ${g.s}–${g.e}</span>
          <button class="toggle" data-k="${key}" aria-expanded="${open.has(key)}">${open.has(key) ? '收起原文' : '看原文'}</button></div>
        <div class="side gold"><span class="lbl" style="color:var(--gold)">gold</span>${g.g.map(i => paraG(D.gold[i])).join('')}</div>
        <div class="side pred"><span class="lbl" style="color:var(--pred)">${esc(state.run)}</span>${g.p.map(paraP).join('')}</div>
        ${open.has(key) ? source(g) : ''}</article>`;
    }
    html += `</section>`;
  }
  main.innerHTML = html;
}
main.addEventListener('click', e => {
  const b = e.target.closest('.toggle'); if (!b) return;
  const k = +b.dataset.k; open.has(k) ? open.delete(k) : open.add(k); render();
});
render();
})();
</script>
