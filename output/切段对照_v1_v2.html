神赐福的前因后果有过不正确认识的话，约伯记的开篇可以稍作调整", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 80, "e": 114, "st": "mixed", "g": [17, 18, 19, 20], "p": [{"s": 80, "e": 83, "t": "引出约伯记1章1至5节的经文，请听众先看约伯近乎永久安稳的人生，并提出问题：什么叫永久安稳的人生", "en": "请听众先看约伯近乎永久安稳的人生，并抛出「什么叫永久安稳的人生」这一问题", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 84, "e": 88, "t": "介绍约伯记的成书背景：这卷书是最早写成的一卷，比创世记还早，约伯生活在很早很早的年代，可能比亚伯拉罕还早，读者只要记住这一点即可", "en": "要点是约伯生活在很早很早的年代、可能比亚伯拉罕还早，随后引出第一节乌斯地有一个人名叫约伯", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 89, "e": 93, "t": "约伯是乌斯地的人，并非以色列人；他可能生活在更早的族长时代，甚至比亚伯拉罕更早，是一位认识独一真神的古代圣徒", "en": "约伯可能生活在更早的族长时代，甚至比亚伯拉罕更早，是一位认识独一真神的古代圣徒", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 94, "e": 98, "t": "针对「旧约只有以色列人信上帝」这一常见的误会，说明耶和华是全地的主、全人类的主，并非以色列人发明了耶和华", "en": "耶和华是全地的主、全人类的主，并非以色列人发明了耶和华", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 99, "e": 105, "t": "举例说明亚伯拉罕之前已有民族信耶和华：亚伯拉罕认识作为至高上帝祭司的撒冷王麦基洗德，麦基洗德还从他手里收十分之一；连行邪术的术士巴兰也知道耶和华的名字", "en": "巴兰虽是行邪术的，却也知道耶和华的名字", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 106, "e": 114, "t": "独一神信仰不是从摩西才开始，连该隐都认识耶和华；族长时代之前耶和华是全地的信仰，万族都知道，后来纯正的信仰才在一族之内被保全，而约伯的年代乌斯地已有一位非常敬畏上帝的人", "en": "万族都知道，只是纯正信仰后来在一族之内被保全，约伯的年代乌斯地已有敬畏上帝的人", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 115, "e": 121, "st": "same", "g": [21], "p": [{"s": 115, "e": 121, "t": "追问约伯记开篇1至5节的写作目的：圣经没有一段话的细节是枉费、白费的，作者要让读者在读后面的内容之前先明白一件什么事", "en": "圣经没有一段细节是枉费白费的，要读者在读后面内容前先明白一件事", "sec": "5.3", "f": {"ban": ["作者"], "per": [], "dem": []}}]}, {"s": 122, "e": 128, "st": "same", "g": [22], "p": [{"s": 122, "e": 128, "t": "请听众先不看圣经设想：在我们眼中什么样的人、什么样的家庭绝对不会出意外，通常的答案是人多一点、钱多一点、资源多一点", "en": "通常的答案是人多一点、钱多一点、资源多一点，这样的家庭更能平事", "sec": "5.3", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 129, "e": 144, "st": "mixed", "g": [23, 24], "p": [{"s": 129, "e": 133, "t": "从1至5节的描述看，作者突出约伯家庭极其鲜明的「稳」，按各个时代的眼光看，他都是绝不会出现灾祸、或有能力面对任何风险的人", "en": "按各个时代的眼光，他都是绝不会出现灾祸、有能力面对任何风险的人", "sec": "5.3", "f": {"ban": ["作者"], "per": [], "dem": []}}, {"s": 134, "e": 140, "t": "解释1至5节先交代约伯的稳固的原因：约伯后来落到极大的灾难中，绝对平安稳妥的开头与后面完全不安稳的处境形成非常大的落差", "en": "1至5节绝对平安的大背景与后面完全不安稳的处境形成非常大的落差", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 141, "e": 144, "t": "读约伯记来思考自己信心的根基：先不看后面的内容，老弟兄老姐妹也知道约伯后来遭殃，家破人亡、浑身疾病躺在炉灰中", "en": "就算没有特别读懂过约伯记，也知道约伯后来遭殃，家破人亡、浑身疾病躺在炉灰中", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 145, "e": 154, "st": "over", "g": [25], "p": [{"s": 145, "e": 149, "t": "读约伯记1至5节时先不管后面的故事，要避免今天年轻人所说的「上帝视角」，因为知道太多反而会破坏读开头时应该有的思维渠道", "en": "知道太多反而会破坏读开头时应该有的思维渠道", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 150, "e": 154, "t": "请听众设想：如果生活中遇到约伯这样的人，会不会认为他的家庭会出现什么变故，答案应该是不会", "en": "先看1至5节，问会不会认为他的家庭出变故，答案应该是不会，并追问约伯这种人可能遇到什么麻烦事", "sec": "5.4", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 155, "e": 174, "st": "mixed", "g": [26, 27], "p": [{"s": 155, "e": 158, "t": "提出问题：人生的动荡和困境有哪些风险因素，需要一样一样列举排列出来，这个话题放到哪个年代都不陌生", "en": "这个话题放到哪个年代去都不陌生", "sec": "5.4", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 159, "e": 168, "t": "说明努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力，而抗风险能力最强的人通常被认为是最平安、家庭不会有任何意外的人", "en": "抗风险能力最强的人通常被认为是最平安的人，所以我们都有对生活不安稳的担忧和风险意识", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 169, "e": 174, "t": "对突然遭遇灾祸的人，通常的看法是恶有恶报，坏人最不稳，因为常在恶事里；家庭容易出灾祸，可能因为抗风险能力低，也可能因为他是个常在河边走的恶人", "en": "家庭容易出灾祸，可能因为抗风险能力低，也可能因为他是常在恶事里被反噬的恶人", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 175, "e": 192, "st": "mixed", "g": [28, 29], "p": [{"s": 175, "e": 180, "t": "对照约伯记第一节追问：约伯是不是坏人，是不是一个常在河边走、很容易在恶事里遭到恶报的人，答案都不是", "en": "他不是一个常在河边走、容易在恶事里遭恶报的人，答案都不是", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 181, "e": 184, "t": "圣经首先介绍约伯第一个稳健的因素，即完全正直、远离恶事，也就是说任何道德和违法犯罪所带来的风险，在他身上都可以彻底排除", "en": "任何道德和违法犯罪所带来的风险，都可以在他身上彻底排除", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 185, "e": 192, "t": "假设一个家庭作奸犯科、开赌场贩毒，会认为它迟早因不正直和恶事招来灾祸；约伯却没有这些，他完全正直、敬畏神、远离恶事，道德和违法犯罪的因素都被排开", "en": "约伯没有这些，他完全正直、敬畏神、远离恶事，道德和违法犯罪的因素都被排开", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 193, "e": 205, "st": "same", "g": [30], "p": [{"s": 193, "e": 205, "t": "约伯敬畏神这一点连耶和华都承认，属灵的遭天谴风险也排开；所谓遭天谴，是指一个人虽是好人却不信上帝、拜偶像、乱搞迷信，因亵渎上帝而让家庭遭牵连", "en": "假设是好人却不信上帝、拜偶像、乱搞迷信，会因上帝的愤怒让家庭遭牵连，这是第二个不稳健因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 206, "e": 222, "st": "near", "g": [31, 32], "p": [{"s": 206, "e": 215, "t": "约伯在道德伦理、司法到信仰虔诚的一切风险因素都不存在，敬畏还被上帝认可，是一个真正的好人和好弟兄；这样内外无懈可击的家庭若还会遇到波折，就还需要追问别的因素", "en": "这样的家庭内外无懈可击，若还会遇到波折，那还有什么可能的因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 216, "e": 222, "t": "硬实力不够或太弱小是另一个风险因素：古代乃至今天农村，人丁兴旺都意味着家族势力大，以前人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里比较稳健", "en": "爷爷那辈的农村，家里儿子多、顶梁柱多，在村里就顶得住，比较稳健，很多人都有这么个观念", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 223, "e": 228, "st": "same", "g": [33], "p": [{"s": 223, "e": 228, "t": "转而看约伯的硬实力：第二节记载他的家庭成员，他生了七个儿子，还有三个女儿，人丁足够兴旺，这是他家庭抗风险的第二把锁", "en": "第二节记载他生了七个儿子，还有三个女儿，人丁足够兴旺，这是抗风险的第二把锁", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 229, "e": 237, "st": "same", "g": [34], "p": [{"s": 229, "e": 237, "t": "接续抗风险的话题，看约伯记第三节所记他的财富与地位：七千羊、三千骆驼、五百对牛、五百母驴，并有许多仆婢，这人在东方为至大，硬实力一看便知", "en": "他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，这人在东方为至大，财富、权势和国际地位这一节就交代了", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 238, "e": 247, "st": "same", "g": [35], "p": [{"s": 238, "e": 247, "t": "说明七千只羊意味着庞大的牧场，在古代羊毛和羊奶都是非常丰厚的利润；圣经一五一十地交代约伯的收入来源，就像一份财务报表", "en": "圣经一五一十地交代约伯的收入来源，这是他的财务报表", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 248, "e": 260, "st": "same", "g": [36], "p": [{"s": 248, "e": 260, "t": "说明三千骆驼在古代用于运货，相当于今天的大货车，它们走过沙漠和丝绸之路，可见约伯的物流商贸做得非常非常大", "en": "三千骆驼相当于三千辆大货车，可见他的物流商贸做得非常非常大", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 261, "e": 267, "st": "same", "g": [37], "p": [{"s": 261, "e": 267, "t": "耕地用的牛和驴说明约伯的田产也非常大，再加上许多仆婢，他的牧场、物流商贸和农业田产都很可观，硬实力丰厚到难以想象", "en": "牧场、羊毛羊奶、物流、牛驴仆婢的农业田产都非常大，硬实力丰厚到难以想象", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 268, "e": 284, "st": "mixed", "g": [38, 39], "p": [{"s": 268, "e": 272, "t": "圣经对约伯的评价是「在东方为至大」，注意不是乌斯地，而是说整个东方他都是最顶配的人物", "en": "他在整个东方是最顶配的人物", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 273, "e": 278, "t": "约伯这样的人后来竟会坐在炉灰里，说明瘦死的骆驼未必比马大：只要上帝愿意、撒但插手，这样强盛的人有一天会在炉灰里满身烂疮、哀叫连连", "en": "只要上帝愿意、撒但插手，这样的人有天会在炉灰里满身烂疮、哀叫连连", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 279, "e": 284, "t": "总结约伯在历史上的真实素描：他的经济富可敌国，不止乌斯地而是整个东方；地位上东方为至大，是在东边具备国际影响力的人", "en": "他的经济富可敌国，地位东方为至大，是在东边具备国际影响力的人", "sec": "5.8", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 285, "e": 303, "st": "mixed", "g": [40, 41], "p": [{"s": 285, "e": 290, "t": "设想今天若在生活中认识约伯，会不会觉得他有什么风险：生病、给儿子买房对你我是负担，对他却随时可以处理，一个随时能平事的人怎么会有不平安", "en": "对你我是负担的事，他随时可以处理，一个随时能平事的人怎么会有不平安", "sec": "5.8", "f": {"ban": [], "per": ["你", "我"], "dem": []}}, {"s": 291, "e": 299, "t": "若只看1至5节而不看后面的内容，会认为约伯这个家庭这辈子什么意外都不会有；理由是道德上他远离恶事，信仰上敬畏神远离被上帝击打，硬实力上则是国际大佬", "en": "道德上远离恶事，信仰上敬畏神远离被上帝击打，硬实力上则是今天所说的国际大佬", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 300, "e": 303, "t": "今天最常喊人定胜天口号的就是这种手眼通天、站在至大地位的大佬，用不着到约伯这种级别，许多人有一点点钱就觉得自己可以上天", "en": "用不着到这种级别，今天许多人有一点点钱就觉得自己可以上天", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 304, "e": 312, "st": "same", "g": [42], "p": [{"s": 304, "e": 312, "t": "针对「有钱人也有有钱人的苦」的不服气，承认豪门无情、兄弟姐妹争夺家产的悲剧自古确实有，但约伯家里并不是这样", "en": "承认豪门争夺家产的悲剧自古确实有，但约伯家里并不是这样", "sec": "5.9", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 313, "e": 323, "st": "over", "g": [43], "p": [{"s": 313, "e": 316, "t": "引约伯记第四节：约伯的儿子按着日子各在自己家里设摆筵席，打发人请了他的三个姐妹来，他们一同吃喝", "en": "约伯的儿子按着日子各在自己家里设摆筵席，请三个姐妹来一同吃喝", "sec": "5.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 317, "e": 323, "t": "约伯家不存在那种给豪门带来悲剧的争夺家产之争，兄弟姐妹感情非常好，常常聚餐、一同吃喝，其乐融融，根本不存在任何变数", "en": "兄弟姐妹感情非常好，常常聚餐、其乐融融，根本不存在任何的变数", "sec": "5.9", "f": {"ban": [], "per": [], "dem": ["那种"]}}]}, {"s": 324, "e": 338, "st": "over", "g": [44], "p": [{"s": 324, "e": 329, "t": "加上约伯的最后一层保障：他对儿女的信仰教育也是顶级的；今天有些人稍有点小钱已经人定胜天，约伯做到那样的地位却活在警醒甚至震惊之中", "en": "今天有些人稍有点小钱已经人定胜天，约伯做到那样的地位却活在警醒甚至震惊之中", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["那样"]}}, {"s": 330, "e": 338, "t": "引约伯记第五节：筵席的日子一过，约伯就打发儿女去自洁，又清早起来按众人的数目献燔祭，恐怕儿子犯了罪、心中弃掉神，并且约伯常常这样行", "en": "他怕儿子犯了罪、心中弃掉神，而且约伯常常这样行", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 339, "e": 379, "st": "mixed", "g": [45, 46, 47], "p": [{"s": 339, "e": 349, "t": "加上最后一层锁后，从硬实力、本人的正直、家庭的和睦、经济到对家庭的信仰看守都是顶级；约伯怀着深深的恐惧，怕这些富二代儿子会弃掉神，所以宴席一结束就一大早按数目一个一个献燔祭", "en": "约伯怕这些富二代儿子弃掉神，所以宴席一结束就一大早按数目一个一个献上燔祭，并叫他们自洁", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这些"]}}, {"s": 350, "e": 353, "t": "约伯连对儿女的信仰教育都是顶配：这个家庭从本人的信仰到下面子女的信仰，全部都在圣约、在上帝的看守之中", "en": "从本人的信仰到下面子女的信仰，全部都在圣约、在上帝的看守之中", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 354, "e": 359, "t": "约伯记的冲击力在于：这样敬虔又强大的家族，到后面居然会家破人亡，人全部被杀光，唯一剩下的活口还满身烂疮躺在炉灰里", "en": "人全部被杀光，唯一剩下的活口满身烂疮躺在炉灰里", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 360, "e": 363, "t": "更难接受的一点是允许这件事的是谁：虽然说是撒但攻击他，但允许撒但去做的，居然是他们全家所敬畏的那位耶和华", "en": "允许撒但去做的，居然是他们全家所敬畏的那位耶和华", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷很合适：若肯客观地读它，一定会倒掉之前喝下过的所有基督教鸡汤，打掉任何的幻想", "en": "若肯客观地读约伯记，一定会倒掉之前喝下过的所有基督教鸡汤，打掉任何幻想", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"s": 371, "e": 376, "t": "约伯家不只是硬实力强，更是全家敬虔，父亲信仰上没有一点不警醒，第五节说他常常这样行，整个家庭都在敬畏的氛围中，连耶和华也承认他完全敬畏、远离恶事", "en": "整个家庭都在敬畏的氛围中，连耶和华也承认他完全敬畏、远离恶事", "sec": "5.11", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 377, "e": 379, "t": "但往后读到第三章，约伯在炉灰之中说自己巴不得快点死掉，因为所有的事情都没了，他极其痛苦，这就是约伯的变化", "en": "约伯说自己巴不得快点死掉，因为所有的事情都没了，他极其痛苦", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 380, "e": 390, "st": "over", "g": [48], "p": [{"s": 380, "e": 385, "t": "读懂约伯记所获得的智慧不是中国人理解的厚黑、圆滑，而是真的倒掉一切曾经喝过的基督教毒鸡汤和虚假的平安；没想清楚这个问题就无法健全地认识福音", "en": "真正的智慧是倒掉基督教的毒鸡汤和虚假的平安，没想清楚就无法健全地认识福音", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 386, "e": 390, "t": "每个人对人生顺遂与稳健程度的评估都有具体标准：按约伯记1至5节整理，钱多、人多、势力大能轻易迈过难关，再加上做人好、虔诚、家庭团结、敬畏神，看起来总是内外无懈可击", "en": "钱多人多势力大，再加上做人好、虔诚、家庭团结、敬畏神，看起来总是内外无懈可击", "sec": "5.12", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 391, "e": 399, "st": "same", "g": [49], "p": [{"s": 391, "e": 399, "t": "约伯不是偶尔这样，而是第五节所说常常这样行；生活中真遇到这种人，你肯定认为他不会出意外，就像你不会认为马斯克交不起房租，这种人与普通百姓和炉灰中的乞丐完全是两个物种", "en": "就像你不会认为马斯克交不起房租，这种人与普通百姓和炉灰中的乞丐完全是两个物种", "sec": "5.12", "f": {"ban": [], "per": ["你"], "dem": ["这样", "这种"]}}]}, {"s": 400, "e": 410, "st": "over", "g": [50], "p": [{"s": 400, "e": 404, "t": "约伯记给出的答案与人生经验相反：这样的人会不会出意外，用以前的人生经验会说不会，但约伯记告诉你会，而且非常非常地会", "en": "用以前的人生经验会说不会，但约伯记告诉你会，而且非常非常地会", "sec": "5.12", "f": {"ban": [], "per": ["你"], "dem": ["这样"]}}, {"s": 405, "e": 410, "t": "作为安稳支柱的那些资源都有可能瞬间失去，最终能护住人的反而是耶和华为我们圈上看守的看不见的篱笆；连身外身内之物都失去后，能留下来的只有曾经敬畏耶和华的智慧和知识", "en": "连身外之物到身内之物都失去后，能留下来的只有曾经敬畏耶和华的智慧和知识", "sec": "5.13", "f": {"ban": [], "per": ["我们"], "dem": ["那些"]}}]}, {"s": 411, "e": 420, "st": "same", "g": [51], "p": [{"s": 411, "e": 420, "t": "解释身外之物指钱和房产，此生不带来、死不带去；但约伯连身内之物也没了，皮与骨都被撒但击打，仍说就算神杀他，他也要在炉灰中继续等他", "en": "约伯连皮与骨都被撒但击打，仍说就算神杀他，他也要在炉灰中继续等他", "sec": "5.13", "f": {"ban": [], "per": [], "dem": ["此"]}}]}, {"s": 421, "e": 427, "st": "same", "g": [52], "p": [{"s": 421, "e": 427, "t": "最终看守我们的不是自己想象的抗风险因素和人生支架，因为这些说倒塌就会倒塌；真正看守人的是耶和华为我们圈上的四维篱笆，以及敬畏耶和华积累的真知识真智慧，它发芽结果后要等神收割", "en": "剩下的是敬畏耶和华的真知识真智慧，它发芽结果之后等着神收割", "sec": "5.13", "f": {"ban": [], "per": ["我们"], "dem": ["这些"]}}]}, {"s": 428, "e": 444, "st": "mixed", "g": [53, 54], "p": [{"s": 428, "e": 433, "t": "需要在约伯记一开始就预备好，随时清醒地知道与神同行的这几十年有许多事很可能突然发生；只有在正确的预设之下，人才不会在苦难的年岁突然弃掉神，因为错误的期待往往带来错误的信心", "en": "只有在正确的预设之下，人才不会在苦难的年岁突然弃掉神，因为错误的期待带来错误的信心", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}, {"s": 434, "e": 439, "t": "带着错误的期待又想回应自己的遭遇，只有两个最危险的做法：要么去掉福音，要么更改福音；就算不肯去掉福音，只要还怀着错误的期待来信，也一样会更改福音，无法接受纯正的东西", "en": "就算不肯去掉福音，只要还怀着错误的期待来信，也一样会更改福音，无法接受纯正的东西", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}, {"s": 440, "e": 444, "t": "第二章上帝对约伯的评价是「持守纯正」：持守纯正就是福音在自己舒适时如此，如今倒在炉灰中不舒适了，仍按原来那个东西继续等候，哪怕困惑也不更改、不以口犯罪、不忘认上帝", "en": "持守纯正就是福音让自己不舒适时仍按原样继续等候，哪怕困惑也不更改、不以口犯罪、不忘认上帝", "sec": "5.14", "f": {"ban": [], "per": [], "dem": ["那个"]}}]}, {"s": 445, "e": 466, "st": "mixed", "g": [55, 56], "p": [{"s": 445, "e": 448, "t": "面对「信耶稣就是保平安、上帝大大祝福」这类好意的话，常用约伯记二章九节回应：我们从神手里得福，也从神手里受祸，这是约伯对他的太太说的", "en": "我常用约伯记二章九节回应，就是我们从神手里得福，也从神手里受祸，这是约伯对他太太说的", "sec": "5.15", "f": {"ban": [], "per": ["我们"], "dem": []}}, {"s": 449, "e": 458, "t": "许多人说约伯太太太坏，其实不然：第一轮散尽家财、儿女全死光时她什么也没说，仍跟在他身边，直到第二轮约伯身体烂掉、倒在炉灰中祷告时才崩溃劝他弃掉神，她已经非常难得", "en": "第二轮约伯身体烂掉、倒在炉灰中时她才崩溃劝他弃掉神，这个女人已经非常非常好了", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"s": 459, "e": 466, "t": "约伯太太所过不去的那一关是「不能受祸」：就算不得福、一个福也不给都行，但不能受祸；约伯回答她从神手里得福不也受祸吗，并责备她说话像愚顽的妇人", "en": "约伯回答从神手里得福不也受祸吗，并责备她说话像愚顽的妇人", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 467, "e": 487, "st": "mixed", "g": [57, 58], "p": [{"s": 467, "e": 472, "t": "这些年无论顺境逆境，许多人总说为上帝做事、信耶稣绝对平安顺遂；我的回应是打住，我认为从神手里得福，也从神手里受祸，这是我的信仰告白，我甘心如此，这位上帝给福给祸都是我的上帝", "en": "我认为从神手里得福也从神手里受祸，这是我的信仰告白，我甘心如此，这位上帝给福给祸都是我的上帝", "sec": "5.15", "f": {"ban": [], "per": ["我"], "dem": ["这些"]}}, {"s": 473, "e": 476, "t": "但很多人会疑惑：按照传统的宗教性，得祸你还信什么？没有一个人是为了承认得祸而来信耶稣的", "en": "没有一个人是为了承认得祸而来信耶稣的", "sec": "5.15", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 477, "e": 487, "t": "到了第一层的结尾，借助使徒保罗在罗马书的解释说明按这个眼光看约伯记的理由：万事互相效力，为人的救恩得益处；从神手里得福、受祸指人生的际遇，万事包含祸与福，有时益处正从祸里来，就是救恩的益处", "en": "万事互相效力，让人在救恩上得益处，有时那个益处正是从祸里面来的", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 488, "e": 492, "st": "same", "g": [59], "p": [{"s": 488, "e": 492, "t": "有些东西如破产、生病对人生无益，对永生却有益；万事互相效力，只为那一个确定的益处，就是永生的益处，因为只有到达这个终点，神才会擦去我们一切的眼泪", "en": "万事互相效力只要相信，最终就是永生的益处，到终点神才会擦去我们一切的眼泪", "sec": "5.16", "f": {"ban": [], "per": ["我们"], "dem": ["这个"]}}]}, {"s": 493, "e": 497, "st": "same", "g": [60], "p": [{"s": 493, "e": 497, "t": "跟随耶稣确实不是专门为了今生保平安；不是说这辈子的事不重要，但最终寻求的必须是永恒的福乐，信耶稣一定是为了追求这个而来", "en": "跟随耶稣不是专为今生保平安，最终寻求的是永恒的福乐，那里神会擦去我们一切的眼泪", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 498, "e": 511, "st": "under", "g": [61, 62], "p": [{"s": 498, "e": 511, "t": "今生的苦难几十年后都会过去，而永恒的福乐和永恒的咒诅都永久不会过去；信耶稣与否有一个永恒的结局，人却处在暂存状态，九十年后进入永恒不会废去的福与祸，为了这个我愿接受现在的福与祸，只要它为我的救恩效力", "en": "今生的福祸九十年以后清空，之后进入永恒不会废去的福与祸；为了这个我接受现在的福与祸，只要它为我的救恩效力", "sec": "5.16", "f": {"ban": [], "per": ["我"], "dem": ["这个"]}}]}, {"s": 512, "e": 540, "st": "mixed", "g": [63, 64, 65], "p": [{"s": 512, "e": 516, "t": "最终会看到两套截然不同的福音：一套相信上帝只给你福、不给你祸，另一套相信上帝让人得福、让人得祸都为儿女的救恩效力，二者绝对不一样", "en": "一套是上帝只给福不给祸，一套是福祸都为儿女的救恩效力，两者绝对不一样", "sec": "5.17", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 517, "e": 526, "t": "大部分人相信信耶稣绝对只有祝福没有灾祸，后来遇到无法解释的人生动荡，就只能不断怀疑自己是不是做错了什么；约伯的三个朋友正是这样集体怀疑他，认定上帝只给信他的人祝福，所以约伯受祸必定是干了坏事，后面的辩论都源于这种福音", "en": "所以约伯的三个朋友集体怀疑他，认为约伯受祸必是干了坏事，后面的辩论都源于这套福音", "sec": "5.17", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"s": 527, "e": 533, "t": "这种观念在上古乌斯地就已存在：上帝只给义人祝福，所以人一旦受苦就不是义人，就是犯罪的人，因此三轮对话都在骂约伯；第一套福音就是绝对平安、没有灾祸、只有祝福", "en": "所以三轮对话都在骂约伯，约伯不断辩解；第一套福音就是绝对平安、没有灾祸、只有祝福", "sec": "5.17", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 534, "e": 540, "t": "我们所信的是从神手里得福，也从神手里受祸；但这并不代表上帝咒诅我们，他会给我们一个永久的祝福，就是让万事为我们的救恩互相效力；为了永恒的定局，上帝甚至可以在短暂期间降祸，对以色列整个部族也是如此", "en": "为了永恒的定局，上帝甚至可以在短暂期间降祸，对以色列整个部族也是如此，短暂咒诅促成永久祝福", "sec": "5.17", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 541, "e": 546, "st": "same", "g": [66], "p": [{"s": 541, "e": 546, "t": "选择哪一套信仰，信心看向不同的方向，最终会走向不同的道路、结出不同的果子；后一套福音并不残酷，有得救智慧的人都知道怎么选，在今生只要能促成不可废去之福，我们愿意接受上帝给我们的任何东西，这就是1至5节所说的", "en": "今生只要能促成不可废去之福，我们愿意接受上帝给我们的任何东西，这就是1至5节所说的", "sec": "5.17", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 547, "e": 556, "st": "near", "g": [67, 68], "p": [{"s": 547, "e": 550, "t": "总结约伯记1至5节：绝对的稳固是为后面读约伯记做铺垫，约伯方方面面都不可能出现任何意外，但他还是出了意外", "en": "约伯方方面面都不可能出现任何意外，但他还是出了意外", "sec": "5.18", "f": {"ban": [], "per": [], "dem": []}}, {"s": 551, "e": 556, "t": "由此得到一个最基本的认识：以前认为的一切抗风险的稳固支架都不算数，都会顷刻失去；最终能够看守我们的只是耶和华为我们安扎的篱笆，身内身外之物全都失去以后，剩下的只有敬畏耶和华的人生所积累的知识和智慧，它会开花结果", "en": "身内身外之物全都失去以后，剩下的只有敬畏耶和华的人生所积累的知识和智慧，它会开花结果", "sec": "5.18", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 557, "e": 581, "st": "mixed", "g": [69, 70, 71], "p": [{"s": 557, "e": 571, "t": "承接1至5节人所看得见的约伯家产，转入天上关乎约伯家庭的事：影响人家庭甚至国家历史的，往往是看不见的天上场景，人所争取的物质资源影响力其实没那么大，这一转折点始于第6节", "en": "从看不见的天上场景转到人的家庭，天上属灵领域远比人所争取的资源更能影响历史中的人", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 572, "e": 581, "t": "神的众子聚集在耶和华面前，众子就是众天使，大家齐聚在耶和华面前；这场景如同君王听政的集会，好比皇帝坐在上面、众爱卿站在下面的早朝", "en": "这个集会就像皇帝坐在上面、众大臣站在下面的早朝", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 582, "e": 604, "st": "mixed", "g": [72, 73], "p": [{"s": 582, "e": 587, "t": "很多人不明白撒旦怎么也跑到天上来了，其实撒旦原是堕落的天使，他原本就是这种属灵的活物，只是背叛了上帝", "en": "撒旦原是这种性质的活物，只不过背叛了上帝", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这种"]}}, {"s": 588, "e": 597, "t": "撒旦本来是天使，堕落以后已不在神的众子队伍之中，作者却用「也来在其中」的措辞，暗示撒旦已经不是神的众子之一，读者若对中文敏感就能察觉", "en": "撒旦已经不是神的众子之一了，作者用「也来在其中」的措辞在暗示这一点", "sec": "6.1", "f": {"ban": ["作者"], "per": [], "dem": []}}, {"s": 598, "e": 604, "t": "以高湖教会集会中陈世美也来在其中为例，说明撒旦是众子队伍中一个不协调的成员，他已经不是神的众子，不在集会的合法成员之内，但原本确是受造的属灵活物", "en": "撒旦不在集会的合法成员之内，已经不是天使，但原本确是受造的属灵活物", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 605, "e": 629, "st": "near", "g": [74, 75, 76], "p": [{"s": 605, "e": 612, "t": "许多人更不理解第7节：既然允许撒旦来，为何不把他赶走，耶和华反而主动询问他从哪里来？不少人因耶和华与撒旦搭话而困惑，觉得上帝有些做法很难理解", "en": "很多人困惑，问他搭话搞得约伯这么惨，上帝有些做法很难理解", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 613, "e": 618, "t": "这不是一次搭讪，也不是一次找茬，而是一次说话的授权；它要表达的是撒旦自始至终都在上帝的权下，神若不这样讲，撒旦根本没有办法主动开口", "en": "神若不这样讲，撒旦没有办法主动开口，撒旦自始至终都在上帝的权下", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 619, "e": 629, "t": "有人质疑耶和华询问撒旦，难道全知的上帝还有不知道的事？但第7节和约伯记2章2节上帝问的是同样的问题，可见这不是上帝困惑，而是让撒旦回答他，是一种说话的授权", "en": "耶和华是让撒旦回答他，这是一种说话的授权", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 630, "e": 640, "st": "same", "g": [77], "p": [{"s": 630, "e": 640, "t": "以皇帝上早朝时大臣太监视说「有事启奏，无事退朝」为例，说明在权柄底下不能突然站起来主动说话；正如在公司跟领导开会、小孩在课堂上，权柄是无形的，你在我的权柄底下要说话也得举手，经我授权才能讲", "en": "你们在我的权柄底下，要说话得举手，我授权你才能站起来讲话", "sec": "6.2", "f": {"ban": [], "per": ["你", "我"], "dem": []}}]}, {"s": 641, "e": 646, "st": "same", "g": [78], "p": [{"s": 641, "e": 646, "t": "耶和华集会时撒旦不可能冲进去主动开口，他往返而来时，耶和华主动用「你从哪里来」的语式给他一个发言的授权，撒旦才得到说话的权利，否则他连说话的资格都没有", "en": "耶和华主动发问给撒旦发言的授权，否则他在上帝面前连说话的资格都没有", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 647, "e": 653, "st": "same", "g": [79], "p": [{"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给撒旦一定的活动权限让他说话；魔鬼完全在神的掌管之中，攻击约伯时必须被耶和华的权柄限制，第一次不能伤他身体，第二次能伤身体却不能夺命，这种对邪恶的限制贯彻整个约伯记", "en": "对邪恶的限制会贯彻整个约伯记，第一次不能伤他身体，第二次能伤但不能夺命", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 654, "e": 660, "st": "same", "g": [80], "p": [{"s": 654, "e": 660, "t": "若确知撒旦肆虐的当下正被上帝良善的权柄限制，神的儿女对上帝的期待和安稳感就不只建立在脱离困境之后，也建立在困境之中，因为相信当下仍在上帝掌控之中，就不会有任何不安稳感", "en": "因为你相信当下还在被上帝掌控着，就不会有任何不安稳感", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 661, "e": 694, "st": "near", "g": [81, 82, 83, 84], "p": [{"s": 661, "e": 669, "t": "第8节耶和华主动称赞约伯完全正直、远离恶事，引发困惑：这不是主动引魔鬼攻击义人吗？撒旦本没注意约伯，上帝反而提醒他去看，岂不是勾引他去试探？读圣经感觉不痛快，往往是因为不了解它原来的表达", "en": "读圣经给人感觉不痛快，是因为不太了解它原来的表达，我们可以借这个来思考", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 670, "e": 677, "t": "提出两个选择题请听众判断：是耶和华主动要撒旦注意约伯，还是撒旦本来就在关注约伯？也就是上帝主动说地上有个约伯让他去看、撒旦要试一试他，还是耶和华借着撒旦的邪恶授权他、促成自己美善的计划", "en": "耶和华主动借撒旦的邪恶授权他，并促成自己美善的计划，问听众是哪一种", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 678, "e": 686, "t": "教会大部分时间都在介绍上帝，极少介绍魔鬼；需要知道魔鬼不是全知全能，全宇宙中只有耶和华一位全知、全能、全在，这段圣经有证据；魔鬼好像不受时间限制，从创世以前就在，不会老", "en": "魔鬼好像不受时间限制，从创世以前、始祖的时候就在，不会老", "sec": "6.4", "f": {"ban": ["这段"], "per": [], "dem": []}}, {"s": 687, "e": 694, "t": "但魔鬼受不受空间限制？他受，因为第7节魔鬼自己说「我从地上走来走去，往返而来」，可见他受空间限制；如果他在东方就一定不在西边，不能认为魔鬼是全在的，全在只有一位就是上帝", "en": "不能认为魔鬼是全在的，全在只有一位就是上帝", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 695, "e": 704, "st": "over", "g": [85], "p": [{"s": 695, "e": 700, "t": "以耶稣所说「从天降下却仍就在天的人子」为例，说明宇宙中没有这样的存在物，除了上帝，人只要在这里就不在那边，受空间限制，要去那边只能从这里走过去，往返而来", "en": "这是受空间限制的活物，要去那边只能从这里走过去", "sec": "6.4", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 701, "e": 704, "t": "上帝却可以说我在东也在西，超乎众人之上，贯乎众人之内，也住在众人之间；他道成肉身仍在天，用全能的命令托住万有，不需要往返，他充满全地", "en": "他不需要往返，他充满全地，是耶和华的荣耀", "sec": "6.4", "f": {"ban": [], "per": ["我"], "dem": []}}]}, {"s": 705, "e": 720, "st": "over", "g": [86], "p": [{"s": 705, "e": 711, "t": "上帝问撒旦从哪里来、从什么空间来、是什么样的活物；撒旦诚实地回答从地上来，因为他已经不在天上了，神的众子在天上，撒旦却从地上来，走来走去、往返而来", "en": "神的众子在天上，撒旦从地上来，走来走去往返而来", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 712, "e": 720, "t": "之所以要介绍撒旦受空间限制，是因为他在东方就不在西方，得走来走去；他后面能把约伯的状况说得那么清楚，说明这些年他就在约伯身边，撒旦不是全在也不是全知，因此他必须走到约伯身边", "en": "他既然不是全在也不是全知，就一定要走到约伯身边", "sec": "6.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 721, "e": 730, "st": "same", "g": [87], "p": [{"s": 721, "e": 730, "t": "撒旦对约伯了解不了解？人常把魔鬼看得太厉害了；第9节之后撒旦说出约伯家里的情况，问约伯敬畏神岂是无故、难道不是四面圈上篱笆保护他吗？这些事撒旦知道，他不是全知者，却能知道，因为他一直在约伯身边盯着这个人", "en": "撒旦不是全知者，却能知道约伯家的情况，因为他一直在约伯身边盯着这个人", "sec": "6.5", "f": {"ban": [], "per": [], "dem": ["这个", "这些"]}}]}, {"s": 731, "e": 740, "st": "same", "g": [88], "p": [{"s": 731, "e": 740, "t": "撒旦对约伯敬畏神的原因表达了两次质疑，耶和华两次都允许他试验，但这两次质疑透露出撒旦对约伯内心的评估出错了；上帝全知全能全在，也全然无误，他对约伯的评价是敬畏我、远离恶事，不会错", "en": "上帝全知全能全在，对约伯的评价是敬畏我、远离恶事，不会错", "sec": "6.6", "f": {"ban": [], "per": ["我"], "dem": []}}]}, {"s": 741, "e": 749, "st": "same", "g": [89], "p": [{"s": 741, "e": 749, "t": "撒旦第一次说约伯敬畏神岂是无故，夺去他所有的他必当面弃掉神，结果没有发生，约伯反而说赏赐和收取都在耶和华、耶和华的名应当称颂；撒旦第二次改口说人以皮代骨、击打他身体他必弃掉神，第二次又错了，约伯浑身烂疮之后依然持守纯正", "en": "第二次又错了，因为约伯浑身烂疮之后依然持守纯正", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 750, "e": 757, "st": "same", "g": [90], "p": [{"s": 750, "e": 757, "t": "撒旦两次出错，上帝会不会两次出错？不会；这说明撒旦对人的观察需要知识的积累，他先认为约伯是因钱财才敬畏神，钱财拿掉却发现约伯仍敬畏神，又评估应该是皮肉，结果又错了", "en": "他又评估应该是皮肉，骨头又错了", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 758, "e": 775, "st": "near", "g": [91, 92], "p": [{"s": 758, "e": 764, "t": "撒旦很厉害，人搞不过他，但千万不要把他放成能跟上帝掰手腕的角色；网上有耶稣和撒旦在桌上掰手腕的图，他怎么可能跟上帝坐到一张桌子上，他永远是在上帝权下的姿态，受造的天使再高级也不可能是耶和华这样", "en": "他这种受造的天使，以前再高级，也不可能是耶和华这样", "sec": "6.6", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾没有出现任何差错；人在神面前赤露敞开，在撒旦面前却不是，撒旦需要长期观察，评估可能出错，圣经记载他对约伯的评估两次出错；只有有限的受造物才需要日久见人心，耶和华从开始就知道约伯透透的，撒旦却既不周全了解他，又想试探他", "en": "撒旦不全知也不全在，对约伯也不全然了解，但他在约伯旁边，本身就想试探约伯", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 776, "e": 793, "st": "mixed", "g": [93, 94], "p": [{"s": 776, "e": 782, "t": "上帝完全认可约伯对他的敬畏，按理该直接赶走撒旦、保护约伯，可他居然两次允许约伯受祸，而且灾祸非常严重；这是大部分人想不明白的，因为人总认为招灾的一定是恶人，义人一定要得福，约伯的三个朋友后面也都这样认为", "en": "这是大部分人想不明白的，因为我们认为招灾的一定是恶人，义人一定要得福", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 783, "e": 786, "t": "约伯记才刚开始，这卷书讨论了一个非常需要讨论的主题，就是义人受苦、恶人亨通的怪单", "en": "就是义人受苦、恶人亨通这个主题", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 787, "e": 793, "t": "义人受苦恶人亨通在智慧书、诗篇、先知书中反复出现，人想象的是义人得福、恶人受苦，圣经却诚实地告诉人间的处境；但这不必然，义人有可能受苦，恶人有可能亨通，具备这种智慧，你就会具备健全的信心", "en": "具备这种智慧，你喝不下基督教的毒鸡汤，也会具备健全的信心", "sec": "6.7", "f": {"ban": [], "per": ["你"], "dem": ["这种"]}}]}, {"s": 794, "e": 829, "st": "mixed", "g": [95, 96, 97, 98], "p": [{"s": 794, "e": 800, "t": "正常人选择任何宗教，都以保佑顺遂和福泽作为敬拜的理由，哪个宗庙不以灵验作招牌；基督教听来的见证也基本清一色是信耶稣后丰收了某些东西，没人敢拿敬畏神后家破人亡来说事，因为那像是给上帝抹黑，但上帝自己就记载了这个事", "en": "你总觉得给上帝抹黑，但上帝自己就记载了这个事", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 801, "e": 810, "t": "有人拿约伯记结尾说他双倍得回祝福来反驳，但圣经中有一位跟约伯类似的人物至死没得回，就是路加福音财主和拉撒路比喻中的乞丐拉撒路，他长烂疮、狗舔他的疮，死后在亚伯拉罕的怀里；不要因约伯双倍得回就以为最终盼望又变成祝福，义人可能受苦、恶人可能亨通，是上帝告诉你的", "en": "义人可能受苦、恶人可能亨通，是上帝告诉你的，在这个不正常的世界，你的人生可能这样", "sec": "6.7", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 811, "e": 814, "t": "更重要的东西是：福音是这几十年所传的不可废去之福，我们的福音就是这个，不是别的东西", "en": "我们的福音是不可废去之福，不是别的东西", "sec": "6.8", "f": {"ban": [], "per": ["我们"], "dem": ["这个"]}}, {"s": 815, "e": 821, "t": "中国老祖宗有一句话叫「好人不长命，王八活千年」，王八指的就是坏人；坏人怎么反而家大业大，老祖宗通过观察就懂得这个道理", "en": "老祖宗通过观察，都懂得这个道理", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 822, "e": 829, "t": "由此得出一个重要的事：不能因为灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，约伯就是例证；同样也不能因一个人顺风顺水就认可他的信仰，因为上帝可能不认可他，圣经中亦有这种例子", "en": "你也不能因这个人顺风顺水就认可他的信仰，因为上帝可能不认可他", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 830, "e": 850, "st": "mixed", "g": [99, 100], "p": [{"s": 830, "e": 835, "t": "当说信仰的方式需要调整，指的是知识和认知，很多人却用人生顺遂来回应，说自己家里买了三套房子，这跟神学有误是鸡同鸭讲；不要把处境放在自己信仰的纯正度上", "en": "所以不要把处境放在自己信仰的纯正度上", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 836, "e": 842, "t": "人对福音的误解会导致完全错信一场，有人因为多年家庭和睦或事业高升而公然拒绝反思自己的信仰；有些人明明找到了真理，却因人生顺遂拒绝反思；也有人明明对了，却因遭灾开始怀疑自己", "en": "有的人明明对了，却因遭灾开始怀疑自己", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 843, "e": 850, "t": "两个都不可取，智慧书一定给你带来智慧，所谓智慧是在环境中认识上帝的智慧；用当下环境来解释信仰的实质是一种误区，熟知智慧书的基督徒不会这样讲，因为顺遂与祸福跟上帝对你的认可与否是两码事，光这一点就有很多人陷在愚昧里", "en": "顺遂与祸福跟上帝对你的认可与否是两码事，光这一点愚昧很多人都有", "sec": "6.8", "f": {"ban": [], "per": ["你"], "dem": ["这样"]}}]}, {"s": 851, "e": 889, "st": "mixed", "g": [101, 102], "p": [{"s": 851, "e": 858, "t": "举例说明：假设我今天要来你们教会讲道，昨天腿摔断了，今早还连续拉肚子；有人说你不能去，因为上帝在拦阻你，也有人说你要坚持去，这是撒旦在拦阻，可见你要做成神的工；同一件事、同一个现实，却能得出两种解释", "en": "一件事一个现实，你会得出两种解释", "sec": "6.9", "f": {"ban": [], "per": ["你", "你们", "我"], "dem": []}}, {"s": 859, "e": 864, "t": "这不是虚构，是真实经历：十多年来要做一件关乎上帝的工作之前，身体常出现看得见的问题，发烧、腿受伤、骑车摔了、头磕了；结果同一件事居然分出两拨人，给出两种解释", "en": "同一件事居然分出两拨人，给出两种解释", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 865, "e": 872, "t": "一拨人说你生病了，看来上帝拦阻、上帝不喜欢，你不要去；另一拨人说生病了看来撒旦拦阻，撒旦拦阻就是上帝喜欢，你要去；那到底听谁的？借着物质指着灵界来论，这叫做愚昧", "en": "借着物质指着灵界来论，这叫做愚昧", "sec": "6.9", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 873, "e": 878, "t": "真相是：一般说上帝拦阻你的人，通常是自己不想我去；一般说撒旦拦阻的人，其实自己想我去；人随私意解读，不只会随私意解读圣经，还会随私意解读环境", "en": "人随私意解读，不只会解读圣经，还会解读环境", "sec": "6.9", "f": {"ban": [], "per": ["你", "我"], "dem": []}}, {"s": 879, "e": 884, "t": "我身上所发生的事，可能跟上帝的旨意没有半毛钱关系，不要硬扯在一起，有时有有时没，不一定非要去对应；从约伯记就会发现，天上的场景和地下的场景完全没什么关系", "en": "从约伯记就会发现，天上的场景和地下的场景完全没什么关系", "sec": "6.9", "f": {"ban": [], "per": ["我"], "dem": []}}, {"s": 885, "e": 889, "t": "环境不要成为我们信仰的第一参考标准，因为有些时候在你眼前显明的东西，不表示背后属灵的实际；你生病不代表这个人就是坏，解读上帝的旨意不要这样", "en": "你眼前显明的东西不一定表示背后属灵的实际，你生病不代表这个人就是坏", "sec": "6.9", "f": {"ban": [], "per": ["你", "我们"], "dem": ["这个", "这样"]}}]}, {"s": 890, "e": 922, "st": "mixed", "g": [103, 104, 105], "p": [{"s": 890, "e": 898, "t": "约伯完全没有得罪神，1至5节的安稳却被6至8节认可他的上帝打破；至少今天做一个最简单的调整：不要做那种属灵的懂王，好像能为弟兄姊妹解读他身上发生的一切属灵事实，你何德何能，传道人又何德何能；家庭的处境和顺遂不要来问我，许多传道人都自以为知道，我认为我不知道，也不认为他们知道", "en": "天底下许多传道人都认为他们知道，我认为我不知道，也不认为他们知道", "sec": "6.10", "f": {"ban": [], "per": ["你", "我"], "dem": ["那种"]}}, {"s": 899, "e": 906, "t": "我们能懂的只有上帝的话是怎么说的，这个可以告诉你；但你家里为什么这样，我怎么知道？天上的场景是我们的智慧所不可企及、至高不能及的，我们又不是先知", "en": "天上的场景是我们的智慧不可企及、至高不能及的，我们又不是先知", "sec": "6.10", "f": {"ban": [], "per": ["你", "我", "我们"], "dem": ["这个", "这样"]}}, {"s": 907, "e": 910, "t": "我只能通过上帝的原则来告诉大家，希望大家安稳在其上，在这本书上你会得到非常安稳的人生；这不是直接的安稳，而是整个救恩根基的稳固，风吹雨打也不在沙土上，绝不动摇", "en": "有整个在救恩上根基的稳固，风吹雨打也不在沙土上，绝不动摇", "sec": "6.10", "f": {"ban": [], "per": ["你", "我"], "dem": []}}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天通过瞎猜教别人做事的这种人，或许你们认为是属灵人，但圣经称这种人为愚昧人，希望约伯记至少让我们避免成为这种人；后面三个朋友会具体示范什么叫这种人，他们言之凿凿、振振有词地跟约伯解释他当下的处境证明上帝怎么看待他，三个属灵的懂王，我们不要做", "en": "三个属灵的懂王，我们不要做这种人", "sec": "6.10", "f": {"ban": [], "per": ["你们", "我们"], "dem": ["这种"]}}, {"s": 919, "e": 922, "t": "如果具备了智慧书的智慧，你就可以得到一个干净的皮袋子，就能帮助你们好好装载新酒，不至于破裂；这是约伯记全部的信息", "en": "得到干净的皮袋子，就能好好装载新酒，不至于破裂", "sec": "6.10", "f": {"ban": [], "per": ["你", "你们"], "dem": []}}]}, {"s": 923, "e": 928, "st": "same", "g": [106], "p": [{"s": 923, "e": 928, "t": "面对「不靠环境辨别神旨意」的说法，人常会追问：多年来都靠环境判断，事情做不顺就以为不是上帝的意思；但做事不顺不等于不是上帝的意思，反过来认为越不顺越是上帝的意思，这两种极端都不可取", "en": "做事不顺就断定不是上帝的意思，或认为越不顺越是上帝的意思，这两种极端都不可取", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 929, "e": 942, "st": "mixed", "g": [107, 108], "p": [{"s": 929, "e": 933, "t": "既然环境的顺逆不是第一鉴别标准，那么第一鉴别标准是什么？答案是上帝圣言的准则，也就是圣经这66卷：违反它就不是，遵从它就是，无论顺遂与否", "en": "违反它就不是，遵从它就是，无论顺遂与否", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 934, "e": 936, "t": "因此圣经的准则才是根基：上帝怎么说永远是人行动的最高准则，而不是自己的遭遇或家庭的遭遇", "en": "上帝怎么说永远是行动的最高准则，而不是自己的遭遇或家庭的遭遇", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 937, "e": 939, "t": "人靠什么知道上帝对自己的真实心意？答案是圣经这卷书；因此人的安全感应当建立在圣经之上", "en": "人的安全感应当建立在这卷书之上", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道；最大的祝福则是上帝带人进入真理，并赐予永恒的福乐", "en": "最大的祝福是上帝带人进入真理，并赐予永恒的福乐", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 943, "e": 947, "st": "same", "g": [109], "p": [{"s": 943, "e": 947, "t": "有人提出疑问：上帝所认可的人既不出于刑罚也不出于管教，那还有什么理由让他受祸？既然不管教他、不试炼他、也不刑罚他，又不讨厌他，为什么还允许人受祸", "en": "既然不讨厌他，为什么还允许人受祸", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 948, "e": 959, "st": "same", "g": [110], "p": [{"s": 948, "e": 959, "t": "约翰福音9章1-3节记载，耶稣看见一个生来瞎眼的人，门徒问这人生来瞎眼是谁犯了罪，是这人还是他父母；门徒认定天生瞎眼必定与罪有关，便把答案限定为父母的罪或儿子的罪，认为耶稣只能回答是罪", "en": "门徒限定了耶稣的回答，认定答案绝对是罪", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 960, "e": 967, "st": "over", "g": [111], "p": [{"s": 960, "e": 962, "t": "耶稣的回答推翻了门徒给出的选项：不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来", "en": "是要在他身上显出神的作为来", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 963, "e": 967, "t": "原来这件事与罪无关，而与神的作为有关；人向上帝提问时往往只给一个A或B的选择题，结果两个都不是，可见祸福与罪的关系未必是想当然的认知，需要作出调整", "en": "祸福与罪的关系需要按圣经作出调整", "sec": "7.3", "f": {"ban": [], "per": [], "dem": ["这件"]}}]}, {"s": 968, "e": 969, "st": "same", "g": [112], "p": [{"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记", "en": "以祷告开场，表示要遵照神的话开始查考约伯记", "sec": "8.1", "f": {"ban": [], "per": [], "dem": []}}]}], "near": {"29": 30, "89": 88, "94": 96, "106": 107, "134": 137, "169": 170, "181": 184, "216": 215, "273": 275, "291": 294, "354": 355, "364": 365, "440": 438, "477": 479, "517": 519, "534": 533, "551": 552, "572": 573, "588": 591, "613": 614, "619": 622, "670": 668, "678": 679, "687": 688, "765": 766, "783": 786, "801": 802, "811": 814, "822": 823, "843": 841, "879": 878, "899": 900, "911": 914, "934": 936}, "unc": {"23": "第25行是本节收尾语，与耶和华夸约伯同属一个论证动作，故并入该段；若把收尾语单独看待则切点会不同", "29": "此处也可视为与30-32同属「赐下福音与信心并结果子」的连续祈求，整节或可作一段；按祷告事项切开为两段。", "41": "「他先跟你介绍约伯这个人」既可看作1-5节现实背景的收尾，也可看作引出下面属灵背景的过渡；因其内容仍在说1-5节，归前不切", "51": "49-50自我介绍与51起的服侍任务之间是自然的动作转换，但49-50只有2行，按规则并入，整节作一段", "84": "84起转入成书背景，也可看作83「什么叫永久安稳的人生」的解答起点，但两者论证动作不同，暂切", "99": "麦基洗德与巴兰是两个例子，但支撑同一论点，按并列列举整体成段", "122": "122-128是面向听众的设问，也可看作121所提问题的展开，但论证动作为引导听众设想，暂切", "155": "155-158提出风险因素的问题，也可与159起的抗风险能力列举合并，此处单独成段以保留设问动作", "181": "181-184提出约伯第一个稳健因素，与185起的假设例子是两个动作，但也可合为一段", "313": "313-316是引经文，317起是解释，也可合为一段", "377": "377-379只有三行，也可并入371-376，但它是转向后文处境的独立一步", "391": "391-399把约伯的常常这样行与马斯克的比喻连成一体，也可再细分，但整体是同一论证动作", "488": "488-492与493-497内容相近，都讲永生益处与跟随耶稣的目的，也可合并为一段", "588": "582与588问了几乎相同的问题（撒旦怎么也来了），可视为同一论证动作的重复，此处按先讲身份、再讲措辞暗示切为两段", "647": "641-646讲授权说话，647-653讲活动权限与限制，二者递进，是否应合并为一段可斟酌", "721": "721-723的设问与724-729的论证是否要再切开，因721-723仅三行而作罢", "811": "811-814是全节的引子，仅四行，也可并入后面老祖宗的观察，此处按独立提出福音是不可废去之福处理", "865": "865-872的两拨人解释与873-878的真相解读紧密相连，是否合并为一段可斟酌", "907": "907-910仅四行，且与911-918的愚昧人判断相承，是否应合并可斟酌", "923": "「大体我们今天就到这里」像是上一节的结束语，但落在本节首行，只能并入本节第一段", "953": "门徒反应的解释是否该与所引经文分开，拿不准；按宁少勿多不切"}, "paras": [{"s": 1, "e": 3, "t": "开场互相问候平安，谦卑表示「帮助不敢当」，并说明自己只是把神的话用今天的话尽可能讲给大家听，因为能建立人的是神的话本身"}, {"s": 4, "e": 8, "t": "宣布本周正道要宣读的经文是约伯记一章1至8节，并说明诵读时坦然看经文就好，其中难解的部分会尽可能替大家解释"}, {"s": 9, "e": 13, "t": "约伯记一章1至3节记载，乌斯地有一个人名叫约伯，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴并许多仆婢，在东方人中为至大"}, {"s": 14, "e": 18, "t": "约伯记一章4至5节记载，约伯的儿子按着日子各在自己家中设摆筵席，请三个姐妹一同吃喝；筵席的日子过了，约伯打发人去叫他们自洁，清早按众人的数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，约伯常常这样行"}, {"s": 19, "e": 22, "t": "约伯记一章6至7节记载，有一天神的众子来侍立在耶和华面前，撒但也来到其中，耶和华问撒但从哪里来，撒但回答说自己从地上走来走去、往返而来"}, {"s": 23, "e": 25, "t": "约伯记一章8节记载，耶和华问撒但是否用心查看过他的仆人约伯，并说地上再没有人像约伯那样完全正直、敬畏神、远离恶事；本周的分享就到这里"}, {"s": 26, "e": 28, "t": "会前祷告开始，祈求神使众人照着他的话、以他话语的根基继续敬拜他，并求神自己在众圣徒中得着当得的荣耀。"}, {"s": 29, "e": 33, "t": "祈求神临格开通众弟兄姊妹的耳朵，使他们凡有耳的都应当听；求神将众先知使徒记在圣经上的福音、古旧信仰和所需的一切知识赐给他们，使他们通达灵敏认识神、一次得救；又求神让真信心在他们里面酝酿，并使他们中间多结果子，最后奉耶稣基督的圣名祈求。"}, {"s": 34, "e": 41, "t": "约伯记开篇分两个部分、两种眼光来看：1-5节先介绍约伯的现实背景，用通俗的话说就是他很有钱，生了多少儿子，牛驴仆婢众多，是一个东方的大富户"}, {"s": 42, "e": 48, "t": "6-8节是约伯的属灵背景：他敬畏神、远离恶事，因此在天上人看不见的地方，耶和华如此评价他——他虽是被撒但控告的人，却也是被耶和华非常认可的人"}, {"s": 49, "e": 54, "t": "讲员自我介绍姓陈、人称陈社炳，本人的事不必过多介绍；他新年在此服侍的任务很明确，就是把圣经里先知使徒的福音抛开传统告诉会众，使这道成为这里敬拜的根基、不再立别的根基，并适当地与自己教会同步信息，若认为不合适就用最古老的约伯记开始"}, {"s": 55, "e": 58, "t": "今天教会对福音的信仰通常比较关注个人，而不关注国度，也就是只关注今生这几十年个人的祸福，并不关注将来那个所谓的国度；因此讲员到很多地方，也不得不先从个人的事谈起"}, {"s": 59, "e": 63, "t": "约伯记不是传讲全备福音最好的一卷书，但它能帮助人消除以前比较顽固的观念，为领受真道预备所需的智慧；讲员也希望以后若冒犯听众，就先用约伯记来冒犯，因为福音本身对人的挑战会更大"}, {"s": 64, "e": 67, "t": "认识福音要先读约伯记，并不意味着认识真道要先与认识苦难有关；约伯记的排版不可忽略，它是智慧书的第一卷，一般人提到它常联想到苦难，其实它的大主题是智慧，也就是认识耶和华的智慧"}, {"s": 68, "e": 73, "t": "先讨论两个问题，第一个是1-5节的：世界上存不存在绝对的平安；因为许多在平安夜信耶稣的弟兄姊妹，平安正是他们信基督教的第一诉求，所以先从平安这个话题看起"}, {"s": 74, "e": 76, "t": "第二个问题在6-8节：上帝所认可的信仰，是否意味着这个人就会远离灾祸"}, {"s": 77, "e": 79, "t": "如果人曾经对信仰的祸与福做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整一下这些观念"}, {"s": 80, "e": 83, "t": "引出约伯记1章1至5节的经文，请听众先看约伯近乎永久安稳的人生，并提出问题：什么叫永久安稳的人生"}, {"s": 84, "e": 88, "t": "介绍约伯记的成书背景：这卷书是最早写成的一卷，比创世记还早，约伯生活在很早很早的年代，可能比亚伯拉罕还早，读者只要记住这一点即可"}, {"s": 89, "e": 93, "t": "约伯是乌斯地的人，并非以色列人；他可能生活在更早的族长时代，甚至比亚伯拉罕更早，是一位认识独一真神的古代圣徒"}, {"s": 94, "e": 98, "t": "针对「旧约只有以色列人信上帝」这一常见的误会，说明耶和华是全地的主、全人类的主，并非以色列人发明了耶和华"}, {"s": 99, "e": 105, "t": "举例说明亚伯拉罕之前已有民族信耶和华：亚伯拉罕认识作为至高上帝祭司的撒冷王麦基洗德，麦基洗德还从他手里收十分之一；连行邪术的术士巴兰也知道耶和华的名字"}, {"s": 106, "e": 114, "t": "独一神信仰不是从摩西才开始，连该隐都认识耶和华；族长时代之前耶和华是全地的信仰，万族都知道，后来纯正的信仰才在一族之内被保全，而约伯的年代乌斯地已有一位非常敬畏上帝的人"}, {"s": 115, "e": 121, "t": "追问约伯记开篇1至5节的写作目的：圣经没有一段话的细节是枉费、白费的，作者要让读者在读后面的内容之前先明白一件什么事"}, {"s": 122, "e": 128, "t": "请听众先不看圣经设想：在我们眼中什么样的人、什么样的家庭绝对不会出意外，通常的答案是人多一点、钱多一点、资源多一点"}, {"s": 129, "e": 133, "t": "从1至5节的描述看，作者突出约伯家庭极其鲜明的「稳」，按各个时代的眼光看，他都是绝不会出现灾祸、或有能力面对任何风险的人"}, {"s": 134, "e": 140, "t": "解释1至5节先交代约伯的稳固的原因：约伯后来落到极大的灾难中，绝对平安稳妥的开头与后面完全不安稳的处境形成非常大的落差"}, {"s": 141, "e": 144, "t": "读约伯记来思考自己信心的根基：先不看后面的内容，老弟兄老姐妹也知道约伯后来遭殃，家破人亡、浑身疾病躺在炉灰中"}, {"s": 145, "e": 149, "t": "读约伯记1至5节时先不管后面的故事，要避免今天年轻人所说的「上帝视角」，因为知道太多反而会破坏读开头时应该有的思维渠道"}, {"s": 150, "e": 154, "t": "请听众设想：如果生活中遇到约伯这样的人，会不会认为他的家庭会出现什么变故，答案应该是不会"}, {"s": 155, "e": 158, "t": "提出问题：人生的动荡和困境有哪些风险因素，需要一样一样列举排列出来，这个话题放到哪个年代都不陌生"}, {"s": 159, "e": 168, "t": "说明努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力，而抗风险能力最强的人通常被认为是最平安、家庭不会有任何意外的人"}, {"s": 169, "e": 174, "t": "对突然遭遇灾祸的人，通常的看法是恶有恶报，坏人最不稳，因为常在恶事里；家庭容易出灾祸，可能因为抗风险能力低，也可能因为他是个常在河边走的恶人"}, {"s": 175, "e": 180, "t": "对照约伯记第一节追问：约伯是不是坏人，是不是一个常在河边走、很容易在恶事里遭到恶报的人，答案都不是"}, {"s": 181, "e": 184, "t": "圣经首先介绍约伯第一个稳健的因素，即完全正直、远离恶事，也就是说任何道德和违法犯罪所带来的风险，在他身上都可以彻底排除"}, {"s": 185, "e": 192, "t": "假设一个家庭作奸犯科、开赌场贩毒，会认为它迟早因不正直和恶事招来灾祸；约伯却没有这些，他完全正直、敬畏神、远离恶事，道德和违法犯罪的因素都被排开"}, {"s": 193, "e": 205, "t": "约伯敬畏神这一点连耶和华都承认，属灵的遭天谴风险也排开；所谓遭天谴，是指一个人虽是好人却不信上帝、拜偶像、乱搞迷信，因亵渎上帝而让家庭遭牵连"}, {"s": 206, "e": 215, "t": "约伯在道德伦理、司法到信仰虔诚的一切风险因素都不存在，敬畏还被上帝认可，是一个真正的好人和好弟兄；这样内外无懈可击的家庭若还会遇到波折，就还需要追问别的因素"}, {"s": 216, "e": 222, "t": "硬实力不够或太弱小是另一个风险因素：古代乃至今天农村，人丁兴旺都意味着家族势力大，以前人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里比较稳健"}, {"s": 223, "e": 228, "t": "转而看约伯的硬实力：第二节记载他的家庭成员，他生了七个儿子，还有三个女儿，人丁足够兴旺，这是他家庭抗风险的第二把锁"}, {"s": 229, "e": 237, "t": "接续抗风险的话题，看约伯记第三节所记他的财富与地位：七千羊、三千骆驼、五百对牛、五百母驴，并有许多仆婢，这人在东方为至大，硬实力一看便知"}, {"s": 238, "e": 247, "t": "说明七千只羊意味着庞大的牧场，在古代羊毛和羊奶都是非常丰厚的利润；圣经一五一十地交代约伯的收入来源，就像一份财务报表"}, {"s": 248, "e": 260, "t": "说明三千骆驼在古代用于运货，相当于今天的大货车，它们走过沙漠和丝绸之路，可见约伯的物流商贸做得非常非常大"}, {"s": 261, "e": 267, "t": "耕地用的牛和驴说明约伯的田产也非常大，再加上许多仆婢，他的牧场、物流商贸和农业田产都很可观，硬实力丰厚到难以想象"}, {"s": 268, "e": 272, "t": "圣经对约伯的评价是「在东方为至大」，注意不是乌斯地，而是说整个东方他都是最顶配的人物"}, {"s": 273, "e": 278, "t": "约伯这样的人后来竟会坐在炉灰里，说明瘦死的骆驼未必比马大：只要上帝愿意、撒但插手，这样强盛的人有一天会在炉灰里满身烂疮、哀叫连连"}, {"s": 279, "e": 284, "t": "总结约伯在历史上的真实素描：他的经济富可敌国，不止乌斯地而是整个东方；地位上东方为至大，是在东边具备国际影响力的人"}, {"s": 285, "e": 290, "t": "设想今天若在生活中认识约伯，会不会觉得他有什么风险：生病、给儿子买房对你我是负担，对他却随时可以处理，一个随时能平事的人怎么会有不平安"}, {"s": 291, "e": 299, "t": "若只看1至5节而不看后面的内容，会认为约伯这个家庭这辈子什么意外都不会有；理由是道德上他远离恶事，信仰上敬畏神远离被上帝击打，硬实力上则是国际大佬"}, {"s": 300, "e": 303, "t": "今天最常喊人定胜天口号的就是这种手眼通天、站在至大地位的大佬，用不着到约伯这种级别，许多人有一点点钱就觉得自己可以上天"}, {"s": 304, "e": 312, "t": "针对「有钱人也有有钱人的苦」的不服气，承认豪门无情、兄弟姐妹争夺家产的悲剧自古确实有，但约伯家里并不是这样"}, {"s": 313, "e": 316, "t": "引约伯记第四节：约伯的儿子按着日子各在自己家里设摆筵席，打发人请了他的三个姐妹来，他们一同吃喝"}, {"s": 317, "e": 323, "t": "约伯家不存在那种给豪门带来悲剧的争夺家产之争，兄弟姐妹感情非常好，常常聚餐、一同吃喝，其乐融融，根本不存在任何变数"}, {"s": 324, "e": 329, "t": "加上约伯的最后一层保障：他对儿女的信仰教育也是顶级的；今天有些人稍有点小钱已经人定胜天，约伯做到那样的地位却活在警醒甚至震惊之中"}, {"s": 330, "e": 338, "t": "引约伯记第五节：筵席的日子一过，约伯就打发儿女去自洁，又清早起来按众人的数目献燔祭，恐怕儿子犯了罪、心中弃掉神，并且约伯常常这样行"}, {"s": 339, "e": 349, "t": "加上最后一层锁后，从硬实力、本人的正直、家庭的和睦、经济到对家庭的信仰看守都是顶级；约伯怀着深深的恐惧，怕这些富二代儿子会弃掉神，所以宴席一结束就一大早按数目一个一个献燔祭"}, {"s": 350, "e": 353, "t": "约伯连对儿女的信仰教育都是顶配：这个家庭从本人的信仰到下面子女的信仰，全部都在圣约、在上帝的看守之中"}, {"s": 354, "e": 359, "t": "约伯记的冲击力在于：这样敬虔又强大的家族，到后面居然会家破人亡，人全部被杀光，唯一剩下的活口还满身烂疮躺在炉灰里"}, {"s": 360, "e": 363, "t": "更难接受的一点是允许这件事的是谁：虽然说是撒但攻击他，但允许撒但去做的，居然是他们全家所敬畏的那位耶和华"}, {"s": 364, "e": 370, "t": "约伯记被放在智慧书的第一卷很合适：若肯客观地读它，一定会倒掉之前喝下过的所有基督教鸡汤，打掉任何的幻想"}, {"s": 371, "e": 376, "t": "约伯家不只是硬实力强，更是全家敬虔，父亲信仰上没有一点不警醒，第五节说他常常这样行，整个家庭都在敬畏的氛围中，连耶和华也承认他完全敬畏、远离恶事"}, {"s": 377, "e": 379, "t": "但往后读到第三章，约伯在炉灰之中说自己巴不得快点死掉，因为所有的事情都没了，他极其痛苦，这就是约伯的变化"}, {"s": 380, "e": 385, "t": "读懂约伯记所获得的智慧不是中国人理解的厚黑、圆滑，而是真的倒掉一切曾经喝过的基督教毒鸡汤和虚假的平安；没想清楚这个问题就无法健全地认识福音"}, {"s": 386, "e": 390, "t": "每个人对人生顺遂与稳健程度的评估都有具体标准：按约伯记1至5节整理，钱多、人多、势力大能轻易迈过难关，再加上做人好、虔诚、家庭团结、敬畏神，看起来总是内外无懈可击"}, {"s": 391, "e": 399, "t": "约伯不是偶尔这样，而是第五节所说常常这样行；生活中真遇到这种人，你肯定认为他不会出意外，就像你不会认为马斯克交不起房租，这种人与普通百姓和炉灰中的乞丐完全是两个物种"}, {"s": 400, "e": 404, "t": "约伯记给出的答案与人生经验相反：这样的人会不会出意外，用以前的人生经验会说不会，但约伯记告诉你会，而且非常非常地会"}, {"s": 405, "e": 410, "t": "作为安稳支柱的那些资源都有可能瞬间失去，最终能护住人的反而是耶和华为我们圈上看守的看不见的篱笆；连身外身内之物都失去后，能留下来的只有曾经敬畏耶和华的智慧和知识"}, {"s": 411, "e": 420, "t": "解释身外之物指钱和房产，此生不带来、死不带去；但约伯连身内之物也没了，皮与骨都被撒但击打，仍说就算神杀他，他也要在炉灰中继续等他"}, {"s": 421, "e": 427, "t": "最终看守我们的不是自己想象的抗风险因素和人生支架，因为这些说倒塌就会倒塌；真正看守人的是耶和华为我们圈上的四维篱笆，以及敬畏耶和华积累的真知识真智慧，它发芽结果后要等神收割"}, {"s": 428, "e": 433, "t": "需要在约伯记一开始就预备好，随时清醒地知道与神同行的这几十年有许多事很可能突然发生；只有在正确的预设之下，人才不会在苦难的年岁突然弃掉神，因为错误的期待往往带来错误的信心"}, {"s": 434, "e": 439, "t": "带着错误的期待又想回应自己的遭遇，只有两个最危险的做法：要么去掉福音，要么更改福音；就算不肯去掉福音，只要还怀着错误的期待来信，也一样会更改福音，无法接受纯正的东西"}, {"s": 440, "e": 444, "t": "第二章上帝对约伯的评价是「持守纯正」：持守纯正就是福音在自己舒适时如此，如今倒在炉灰中不舒适了，仍按原来那个东西继续等候，哪怕困惑也不更改、不以口犯罪、不忘认上帝"}, {"s": 445, "e": 448, "t": "面对「信耶稣就是保平安、上帝大大祝福」这类好意的话，常用约伯记二章九节回应：我们从神手里得福，也从神手里受祸，这是约伯对他的太太说的"}, {"s": 449, "e": 458, "t": "许多人说约伯太太太坏，其实不然：第一轮散尽家财、儿女全死光时她什么也没说，仍跟在他身边，直到第二轮约伯身体烂掉、倒在炉灰中祷告时才崩溃劝他弃掉神，她已经非常难得"}, {"s": 459, "e": 466, "t": "约伯太太所过不去的那一关是「不能受祸」：就算不得福、一个福也不给都行，但不能受祸；约伯回答她从神手里得福不也受祸吗，并责备她说话像愚顽的妇人"}, {"s": 467, "e": 472, "t": "这些年无论顺境逆境，许多人总说为上帝做事、信耶稣绝对平安顺遂；我的回应是打住，我认为从神手里得福，也从神手里受祸，这是我的信仰告白，我甘心如此，这位上帝给福给祸都是我的上帝"}, {"s": 473, "e": 476, "t": "但很多人会疑惑：按照传统的宗教性，得祸你还信什么？没有一个人是为了承认得祸而来信耶稣的"}, {"s": 477, "e": 487, "t": "到了第一层的结尾，借助使徒保罗在罗马书的解释说明按这个眼光看约伯记的理由：万事互相效力，为人的救恩得益处；从神手里得福、受祸指人生的际遇，万事包含祸与福，有时益处正从祸里来，就是救恩的益处"}, {"s": 488, "e": 492, "t": "有些东西如破产、生病对人生无益，对永生却有益；万事互相效力，只为那一个确定的益处，就是永生的益处，因为只有到达这个终点，神才会擦去我们一切的眼泪"}, {"s": 493, "e": 497, "t": "跟随耶稣确实不是专门为了今生保平安；不是说这辈子的事不重要，但最终寻求的必须是永恒的福乐，信耶稣一定是为了追求这个而来"}, {"s": 498, "e": 511, "t": "今生的苦难几十年后都会过去，而永恒的福乐和永恒的咒诅都永久不会过去；信耶稣与否有一个永恒的结局，人却处在暂存状态，九十年后进入永恒不会废去的福与祸，为了这个我愿接受现在的福与祸，只要它为我的救恩效力"}, {"s": 512, "e": 516, "t": "最终会看到两套截然不同的福音：一套相信上帝只给你福、不给你祸，另一套相信上帝让人得福、让人得祸都为儿女的救恩效力，二者绝对不一样"}, {"s": 517, "e": 526, "t": "大部分人相信信耶稣绝对只有祝福没有灾祸，后来遇到无法解释的人生动荡，就只能不断怀疑自己是不是做错了什么；约伯的三个朋友正是这样集体怀疑他，认定上帝只给信他的人祝福，所以约伯受祸必定是干了坏事，后面的辩论都源于这种福音"}, {"s": 527, "e": 533, "t": "这种观念在上古乌斯地就已存在：上帝只给义人祝福，所以人一旦受苦就不是义人，就是犯罪的人，因此三轮对话都在骂约伯；第一套福音就是绝对平安、没有灾祸、只有祝福"}, {"s": 534, "e": 540, "t": "我们所信的是从神手里得福，也从神手里受祸；但这并不代表上帝咒诅我们，他会给我们一个永久的祝福，就是让万事为我们的救恩互相效力；为了永恒的定局，上帝甚至可以在短暂期间降祸，对以色列整个部族也是如此"}, {"s": 541, "e": 546, "t": "选择哪一套信仰，信心看向不同的方向，最终会走向不同的道路、结出不同的果子；后一套福音并不残酷，有得救智慧的人都知道怎么选，在今生只要能促成不可废去之福，我们愿意接受上帝给我们的任何东西，这就是1至5节所说的"}, {"s": 547, "e": 550, "t": "总结约伯记1至5节：绝对的稳固是为后面读约伯记做铺垫，约伯方方面面都不可能出现任何意外，但他还是出了意外"}, {"s": 551, "e": 556, "t": "由此得到一个最基本的认识：以前认为的一切抗风险的稳固支架都不算数，都会顷刻失去；最终能够看守我们的只是耶和华为我们安扎的篱笆，身内身外之物全都失去以后，剩下的只有敬畏耶和华的人生所积累的知识和智慧，它会开花结果"}, {"s": 557, "e": 571, "t": "承接1至5节人所看得见的约伯家产，转入天上关乎约伯家庭的事：影响人家庭甚至国家历史的，往往是看不见的天上场景，人所争取的物质资源影响力其实没那么大，这一转折点始于第6节"}, {"s": 572, "e": 581, "t": "神的众子聚集在耶和华面前，众子就是众天使，大家齐聚在耶和华面前；这场景如同君王听政的集会，好比皇帝坐在上面、众爱卿站在下面的早朝"}, {"s": 582, "e": 587, "t": "很多人不明白撒旦怎么也跑到天上来了，其实撒旦原是堕落的天使，他原本就是这种属灵的活物，只是背叛了上帝"}, {"s": 588, "e": 597, "t": "撒旦本来是天使，堕落以后已不在神的众子队伍之中，作者却用「也来在其中」的措辞，暗示撒旦已经不是神的众子之一，读者若对中文敏感就能察觉"}, {"s": 598, "e": 604, "t": "以高湖教会集会中陈世美也来在其中为例，说明撒旦是众子队伍中一个不协调的成员，他已经不是神的众子，不在集会的合法成员之内，但原本确是受造的属灵活物"}, {"s": 605, "e": 612, "t": "许多人更不理解第7节：既然允许撒旦来，为何不把他赶走，耶和华反而主动询问他从哪里来？不少人因耶和华与撒旦搭话而困惑，觉得上帝有些做法很难理解"}, {"s": 613, "e": 618, "t": "这不是一次搭讪，也不是一次找茬，而是一次说话的授权；它要表达的是撒旦自始至终都在上帝的权下，神若不这样讲，撒旦根本没有办法主动开口"}, {"s": 619, "e": 629, "t": "有人质疑耶和华询问撒旦，难道全知的上帝还有不知道的事？但第7节和约伯记2章2节上帝问的是同样的问题，可见这不是上帝困惑，而是让撒旦回答他，是一种说话的授权"}, {"s": 630, "e": 640, "t": "以皇帝上早朝时大臣太监视说「有事启奏，无事退朝」为例，说明在权柄底下不能突然站起来主动说话；正如在公司跟领导开会、小孩在课堂上，权柄是无形的，你在我的权柄底下要说话也得举手，经我授权才能讲"}, {"s": 641, "e": 646, "t": "耶和华集会时撒旦不可能冲进去主动开口，他往返而来时，耶和华主动用「你从哪里来」的语式给他一个发言的授权，撒旦才得到说话的权利，否则他连说话的资格都没有"}, {"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给撒旦一定的活动权限让他说话；魔鬼完全在神的掌管之中，攻击约伯时必须被耶和华的权柄限制，第一次不能伤他身体，第二次能伤身体却不能夺命，这种对邪恶的限制贯彻整个约伯记"}, {"s": 654, "e": 660, "t": "若确知撒旦肆虐的当下正被上帝良善的权柄限制，神的儿女对上帝的期待和安稳感就不只建立在脱离困境之后，也建立在困境之中，因为相信当下仍在上帝掌控之中，就不会有任何不安稳感"}, {"s": 661, "e": 669, "t": "第8节耶和华主动称赞约伯完全正直、远离恶事，引发困惑：这不是主动引魔鬼攻击义人吗？撒旦本没注意约伯，上帝反而提醒他去看，岂不是勾引他去试探？读圣经感觉不痛快，往往是因为不了解它原来的表达"}, {"s": 670, "e": 677, "t": "提出两个选择题请听众判断：是耶和华主动要撒旦注意约伯，还是撒旦本来就在关注约伯？也就是上帝主动说地上有个约伯让他去看、撒旦要试一试他，还是耶和华借着撒旦的邪恶授权他、促成自己美善的计划"}, {"s": 678, "e": 686, "t": "教会大部分时间都在介绍上帝，极少介绍魔鬼；需要知道魔鬼不是全知全能，全宇宙中只有耶和华一位全知、全能、全在，这段圣经有证据；魔鬼好像不受时间限制，从创世以前就在，不会老"}, {"s": 687, "e": 694, "t": "但魔鬼受不受空间限制？他受，因为第7节魔鬼自己说「我从地上走来走去，往返而来」，可见他受空间限制；如果他在东方就一定不在西边，不能认为魔鬼是全在的，全在只有一位就是上帝"}, {"s": 695, "e": 700, "t": "以耶稣所说「从天降下却仍就在天的人子」为例，说明宇宙中没有这样的存在物，除了上帝，人只要在这里就不在那边，受空间限制，要去那边只能从这里走过去，往返而来"}, {"s": 701, "e": 704, "t": "上帝却可以说我在东也在西，超乎众人之上，贯乎众人之内，也住在众人之间；他道成肉身仍在天，用全能的命令托住万有，不需要往返，他充满全地"}, {"s": 705, "e": 711, "t": "上帝问撒旦从哪里来、从什么空间来、是什么样的活物；撒旦诚实地回答从地上来，因为他已经不在天上了，神的众子在天上，撒旦却从地上来，走来走去、往返而来"}, {"s": 712, "e": 720, "t": "之所以要介绍撒旦受空间限制，是因为他在东方就不在西方，得走来走去；他后面能把约伯的状况说得那么清楚，说明这些年他就在约伯身边，撒旦不是全在也不是全知，因此他必须走到约伯身边"}, {"s": 721, "e": 730, "t": "撒旦对约伯了解不了解？人常把魔鬼看得太厉害了；第9节之后撒旦说出约伯家里的情况，问约伯敬畏神岂是无故、难道不是四面圈上篱笆保护他吗？这些事撒旦知道，他不是全知者，却能知道，因为他一直在约伯身边盯着这个人"}, {"s": 731, "e": 740, "t": "撒旦对约伯敬畏神的原因表达了两次质疑，耶和华两次都允许他试验，但这两次质疑透露出撒旦对约伯内心的评估出错了；上帝全知全能全在，也全然无误，他对约伯的评价是敬畏我、远离恶事，不会错"}, {"s": 741, "e": 749, "t": "撒旦第一次说约伯敬畏神岂是无故，夺去他所有的他必当面弃掉神，结果没有发生，约伯反而说赏赐和收取都在耶和华、耶和华的名应当称颂；撒旦第二次改口说人以皮代骨、击打他身体他必弃掉神，第二次又错了，约伯浑身烂疮之后依然持守纯正"}, {"s": 750, "e": 757, "t": "撒旦两次出错，上帝会不会两次出错？不会；这说明撒旦对人的观察需要知识的积累，他先认为约伯是因钱财才敬畏神，钱财拿掉却发现约伯仍敬畏神，又评估应该是皮肉，结果又错了"}, {"s": 758, "e": 764, "t": "撒旦很厉害，人搞不过他，但千万不要把他放成能跟上帝掰手腕的角色；网上有耶稣和撒旦在桌上掰手腕的图，他怎么可能跟上帝坐到一张桌子上，他永远是在上帝权下的姿态，受造的天使再高级也不可能是耶和华这样"}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾没有出现任何差错；人在神面前赤露敞开，在撒旦面前却不是，撒旦需要长期观察，评估可能出错，圣经记载他对约伯的评估两次出错；只有有限的受造物才需要日久见人心，耶和华从开始就知道约伯透透的，撒旦却既不周全了解他，又想试探他"}, {"s": 776, "e": 782, "t": "上帝完全认可约伯对他的敬畏，按理该直接赶走撒旦、保护约伯，可他居然两次允许约伯受祸，而且灾祸非常严重；这是大部分人想不明白的，因为人总认为招灾的一定是恶人，义人一定要得福，约伯的三个朋友后面也都这样认为"}, {"s": 783, "e": 786, "t": "约伯记才刚开始，这卷书讨论了一个非常需要讨论的主题，就是义人受苦、恶人亨通的怪单"}, {"s": 787, "e": 793, "t": "义人受苦恶人亨通在智慧书、诗篇、先知书中反复出现，人想象的是义人得福、恶人受苦，圣经却诚实地告诉人间的处境；但这不必然，义人有可能受苦，恶人有可能亨通，具备这种智慧，你就会具备健全的信心"}, {"s": 794, "e": 800, "t": "正常人选择任何宗教，都以保佑顺遂和福泽作为敬拜的理由，哪个宗庙不以灵验作招牌；基督教听来的见证也基本清一色是信耶稣后丰收了某些东西，没人敢拿敬畏神后家破人亡来说事，因为那像是给上帝抹黑，但上帝自己就记载了这个事"}, {"s": 801, "e": 810, "t": "有人拿约伯记结尾说他双倍得回祝福来反驳，但圣经中有一位跟约伯类似的人物至死没得回，就是路加福音财主和拉撒路比喻中的乞丐拉撒路，他长烂疮、狗舔他的疮，死后在亚伯拉罕的怀里；不要因约伯双倍得回就以为最终盼望又变成祝福，义人可能受苦、恶人可能亨通，是上帝告诉你的"}, {"s": 811, "e": 814, "t": "更重要的东西是：福音是这几十年所传的不可废去之福，我们的福音就是这个，不是别的东西"}, {"s": 815, "e": 821, "t": "中国老祖宗有一句话叫「好人不长命，王八活千年」，王八指的就是坏人；坏人怎么反而家大业大，老祖宗通过观察就懂得这个道理"}, {"s": 822, "e": 829, "t": "由此得出一个重要的事：不能因为灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，约伯就是例证；同样也不能因一个人顺风顺水就认可他的信仰，因为上帝可能不认可他，圣经中亦有这种例子"}, {"s": 830, "e": 835, "t": "当说信仰的方式需要调整，指的是知识和认知，很多人却用人生顺遂来回应，说自己家里买了三套房子，这跟神学有误是鸡同鸭讲；不要把处境放在自己信仰的纯正度上"}, {"s": 836, "e": 842, "t": "人对福音的误解会导致完全错信一场，有人因为多年家庭和睦或事业高升而公然拒绝反思自己的信仰；有些人明明找到了真理，却因人生顺遂拒绝反思；也有人明明对了，却因遭灾开始怀疑自己"}, {"s": 843, "e": 850, "t": "两个都不可取，智慧书一定给你带来智慧，所谓智慧是在环境中认识上帝的智慧；用当下环境来解释信仰的实质是一种误区，熟知智慧书的基督徒不会这样讲，因为顺遂与祸福跟上帝对你的认可与否是两码事，光这一点就有很多人陷在愚昧里"}, {"s": 851, "e": 858, "t": "举例说明：假设我今天要来你们教会讲道，昨天腿摔断了，今早还连续拉肚子；有人说你不能去，因为上帝在拦阻你，也有人说你要坚持去，这是撒旦在拦阻，可见你要做成神的工；同一件事、同一个现实，却能得出两种解释"}, {"s": 859, "e": 864, "t": "这不是虚构，是真实经历：十多年来要做一件关乎上帝的工作之前，身体常出现看得见的问题，发烧、腿受伤、骑车摔了、头磕了；结果同一件事居然分出两拨人，给出两种解释"}, {"s": 865, "e": 872, "t": "一拨人说你生病了，看来上帝拦阻、上帝不喜欢，你不要去；另一拨人说生病了看来撒旦拦阻，撒旦拦阻就是上帝喜欢，你要去；那到底听谁的？借着物质指着灵界来论，这叫做愚昧"}, {"s": 873, "e": 878, "t": "真相是：一般说上帝拦阻你的人，通常是自己不想我去；一般说撒旦拦阻的人，其实自己想我去；人随私意解读，不只会随私意解读圣经，还会随私意解读环境"}, {"s": 879, "e": 884, "t": "我身上所发生的事，可能跟上帝的旨意没有半毛钱关系，不要硬扯在一起，有时有有时没，不一定非要去对应；从约伯记就会发现，天上的场景和地下的场景完全没什么关系"}, {"s": 885, "e": 889, "t": "环境不要成为我们信仰的第一参考标准，因为有些时候在你眼前显明的东西，不表示背后属灵的实际；你生病不代表这个人就是坏，解读上帝的旨意不要这样"}, {"s": 890, "e": 898, "t": "约伯完全没有得罪神，1至5节的安稳却被6至8节认可他的上帝打破；至少今天做一个最简单的调整：不要做那种属灵的懂王，好像能为弟兄姊妹解读他身上发生的一切属灵事实，你何德何能，传道人又何德何能；家庭的处境和顺遂不要来问我，许多传道人都自以为知道，我认为我不知道，也不认为他们知道"}, {"s": 899, "e": 906, "t": "我们能懂的只有上帝的话是怎么说的，这个可以告诉你；但你家里为什么这样，我怎么知道？天上的场景是我们的智慧所不可企及、至高不能及的，我们又不是先知"}, {"s": 907, "e": 910, "t": "我只能通过上帝的原则来告诉大家，希望大家安稳在其上，在这本书上你会得到非常安稳的人生；这不是直接的安稳，而是整个救恩根基的稳固，风吹雨打也不在沙土上，绝不动摇"}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天通过瞎猜教别人做事的这种人，或许你们认为是属灵人，但圣经称这种人为愚昧人，希望约伯记至少让我们避免成为这种人；后面三个朋友会具体示范什么叫这种人，他们言之凿凿、振振有词地跟约伯解释他当下的处境证明上帝怎么看待他，三个属灵的懂王，我们不要做"}, {"s": 919, "e": 922, "t": "如果具备了智慧书的智慧，你就可以得到一个干净的皮袋子，就能帮助你们好好装载新酒，不至于破裂；这是约伯记全部的信息"}, {"s": 923, "e": 928, "t": "面对「不靠环境辨别神旨意」的说法，人常会追问：多年来都靠环境判断，事情做不顺就以为不是上帝的意思；但做事不顺不等于不是上帝的意思，反过来认为越不顺越是上帝的意思，这两种极端都不可取"}, {"s": 929, "e": 933, "t": "既然环境的顺逆不是第一鉴别标准，那么第一鉴别标准是什么？答案是上帝圣言的准则，也就是圣经这66卷：违反它就不是，遵从它就是，无论顺遂与否"}, {"s": 934, "e": 936, "t": "因此圣经的准则才是根基：上帝怎么说永远是人行动的最高准则，而不是自己的遭遇或家庭的遭遇"}, {"s": 937, "e": 939, "t": "人靠什么知道上帝对自己的真实心意？答案是圣经这卷书；因此人的安全感应当建立在圣经之上"}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道；最大的祝福则是上帝带人进入真理，并赐予永恒的福乐"}, {"s": 943, "e": 947, "t": "有人提出疑问：上帝所认可的人既不出于刑罚也不出于管教，那还有什么理由让他受祸？既然不管教他、不试炼他、也不刑罚他，又不讨厌他，为什么还允许人受祸"}, {"s": 948, "e": 959, "t": "约翰福音9章1-3节记载，耶稣看见一个生来瞎眼的人，门徒问这人生来瞎眼是谁犯了罪，是这人还是他父母；门徒认定天生瞎眼必定与罪有关，便把答案限定为父母的罪或儿子的罪，认为耶稣只能回答是罪"}, {"s": 960, "e": 962, "t": "耶稣的回答推翻了门徒给出的选项：不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来"}, {"s": 963, "e": 967, "t": "原来这件事与罪无关，而与神的作为有关；人向上帝提问时往往只给一个A或B的选择题，结果两个都不是，可见祸福与罪的关系未必是想当然的认知，需要作出调整"}, {"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记"}]}, "v3": {"stats": {"pred_n": 135, "gb": 112, "pb": 134, "exact": 73, "near": 32, "f0": [0.545, 0.652, 0.593], "f3": [0.784, 0.938, 0.854], "wd": 0.2435, "groups": {"same": 39, "over": 9, "under": 2, "mixed": 16, "near": 8}, "ban": 5, "per": 13, "dem": 57, "long": 8, "tok_in": 62203, "tok_out": 55369, "prompt": "切段_v3", "model": "deepseek-flash", "effort": "low"}, "groups": [{"s": 1, "e": 3, "st": "same", "g": [0], "p": [{"s": 1, "e": 3, "t": "开场互道平安，并谦卑表示自己不敢当什么帮助，只是把神的话用今天的话尽可能讲给众人听", "en": "自称不敢当帮助，只是把神的话用今天的话尽可能讲给大家听", "sec": "1.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 4, "e": 8, "st": "same", "g": [1], "p": [{"s": 4, "e": 8, "t": "宣布本周正道经文为约伯记一章1至8节，并说明读经时坦然看经文即可，其中难解的部分会尽可能为弟兄姊妹解释", "en": "难解的部分会尽可能为大家解释，末了一行只是一个语气词", "sec": "2.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 9, "e": 13, "st": "same", "g": [2], "p": [{"s": 9, "e": 13, "t": "约伯记1章1至3节记载乌斯地有一个名叫约伯的人，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方人中为至大", "en": "这人在东方人中为至大", "sec": "2.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 14, "e": 18, "st": "same", "g": [3], "p": [{"s": 14, "e": 18, "t": "约伯记1章4至5节记载约伯的儿子按着日子各自在家中设摆筵席，请三个姐妹一同吃喝，筵席过后约伯打发他们自洁，清早起来按众人数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，约伯常常这样行", "en": "约伯因恐怕儿子犯罪心中弃掉神而常常这样行", "sec": "2.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 19, "e": 25, "st": "over", "g": [4], "p": [{"s": 19, "e": 22, "t": "约伯记1章6至7节记载有一天神的众子来侍立在耶和华面前，撒但也来到其中，耶和华问撒但从哪里来，撒但回答说自己从地上走来走去、往返而来", "en": "撒但回答说自己从地上走来走去、往返而来", "sec": "2.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 23, "e": 25, "t": "约伯记1章8节耶和华问撒但是否用心查看他的仆人约伯，并说地上再没有人像约伯完全正直、敬畏神、远离恶事，本周的分享到此为止", "en": "本周只分享到这个部分为止", "sec": "2.3", "f": {"ban": [], "per": [], "dem": ["此"]}}]}, {"s": 26, "e": 29, "st": "same", "g": [5], "p": [{"s": 26, "e": 29, "t": "祷告开头先求神使众人照他的话、以他话语为根基来崇拜他，在众圣徒中得着他当得的荣耀，并求他临格在中间，开通众弟兄姊妹的耳朵，使他们凡有耳的都应当听", "en": "落在求神临格在众人中间，开通弟兄姊妹的耳朵，使他们凡有耳的都应当听", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 30, "e": 33, "st": "same", "g": [6], "p": [{"s": 30, "e": 33, "t": "求神把众先知使徒记在圣经上的福音与古旧的信仰、并众人需用的一切知识一同赏赐给他们，使他们通达灵敏、认识神、一次得救；又求真信心在他们中间酝酿，使他们多结果子，末了奉耶稣基督的圣名祈求", "en": "最后一句以奉耶稣基督的圣名祈求作结", "sec": "3.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 34, "e": 41, "st": "under", "g": [7, 8], "p": [{"s": 34, "e": 41, "t": "约伯记开篇分两部分、两个眼光来看：1至5节呈现约伯的现实背景，他儿女众多、牛驴仆婢成群，是东方为大的富户，这一段先向读者介绍约伯这个人", "en": "1至5节看到他的现实背景是东方的大富户，先介绍约伯这个人", "sec": "4.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 42, "e": 48, "st": "same", "g": [9], "p": [{"s": 42, "e": 48, "t": "6至8节是约伯的属灵背景：他敬畏神、远离恶事，虽然被人控告，却在天上得着耶和华对他的认可与评价，全篇就按这两个方面来讲", "en": "就分这两个方面来讲，就是大纲上的两个经文", "sec": "4.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 49, "e": 54, "st": "over", "g": [10], "p": [{"s": 49, "e": 51, "t": "自我介绍：姓陈，人称陈社炳；在此服侍的任务很明确，就是把圣经里的福音和先知使徒的教导抛开传统慢慢告诉会众，使这道成为敬拜的根基，不再另立别的根基", "en": "希望这道成为这里敬拜的根基，并且不要再立别的根基", "sec": "4.2", "f": {"ban": [], "per": ["我"], "dem": ["此"]}}, {"s": 52, "e": 54, "t": "具体的做法：在自己认为许可的范围之内与自己的教会同步信息，尽可能同步认为合适的内容；若认为某周的信息不合适，就用最古老的一卷约伯记来慢慢开始", "en": "若认为某周的信息不合适，就用最古老的约伯记来慢慢开始", "sec": "4.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 55, "e": 58, "st": "same", "g": [11], "p": [{"s": 55, "e": 58, "t": "今天教会对福音的信仰通常更关注个人今生几十年的祸福，而不是将来那个国度；因此到各地讲道时，也不得不先从个人方面的事谈起", "en": "因此到很多地方，也不得不先从个人方面的事谈起", "sec": "4.3", "f": {"ban": [], "per": [], "dem": ["那个"]}}]}, {"s": 59, "e": 63, "st": "same", "g": [12], "p": [{"s": 59, "e": 63, "t": "约伯记不是传讲全备福音最好的一卷书，却能帮助消除以往比较顽固的观念，为领受真道预备所需的智慧；日后若要对会众有所冒犯，也希望先用约伯记来冒犯，因为福音本身对人的挑战更大", "en": "希望先用约伯记来冒犯，因为福音本身对人的挑战会更大", "sec": "4.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 64, "e": 67, "st": "same", "g": [13], "p": [{"s": 64, "e": 67, "t": "认识真道并非先要认识苦难；约伯记的排版不可忽略，它是智慧书的第一卷，一般人提到约伯记会联想到苦难，其实它的大主题是智慧，即认识耶和华的智慧", "en": "约伯记大的主题其实是智慧，而且是认识耶和华的智慧", "sec": "4.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 68, "e": 73, "st": "same", "g": [14], "p": [{"s": 68, "e": 73, "t": "先讨论两个问题：第一个问题出自1至5节，世界上存不存在绝对的平安？许多人，特别是在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求", "en": "许多人，特别是在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求", "sec": "4.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 74, "e": 76, "st": "same", "g": [15], "p": [{"s": 74, "e": 76, "t": "第二个问题出自6至8节：上帝所认可的信仰，是否意味着这个被认可的人就会远离灾祸？", "en": "是否意味着这个人就会远离灾祸", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 77, "e": 79, "st": "same", "g": [16], "p": [{"s": 77, "e": 79, "t": "若曾对信仰的祸与福做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整一下这些观念", "en": "对神赐福的前因后果曾有过不正确的认识，约伯记的开篇可以稍微调整一下", "sec": "4.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 80, "e": 106, "st": "mixed", "g": [17, 18, 19], "p": [{"s": 80, "e": 83, "t": "引出约伯记1章1至5节，让听众先看约伯近乎永久安稳的人生，并以「什么叫永久安稳的人生」这一问题作为展开的起点", "en": "以「什么叫永久安稳的人生」这一问题转入下文", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 84, "e": 88, "t": "先交代约伯记的成书背景，认为它比创世记更早写成，约伯是生活得极早、可能比亚伯拉罕还早的人；随后回到第一节，指出乌斯地有一个人名叫约伯", "en": "回到第一节，乌斯地有一个人名叫约伯", "sec": "5.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 89, "e": 98, "t": "约伯是乌斯地人而非以色列人，可能生活在比亚伯拉罕更早的年代；由此回应「旧约只有以色列人信上帝」的误会，说明耶和华是全地的主、全人类的主", "en": "耶和华是全地的主，全人类的主", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 99, "e": 106, "t": "以麦基洗德和巴兰为例，说明亚伯拉罕之前就有人认识并敬拜耶和华：麦基洗德是至高上帝的祭司，连术士巴兰也知道耶和华的名字，可见族长时代之前耶和华是全地的信仰", "en": "在族长时代之前，耶和华其实是全地的信仰", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 107, "e": 114, "st": "same", "g": [20], "p": [{"s": 107, "e": 114, "t": "独一神信仰并非从摩西才开始，连该隐都知道耶和华，万族本来都知道，只是纯正信仰后来在一族之内被保全；早在约伯的年代，乌斯地已有一个非常敬畏上帝的人", "en": "早在约伯的年代，乌斯地已有一个非常敬畏上帝的人", "sec": "5.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 115, "e": 121, "st": "same", "g": [21], "p": [{"s": 115, "e": 121, "t": "追问圣经为何收录约伯的故事，开篇1至5节记录约伯的大致情况并非枉费，而是要让读者在读后面内容之前先明白一件事", "en": "要让读者先明白和了解一件事", "sec": "5.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 122, "e": 128, "st": "same", "g": [22], "p": [{"s": 122, "e": 128, "t": "让听众先不看圣经来想：什么样的人、什么样的家庭绝对不会出意外；一般会认为是钱多、人多、资源多，因为这样的家庭遇事更有能力平息", "en": "通常认为钱多、人多、资源多", "sec": "5.3", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 129, "e": 144, "st": "mixed", "g": [23, 24], "p": [{"s": 129, "e": 132, "t": "从经文的描述看，作者突出约伯及其家庭的稳固，按各个时代的眼光衡量，这样的人绝不会遭遇灾祸，也有能力面对任何风险", "en": "按各时代眼光看，都是绝不会出灾祸、能面对任何风险的人", "sec": "5.3", "f": {"ban": ["作者"], "per": [], "dem": ["这样"]}}, {"s": 133, "e": 144, "t": "说明1至5节要先交代约伯的稳，是因为他后面落到极大灾难中，这种绝对平安稳妥与后来的完全不安稳形成很大落差，借此让人思考自己对耶和华信心的根基；约伯后来家破人亡、浑身疾病、躺在炉灰中", "en": "约伯后来家破人亡、浑身疾病，躺在炉灰中", "sec": "5.3", "f": {"ban": [], "per": [], "dem": ["此", "这种"]}}]}, {"s": 145, "e": 154, "st": "over", "g": [25], "p": [{"s": 145, "e": 149, "t": "读约伯记开头要先放下后面的故事，避免带着「上帝视角」，即预先知道后面的事；知道太多反而会破坏读开头时本该有的思路", "en": "知道太多反而破坏开头应有的思维渠道", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 150, "e": 154, "t": "让听众先看1至5节来想：如果生活中遇到约伯这样的人，会不会认为他的家庭会出现变故，答案应该是不会；并进一步追问约伯这种人可能遇到什么麻烦事", "en": "追问约伯这种人可能遇到什么麻烦事", "sec": "5.4", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}]}, {"s": 155, "e": 174, "st": "near", "g": [26, 27], "p": [{"s": 155, "e": 168, "t": "追问人生动荡困境的风险因素有哪些，指出努力赚钱、锻炼身体、购买保险都是为了增加家庭的抗风险能力；抗风险能力最强的人通常被认为最平安，人对自己生活的不安稳都有担忧和风险意识", "en": "人对生活的不安稳都有担忧和风险意识", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}, {"s": 169, "e": 174, "t": "人们对突然遭灾的人通常持恶有恶报的看法，认为坏人最不稳；追问一个家庭为何容易出灾祸，答案可能是抗风险能力低，也可能因为常做恶事而被恶事反噬，即常在河边走难免不湿鞋", "en": "常在河边走，难免不湿鞋", "sec": "5.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 175, "e": 183, "st": "same", "g": [28], "p": [{"s": 175, "e": 183, "t": "看第一节圣经如何形容约伯，他不是坏人、不是常在河边走的人，也不会遭恶报；圣经首先给出他第一个稳健因素，即完全正直、远离恶事，因此道德和违法犯罪带来的风险在他身上可以彻底排除", "en": "道德和违法犯罪的风险在他身上可以彻底排除", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 184, "e": 205, "st": "mixed", "g": [29, 30], "p": [{"s": 184, "e": 190, "t": "以假设自己家庭作奸犯科、开赌场贩毒为例，说明身处恶势力、不正直又不远离恶事的人迟早会招来灾祸；约伯却不是这样，他完全正直，且敬畏神、远离恶事", "en": "约伯完全正直，敬畏神远离恶事", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 191, "e": 195, "t": "约伯敬畏神说明道德和违法犯罪的因素都已被排除，而且他的敬畏连耶和华都承认，因此连属灵层面遭天谴的因素也一并排开了", "en": "连属灵、遭天谴的因素也排开了", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 196, "e": 205, "t": "假设一个人基本没干违法犯罪的事，却不信上帝、拜偶像、乱搞迷信，甚至养小鬼，就可能因上帝的愤怒使家庭受牵连；这是基于错误信仰所造成的第二个不稳健因素", "en": "这是基于错误信仰造成的第二个不稳健因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 206, "e": 222, "st": "mixed", "g": [31, 32], "p": [{"s": 206, "e": 211, "t": "约伯敬畏神、远离恶事，品质完全正直，信仰上敬畏神，生活上没有违法乱纪，因此从道德伦理、司法到信仰虔诚度的一切风险因素都不存在，而且他的敬畏是被上帝认可的", "en": "他的敬畏是被上帝认可的", "sec": "5.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 212, "e": 215, "t": "由第一节可认同约伯是好人、好弟兄、好虔诚的人；这样好的一个人似乎不会有任何问题，但若连这样的家庭都还会遇到波折，那就还有别的因素", "en": "若这样的家庭还遇波折，还有什么因素", "sec": "5.5", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 216, "e": 222, "t": "指出第二个稳健因素是硬实力，太弱小则不稳；无论古今，人丁兴旺都意味着家族势力大，以前人喜欢生儿子未必因为重男轻女，而是儿子多、顶梁柱多，家族在村里更稳", "en": "儿子多、顶梁柱多，家族在村里更稳", "sec": "5.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 223, "e": 228, "st": "same", "g": [33], "p": [{"s": 223, "e": 228, "t": "转向约伯的硬实力，看第二节记载的家庭成员：人丁兴旺，他生了七个儿子和三个女儿，这是这个家庭抗风险的第二把锁", "en": "七子三女是抗风险的第二把锁", "sec": "5.6", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 229, "e": 237, "st": "same", "g": [34], "p": [{"s": 229, "e": 237, "t": "今天努力赚钱、积累人脉也是为了增加抗风险因素；第三节记载约伯的财富与地位，他有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方为至大，这一节交代了他的财富、权势和国际地位", "en": "这一节交代约伯的财富、权势和国际地位", "sec": "5.7", "f": {"ban": ["这一节"], "per": [], "dem": []}}]}, {"s": 238, "e": 260, "st": "near", "g": [35, 36], "p": [{"s": 238, "e": 248, "t": "转换视角解释七千羊意味着庞大的牧场，古代羊毛和羊奶利润丰厚，圣经清楚交代约伯的收入来源，如同他的财务报表和清单，接下来还有三千骆驼", "en": "这是约伯的财务报表和清单，还有三千骆驼", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 249, "e": 260, "t": "解释骆驼在古代不用来吃，而是运货和物流的工具，丝绸之路和佩特拉古城的交通都靠骆驼；约伯的三千骆驼可看作三千辆大货车，说明他的物流商贸做得非常大", "en": "三千骆驼说明物流商贸做得非常大", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 261, "e": 303, "st": "mixed", "g": [37, 38, 39, 40, 41], "p": [{"s": 261, "e": 265, "t": "古代耕地用牛和驴，由此可以看出约伯的田产也非常大，他家里还有许多仆婢", "en": "田产非常大，家里有许多仆婢", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 266, "e": 272, "t": "总结约伯在牧场、羊毛羊奶、三千骆驼的物流以及牛驴仆婢的农业田产上都极其丰厚，硬实力和产业大到难以想象；经文评价他在东方为至大，不是仅限乌斯地，而是整个东方最顶配的人物", "en": "整个东方约伯是最顶配的人物", "sec": "5.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 273, "e": 280, "t": "约伯这种后来坐在炉灰里的人，说明「瘦死的骆驼比马大」未必成立；只要上帝愿意、撒旦插手，这样的人也会满身烂疮、哀叫连连，这是约伯用自己人生留下的残酷真相；他在古代东方的强盛，恐怕连城邦君王都难以做到", "en": "连城邦君王都难做到这种强盛", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"s": 281, "e": 290, "t": "为约伯画一幅素描：经济富可敌国，地位在整个东方为至大、具备国际影响力；今天若认识这样的人，会觉得他有什么风险吗，生病、买房这类负担对他随时都能处理，这样随时能平事的人还会有不平安吗", "en": "随时能平事的人还会有不平安吗", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 291, "e": 303, "t": "若只看1至5节，会觉得约伯家一辈子不会出任何事：道德上他远离恶事，信仰上他敬畏神而远离被上帝击打，硬实力上则是国际大佬；今天最爱喊人定胜天的正是这种手眼通天的大佬，约伯更是如此", "en": "许多人有点钱就觉得自己能上天，约伯更是如此", "sec": "5.8", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 304, "e": 323, "st": "near", "g": [42, 43], "p": [{"s": 304, "e": 311, "t": "有人对约伯的稳固仍不服气，提出豪门家庭这个因素，认为有钱人也有有钱人的苦，豪门内部无情，兄弟姐妹会为争夺家产打得头破血流", "en": "豪门争产打得头破血流", "sec": "5.9", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 312, "e": 323, "t": "承认豪门争产的悲剧自古就有，但约伯家不是这样；第四节记载他的儿子按着日子各自设摆筵席，请三个姐妹一同吃喝，可见约伯家兄弟姐妹感情非常好、常常聚餐、其乐融融，不存在豪门争端带来的变数", "en": "其乐融融，不存在任何变数", "sec": "5.9", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 324, "e": 338, "st": "over", "g": [44], "p": [{"s": 324, "e": 330, "t": "第五节提供最后一层保障，即约伯对儿女的信仰教育也是顶级的；与那些稍有积蓄就自认人定胜天的人相比，约伯做到这样的地位，却仍活在警醒甚至震惊之中", "en": "约伯却活在警醒甚至震惊之中", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这样", "那些"]}}, {"s": 331, "e": 338, "t": "第五节记载，筵席的日子一过，约伯就打发儿女自洁，又清早起来按众人的数目献燔祭，因为他恐怕儿子们犯罪、心中弃掉神，而且约伯常常这样行", "en": "约伯常常这样行", "sec": "5.10", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 339, "e": 379, "st": "mixed", "g": [45, 46, 47], "p": [{"s": 339, "e": 353, "t": "这是最后一层锁，说明约伯从硬实力、正直、家庭和睦、经济到对家庭的信仰看守都是顶级，作者借此表明这种人不可能出意外；他担心被称为富二代的儿子们弃掉神，每次聚餐后都献燔祭、叫他们自洁，整个家庭从本人到子女的信仰都在圣约和上帝的看守之中", "en": "家庭从本人到子女的信仰都在上帝的看守中", "sec": "5.10", "f": {"ban": ["作者"], "per": [], "dem": ["此", "这种"]}}, {"s": 354, "e": 359, "t": "约伯记的冲击力在于，一个既敬虔又强大的家族后来竟然家破人亡，人几乎被杀光，唯一剩下的活口也满身烂疮，躺在炉灰里", "en": "唯一活口满身烂疮躺在炉灰里", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"s": 360, "e": 367, "t": "更让人难以接受的是，允许撒但攻击约伯的，竟是他全家所敬畏的耶和华；因此约伯记被放在智慧书的第一卷，智慧书包括约伯记、箴言、诗篇、传道书和雅歌", "en": "智慧书包括约伯记、箴言、诗篇、传道书、雅歌", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}, {"s": 368, "e": 379, "t": "若肯客观读约伯记，就会倒掉曾喝下的所有基督教鸡汤，打掉一切幻想；约伯不只是硬实力强，更是全家敬虔、父亲时刻警醒，连耶和华也承认他完全敬畏神、远离恶事；但到第三章，约伯却躺在炉灰中巴不得快死，极其痛苦，这就是他的变化", "en": "约伯躺在炉灰中巴不得快死，极其痛苦", "sec": "5.11", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 380, "e": 390, "st": "over", "g": [48], "p": [{"s": 380, "e": 385, "t": "追问读懂约伯记能获得怎样的智慧，指出它不是中国人通常理解的厚黑或圆滑，而是让人倒掉曾喝下的一切基督教毒鸡汤和虚假平安；没想清楚这个问题，就无法健全地认识福音", "en": "没想清楚就无法健全认识福音", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 386, "e": 390, "t": "人对人生顺遂和稳健程度的评估都有具体标准，用1至5节可整理为：钱多、人多、势力大的人遇到难关都能轻易迈过；若再加上做人好、虔诚、家庭团结、敬畏神，就更是内外无懈可击", "en": "加上做人好、虔诚、家庭团结、敬畏神，就内外无懈可击", "sec": "5.12", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 391, "e": 410, "st": "mixed", "g": [49, 50], "p": [{"s": 391, "e": 398, "t": "约伯不是偶尔如此，第五节说他常常这样行；这样内外无懈可击的人会出现意外吗，生活中若真遇到这种人，肯定认为不会，正如同为房租发愁的人不会认为马斯克交不起房租；这种人与在炉灰中的乞丐仿佛两个物种，很难想象两种形象会重叠在一个人身上", "en": "很难想象两种形象会重叠在一个人身上", "sec": "5.12", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"s": 399, "e": 404, "t": "约伯记给出的答案要到后面才真正显明；按以前的人生经验，人会认为这样厉害又敬畏上帝的人不会出意外，但约伯记告诉你会，不仅会，而且非常会", "en": "约伯记告诉你会，而且非常会", "sec": "5.12", "f": {"ban": [], "per": ["你"], "dem": ["这样"]}}, {"s": 405, "e": 410, "t": "作为安稳支柱的那些资源都可能瞬间失去，一个个搭建起来的人生稳健度支架会瞬间倒塌；最后能护住人的反而是耶和华看守的一道看不见的篱笆，当身外之物和身内之物都失去，留下的只有曾经敬畏耶和华的智慧和知识", "en": "留下的是曾经敬畏耶和华的智慧和知识", "sec": "5.13", "f": {"ban": [], "per": [], "dem": ["那些"]}}]}, {"s": 411, "e": 420, "st": "same", "g": [51], "p": [{"s": 411, "e": 420, "t": "解释身外之物指钱和房产，人尚能想通；但约伯连身内之物都失去了，皮与骨被撒旦击打，快扛不住时仍说杀我也要在炉灰中继续等神，只求神说明为何让他这样，这就是约伯的整个信仰", "en": "这就是约伯的整个信仰", "sec": "5.13", "f": {"ban": [], "per": ["我"], "dem": ["这样"]}}]}, {"s": 421, "e": 427, "st": "same", "g": [52], "p": [{"s": 421, "e": 427, "t": "最终看守人的不是人以为的抗风险因素或人生支架，这些说倒塌就倒塌；真正看守人的是耶和华为我们圈上的四面篱笆，以及最终留下的、曾经敬畏耶和华的真知识和真智慧，也就是发芽结果后丰收的果子，神要从中收割", "en": "剩下的是真知识真智慧，是神要收割的果子", "sec": "5.13", "f": {"ban": [], "per": ["我们"], "dem": ["这些"]}}]}, {"s": 428, "e": 444, "st": "mixed", "g": [53, 54], "p": [{"s": 428, "e": 433, "t": "需要在约伯记开头就预备好接受这件事，清醒知道与神同行的岁月里许多事很可能突然发生；只有在正确的预设下，人才不会在苦难的年岁突然弃掉神，因为错误的期待会带来错误的信心，无法正确回应自己的遭遇", "en": "错误的信心无法正确回应自己的遭遇", "sec": "5.14", "f": {"ban": [], "per": [], "dem": ["这件"]}}, {"s": 434, "e": 439, "t": "若带着错误的期待又想回应自己的遭遇，只剩两个危险的做法：要么去掉福音，要么更改福音；即使不去掉福音，怀着错误的期待来信，也会更改福音，无法接受纯正的东西", "en": "怀着错误期待来信，也会更改福音", "sec": "5.14", "f": {"ban": [], "per": [], "dem": []}}, {"s": 440, "e": 444, "t": "第二章上帝评价约伯持守纯正，所谓持守纯正，就是这个福音在他为至大时让他舒适，如今他在炉灰中不舒适，他仍按原来的继续等候，哪怕困惑也不更改、不以口犯罪、不妄认上帝，这才是真实的智慧", "en": "这才是真实的智慧", "sec": "5.14", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 445, "e": 466, "st": "mixed", "g": [55, 56], "p": [{"s": 445, "e": 448, "t": "这些年常有人出于好意说信耶稣就是保平安、上帝大大祝福，而回应这类话常用约伯记2章9节约伯对妻子所说的话：我们从神手里得福，也从神手里受祸", "en": "这是约伯对妻子说的话", "sec": "5.15", "f": {"ban": [], "per": ["我们"], "dem": ["这些"]}}, {"s": 449, "e": 458, "t": "约伯第一轮家财散尽、儿女死光时，他妻子并没有说什么，仍跟在身边；直到第二轮约伯身体烂掉、倒在炉灰中还祷告时，她才受不了，质问他还持守纯正吗、干脆弃掉神死掉，可见她是第二轮才崩溃，已属难得", "en": "她是第二轮才崩溃的，已属难得", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"s": 459, "e": 466, "t": "约伯妻子过不去的那一关是：从神手里得福尚可，但一个福都不给、还要受祸就无法接受；约伯却回答，我们从神手里得福，不也受祸吗，并说她说话像愚顽的妇人，这是夫妻之间的对话", "en": "这是夫妻之间的对话", "sec": "5.15", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 467, "e": 492, "st": "mixed", "g": [57, 58, 59], "p": [{"s": 467, "e": 476, "t": "许多人在顺境逆境中都劝人信耶稣就绝对平安顺遂，而「从神手里得福，也从神手里受祸」被当作信仰告白，认为这位上帝给福给祸都是自己的上帝；但很多人按传统宗教性会疑惑：得祸还信什么呢", "en": "按传统宗教性，得祸还信什么呢", "sec": "5.15", "f": {"ban": [], "per": [], "dem": []}}, {"s": 477, "e": 482, "t": "第一层结尾解释为何要按这个眼光读约伯记，借助使徒保罗在罗马书中的话「万事互相效力，为人的救恩得益处」，说明从神手里得福、也从神手里受祸指的是人的人生际遇", "en": "指的是人的人生际遇", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 483, "e": 492, "t": "上帝并非坏心眼，万事包含祸与福，祸福之中都有确定的益处，有时益处正是从祸里来，即救恩的益处；破产生病对今生无益却对永生有益，因此要重新认识从神手里得福、也从神手里受祸，万事互相效力是为永生这确定的益处，到终点神才擦去一切眼泪", "en": "到终点神才擦去一切眼泪", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 493, "e": 497, "st": "same", "g": [60], "p": [{"s": 493, "e": 497, "t": "跟随耶稣确实不是专门为今生保平安，并非说今生的事不重要，而是必须一开始就清楚最终寻求的是永恒的福乐；信耶稣正是为追求这个而来，在那里不会有悲哀，神会擦去一切的眼泪", "en": "在那里不会有悲哀，神会擦去一切眼泪", "sec": "5.16", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 498, "e": 511, "st": "under", "g": [61, 62], "p": [{"s": 498, "e": 511, "t": "用通俗的话说，今生的苦难都会过去，而永恒的福乐不会过去，永恒的咒诅也不会过去；信耶稣与否有永恒的结局，人处在暂存的状态中，九十年后今生的福祸清空，却进入永不废去的永恒福祸；为这永恒的定局，人愿意接受今生任何福祸，只要它为救恩效力", "en": "这就是我们的信仰", "sec": "5.16", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 512, "e": 518, "st": "same", "g": [63], "p": [{"s": 512, "e": 518, "t": "世上存在两套截然不同的福音：一套相信上帝只赐福、不降祸，另一套相信上帝让人得福也得祸，都为儿女的救恩效力；两者绝不一样，而大部分人相信的是信耶稣只有祝福没有灾祸的那一套", "en": "大部分人相信信耶稣只有祝福没有灾祸", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 519, "e": 532, "st": "same", "g": [64], "p": [{"s": 519, "e": 532, "t": "接受人生动荡又无法解释的人只能不断怀疑自己做错了；约伯的三个朋友正是如此，他们认定上帝只给信他的人祝福，因此约伯受祸必然是干了坏事，后面的三轮辩论都源于这套在上古乌斯地就已存在的福音，约伯则不断辩解自己没做过对不起上帝的事", "en": "约伯不断辩解自己没做过对不起上帝的事", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 533, "e": 540, "st": "same", "g": [65], "p": [{"s": 533, "e": 540, "t": "第一套福音是绝对平安、只有祝福没有灾祸；我们所信的则是从神手里得福也从神手里受祸，但这不代表上帝咒诅人，因为他有永久的祝福，就是让万事为人的救恩互相效力；为了永恒的定局，上帝可在短暂期间暂时降祸，短暂咒诅促成永久的祝福", "en": "短暂咒诅促成永久祝福，这是我们所相信的", "sec": "5.17", "f": {"ban": [], "per": ["我们"], "dem": []}}]}, {"s": 541, "e": 546, "st": "same", "g": [66], "p": [{"s": 541, "e": 546, "t": "最终人要选择哪一套信仰，信心看向不同的方向，就会走向不同的道路、结出不同的果子；后一套福音并不残酷，因为稍有得救智慧的人都知道怎么选，今生只要能促成不可废去之福，就愿意接受上帝所给的一切", "en": "这就是一到五节说的", "sec": "5.17", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 547, "e": 556, "st": "near", "g": [67, 68], "p": [{"s": 547, "e": 550, "t": "总结1至5节：约伯绝对的稳固是为后面读约伯记作铺垫，方方面面都显示他不可能出现任何意外，但他还是出意外了", "en": "方方面面都不可能出意外，但他还是出意外了", "sec": "5.18", "f": {"ban": [], "per": [], "dem": []}}, {"s": 551, "e": 556, "t": "由此得到最基本的一点：人以前认为的一切抗风险稳固支架都不算数，都会顷刻失去，耶和华允许了这件事发生；最终能看守人的只是耶和华安扎的篱笆，当身内之物和身外之物都失去，剩下的是通过敬畏耶和华所积累、会开花结果的知识和智慧", "en": "剩下的是敬畏耶和华积累的知识和智慧，会开花结果", "sec": "5.18", "f": {"ban": [], "per": [], "dem": ["这件"]}}]}, {"s": 557, "e": 566, "st": "same", "g": [69], "p": [{"s": 557, "e": 566, "t": "从第1至5节人能看见的约伯的家产与家庭和睦，转到第6至8节看不见的灵界；影响家庭乃至整个国家历史的，未必是银行里那些自认为的保障，而往往是天上的场景，圣经不止一次呈现过所谓灵界的事。", "en": "影响家庭乃至国家历史的是天上的场景，圣经不止一次呈现所谓灵界的事", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["那些"]}}]}, {"s": 567, "e": 572, "st": "same", "g": [70], "p": [{"s": 567, "e": 572, "t": "把镜头切到天上，约伯记1章6节有一天神的众子在耶和华面前侍立；人类的物质支持与情感维系都非常脆弱，所争取的资源对自己的影响力其实没那么大，真正影响历史中人的是天上属灵的领域，而这一切的转折点始于神的众子聚集的那一天。", "en": "人类物质与情感支撑很脆弱，真正影响历史中人的是天上领域，转折点在第6节", "sec": "6.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 573, "e": 581, "st": "same", "g": [71], "p": [{"s": 573, "e": 581, "t": "解释神的众子就是众天使，他们聚集在耶和华面前；这个场景如同君王听政的集会，好比康熙王朝、雍正王朝里皇帝坐在上面、众大臣站在下面的早朝。", "en": "这个集会场景就像皇帝早朝，众大臣站在下面", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 582, "e": 604, "st": "mixed", "g": [72, 73], "p": [{"s": 582, "e": 596, "t": "很多人不明白撒旦怎么也在神的众子聚会中；撒旦原是堕落的天使，背叛上帝之后确实已不在这个队伍里，但经文却说他「也来在其中」，因此要留意作者措辞的用意。", "en": "撒旦本是天使，堕落后已不在神的众子队伍中，但经文说他也来在其中，要留意作者的措辞", "sec": "6.1", "f": {"ban": ["作者"], "per": [], "dem": ["这个"]}}, {"s": 597, "e": 601, "t": "以今天高湖教会集会时「陈世美也来在其中」为例，说明他本不属于这个群体却来了；同理，神的众子是一个队伍，撒旦是队伍中一个不协调的成员。", "en": "神的众子是一个队伍，撒旦是队伍中一个不协调的成员也来在其中", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 602, "e": 604, "t": "结论是撒旦已经不是神的众子、不再是天使，但他原本确实是受造的属灵活物，因此他不在这个集会的合法成员之内。", "en": "撒旦已不是神的众子，不在这个集会的合法成员之内", "sec": "6.1", "f": {"ban": [], "per": [], "dem": ["这个"]}}]}, {"s": 605, "e": 629, "st": "near", "g": [74, 75, 76], "p": [{"s": 605, "e": 612, "t": "提出许多人的困惑：约伯记1章7节耶和华不但允许撒旦来到集会，还主动询问他「你从哪里来」，与他搭话而不把他赶走，正因这次搭话才有了约伯后来的惨况，上帝这一做法令人难以理解。", "en": "耶和华主动询问撒旦并与他搭话，导致约伯这么惨，很多人困惑不解", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 613, "e": 618, "t": "直接给出结论：耶和华询问撒旦不是搭讪也不是找茬，而是一次说话的授权，要表达的是撒旦自始至终都在上帝的权柄之下；神若不这样发问，撒旦就没有办法主动在集会中开口说话。", "en": "这不是搭讪而是说话的授权，表达撒旦自始至终在上帝权下，神不问他就不能开口", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 619, "e": 629, "t": "回应「耶和华全知为何还要问」的质疑：约伯记1章7节与2章2节两次集会，上帝问的都是同样的问题，说明他不是因困惑才询问，而是以「你回答我，你从哪里来」的命令式发问，给撒旦说话的授权。", "en": "上帝两次都问同样的问题，不是困惑而是命令式发问，是说话的授权", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 630, "e": 640, "st": "same", "g": [77], "p": [{"s": 630, "e": 640, "t": "以皇帝早朝时「有事启奏，无事退朝」为例，说明得到许可才能说话；又举公司开会、小孩上课乃至讲道现场为例，指出人处在一个人的权柄底下往往不自觉，因为权柄是无形的，要说话得先举手、经授权。", "en": "在权柄之下要说话须先举手、经授权，权柄是无形的，人常不自知", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 641, "e": 646, "st": "same", "g": [78], "p": [{"s": 641, "e": 646, "t": "把权柄的道理用在撒旦身上：他不可能冲进集会主动对上帝说话，是耶和华两次主动以同样语式发问，给他发言的授权，他才有说话的权利，否则他在上帝面前连说话的资格都没有。", "en": "耶和华主动发问给撒旦授权，他才能说话，否则连资格都没有", "sec": "6.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 647, "e": 653, "st": "same", "g": [79], "p": [{"s": 647, "e": 653, "t": "耶和华出于某种日后才揭晓的荣耀目的，给了撒旦一定的活动权限；但魔鬼完全在神的掌管之中，攻击约伯时都被耶和华的权柄限制，第一次不能伤他身体，第二次能伤身体却不能夺他性命，这种对邪恶的限制贯穿整卷约伯记。", "en": "魔鬼完全在神掌管中，攻击约伯受权柄限制，这种对邪恶的限制贯彻整卷约伯记", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["这种"]}}]}, {"s": 654, "e": 660, "st": "same", "g": [80], "p": [{"s": 654, "e": 660, "t": "若确知撒旦肆虐的当下正被上帝良善的权柄限制，神儿女对上帝的期待、信心和安稳感就不只建立于脱离困境之后，更建立在身处困境的当下，因为相信此刻仍在上帝掌管之中，就不会有任何不安稳。", "en": "确信撒旦在困境中仍被神权柄限制，信心与安稳就建立在当下困境之中", "sec": "6.2", "f": {"ban": [], "per": [], "dem": ["此"]}}]}, {"s": 661, "e": 694, "st": "near", "g": [81, 82, 83, 84], "p": [{"s": 661, "e": 666, "t": "提出约伯记1章8节带来的困惑：上帝主动称赞约伯完全正直、远离恶事，本可把约伯掩盖过去，却像在提醒撒旦去看他，而撒旦本是控告者，这不等于主动引魔鬼攻击义人吗。", "en": "上帝主动称赞约伯，被质疑是提醒撒旦、引诱他去试探义人", "sec": "6.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 667, "e": 677, "t": "提出解决这一困惑的两个选择题：究竟认为耶和华主动要撒旦注意约伯、让他去试探，还是认为撒旦本来就在关注约伯，耶和华不过是借他的邪恶授权他，并借此促成自己美善的计划。", "en": "提出两个选择题——是耶和华主动要撒旦注意约伯，还是撒旦本就在关注约伯", "sec": "6.3", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"s": 678, "e": 686, "t": "指出全宇宙中只有耶和华一位是全知、全能、全在的，魔鬼并不是；从创世以前直到如今魔鬼一直存在，似乎不受时间限制、不会老，这段经文正有证据说明这一点。", "en": "只有耶和华全知全能全在，魔鬼不是；魔鬼好像不受时间限制，不会老", "sec": "6.4", "f": {"ban": ["这段"], "per": [], "dem": []}}, {"s": 687, "e": 694, "t": "魔鬼虽然不受时间限制，却受空间限制；约伯记1章7节他自称「从地上走来走去，往返而来」正说明这一点，他在东方就不在西边，不能认为魔鬼是全在的，全在的只有上帝。", "en": "魔鬼受空间限制，若在东方就不在西边，不能认为他是全在的", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 695, "e": 704, "st": "over", "g": [85], "p": [{"s": 695, "e": 700, "t": "以耶稣所说「从天降下却仍就在天的人子」为例，说明宇宙中除上帝以外没有谁能同时在此又在彼；受造之物只要在这里就不在那边，要去那边只能走过去、往返而来，这就是受空间限制。", "en": "受造之物只要在这里就不在那边，要去只能走过去，这是受空间限制", "sec": "6.4", "f": {"ban": [], "per": [], "dem": ["此"]}}, {"s": 701, "e": 704, "t": "与受造之物相对，上帝可以说「我在东也在西」，超乎众人之上、贯乎众人之内、也住在众人之间；他道成肉身降世却仍在天，用全能命令托住万有，不需要往返，因他充满全地，耶和华的荣耀遍满。", "en": "只有上帝不需要往返，他充满全地，其荣耀遍满", "sec": "6.4", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 705, "e": 720, "st": "over", "g": [86], "p": [{"s": 705, "e": 714, "t": "上帝问撒旦从什么空间来、是什么样的活物，撒旦诚实回答「我从地上来」，因为堕落之后他已不在天上；神的众子在天上，他却从地上走来走去、往返而来，正因受空间限制，他在东方就不在西方。", "en": "撒旦诚实答从地上来，他已不在天上；他受空间限制，须走来走去", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}, {"s": 715, "e": 720, "t": "撒旦既非全在也非全知，他要了解约伯的信息，就得走到约伯身边；由他后来能把约伯的状况说得那么清楚，可以合理推断这些年他就在约伯身边。", "en": "撒旦既不全在也不全知，就得走到约伯身边，才能了解他的信息", "sec": "6.5", "f": {"ban": [], "per": [], "dem": ["这些"]}}]}, {"s": 721, "e": 730, "st": "same", "g": [87], "p": [{"s": 721, "e": 730, "t": "撒旦对约伯是了解的：他不是全知者，却因长期在约伯身边盯着他，能说出约伯家里受神篱笆保护的情况，也就是约伯记1章9节「他敬畏你岂是无故呢」那番话；可见他要走来走去、靠观察了解约伯。", "en": "撒旦非全知却知道约伯家的情况，因他一直盯着约伯、长期观察", "sec": "6.5", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 731, "e": 740, "st": "same", "g": [88], "p": [{"s": 731, "e": 740, "t": "撒旦两次质疑约伯敬畏神的原因，耶和华两次都允许他试验；但两次质疑传出同一个信息，就是撒旦对约伯内心的评估出错了，而全知全能全在的上帝对约伯「敬畏我、远离恶事」的评价全然无误。", "en": "撒旦两次质疑约伯敬畏神的缘由都出错，上帝全知，对约伯的评价不会错", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 741, "e": 749, "st": "same", "g": [89], "p": [{"s": 741, "e": 749, "t": "撒旦第一次质疑「夺去他所有，他必当面弃掉你」，结果约伯说「赏赐的是耶和华，收取的也是耶和华」，出乎他意料；第二次质疑「击打他身体，他必当面弃掉你」，约伯浑身烂疮后依然持守纯正，又错了。", "en": "第二次击打身体，约伯浑身烂疮后仍持守纯正，撒旦又错了", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 750, "e": 757, "st": "same", "g": [90], "p": [{"s": 750, "e": 757, "t": "撒旦两次出错，上帝却绝不会出错；撒旦对人的观察需要知识的积累，他先以为约伯是因钱财才敬畏神，钱财被夺走后发现并非如此，又改猜是皮肉，结果仍然错了。", "en": "撒旦对人观察需知识积累，先猜钱财再猜皮肉，两次都错", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 758, "e": 775, "st": "near", "g": [91, 92], "p": [{"s": 758, "e": 764, "t": "撒旦固然厉害，人搞不过他，但绝不能把他看作能与上帝掰手腕的对手；他不像网上那幅耶稣与撒旦同桌掰手腕的图，他永远在上帝面前处于权下的姿态，作为受造的天使，再高级也不可能像耶和华那样。", "en": "撒旦永远在上帝面前处于权下，不可能与上帝掰手腕", "sec": "6.6", "f": {"ban": [], "per": [], "dem": ["那样"]}}, {"s": 765, "e": 775, "t": "耶和华在天上就了解约伯，对他的评价从头到尾毫无差错；人面对上帝是赤露敞开的，面对撒旦却不是，撒旦虽很有智慧仍需观察、评估仍会出错，只有有限的受造之物才需要日久见人心，而撒旦不全知也不全在，对约伯并不全然了解，却在约伯旁边想试探他。", "en": "耶和华从开始就完全了解约伯，撒旦不全知不全在，对约伯也不全然了解", "sec": "6.6", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 776, "e": 829, "st": "mixed", "g": [93, 94, 95, 96, 97, 98], "p": [{"s": 776, "e": 783, "t": "上帝完全认可约伯的敬畏，按人的想法就该把撒旦赶走、保护约伯，可上帝竟两次允许他受非常严重的灾祸；这是大部分人想不明白的，因为人总认为招灾的一定是恶人、义人一定得福，约伯的三个朋友后来也都是这样认为。", "en": "上帝两次允许约伯受重祸，令人想不明白，因为人认为招灾的必是恶人", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这样"]}}, {"s": 784, "e": 792, "t": "约伯记讨论的是一个非常需要讨论的主题：义人受苦、恶人亨通，这怪象在智慧书、诗篇、先知书中反复出现；人想象的是义人得福、恶人受苦，圣经却诚实指出义人受苦、恶人亨通，但这不是必然，而是义人有可能受苦、恶人有可能亨通。", "en": "义人可能受苦，恶人却可能亨通，这不是必然但确实可能", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 793, "e": 800, "t": "具备这种智慧就能有健全的信心，不喝基督教的毒鸡汤；正常人选择任何宗教都以保佑顺遂、福泽作为敬拜理由，宗庙庙宇以灵验作招牌，教会见证也多是信耶稣后丰收，没人敢拿敬畏神后家破人亡说事，可上帝自己恰恰记载了这样的事。", "en": "人选择宗教都以顺遂福泽为理由，见证也多是丰收，但上帝自己记载了家破人亡的事", "sec": "6.7", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"s": 801, "e": 810, "t": "有人以约伯后来双倍得回祝福为据，但路加福音里财主与拉撒路比喻中的乞丐拉撒路至死没有得回，死后才在亚伯拉罕怀里；不能因约伯记结尾的双倍就说最终盼望都变成祝福，义人可能受苦、恶人可能亨通，正是上帝在这被败坏辖制的世界里告诉人的。", "en": "拉撒路至死未得回，义人可能受苦恶人可能亨通，是上帝在败坏世界里告诉人的", "sec": "6.7", "f": {"ban": [], "per": [], "dem": []}}, {"s": 811, "e": 814, "t": "更重要的信息是：这几十年所传的不可废去之福，福音正是这个，而不是别的东西。", "en": "福音是不可废去之福，不是别的", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 815, "e": 821, "t": "以中国人的老话「好人不长命，王八活千年」为例，其中的王八指的是坏人，说明老祖宗凭观察也懂得坏人反而家大业大这个道理。", "en": "老祖宗通过观察懂得好人不长命、坏人反而家大业大的道理", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 822, "e": 829, "t": "由此得出重要原则：不能因灾难就怀疑自己或别人的信仰，因为上帝可能正认可他，正如约伯；同样也不能因某人顺风顺水就认可他的信仰，因为上帝可能并不认可他，圣经中也有这样的例子。", "en": "不能因顺遂认可别人的信仰，因为上帝可能不认可他，圣经有例子", "sec": "6.8", "f": {"ban": [], "per": [], "dem": ["这样"]}}]}, {"s": 830, "e": 850, "st": "near", "g": [99, 100], "p": [{"s": 830, "e": 838, "t": "当提醒一个人信仰的方式需要调整，指的是知识与认知，他却拿自己人生的顺遂、家里买了三套房子来回应，这如同鸡同鸭讲；不要把处境当作自己信仰纯正度的凭据，对福音的误解会让人用多年来的家庭和睦或事业高升公然拒绝反思自己的信仰。", "en": "用人生顺遂回应信仰的纠正，是鸡同鸭讲，不要把处境放在信仰纯正度上", "sec": "6.8", "f": {"ban": [], "per": [], "dem": []}}, {"s": 839, "e": 850, "t": "两种情形都不可取：有人自己错了，却因家庭或人生顺遂拒绝反思；有人明明对了，却因遭灾开始怀疑自己。智慧书带来的智慧，是在环境中认识上帝；用当下的环境来解释信仰的实质，是绝不应当从熟知智慧书的基督徒口中听见的误区，因为顺遂与祸福跟上帝是否认可你是两码事，光这一点，这种愚昧很多人都有。", "en": "顺遂祸福与上帝认可与否是两码事，用环境解释信仰实质是愚昧", "sec": "6.8", "f": {"ban": [], "per": ["你"], "dem": ["这种"]}}]}, {"s": 851, "e": 889, "st": "mixed", "g": [101, 102], "p": [{"s": 851, "e": 858, "t": "以讲道前腿摔断、接连拉肚子为例：有人说这是上帝在拦阻、不要去，另一拨人却说这是撒旦在拦阻、可见要去做成神的工；同一个现实竟得出两种相反的解释。", "en": "同一件事被两拨人分别解释为上帝拦阻和撒旦拦阻", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 859, "e": 868, "t": "这不是虚构，而是亲身经历：每次要做关乎上帝的工作前身体出事，人们就分成两拨——一拨说生病说明上帝拦阻、不要去，另一拨说生病是撒旦拦阻，说明上帝喜欢、你该去。", "en": "亲身经历中，同一件事被分成两拨人给出上帝拦阻与撒旦拦阻两种解释", "sec": "6.9", "f": {"ban": [], "per": ["你"], "dem": []}}, {"s": 869, "e": 878, "t": "到底该听谁的？借物质之事指向灵界来论断，就是愚昧；说上帝拦阻的人通常是自己不想去，说撒旦拦阻的人其实自己想去。人不仅随私意解读圣经，也随私意解读环境。", "en": "说上帝拦阻的人通常自己不想我去，说撒旦拦阻的其实是自己想去，人随私意解读环境", "sec": "6.9", "f": {"ban": [], "per": [], "dem": []}}, {"s": 879, "e": 884, "t": "我身上发生的事可能跟上帝的旨意毫无关系，不要硬把当下的事与旨意对应起来；从约伯记可以看出，天上的场景与地下的场景完全没有关系，背后有的是上帝自己在这件事上的美意与圣言。", "en": "天上场景与地下场景没有直接关系，有的是上帝自己的美意", "sec": "6.9", "f": {"ban": [], "per": ["我"], "dem": ["这件"]}}, {"s": 885, "e": 889, "t": "走上正确或错误的道路时，环境都不应成为第一参考标准；有些时候在你眼前显明的东西并不代表背后的属灵实际，你的生病也不表示这个人就是坏的。", "en": "环境不要成为第一参考标准，眼前显明的不表示背后属灵的实际", "sec": "6.9", "f": {"ban": [], "per": ["你"], "dem": ["这个"]}}]}, {"s": 890, "e": 899, "st": "over", "g": [103], "p": [{"s": 890, "e": 893, "t": "日后会看到约伯完全没有得罪神，第1至5节的安稳却被第6至8节那位认可他的上帝打破；至少今天先做一个最简单的调整，就是不要做属灵的董王，仿佛能为弟兄姊妹解读他身上一切遭遇背后的属灵事实。", "en": "至少今天做一个调整，不要做替弟兄姊妹解读一切遭遇的属灵董王", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}, {"s": 894, "e": 899, "t": "追问「你何德何能」：连传道人也不例外；日后相识，家庭的处境与顺遂不要来问，因为不知道。天底下许多传道人都以为自己知道，而我认为自己不知道，也不认为他们知道。", "en": "许多传道人自以为知道，我则认为自己和他们都不知道", "sec": "6.10", "f": {"ban": [], "per": ["我"], "dem": []}}]}, {"s": 900, "e": 922, "st": "mixed", "g": [104, 105], "p": [{"s": 900, "e": 910, "t": "能懂的只有上帝的话怎么说；至于某人家里为什么这样，是无从知道的，天上的场景是人的智慧不可企及、无法触及的，我们又不是先知。因此只能按上帝的原则告诉大家，并希望大家安稳其上，在这卷书上得着救恩根基的稳固，风吹雨打也不动摇。", "en": "只能通过上帝的原则讲明，叫人根基稳固、风吹雨打不动摇", "sec": "6.10", "f": {"ban": [], "per": ["我们"], "dem": ["这样"]}}, {"s": 911, "e": 918, "t": "瞎猜神的意思、天天靠自己的猜测教别人做事的这种人，或许被看作属灵人，圣经却称他们为愚昧人；约伯的三个朋友正是示范——他们言之凿凿地替约伯解释处境，好像以利法、比勒达、琐法都知道，只有约伯不知道，所以不要做这样的属灵懂王。", "en": "三个朋友会示范这种愚昧人，不要做属灵的懂王", "sec": "6.10", "f": {"ban": [], "per": [], "dem": ["这样", "这种"]}}, {"s": 919, "e": 922, "t": "若具备智慧书的智慧，就像得到一个干净的皮袋，可以好好装载新酒而不至于破裂，这就是约伯记全部的信息。", "en": "具备智慧书的智慧就如得干净皮袋装新酒，这是约伯记全部的信息", "sec": "6.10", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 923, "e": 928, "st": "same", "g": [106], "p": [{"s": 923, "e": 928, "t": "针对不靠环境辨别的疑问，纠正多年来靠环境判断的习惯：一件事做得很不顺，不等于不是上帝的旨意，而认为越不顺越是上帝旨意的另一种极端同样不可取", "en": "不顺就不是神的意思、越不顺越是神的意思，这两种极端都不可取", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 929, "e": 942, "st": "mixed", "g": [107, 108], "p": [{"s": 929, "e": 936, "t": "自问既然环境的顺遂不是第一鉴别标准，那第一标准究竟是什么，答案是上帝圣言的66卷准则：违背就不是、遵从就是，与顺遂与否无关；这是根基，上帝的话才是行动的最高准则，而非人的遭遇", "en": "上帝怎么说永远是行动的最高准则，而不是自己或家庭的遭遇", "sec": "7.1", "f": {"ban": [], "per": [], "dem": []}}, {"s": 937, "e": 939, "t": "人靠圣经这卷书知道上帝对人的真实想法，并希望安全感建立在这卷书之上", "en": "希望安全感建立在圣经这卷书之上", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}, {"s": 940, "e": 942, "t": "人所遭遇的最大灾祸是心眼昏迷、不能明白真道，最大的祝福则是上帝带领人进入真理，并赐下永恒的福乐", "en": "最大的祝福是上帝带领人进入真理并赐下永恒的福乐", "sec": "7.2", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 943, "e": 959, "st": "mixed", "g": [109, 110], "p": [{"s": 943, "e": 946, "t": "有人提出疑问：上帝所认可的人不出于刑罚、也不出于管教，那上帝既不讨厌他，为什么还允许这个人遭受祸患", "en": "上帝既不讨厌他，为什么还允许人受祸", "sec": "7.3", "f": {"ban": [], "per": [], "dem": ["这个"]}}, {"s": 947, "e": 952, "t": "以约翰福音9章1到3节作结并念出经文：耶稣过去看见一个生来瞎眼的人，门徒问他这人生来瞎眼是谁犯了罪，是这人还是他父母", "en": "门徒问这人生来瞎眼是谁犯了罪，是这人还是他父母", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 953, "e": 959, "t": "分析门徒的反应：他们认为天生瞎眼必定与罪有关，只在父母犯罪还是本人犯罪之间二选一，等于限定了耶稣的回答，认定了答案必然是罪", "en": "门徒认定答案绝对是罪，等于限定了耶稣的回答", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 960, "e": 967, "st": "over", "g": [111], "p": [{"s": 960, "e": 962, "t": "耶稣的回答否定了这两种猜测：不是这人犯罪，也不是他父母犯罪，而是要在他的身上显出神的作为来", "en": "耶稣说不是这人也不是他父母犯罪，而是要在他的身上显出神的作为", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}, {"s": 963, "e": 967, "t": "由此得出这人的瞎眼与罪无关、与神的作为有关；人向上帝提问时常只给出一道A与B的选择题，结果发现两个都不是，因此对祸福与罪恶的认知需要作出调整", "en": "祸福与罪恶的认知需要作调整", "sec": "7.3", "f": {"ban": [], "per": [], "dem": []}}]}, {"s": 968, "e": 969, "st": "same", "g": [112], "p": [{"s": 968, "e": 969, "t": "以祷告作为开场，求神带领，并遵照神的话开始查考约伯记", "en": "要开始看约伯的", "sec": "8.1", "f": {"ban": [], "per": [], "dem": []}}]}], "near": {"89": 88, "99": 96, "169": 170, "191": 193, "212": 215, "249": 248, "266": 268, "273": 275, "291": 294, "312": 313, "354": 355, "368": 365, "399": 400, "440": 438, "477": 479, "551": 552, "613": 614, "619": 622, "667": 668, "678": 679, "687": 688, "765": 766, "784": 786, "793": 794, "801": 802, "811": 814, "822": 823, "839": 841, "879": 878, "911": 914, "937": 936, "947": 948}, "unc": {"23": "第25行是收尾话，也可单独成段，但仅一行过短，按长度规则并入前一段", "30": "「使众先知使徒记在圣经上的福音……」可看作第29行开通耳朵、能听之后所听内容的展开，也可看作独立的一项祈求；按祈求事项另起一段处理", "37": "34-36的总起与37-41的现实背景也可分开成两段，但总起仅3行且与后文同属介绍背景，故合并", "129": "129-132仅4行，也可并入前段设问，按作者突出约伯的稳这一独立动作单独成段", "261": "261-265仅5行，也可并入后段总结，按牛驴田产这一独立补充单独成段", "368": "368「约伯记被放在智慧书的第一卷……因为如果你肯客观地去读约伯记」与369构成完整句子，句末为下文开口，按过渡句规则归后", "597": "陈世美例子是「也来在其中」这一措辞解释的举例，也可与上段合并为一次措辞解读", "641": "把权柄道理应用回撒旦，也可看作皇帝早朝例子的收束，归入上一段", "715": "也可与上文空间限制的说明合并，同属解释撒旦为何须走到约伯身边", "934": "「所以我说这是所谓的根基」回指上文的第一标准，可视为独立收束，按宁少勿多并入上一段", "940": "全节仅6行，灾祸与祝福也可与上文合为一段", "963": "「原来与罪无关」复述962耶稣的回答，也可并入上一段；因其后展开新的应用，按新一步处理"}, "paras": [{"s": 1, "e": 3, "t": "开场互道平安，并谦卑表示自己不敢当什么帮助，只是把神的话用今天的话尽可能讲给众人听"}, {"s": 4, "e": 8, "t": "宣布本周正道经文为约伯记一章1至8节，并说明读经时坦然看经文即可，其中难解的部分会尽可能为弟兄姊妹解释"}, {"s": 9, "e": 13, "t": "约伯记1章1至3节记载乌斯地有一个名叫约伯的人，他完全正直、敬畏神、远离恶事，生了七个儿子三个女儿，家产有七千羊、三千骆驼、五百对牛、五百母驴和许多仆婢，在东方人中为至大"}, {"s": 14, "e": 18, "t": "约伯记1章4至5节记载约伯的儿子按着日子各自在家中设摆筵席，请三个姐妹一同吃喝，筵席过后约伯打发他们自洁，清早起来按众人数目献燔祭，因为他恐怕儿子犯了罪、心中弃掉神，约伯常常这样行"}, {"s": 19, "e": 22, "t": "约伯记1章6至7节记载有一天神的众子来侍立在耶和华面前，撒但也来到其中，耶和华问撒但从哪里来，撒但回答说自己从地上走来走去、往返而来"}, {"s": 23, "e": 25, "t": "约伯记1章8节耶和华问撒但是否用心查看他的仆人约伯，并说地上再没有人像约伯完全正直、敬畏神、远离恶事，本周的分享到此为止"}, {"s": 26, "e": 29, "t": "祷告开头先求神使众人照他的话、以他话语为根基来崇拜他，在众圣徒中得着他当得的荣耀，并求他临格在中间，开通众弟兄姊妹的耳朵，使他们凡有耳的都应当听"}, {"s": 30, "e": 33, "t": "求神把众先知使徒记在圣经上的福音与古旧的信仰、并众人需用的一切知识一同赏赐给他们，使他们通达灵敏、认识神、一次得救；又求真信心在他们中间酝酿，使他们多结果子，末了奉耶稣基督的圣名祈求"}, {"s": 34, "e": 41, "t": "约伯记开篇分两部分、两个眼光来看：1至5节呈现约伯的现实背景，他儿女众多、牛驴仆婢成群，是东方为大的富户，这一段先向读者介绍约伯这个人"}, {"s": 42, "e": 48, "t": "6至8节是约伯的属灵背景：他敬畏神、远离恶事，虽然被人控告，却在天上得着耶和华对他的认可与评价，全篇就按这两个方面来讲"}, {"s": 49, "e": 51, "t": "自我介绍：姓陈，人称陈社炳；在此服侍的任务很明确，就是把圣经里的福音和先知使徒的教导抛开传统慢慢告诉会众，使这道成为敬拜的根基，不再另立别的根基"}, {"s": 52, "e": 54, "t": "具体的做法：在自己认为许可的范围之内与自己的教会同步信息，尽可能同步认为合适的内容；若认为某周的信息不合适，就用最古老的一卷约伯记来慢慢开始"}, {"s": 55, "e": 58, "t": "今天教会对福音的信仰通常更关注个人今生几十年的祸福，而不是将来那个国度；因此到各地讲道时，也不得不先从个人方面的事谈起"}, {"s": 59, "e": 63, "t": "约伯记不是传讲全备福音最好的一卷书，却能帮助消除以往比较顽固的观念，为领受真道预备所需的智慧；日后若要对会众有所冒犯，也希望先用约伯记来冒犯，因为福音本身对人的挑战更大"}, {"s": 64, "e": 67, "t": "认识真道并非先要认识苦难；约伯记的排版不可忽略，它是智慧书的第一卷，一般人提到约伯记会联想到苦难，其实它的大主题是智慧，即认识耶和华的智慧"}, {"s": 68, "e": 73, "t": "先讨论两个问题：第一个问题出自1至5节，世界上存不存在绝对的平安？许多人，特别是在平安夜信耶稣的弟兄姊妹，平安是他们信基督教的第一诉求"}, {"s": 74, "e": 76, "t": "第二个问题出自6至8节：上帝所认可的信仰，是否意味着这个被认可的人就会远离灾祸？"}, {"s": 77, "e": 79, "t": "若曾对信仰的祸与福做过不恰当的归类，甚至对神赐福的前因后果有过不正确的认识，约伯记的开篇可以稍微调整一下这些观念"}, {"s": 80, "e": 83, "t": "引出约伯记1章1至5节，让听众先看约伯近乎永久安稳的人生，并以「什么叫永久安稳的人生」这一问题作为展开的起点"}, {"s": 84, "e":
